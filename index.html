    async function requestAuth(action, username, password) {
      const response = await fetch(`${authUrl}?action=${action}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      });
      const raw = await response.text();
      let payload = null;
      try {
        payload = JSON.parse(raw);
      } catch (error) {
        const detail = raw.trim().slice(0, 500);
        throw new Error(detail
          ? `注册接口返回的不是 JSON：${detail}`
          : `注册接口返回空内容（HTTP ${response.status}）`);
      }
      if (!response.ok || !payload?.ok) throw new Error(payload?.error || `HTTP ${response.status}`);
      return payload.user;
    }

    async function initAuth() {
      try {
        const response = await fetch(`${authUrl}?action=me`, { cache: "no-store" });
        const payload = await response.json();
        if (payload.ok && payload.authenticated && payload.user) {
          startAuthenticatedApp(payload.user);
          return;
        }
      } catch (error) {
        console.warn(error);
      }
      showAuth();
    }

    function normalizeCounterValue(value) {
      return Math.max(0, Math.floor(Number(value || 0)));
    }

    function argoKnowledgeStart(cycleId = "c2") {
      return { c1: 1, c2: 20, c3: 40, c4: 60, c5: 80 }[cycleId] || 0;
    }

    function normalizeCardTrackEntry(value = {}, legacyPosition = 0, physicalCardToStep = false) {
      const position = normalizeCounterValue(value.position ?? legacyPosition);
      return {
        position: physicalCardToStep && position > 0 ? (position - 1) * 2 + 1 : position,
        progress: normalizeCounterValue(value.progress),
        doom: normalizeCounterValue(value.doom),
      };
    }

    function normalizeCardTracks(value = {}, legacyCounters = {}, physicalCardToStep = false, cycleId = "c2") {
      const inwardPosition = normalizeCounterValue(value.inwardOdyssey?.position ?? legacyCounters.inwardOdyssey ?? legacyCounters.inwardOdysseyCount);
      return {
        story: normalizeCardTrackEntry(value.story, legacyCounters.story ?? legacyCounters.storyCount, physicalCardToStep),
        doom: normalizeCardTrackEntry(value.doom, legacyCounters.doom ?? legacyCounters.doomCount, physicalCardToStep),
        inwardOdyssey: normalizeCardTrackEntry({ ...value.inwardOdyssey, position: inwardPosition || argoKnowledgeStart(cycleId) }),
      };
    }

    function defaultDayForCycle(cycleId) {
      return cycleId === "c1" ? "T0" : 0;
    }

    function normalizeCampaignDay(value, cycleId = "c2") {
      const text = String(value ?? "").trim().toUpperCase();
      if (cycleId === "c1" && /^(?:T[0-5]|T6\/00)$/.test(text)) return text;
      if (text === "") return defaultDayForCycle(cycleId);
      return Math.max(0, Math.floor(Number(text) || 0));
    }

    function normalizeState(value = {}, cycleId = "c2") {
      const { cardCounters: legacyCardCounters, ...normalizedValue } = value;
      const day = normalizeCampaignDay(value === defaultState ? undefined : value.day, cycleId);
      const surveyConstantsDay = typeof value.surveyConstantsDay === "string" ? value.surveyConstantsDay : null;
      const surveyConstantsTouchedDay = typeof value.surveyConstantsTouchedDay === "string" ? value.surveyConstantsTouchedDay : null;
      const currentSurveyDay = `${cycleId}:${day}`;
      const pharosDreamsDay = typeof value.pharosDreamsDay === "string" ? value.pharosDreamsDay : null;
      const mainStoryConstantsDay = typeof value.mainStoryConstantsDay === "string" ? value.mainStoryConstantsDay : null;
      const mnemosBreakthroughConstantsDay = typeof value.mnemosBreakthroughConstantsDay === "string" ? value.mnemosBreakthroughConstantsDay : null;
      const specialEventConstantsDay = typeof value.specialEventConstantsDay === "string" ? value.specialEventConstantsDay : null;
      return {
        ...defaultState,
        ...normalizedValue,
        day,
        dateNotes: isPlainObject(value.dateNotes) ? cloneJson(value.dateNotes) : {},
        mapCurrentTileTags: Array.isArray(value.mapCurrentTileTags)
          ? value.mapCurrentTileTags
          : (Array.isArray(value.mapSnapshot?.currentTileTags) ? value.mapSnapshot.currentTileTags : []),
        mapCurrentTileTagLabels: Array.isArray(value.mapCurrentTileTagLabels)
          ? value.mapCurrentTileTagLabels
          : (Array.isArray(value.mapSnapshot?.currentTileTagLabels) ? value.mapSnapshot.currentTileTagLabels : []),
        mapCurrentTileFactions: Array.isArray(value.mapCurrentTileFactions)
          ? value.mapCurrentTileFactions
          : (Array.isArray(value.mapSnapshot?.currentTileFactions) ? value.mapSnapshot.currentTileFactions : []),
        mapCurrentTileFactionLabels: Array.isArray(value.mapCurrentTileFactionLabels)
          ? value.mapCurrentTileFactionLabels
          : (Array.isArray(value.mapSnapshot?.currentTileFactionLabels) ? value.mapSnapshot.currentTileFactionLabels : []),
        mapLatestRevealedTileTags: Array.isArray(value.mapLatestRevealedTileTags)
          ? value.mapLatestRevealedTileTags
          : (Array.isArray(value.mapSnapshot?.latestRevealedTileTags) ? value.mapSnapshot.latestRevealedTileTags : []),
        mapLatestRevealedTileTagLabels: Array.isArray(value.mapLatestRevealedTileTagLabels)
          ? value.mapLatestRevealedTileTagLabels
          : (Array.isArray(value.mapSnapshot?.latestRevealedTileTagLabels) ? value.mapSnapshot.latestRevealedTileTagLabels : []),
        mapCurrentTileHasLastCityMarker: Boolean(value.mapCurrentTileHasLastCityMarker || value.mapSnapshot?.currentTileHasLastCityMarker),
        mapCurrentTileHasLastOasisMarker: Boolean(value.mapCurrentTileHasLastOasisMarker || value.mapSnapshot?.currentTileHasLastOasisMarker),
        mapCurrentTileIsLatestRevealed: Boolean(value.mapCurrentTileIsLatestRevealed),
        surveyConstants: isPlainObject(value.surveyConstants) ? normalizeSurveyConstants(value.surveyConstants) : null,
        surveyConstantsDay,
        surveyConstantsTouchedDay,
        latestSurveyAdventureAction: isPlainObject(value.latestSurveyAdventureAction) ? value.latestSurveyAdventureAction : null,
        latestSimpleAdventureAction: isPlainObject(value.latestSimpleAdventureAction) ? value.latestSimpleAdventureAction : null,
        pharosDreams: isPlainObject(value.pharosDreams) ? value.pharosDreams : null,
        pharosDreamsDay,
        pharosDreamsActive: value.pharosDreams?.[value.pharosDreamsActive] ? String(value.pharosDreamsActive) : null,
        mainStoryConstants: isPlainObject(value.mainStoryConstants) ? value.mainStoryConstants : null,
        mainStoryConstantsDay,
        mainStoryConstantsActive: value.mainStoryConstants?.[value.mainStoryConstantsActive] ? String(value.mainStoryConstantsActive) : null,
        mnemosBreakthroughConstants: isPlainObject(value.mnemosBreakthroughConstants) ? value.mnemosBreakthroughConstants : null,
        mnemosBreakthroughConstantsDay,
        mnemosBreakthroughConstantsActive: value.mnemosBreakthroughConstants?.[value.mnemosBreakthroughConstantsActive] ? String(value.mnemosBreakthroughConstantsActive) : null,
        specialEventConstants: isPlainObject(value.specialEventConstants) ? value.specialEventConstants : null,
        specialEventConstantsDay,
        specialEventConstantsActive: value.specialEventConstants?.[value.specialEventConstantsActive] ? String(value.specialEventConstantsActive) : null,
        constantToolsOpen: isPlainObject(value.constantToolsOpen) ? cloneJson(value.constantToolsOpen) : {},
        exploration: normalizeExploration(value.exploration),
        cardTracks: normalizeCardTracks(value.cardTracks, legacyCardCounters, value.cardTracks && value.cardTracksVersion !== 2, cycleId),
        cardTracksVersion: 2,
        unlockedTech: isPlainObject(value.unlockedTech) ? value.unlockedTech : null,
        events: Array.isArray(value.events) ? cloneJson(value.events) : [],
        nextBattleTerrain: normalizeNextBattleTerrain(value.nextBattleTerrain),
        completed: isPlainObject(value.completed) ? cloneJson(value.completed) : {},
      };
    }

    function normalizeExploration(value = {}) {
      return {
        selectedByCycle: isPlainObject(value?.selectedByCycle) ? value.selectedByCycle : {},
        drawStateByCycle: isPlainObject(value?.drawStateByCycle) ? value.drawStateByCycle : {},
        cardTagsByCycle: isPlainObject(value?.cardTagsByCycle) ? value.cardTagsByCycle : {},
        destructionByCycle: isPlainObject(value?.destructionByCycle) ? value.destructionByCycle : {},
        destructionCardIdsByCycle: isPlainObject(value?.destructionCardIdsByCycle) ? value.destructionCardIdsByCycle : {},
        acclimationsByCycle: isPlainObject(value?.acclimationsByCycle) ? value.acclimationsByCycle : {},
      };
    }

    function normalizeSurveyConstants(value = {}) {
      return {
        hubs: isPlainObject(value?.hubs) ? value.hubs : {},
        rr: isPlainObject(value?.rr) ? value.rr : {},
        activeHub: isPlainObject(value?.activeHub) ? value.activeHub : null,
        activeRr: isPlainObject(value?.activeRr) ? value.activeRr : null,
      };
    }

    function surveyConstantsDayKey() {
      return `${currentCycleConfig().id}:${Math.max(0, Number(state.day || 0))}`;
    }

    function pharosDreamsDayKey() {
      return `${currentCycleConfig().id}:${Math.max(0, Number(state.day || 0))}`;
    }

    function currentPharosDreamConstants() {
      return pharosDreamConstants[currentCycleConfig().id] || null;
    }

    function currentMainStoryConstants() {
      return mainStoryConstants[currentCycleConfig().id] || null;
    }

    function currentMnemosBreakthroughConstants() {
      return mnemosBreakthroughConstants[currentCycleConfig().id] || null;
    }

    function currentSpecialEventConstants() {
      return specialEventConstants[currentCycleConfig().id] || null;
    }

    function ensureTodaySimpleConstants(valueKey, dayKey, activeKey) {
      const currentDayKey = pharosDreamsDayKey();
      if (!isPlainObject(state[valueKey])) {
        state[valueKey] = {};
        state[activeKey] = null;
      }
      state[dayKey] ||= currentDayKey;
      return state[valueKey];
    }

    function ensureTodayPharosDreams() {
      return ensureTodaySimpleConstants("pharosDreams", "pharosDreamsDay", "pharosDreamsActive");
    }

    function ensureTodayMainStoryConstants() {
      return ensureTodaySimpleConstants("mainStoryConstants", "mainStoryConstantsDay", "mainStoryConstantsActive");
    }

    function ensureTodayMnemosBreakthroughConstants() {
      return ensureTodaySimpleConstants("mnemosBreakthroughConstants", "mnemosBreakthroughConstantsDay", "mnemosBreakthroughConstantsActive");
    }

    function ensureTodaySpecialEventConstants() {
      return ensureTodaySimpleConstants("specialEventConstants", "specialEventConstantsDay", "specialEventConstantsActive");
    }

    function simpleConstantSlotIds(row) {
      const count = Math.max(1, Number(row?.[3]?.count || 1));
      return Array.from({ length: count }, (_, index) => count === 1 ? row[0] : `${row[0]}:${index + 1}`);
    }

    function findSimpleConstantRow(data, target) {
      if (!data || !target) return null;
      return data.boxes.find((row) => row[0] === target || simpleConstantSlotIds(row).includes(target)) || null;
    }

    function firstCheckedSimpleConstantId(data, values) {
      const row = data?.boxes.find((item) => {
        const slotIds = simpleConstantSlotIds(item);
        return slotIds.some((slotId) => values[slotId]) || (slotIds.length > 1 && values[item[0]]);
      });
      if (!row) return null;
      const slotIds = simpleConstantSlotIds(row);
      return slotIds.find((slotId) => values[slotId]) || slotIds[0];
    }

    function getActiveSimpleConstantTarget(data, valueKey, activeKey, ensureFn) {
      if (!data) return null;
      const values = ensureFn();
      const activeRow = findSimpleConstantRow(data, state[activeKey]);
      if (activeRow) {
        const activeSlots = simpleConstantSlotIds(activeRow);
        if (values[state[activeKey]]) return state[activeKey];
        if (activeSlots.length > 1 && values[activeRow[0]]) return activeSlots[0];
      }
      return firstCheckedSimpleConstantId(data, values);
    }

    function getActivePharosDreamTarget() {
      return getActiveSimpleConstantTarget(currentPharosDreamConstants(), "pharosDreams", "pharosDreamsActive", ensureTodayPharosDreams);
    }

    function getActiveMainStoryTarget() {
      return getActiveSimpleConstantTarget(currentMainStoryConstants(), "mainStoryConstants", "mainStoryConstantsActive", ensureTodayMainStoryConstants);
    }

    function getActiveMnemosBreakthroughTarget() {
      return getActiveSimpleConstantTarget(currentMnemosBreakthroughConstants(), "mnemosBreakthroughConstants", "mnemosBreakthroughConstantsActive", ensureTodayMnemosBreakthroughConstants);
    }

    function getActiveSpecialEventTarget() {
      return getActiveSimpleConstantTarget(currentSpecialEventConstants(), "specialEventConstants", "specialEventConstantsActive", ensureTodaySpecialEventConstants);
    }

    function ensureTodaySurveyConstants() {
      const dayKey = surveyConstantsDayKey();
      state.surveyConstantsDay ||= dayKey;
      state.surveyConstants = normalizeSurveyConstants(state.surveyConstants);
      return state.surveyConstants;
    }

    function normalizeNextBattleTerrain(value) {
      if (!isPlainObject(value)) return null;
      const terrain = String(value.terrain || "").trim();
      if (!terrain) return null;
      return {
        terrain,
        hubId: String(value.hubId || ""),
        boxId: String(value.boxId || ""),
        hub: String(value.hub || ""),
        source: String(value.source || ""),
        setAtDay: Math.max(0, Number(value.setAtDay || 0)),
      };
    }

    function shuffleList(items) {
      const result = [...items];
      for (let index = result.length - 1; index > 0; index -= 1) {
        const swapIndex = Math.floor(Math.random() * (index + 1));
        [result[index], result[swapIndex]] = [result[swapIndex], result[index]];
      }
      return result;
    }

    function getExplorationLibrary() {
      const cards = (explorationDecks[currentCycleConfig().id] || []).flatMap((deck) => deck.cards);
      const seen = new Set();
      return cards.filter((card) => {
        if (seen.has(card.id)) return false;
        seen.add(card.id);
        return true;
      });
    }

    function getSelectedExplorationIds() {
      state.exploration = normalizeExploration(state.exploration);
      const cycleId = currentCycleConfig().id;
      const validIds = new Set(getExplorationLibrary().map((card) => card.id));
      const storedSelection = state.exploration.selectedByCycle[cycleId];
      const selected = Array.isArray(storedSelection)
        ? storedSelection.filter((id) => validIds.has(id))
        : (defaultExplorationSelections[cycleId] || []).filter((id) => validIds.has(id));
      state.exploration.selectedByCycle[cycleId] = selected;
      return selected;
    }

    function getExplorationCard(cardId) {
      return getExplorationLibrary().find((card) => card.id === cardId) || null;
    }

    function getExplorationCardByCornerNumber(cycleId, cornerNumber) {
      const id = Object.entries(explorationCornerNumbers[cycleId] || {})
        .find(([, number]) => String(number) === String(cornerNumber))?.[0];
      return id ? getExplorationLibrary().find((card) => card.id === id) || null : null;
    }

    function getExplorationCardLabel(cardId) {
      const card = getExplorationCard(cardId);
      const cornerNumber = getExplorationCornerNumber(cardId);
      return `${card?.name || "探索卡"} #${cardId}${cornerNumber ? ` · 黑底${cornerNumber}` : ""}`;
    }

    function getAcclimationRule(day = state.day, cycleId = currentCycleConfig().id) {
      return (acclimationReplacementRules[cycleId] || []).find((rule) => Number(rule.day) === Number(day)) || null;
    }

    function isAcclimationApplied(rule, cycleId = currentCycleConfig().id) {
      state.exploration = normalizeExploration(state.exploration);
      return Boolean(state.exploration.acclimationsByCycle?.[cycleId]?.[rule.id]);
    }

    function replaceExplorationEntry(entry, replacementPlan) {
      if (!entry || replacementPlan.removedIds.has(entry.id)) return null;
      if (!replacementPlan.replacements.has(entry.id)) return entry;
      const nextId = replacementPlan.replacements.get(entry.id);
      const nextCard = getExplorationCard(nextId);
      return {
        ...entry,
        id: nextId,
        name: nextCard?.name || entry.name,
        acclimatedFrom: entry.id,
      };
    }

    function applyAcclimationReplacement(rule) {
      const cycleId = currentCycleConfig().id;
      state.exploration = normalizeExploration(state.exploration);
      const fromIds = rule.from.map((corner) => getExplorationCardByCornerNumber(cycleId, corner)?.id);
      const toIds = rule.to.map((corner) => getExplorationCardByCornerNumber(cycleId, corner)?.id);
      if (fromIds.some((id) => !id) || toIds.some((id) => !id)) return;
      const replacementPlan = window.ATO_EXPLORATION_RULES.createReplacementPlan(fromIds, toIds);

      const selectedIds = getSelectedExplorationIds();
      const drawState = ensureExplorationDrawState();
      state.exploration.selectedByCycle[cycleId] = window.ATO_EXPLORATION_RULES.applyReplacementPlan(
        selectedIds,
        replacementPlan,
        true
      );
      drawState.drawPile = window.ATO_EXPLORATION_RULES.applyReplacementPlan(
        drawState.drawPile,
        replacementPlan,
        true
      );
      drawState.activePiles = drawState.activePiles.map((pile) =>
        pile.map((entry) => replaceExplorationEntry(entry, replacementPlan)).filter(Boolean)
      );
      drawState.temporaryRemoved = drawState.temporaryRemoved
        .map((entry) => replaceExplorationEntry(entry, replacementPlan))
        .filter(Boolean);
      drawState.permanentRemoved = drawState.permanentRemoved
        .map((entry) => replaceExplorationEntry(entry, replacementPlan))
        .filter(Boolean);
      drawState.history = drawState.activePiles.flat();
      drawState.discardPile = [];
      drawState.current = drawState.history[drawState.history.length - 1] || null;

      const applied = isPlainObject(state.exploration.acclimationsByCycle[cycleId])
        ? state.exploration.acclimationsByCycle[cycleId]
        : {};
      applied[rule.id] = true;
      state.exploration.acclimationsByCycle[cycleId] = applied;

      const summary = `${rule.from.join(", ")} -> ${rule.to.join(", ")}`;
      const noteKey = dateNoteKey(rule.day);
      const note = state.dateNotes?.[noteKey] || "";
      if (!note.includes(`${rule.label} 扎根`)) {
        state.dateNotes[noteKey] = [note, `${rule.label} 扎根：${summary}`].filter(Boolean).join("\n");
      }

      saveState();
      renderFlow();
      renderDateTrack();
    }

    function getExplorationSpecialRule() {
      return explorationSpecialRules[currentCycleConfig().id] || null;
    }

    function getDestructionCardIds() {
      state.exploration = normalizeExploration(state.exploration);
      const cycleId = currentCycleConfig().id;
      const rule = getExplorationSpecialRule();
      if (!rule?.destructionIds) return [];

      const validIds = new Set(getExplorationLibrary().map((card) => card.id));
      const storedIds = state.exploration.destructionCardIdsByCycle[cycleId];
      const cardIds = Array.isArray(storedIds)
        ? storedIds.filter((id) => validIds.has(id))
        : rule.destructionIds.filter((id) => validIds.has(id));
      state.exploration.destructionCardIdsByCycle[cycleId] = [...new Set(cardIds)];
      return state.exploration.destructionCardIdsByCycle[cycleId];
    }

    function getDestructionPileIds() {
      state.exploration = normalizeExploration(state.exploration);
      const cycleId = currentCycleConfig().id;
      const rule = getExplorationSpecialRule();
      if (!rule?.destructionIds) return [];

      const validIds = new Set(getDestructionCardIds());
      const selectedIds = new Set(getSelectedExplorationIds());
      const storedPile = state.exploration.destructionByCycle[cycleId];
      const pile = Array.isArray(storedPile)
        ? storedPile.filter((id) => validIds.has(id) && !selectedIds.has(id))
        : getDestructionCardIds().filter((id) => !selectedIds.has(id));
      state.exploration.destructionByCycle[cycleId] = pile;
      return pile;
    }

    function createExplorationDrawState(cardIds) {
      return {
        drawPile: shuffleList(cardIds),
        activePiles: [[], []],
        temporaryRemoved: [],
        permanentRemoved: [],
        history: [],
        discardPile: [],
        current: null,
      };
    }

    function getExplorationCardTag(cardId) {
      const cycleId = currentCycleConfig().id;
      state.exploration = normalizeExploration(state.exploration);
      const entry = state.exploration.cardTagsByCycle?.[cycleId]?.[cardId]
        || window.ATO_EXPLORATION_CARD_TAGS?.cards?.[`${cycleId}:${cardId}`]
        || {};
      return window.ATO_EXPLORATION_RULES.normalizeTag(entry);
    }

    function normalizeExplorationRecord(entry, pile = 0) {
      if (!entry?.id) return null;
      const card = getExplorationCard(entry.id);
      if (!card) return null;
      const tag = getExplorationCardTag(entry.id);
      return {
        ...entry,
        id: card.id,
        name: card.name,
        day: Math.max(0, Number(entry.day || 0)),
        removal: entry.removal === "permanent" || entry.removal === "remove" || entry.removal === "keep"
          ? entry.removal
          : tag.removal,
        draw: entry.draw === "chain" || entry.draw === "single" ? entry.draw : tag.draw,
        pile,
      };
    }

    function ensureExplorationDrawState() {
      state.exploration = normalizeExploration(state.exploration);
      const cycleId = currentCycleConfig().id;
      const existing = state.exploration.drawStateByCycle[cycleId];
      const legacyPermanentIds = Array.isArray(existing?.permanentRemoved)
        ? existing.permanentRemoved.map((entry) => typeof entry === "string" ? entry : entry?.id).filter(Boolean)
        : [];
      if (legacyPermanentIds.length) {
        const legacyPermanentSet = new Set(legacyPermanentIds);
        state.exploration.selectedByCycle[cycleId] = getSelectedExplorationIds().filter((id) => !legacyPermanentSet.has(id));
      }
      const selectedIds = getSelectedExplorationIds();
      if (!existing || !Array.isArray(existing.drawPile) || !Array.isArray(existing.history)) {
        state.exploration.drawStateByCycle[cycleId] = createExplorationDrawState(selectedIds);
        return state.exploration.drawStateByCycle[cycleId];
      }

      const validIds = new Set(selectedIds);
      if (!Array.isArray(existing.discardPile)) existing.discardPile = [];
      if (!Array.isArray(existing.temporaryRemoved)) existing.temporaryRemoved = [];
      if (!Array.isArray(existing.activePiles)) {
        const legacyHistory = Array.isArray(existing.history) ? existing.history : [];
        existing.activePiles = [legacyHistory, []];
      }
      while (existing.activePiles.length < 2) existing.activePiles.push([]);
      existing.activePiles = existing.activePiles.slice(0, 2).map((pile, pileIndex) =>
        (Array.isArray(pile) ? pile : [])
          .filter((entry) => entry && validIds.has(entry.id))
          .map((entry) => normalizeExplorationRecord(entry, pileIndex))
          .filter(Boolean)
      );
      existing.temporaryRemoved = existing.temporaryRemoved
        .map((entry) => typeof entry === "string" ? { id: entry } : entry)
        .filter((entry) => entry && validIds.has(entry.id))
        .map((entry) => normalizeExplorationRecord(entry))
        .filter(Boolean);
      existing.permanentRemoved = [];

      const legacyDiscardIds = existing.discardPile
        .map((entry) => typeof entry === "string" ? entry : entry?.id)
        .filter((id) => validIds.has(id));
      existing.drawPile = existing.drawPile.filter((id) => validIds.has(id));
      existing.drawPile.push(...legacyDiscardIds);
      existing.discardPile = [];
      existing.history = existing.activePiles.flat();
      existing.current = existing.history[existing.history.length - 1] || null;

      const knownIds = new Set([
        ...existing.drawPile,
        ...existing.activePiles.flat().map((entry) => entry.id),
        ...existing.temporaryRemoved.map((entry) => entry.id),
      ]);
      const missingIds = selectedIds.filter((id) => !knownIds.has(id));
      existing.drawPile = [...new Set(existing.drawPile)];
      existing.drawPile.push(...shuffleList(missingIds));
      return existing;
    }

    function applyExplorationSelection(cardIds) {
      state.exploration = normalizeExploration(state.exploration);
      const cycleId = currentCycleConfig().id;
      const validIds = new Set(getExplorationLibrary().map((card) => card.id));
      const selectedIds = [...new Set(cardIds)].filter((id) => validIds.has(id));
      const drawState = ensureExplorationDrawState();
      if ((drawState.activePiles.flat().length || drawState.temporaryRemoved.length)
        && !window.confirm("更新探索牌组会重洗，并清空当前抽牌结果和暂时移出区。继续吗？")) return;
      state.exploration.selectedByCycle[cycleId] = selectedIds;
      const rule = getExplorationSpecialRule();
      if (rule?.destructionIds) {
        const destructionIds = new Set(getDestructionCardIds());
        const selectedSet = new Set(selectedIds);
        const storedPile = Array.isArray(state.exploration.destructionByCycle[cycleId])
          ? state.exploration.destructionByCycle[cycleId]
          : getDestructionCardIds();
        state.exploration.destructionByCycle[cycleId] = storedPile.filter((id) => destructionIds.has(id) && !selectedSet.has(id));
      }
      state.exploration.drawStateByCycle[cycleId] = createExplorationDrawState(selectedIds);
      saveState();
      renderFlow();
    }

    function restoreDefaultExplorationSelection() {
      const cycleId = currentCycleConfig().id;
      const defaultIds = defaultExplorationSelections[cycleId];
      if (!defaultIds?.length) return;

      const drawState = ensureExplorationDrawState();
      if ((drawState.activePiles.flat().length || drawState.temporaryRemoved.length)
        && !window.confirm("恢复初始探索牌组会重洗，并清空当前抽牌结果和暂时移出区。继续吗？")) return;

      const validIds = new Set(getExplorationLibrary().map((card) => card.id));
      const selectedIds = defaultIds.filter((id) => validIds.has(id));
      state.exploration = normalizeExploration(state.exploration);
      state.exploration.selectedByCycle[cycleId] = selectedIds;
      const rule = getExplorationSpecialRule();
      if (rule?.destructionIds) {
        state.exploration.destructionCardIdsByCycle[cycleId] = [...rule.destructionIds];
        state.exploration.destructionByCycle[cycleId] = [...rule.destructionIds];
      }
      state.exploration.drawStateByCycle[cycleId] = createExplorationDrawState(selectedIds);
      saveState();
      renderFlow();
    }

    function drawExplorationCard() {
      const library = getExplorationLibrary();
      if (!library.length) {
        window.alert("当前 Cycle 暂无探索卡组数据。");
        return;
      }

      const selectedIds = getSelectedExplorationIds();
      if (!selectedIds.length) {
        window.alert("请先在探索卡库里选择本次探索牌组。");
        return;
      }

      const drawState = ensureExplorationDrawState();
      if (drawState.activePiles.flat().length) {
        window.alert("请先结算当前探索结果，再进行下一次探索抽卡。");
        return;
      }
      if (!drawState.drawPile.length) {
        window.alert("探索牌堆已空。请将暂时移出的牌放回，或重新配置探索牌组。");
        return;
      }

      const result = window.ATO_EXPLORATION_RULES.drawTwoPiles(
        drawState.drawPile,
        getExplorationCardTag,
        (cardId, tag, pileIndex) => {
          const card = getExplorationCard(cardId);
          return {
            id: card.id,
            name: card.name,
            day: state.day,
            drawnAt: new Date().toISOString(),
            removal: tag.removal,
            draw: tag.draw,
            pile: pileIndex,
          };
        }
      );
      drawState.drawPile = result.drawPile;
      drawState.activePiles = result.piles;
      drawState.history = result.piles.flat();
      drawState.current = drawState.history[drawState.history.length - 1] || null;
      saveState();
      renderFlow();
      if (result.incompletePiles) {
        window.alert(`探索牌堆不足：有 ${result.incompletePiles} 堆未抽到“不连抽”卡。请结算后补充或放回卡牌。`);
      }
    }

    function endExplorationDraw() {
      const drawState = ensureExplorationDrawState();
      const drawn = drawState.activePiles.flat();
      if (!drawn.length) return;
      const result = window.ATO_EXPLORATION_RULES.settlePiles(drawState.activePiles);
      drawState.temporaryRemoved.push(...result.temporaryRemoved);
      if (result.permanentIds.length) {
        const permanentIds = new Set(result.permanentIds);
        const cycleId = currentCycleConfig().id;
        state.exploration.selectedByCycle[cycleId] = getSelectedExplorationIds()
          .filter((id) => !permanentIds.has(id));
      }
      drawState.drawPile = shuffleList([...drawState.drawPile, ...result.returnIds]);
      drawState.activePiles = [[], []];
      drawState.history = [];
      drawState.discardPile = [];
      drawState.current = null;
      saveState();
      renderFlow();
    }

    function returnTemporaryExplorationCards() {
      const drawState = ensureExplorationDrawState();
      if (!drawState.temporaryRemoved.length) return;
      drawState.drawPile = shuffleList([
        ...drawState.drawPile,
        ...drawState.temporaryRemoved.map((entry) => entry.id),
      ]);
      drawState.temporaryRemoved = [];
      saveState();
      renderFlow();
    }

    function addRandomDestructionCard() {
      const rule = getExplorationSpecialRule();
      if (!rule?.destructionIds) return;

      const pile = getDestructionPileIds();
      if (!pile.length) {
        window.alert("破坏卡组已空。");
        return;
      }

      const cardId = pile[Math.floor(Math.random() * pile.length)];
      const cycleId = currentCycleConfig().id;
      const selectedIds = [...getSelectedExplorationIds(), cardId];
      state.exploration.selectedByCycle[cycleId] = [...new Set(selectedIds)];
      state.exploration.destructionByCycle[cycleId] = pile.filter((id) => id !== cardId);
      ensureExplorationDrawState();
      saveState();
      renderFlow();
    }

    function addCardToDestructionPile(cardId) {
      const rule = getExplorationSpecialRule();
      if (!rule?.destructionIds || !getExplorationCard(cardId)) return;

      const cycleId = currentCycleConfig().id;
      state.exploration = normalizeExploration(state.exploration);
      const destructionCardIds = getDestructionCardIds();
      if (!destructionCardIds.includes(cardId)) {
        state.exploration.destructionCardIdsByCycle[cycleId] = [...destructionCardIds, cardId];
      }

      const pile = getDestructionPileIds();
      if (!pile.includes(cardId)) {
        state.exploration.destructionByCycle[cycleId] = [...pile, cardId];
      }

      state.exploration.selectedByCycle[cycleId] = getSelectedExplorationIds().filter((id) => id !== cardId);
      state.exploration.destructionByCycle[cycleId] = getDestructionPileIds();
      ensureExplorationDrawState();
      saveState();
      renderFlow();
    }

    function returnDestructionCard(cardId) {
      const rule = getExplorationSpecialRule();
      if (!rule?.destructionIds || !getDestructionCardIds().includes(cardId)) return;

      const cycleId = currentCycleConfig().id;
      state.exploration = normalizeExploration(state.exploration);
      state.exploration.selectedByCycle[cycleId] = getSelectedExplorationIds().filter((id) => id !== cardId);

      const pile = getDestructionPileIds();
      if (!pile.includes(cardId)) {
        state.exploration.destructionByCycle[cycleId] = [...pile, cardId];
      }

      ensureExplorationDrawState();
      saveState();
      renderFlow();
    }

    function resetExplorationDeck() {
      const selectedIds = getSelectedExplorationIds();
      if (!selectedIds.length) return;
      if (!window.confirm("重洗探索牌堆并清空当前待结算抽牌吗？暂时移出和永久移出的牌不会自动放回。")) return;
      state.exploration = normalizeExploration(state.exploration);
      const current = ensureExplorationDrawState();
      const blockedIds = new Set([
        ...current.temporaryRemoved.map((entry) => entry.id),
      ]);
      const next = createExplorationDrawState(selectedIds.filter((id) => !blockedIds.has(id)));
      next.temporaryRemoved = current.temporaryRemoved;
      state.exploration.drawStateByCycle[currentCycleConfig().id] = next;
      saveState();
      renderFlow();
    }

    function getExplorationCardImageStyle(cardId) {
      const cycleId = currentCycleConfig().id;
      return [
        `background-image: url("./assets/exploration-cards/${cycleId}/${cardId}.png")`,
        "background-size: contain",
        "background-position: center",
      ].join(";");
    }

    function getExplorationCornerNumber(cardId) {
      return explorationCornerNumbers[currentCycleConfig().id]?.[cardId] || "";
    }

    function createExplorationDestructionTools(selectedIds, destructionPileIds) {
      const rule = getExplorationSpecialRule();
      if (!rule?.destructionIds) return null;

      const destructionSet = new Set(getDestructionCardIds());
      const selectedDestructionIds = selectedIds.filter((id) => destructionSet.has(id));
      const section = document.createElement("details");
      section.className = "exploration-destruction";
      const summary = document.createElement("summary");
      summary.textContent = `破坏卡组（${destructionPileIds.length}） · 探索中 ${selectedDestructionIds.length}`;
      const body = document.createElement("div");
      body.className = "exploration-destruction-body";

      const head = document.createElement("div");
      head.className = "exploration-destruction-head";
      const title = document.createElement("div");
      title.className = "exploration-destruction-title";
      title.textContent = `破坏卡组（${destructionPileIds.length}）`;
      const addButton = document.createElement("button");
      addButton.type = "button";
      addButton.className = "danger";
      addButton.textContent = "随机加入破坏卡";
      addButton.disabled = destructionPileIds.length === 0;
      addButton.addEventListener("click", addRandomDestructionCard);
      head.append(title, addButton);

      const pileList = document.createElement("div");
      pileList.className = "exploration-destruction-list";
      if (destructionPileIds.length) {
        destructionPileIds.forEach((cardId) => {
          const item = document.createElement("span");
          item.className = "exploration-destruction-card";
          item.textContent = getExplorationCardLabel(cardId);
          pileList.appendChild(item);
        });
      } else {
        const item = document.createElement("span");
        item.className = "exploration-destruction-card";
        item.textContent = "破坏卡组为空";
        pileList.appendChild(item);
      }

      const selectedTitle = document.createElement("div");
      selectedTitle.className = "exploration-destruction-title";
      selectedTitle.textContent = `探索卡组中的破坏卡（${selectedDestructionIds.length}）`;

      const selectedList = document.createElement("div");
      selectedList.className = "exploration-destruction-list";
      if (selectedDestructionIds.length) {
        selectedDestructionIds.forEach((cardId) => {
          const item = document.createElement("span");
          item.className = "exploration-destruction-card";
          const label = document.createElement("span");
          label.textContent = getExplorationCardLabel(cardId);
          const returnButton = document.createElement("button");
          returnButton.type = "button";
          returnButton.className = "secondary";
          returnButton.textContent = "移回";
          returnButton.addEventListener("click", () => returnDestructionCard(cardId));
          item.append(label, returnButton);
          selectedList.appendChild(item);
        });
      } else {
        const item = document.createElement("span");
        item.className = "exploration-destruction-card";
        item.textContent = "暂无";
        selectedList.appendChild(item);
      }

      body.append(head, pileList, selectedTitle, selectedList);
      section.append(summary, body);
      return section;
    }

    function currentProfile() {
      return archive.profiles[archive.activeProfileId];
    }

    function currentCycle() {
      const profile = currentProfile();
      if (!profile.cycles?.[profile.activeCycleId]) {
        profile.activeCycleId = "c1";
        profile.cycles = createDefaultCycles("c1");
      }
      return profile.cycles[profile.activeCycleId];
    }

    function currentCycleConfig() {
      return cycleConfigs.find((cycle) => cycle.id === currentProfile().activeCycleId) || cycleConfigs[0];
    }

    function saveState() {
      currentCycle().state = state;
      queueCampaignSave();
    }

    function mapCycleDefinition(cycleId = currentCycleConfig().id) {
      return (window.ATO_MAP_DATA?.cycles || []).find((cycle) => cycle.id === cycleId) || null;
    }

    function normalizeMapCommandState(value, cycleId) {
      const mapData = window.ATO_MAP_DATA || { cycles: [] };
      const cycles = {};
      mapData.cycles.forEach((cycle) => {
        const saved = value?.cycles?.[cycle.id] || {};
        const tokens = saved.tokens || {};
        cycles[cycle.id] = {
          currentTile: saved.currentTile || tokens.AG || "",
          explored: isPlainObject(saved.explored) ? saved.explored : {},
          previewRevealed: isPlainObject(saved.previewRevealed) ? saved.previewRevealed : {},
          latestRevealedTile: saved.latestRevealedTile || "",
          tileNotes: isPlainObject(saved.tileNotes) ? saved.tileNotes : {},
          tileVariants: isPlainObject(saved.tileVariants) ? saved.tileVariants : {},
          tokens: {
            AG: tokens.AG || saved.currentTile || "",
            AD: tokens.AD || "",
            hsCount: Math.max(0, Math.floor(Number(tokens.hsCount || saved.hsCount || 0))),
            markers: isPlainObject(tokens.markers) ? tokens.markers : {},
          },
        };
      });
      return {
        ...(isPlainObject(value) ? value : {}),
        activeCycleId: cycleId,
        showBack: Boolean(value?.showBack),
        onlyExplored: Boolean(value?.onlyExplored),
        hideUnknown: value?.hideUnknown == null ? true : Boolean(value.hideUnknown),
        showAdjacency: Boolean(value?.showAdjacency),
        mapZoom: Number(value?.mapZoom || 100),
        selectedToken: value?.selectedToken || "AG",
        query: value?.query || "",
        cycles,
      };
    }

    async function loadMapCommandState() {
      const response = await fetch(`${authUrl}?section=map`, { cache: "no-store" });
      const payload = await response.json().catch(() => null);
      if (!response.ok || !payload?.ok) throw new Error(payload?.error || `HTTP ${response.status}`);
      const profileId = archive.activeProfileId;
      const section = payload.state;
      const userState = section?.users ? section.users[profileId] : section;
      return {
        state: normalizeMapCommandState(userState, currentCycleConfig().id),
        revision: Math.max(0, Number(payload.revision || 0)),
        profileId,
      };
    }

    async function saveMapCommandState(commandState) {
      for (let attempt = 0; attempt < 2; attempt += 1) {
        const response = await fetch(`${authUrl}?section=map`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            section: "map",
            userId: commandState.profileId,
            state: commandState.state,
            expectedRevision: commandState.revision,
          }),
        });
        const payload = await response.json().catch(() => null);
        if (response.status === 409 && payload?.revision) {
          // The map page saved the section meanwhile; adopt the latest
          // revision and re-save the command state once.
          commandState.revision = payload.revision;
          continue;
        }
        if (!response.ok || !payload?.ok) throw new Error(payload?.error || `HTTP ${response.status}`);
        commandState.revision = payload.revision || commandState.revision;
        return;
      }
      throw new Error("地图状态在保存时被其他页面更新，请重试。");
    }

    function currentMapCommandCycle(commandState) {
      const cycleId = currentCycleConfig().id;
      const cycle = mapCycleDefinition(cycleId);
      const cycleState = commandState.state.cycles[cycleId];
      if (!cycle || !cycleState) throw new Error("当前 Cycle 没有地图数据。");
      return { cycleId, cycle, cycleState };
    }

    function syncDashboardMapSnapshot(cycleId, cycle, cycleState) {
      const current = cycle.tiles.find((tile) => tile.id === cycleState.currentTile);
      const adversary = cycle.tiles.find((tile) => tile.id === cycleState.tokens.AD);
      const exploredIds = cycle.tiles.filter((tile) => cycleState.explored[tile.id]).map((tile) => tile.id);
      state.location = current?.label || cycleState.currentTile || "";
      state.mapSnapshot = {
        ...(isPlainObject(state.mapSnapshot) ? state.mapSnapshot : {}),
        savedAt: new Date().toISOString(),
        cycleId,
        cycleLabel: cycle.label,
        currentTileId: cycleState.currentTile || "",
        currentTileLabel: current?.label || cycleState.currentTile || "",
        adversaryTileId: cycleState.tokens.AD || "",
        adversaryTileLabel: adversary?.label || cycleState.tokens.AD || "",
        exploredIds,
        exploredCount: exploredIds.length,
        totalTiles: cycle.tiles.length,
      };
      saveState();
    }

    function mapDirectionalTarget(cycle, cycleState, direction) {
      const current = cycle.tiles.find((tile) => tile.id === cycleState.currentTile);
      if (!current) throw new Error("请先在地图中设置阿尔戈号当前位置。");
      const targetId = current.neighbors?.[direction] || "";
      if (!targetId) throw new Error(`当前位置没有可向${({ up: "上", right: "右", down: "下", left: "左" })[direction]}移动的板块。`);
      const target = cycle.tiles.find((tile) => tile.id === targetId);
      if (!target) throw new Error("地图数据中找不到目标板块。");
      return targetId;
    }

    function currentC3SpecialTargets(cycle, cycleState) {
      if (cycle.id !== "c3") return [];
      const current = cycle.tiles.find((tile) => tile.id === cycleState.currentTile);
      if (!current) return [];
      return [...new Set(Object.entries(current.exits || {})
        .filter(([exit, targetId]) => String(exit).startsWith("SPECIAL_CYCLE_3") && targetId)
        .map(([, targetId]) => String(targetId))
        .filter((targetId) => cycle.tiles.some((tile) => tile.id === targetId)))];
    }

    function mapAdjacentIds(cycle, cycleState, tileId) {
      const tile = cycle.tiles.find((item) => item.id === tileId);
      if (!tile) return [];
      const revealed = (id) => Boolean(cycleState.explored[id] || cycleState.previewRevealed[id] || id === cycleState.tokens.AD);
      return [...new Set([
        ...Object.values(tile.neighbors || {}),
        ...Object.values(tile.exits || {}),
        ...cycle.tiles.filter((candidate) => (
          Object.values(candidate.neighbors || {}).includes(tileId)
          || Object.values(candidate.exits || {}).includes(tileId)
        )).map((candidate) => candidate.id),
      ].filter((id) => id && revealed(id)))];
    }

    function shortestMapPath(cycle, cycleState, startId, targetId) {
      if (startId === targetId) return [startId];
      const previous = new Map([[startId, ""]]);
      const queue = [startId];
      while (queue.length) {
        const current = queue.shift();
        for (const neighborId of mapAdjacentIds(cycle, cycleState, current)) {
          if (previous.has(neighborId)) continue;
          previous.set(neighborId, current);
          if (neighborId === targetId) {
            const path = [targetId];
            while (previous.get(path[0])) path.unshift(previous.get(path[0]));
            return path;
          }
          queue.push(neighborId);
        }
      }
      return [];
    }

    async function runMapCommand(command, value = "") {
      if (mapCommandBusy) return;
      mapCommandBusy = true;
      document.querySelectorAll("[data-map-command], [data-map-direction]").forEach((button) => { button.disabled = true; });
      setMapCommandStatus("正在同步地图…");
      try {
        const commandState = await loadMapCommandState();
        const { cycleId, cycle, cycleState } = currentMapCommandCycle(commandState);
        let message = "地图已更新。";

        if (command === "move-argo") {
          const targetId = mapDirectionalTarget(cycle, cycleState, value);
          const newlyExplored = !cycleState.explored[targetId];
          cycleState.currentTile = targetId;
          cycleState.tokens.AG = targetId;
          cycleState.explored[targetId] = true;
          if (cycleState.previewRevealed) delete cycleState.previewRevealed[targetId];
          if (newlyExplored) cycleState.latestRevealedTile = targetId;
          if (cycleState.tokens.AD === targetId) {
            cycleState.tokens.AD = "";
            message = `阿尔戈号已移动至 ${targetId}，与宿敌相遇：已移除宿敌，请结算宿敌战斗。`;
          } else {
            message = newlyExplored
              ? `目标板块 ${targetId} 已自动标记为已探索，阿尔戈号已移动过去。`
              : `阿尔戈号已移动至 ${targetId}。`;
          }
        } else if (command === "move-special") {
          const targets = currentC3SpecialTargets(cycle, cycleState);
          if (!targets.includes(value)) throw new Error("当前板块没有通向该板块的特殊连接。");
          const newlyExplored = !cycleState.explored[value];
          cycleState.currentTile = value;
          cycleState.tokens.AG = value;
          cycleState.explored[value] = true;
          if (cycleState.previewRevealed) delete cycleState.previewRevealed[value];
          if (newlyExplored) cycleState.latestRevealedTile = value;
          if (cycleState.tokens.AD === value) {
            cycleState.tokens.AD = "";
            message = `阿尔戈号经特殊连接移动至 ${value}，与宿敌相遇：请结算宿敌战斗。`;
          } else {
            message = newlyExplored
              ? `目标板块 ${value} 已自动标记为已探索，阿尔戈号已通过特殊连接移动过去。`
              : `阿尔戈号已通过特殊连接移动至 ${value}。`;
          }
        } else if (command === "flip-c5-tile") {
          if (cycleId !== "c5") throw new Error("只有 Cycle 5 地图支持翻面。");
          const tileId = cycleState.currentTile;
          const tile = cycle.tiles.find((item) => item.id === tileId);
          if (!tileId || !tile?.back) throw new Error("当前板块没有可切换的背面。");
          cycleState.tileVariants ||= {};
          if (cycleState.tileVariants[tileId] === "alternate") {
            delete cycleState.tileVariants[tileId];
            message = `地图板块 ${tileId} 已翻回 A 面。`;
          } else {
            cycleState.tileVariants[tileId] = "alternate";
            message = `地图板块 ${tileId} 已翻至 B 面。`;
          }
        } else if (command === "spawn-nemesis") {
          const targetId = cycleState.currentTile;
          if (!targetId) throw new Error("请先设置阿尔戈号当前位置。");
          const candidates = cycle.tiles.map((tile) => ({
            tile,
            path: shortestMapPath(cycle, cycleState, targetId, tile.id),
          })).filter(({ tile, path }) => tile.id !== targetId && cycleState.explored[tile.id] && path.length === 5);
          if (!candidates.length) throw new Error("没有距离阿尔戈号正好 4 格的已揭示板块。");
          const chosen = candidates[Math.floor(Math.random() * candidates.length)].tile;
          cycleState.tokens.AD = chosen.id;
          message = `宿敌已生成在 ${chosen.label || chosen.id}${candidates.length > 1 ? `（从 ${candidates.length} 个候选板块随机选择）` : ""}。`;
        } else if (command === "chase-nemesis") {
          const startId = cycleState.tokens.AD;
          const targetId = cycleState.currentTile;
          if (!startId) throw new Error("地图上还没有宿敌，请先生成。");
          if (!targetId) throw new Error("请先设置阿尔戈号当前位置。");
          const path = shortestMapPath(cycle, cycleState, startId, targetId);
          if (path.length < 2) throw new Error("宿敌与阿尔戈号之间没有已揭示路线。");
          cycleState.tokens.AD = path[1];
          if (cycleState.tokens.AD === targetId) {
            cycleState.tokens.AD = "";
            message = "宿敌追上阿尔戈号：已移除宿敌，请结算宿敌战斗。";
          } else {
            message = `宿敌已追击 1 格，移动至 ${path[1]}。`;
          }
        }

        await saveMapCommandState(commandState);
        syncDashboardMapSnapshot(cycleId, cycle, cycleState);
        setMapCommandStatus(message);
      } catch (error) {
        setMapCommandStatus(String(error.message || error), true);
      } finally {
        mapCommandBusy = false;
        document.querySelectorAll("[data-map-command], [data-map-direction]").forEach((button) => { button.disabled = false; });
      }
    }

    async function loadCampaignSection(sessionEpoch = campaignSessionEpoch) {
      try {
        const response = await fetch(campaignStorageUrl, { cache: "no-store" });
        if (sessionEpoch !== campaignSessionEpoch) return;
        if (response.status === 401) {
          showAuth("登录已过期，请重新登录。");
          return;
        }
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const payload = await response.json();
        if (sessionEpoch !== campaignSessionEpoch) return;
        if (!payload.ok) throw new Error(payload.error || "读取失败");
        campaignStorageAvailable = true;
        clearCampaignReconnect();
        campaignSectionRevision = Math.max(0, Number(payload.revision || 0));
        campaignSectionExists = Boolean(payload.exists);
        const flushQueuedSave = campaignSaveQueuedBeforeReady;
        const initializeEmptySection = !payload.exists || !payload.state;
        campaignSaveQueuedBeforeReady = false;
        if (payload.exists && payload.state) {
          renderDashboardArchive(payload.state);
          campaignSectionBaseline = cloneJson(archive);
        } else {
          renderDashboardArchive(defaultArchive);
          campaignSectionBaseline = cloneJson(archive);
        }
        if ((flushQueuedSave || initializeEmptySection) && ownsDashboardWriteLease()) queueCampaignSave();
        else setCampaignSaveStatus("已同步", "saved");
        // Load negotiation cards for explore reminders, then re-render flow.
        loadNegotiationCards().then(() => renderFlow());
        refreshCachedArgoRecord();
      } catch (error) {
        if (sessionEpoch !== campaignSessionEpoch) return;
        campaignStorageAvailable = false;
        setCampaignSaveStatus("存档离线，等待重连", "offline");
        console.warn(error);
        scheduleCampaignReconnect(sessionEpoch);
      }
    }

    function campaignArchiveSnapshot() {

    function campaignHasUnsavedChanges(snapshot = campaignArchiveSnapshot()) {
      return !campaignSectionExists || !campaignSectionBaseline || !jsonEqual(snapshot, campaignSectionBaseline);
    }

    function queueCampaignSave() {
      if (!ownsDashboardWriteLease()) {
        setDashboardWriteLeaseState(false);
        setCampaignSaveStatus("本页只读，已停止保存", "readonly");
        return;
      }
      if (!campaignHasUnsavedChanges()) {
        clearTimeout(campaignSaveTimer);
        campaignSaveTimer = null;
        campaignSavePending = false;
        setCampaignSaveStatus("已同步", "saved");
        return;
      }
      if (!campaignStorageAvailable) {
        campaignSaveQueuedBeforeReady = true;
        setCampaignSaveStatus("有修改待同步", "offline");
        scheduleCampaignReconnect();
        return;
      }
      clearTimeout(campaignSaveTimer);
      setCampaignSaveStatus("等待保存", "saving");
      campaignSaveTimer = setTimeout(() => void saveCampaignSection(), 260);
    }

    async function saveCampaignSection() {
      if (!ownsDashboardWriteLease()) {
        campaignSavePending = false;
        setDashboardWriteLeaseState(false);
        setCampaignSaveStatus("本页只读，已停止保存", "readonly");
        return false;
      }
      if (!campaignStorageAvailable) {
        campaignSaveQueuedBeforeReady = true;
        setCampaignSaveStatus("有修改待同步", "offline");
        scheduleCampaignReconnect();
        return;
      }
      if (campaignSaveInFlight) {
        campaignSavePending = true;
        return false;
      }
      const archiveBeingSaved = campaignArchiveSnapshot();
      if (!campaignHasUnsavedChanges(archiveBeingSaved)) {
        campaignSavePending = false;
        setCampaignSaveStatus("已同步", "saved");
        return true;
      }
      const sessionEpoch = campaignSessionEpoch;
      campaignSaveInFlight = true;
      campaignSavePending = false;
      setCampaignSaveStatus("正在保存", "saving");
      try {
        if (!ownsDashboardWriteLease()) {
          setDashboardWriteLeaseState(false);
          return false;
        }
        const response = await fetch(campaignStorageUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            section: campaignStorageSection,
            state: archiveBeingSaved,
            expectedRevision: campaignSectionRevision,
          }),
        });
        if (sessionEpoch !== campaignSessionEpoch) return;
        if (response.status === 401) {
          showAuth("登录已过期，请重新登录。");
          return;
        }
        const payload = await response.json().catch(() => null);
        if (response.status === 409 && payload?.code === "SAVE_CONFLICT") {
          setCampaignSaveStatus("正在合并其他页面的修改", "saving");
          campaignSavePending = false;
          if (!campaignConflictReloading) {
            campaignConflictReloading = true;
            const latest = await readLatestDashboardSection();
            if (!ownsDashboardWriteLease()) {
              campaignSectionRevision = latest.revision;
              campaignSectionExists = latest.exists;
              campaignSectionBaseline = cloneJson(latest.archive);
              renderDashboardArchive(latest.archive);
              campaignConflictReloading = false;
              return false;
            }
            const merged = mergeDashboardChanges(campaignSectionBaseline || defaultArchive, archive, latest.archive);
            campaignSectionRevision = latest.revision;
            campaignSectionExists = latest.exists;
            campaignSectionBaseline = cloneJson(latest.archive);

            if (merged.conflicts.length) {
              const shown = merged.conflicts.slice(0, 8).join("\n");
              const more = merged.conflicts.length > 8 ? `\n另有 ${merged.conflicts.length - 8} 项` : "";
              const keepLocal = window.confirm(
                `另一个页面修改了相同字段：\n${shown}${more}\n\n确定：保留当前页面的值并合并保存\n取消：放弃当前页面修改并加载服务器最新数据`
              );
              if (!keepLocal) {
                renderDashboardArchive(latest.archive);
                campaignConflictReloading = false;
                setCampaignSaveStatus("已加载服务器版本", "saved");
                return;
              }
            }

            renderDashboardArchive(merged.value);
            campaignSavePending = true;
            campaignConflictReloading = false;
          }
          return;
        }
        if (!response.ok || !payload?.ok) throw new Error(payload?.error || `HTTP ${response.status}`);
        campaignSectionRevision = Math.max(0, Number(payload.revision || campaignSectionRevision));
        campaignSectionExists = true;
        campaignSectionBaseline = archiveBeingSaved;
        campaignSaveQueuedBeforeReady = false;
        campaignReconnectDelay = 2000;
        setCampaignSaveStatus("已保存", "saved");
        campaignSyncChannel?.postMessage({ revision: campaignSectionRevision });
      } catch (error) {
        campaignConflictReloading = false;
        if (!ownsDashboardWriteLease()) {
          setDashboardWriteLeaseState(false);
          return false;
        }
        campaignStorageAvailable = false;
        campaignSaveQueuedBeforeReady = true;
        setCampaignSaveStatus("保存失败，等待重试", "offline");
        console.warn(error);
        scheduleCampaignReconnect(sessionEpoch);
      } finally {
        campaignSaveInFlight = false;
        if (campaignSavePending && ownsDashboardWriteLease()) saveCampaignSection();
      }
    }

    function ensureCardTracks() {
      state.cardTracks = normalizeCardTracks(state.cardTracks, state.cardCounters, state.cardTracks && state.cardTracksVersion !== 2, currentCycleConfig().id);
      state.cardTracksVersion = 2;
      const cycleData = activeStoryDoomData();

        if (def.fixed || !state.cardTracks[def.key]) return;
        const deck = Array.isArray(cycleData[def.source]) ? cycleData[def.source] : [];
        if (deck.length && state.cardTracks[def.key].position > deck.length) {
          state.cardTracks[def.key].position = deck.length;
          state.cardTracks[def.key].progress = 0;
        }
      });
      return state.cardTracks;

    function cardTrackCard(def, track, cycleData) {
      if (def.fixed) return cycleData[def.source] || null;
      const deck = Array.isArray(cycleData[def.source]) ? cycleData[def.source] : [];
      return track.position > 0 ? deck[track.position - 1] || null : null;
    }

    function cardTrackPreviewCard(def, track, cycleData) {
      if (def.fixed) return cardTrackCard(def, track, cycleData);
      const deck = Array.isArray(cycleData[def.source]) ? cycleData[def.source] : [];
      return track.position > 0 ? deck[track.position - 1] || null : deck[0] || null;
    }

    function cardTrackStatus(def, track, cycleData) {
      if (def.fixed) return `阿尔戈号知识 ${track.position}`;
      const deck = Array.isArray(cycleData[def.source]) ? cycleData[def.source] : [];
      if (!track.position) return deck[0]?.label ? `未开始，下张 ${deck[0].label} / ${deck.length}` : `未开始 / ${deck.length}`;
      const step = deck[track.position - 1];
      return `${step?.label || `第 ${track.position} 步`} / ${deck.length || "?"}`;
    }

    function cardTrackMeta(def, track, cycleData, card) {
      if (def.fixed) {
        return `当前阿尔戈号知识 ${track.position}；已放进展 ${track.progress}`;
      }
      const deck = Array.isArray(cycleData[def.source]) ? cycleData[def.source] : [];
      if (!track.position) return deck[0]
        ? `未开始；当前预览 ${deck[0].label} ${deck[0].name}。点击推进后正式进入 ${deck[0].label}。`
        : `mod 中找到 ${deck.length} 个 A/B 步骤。点击推进进入 1A。`;
      const counters = `已放进展 ${track.progress}${def.key === "doom" ? `；已放灾祸 ${track.doom}` : ""}`;
      if (!card) return `第 ${track.position} 步无对应卡面；${counters}`;
      return `${card.label} ${card.name}；${counters}`;
    }

    function readLocalHeroState() {
      try {
        const heroState = JSON.parse(localStorage.getItem(HERO_STORAGE_KEY));
        return heroState && Array.isArray(heroState.heroes) ? heroState : null;
      } catch {
        return null;
      }
    }

    async function readLatestHeroState() {
      try {
        const response = await fetch("./api/campaign-state.php?section=heroes", { cache: "no-store" });
        const payload = await response.json().catch(() => null);
        const heroState = payload?.state;
        if (response.ok && payload?.ok && heroState && Array.isArray(heroState.heroes)) {
          heroState._lastSyncRevision = Math.max(0, Number(payload.revision || heroState._lastSyncRevision || 0));
          heroState._userId = payload.user?.id || heroState._userId || "";
          try { localStorage.setItem(HERO_STORAGE_KEY, JSON.stringify(heroState)); } catch {}
          return heroState;
        }
      } catch {}
      return readLocalHeroState();
    }

    function applyHeroProgressChanges(baseState, changes, fallbackState = null) {
      const next = cloneJson(isPlainObject(baseState) ? baseState : { heroes: [], activeHeroId: "", graveyard: [] });
      if (!Array.isArray(next.heroes)) next.heroes = [];
      const fallbackHeroes = new Map(
        (Array.isArray(fallbackState?.heroes) ? fallbackState.heroes : [])
          .filter((hero) => hero?.id)
          .map((hero) => [hero.id, hero])
      );

      changes.forEach((change) => {
        let hero = next.heroes.find((candidate) => candidate?.id === change.heroId);
        if (!hero && fallbackHeroes.has(change.heroId)) {
          hero = cloneJson(fallbackHeroes.get(change.heroId));
          next.heroes.push(hero);
        }
        if (!hero) return;
        const field = change.type === "fated" ? "fatedProgress" : "mnemosProgress";
        if (!isPlainObject(hero[field])) hero[field] = {};
        const current = Math.max(0, Number(hero[field][change.cardId] || 0));
        hero[field][change.cardId] = Math.min(change.max, current + 1);
      });
      return next;
    }

    async function readServerHeroStateForUpdate() {
      const response = await fetch("./api/campaign-state.php?section=heroes", { cache: "no-store" });
      const payload = await response.json().catch(() => null);
      if (!response.ok || !payload?.ok) throw new Error(payload?.error || `HTTP ${response.status}`);
      return {
        state: isPlainObject(payload.state) ? payload.state : null,
        revision: Math.max(0, Number(payload.revision || 0)),
        userId: payload.user?.id || "",
      };
    }

    async function applyMnemosTagToHeroes(tagId, hubTitle, boxLabel) {
      const heroState = await readLatestHeroState();
      if (!heroState || !Array.isArray(heroState.heroes) || !heroState.heroes.length) return;

      const tagZh = MNEMOS_TAG_ZH[tagId] || tagId;
      const proposals = [];

      heroState.heroes.forEach(hero => {
        hero.mnemosProgress = hero.mnemosProgress || {};
        // Find best mnemos card with this tag
        let bestMnemos = null;
        let bestProgress = -1;
        HERO_CYCLES.forEach(cycleId => {
          (hero.mnemos?.[cycleId] || []).forEach(mId => {
            const cardTags = MNEMOS_CARD_TAGS[mId];
            if (cardTags && cardTags.includes(tagId)) {
              const progress = hero.mnemosProgress[mId] || 0;
              if (progress < 10 && progress > bestProgress) {
                bestProgress = progress;
                bestMnemos = mId;
              }
            }
          });
        });
        if (bestMnemos) {
          proposals.push({ hero, type: "mnemos", cardId: bestMnemos, current: hero.mnemosProgress[bestMnemos] || 0 });
        }

        // Find best fated card with this tag
        hero.fatedMnemos = hero.fatedMnemos || {};
        hero.fatedProgress = hero.fatedProgress || {};
        let bestFated = null;
        let bestFatedProg = -1;
        HERO_CYCLES.forEach(cycleId => {
          (hero.fatedMnemos[cycleId] || []).forEach(fId => {
            const cardTags = FATED_CARD_TAGS[fId];
            if (cardTags && cardTags.includes(tagId)) {
              const progress = hero.fatedProgress[fId] || 0;
              if (progress < 3 && progress > bestFatedProg) {
                bestFatedProg = progress;
                bestFated = fId;
              }
            }
          });
        });
        if (bestFated) {
          proposals.push({ hero, type: "fated", cardId: bestFated, current: hero.fatedProgress[bestFated] || 0 });
        }
      });

      if (!proposals.length) return;

      const heroDisplayName = (hero) => {
        const argonauts = [["odys","奥德修斯·零"],["circe","喀耳刻卫"],["phenelope","珀涅罗珀"],["telebac","忒勒巴科斯"],["herakleides","赫拉克莱德斯"],["olympia","奥林匹亚"],["leocules","莱奥库勒斯"],["raz","拉兹"],["fisher","费舍尔"],["hypatia","希帕提亚"],["anakreon","阿纳克里翁"],["anathea","安纳忒亚"],["orphan","DMT的孤儿"],["aster","阿斯特"],["dastan","达斯坦"],["aktisaeos","阿克提赛俄斯"],["oleander","欧利安德"],["omorfos","欧莫弗斯"]];
        if (hero.customName) return hero.customName;
        const found = argonauts.find(a => a[0] === hero.argonaut);
        return found ? found[1] : (hero.playerName || "英雄");
      };

      const lines = proposals.map(p => {
        const name = heroDisplayName(p.hero);
        const cardName = p.type === "mnemos" ? (MNEMOS_CARD_NAMES[p.cardId] || p.cardId) : (FATED_CARD_NAMES[p.cardId] || p.cardId);
        const label = p.type === "mnemos" ? "回忆" : "宿命";
        const max = p.type === "mnemos" ? 10 : 3;
        return `${name}「${cardName}」(${label}) ${p.current} → ${p.current + 1}/${max}`;
      });
      const confirmMsg = `定数框标签【${tagZh}】\n来源：${hubTitle} · ${boxLabel}\n\n以下英雄将获得回忆节点：\n${lines.join("\n")}\n\n确认增加？`;
      if (!confirm(confirmMsg)) return;

      const progressChanges = proposals.map((proposal) => ({
        heroId: proposal.hero.id,
        type: proposal.type,
        cardId: proposal.cardId,
        max: proposal.type === "mnemos" ? 10 : 3,
      }));
      const localHeroState = applyHeroProgressChanges(readLocalHeroState() || heroState, progressChanges, heroState);

      // Save back to localStorage
      try { localStorage.setItem(HERO_STORAGE_KEY, JSON.stringify(localHeroState)); } catch {}
      // Also save to NAS
      void saveHeroMnemosToServer(heroState, progressChanges);
      // Notify hero page if open
      heroMnemosSyncChannel?.postMessage({ type: "hero-state-updated" });
    }

    async function saveHeroMnemosToServer(baseHeroState, progressChanges) {
      try {
        for (let attempt = 0; attempt < 5; attempt += 1) {
          const latest = await readServerHeroStateForUpdate();
          const next = applyHeroProgressChanges(latest.state || baseHeroState, progressChanges, baseHeroState);
          const response = await fetch("./api/campaign-state.php?section=heroes", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              section: "heroes",
              state: next,
              expectedRevision: latest.revision,
            }),
          });
          const payload = await response.json().catch(() => null);
          if (response.status === 409 && payload?.code === "SAVE_CONFLICT") continue;
          if (!response.ok || !payload?.ok) throw new Error(payload?.error || `HTTP ${response.status}`);

          const currentLocal = readLocalHeroState() || next;
          currentLocal._lastSyncRevision = Math.max(0, Number(payload.revision || latest.revision + 1));
          currentLocal._userId = payload.user?.id || latest.userId || currentLocal._userId || "";
          try { localStorage.setItem(HERO_STORAGE_KEY, JSON.stringify(currentLocal)); } catch {}
          heroMnemosSyncChannel?.postMessage({ type: "hero-state-updated" });
          return true;
        }
        throw new Error("英雄记录持续冲突，请稍后重试。");
      } catch (error) {
        console.warn(error);
        return false;
      }
    }

    function surveyStoryEntryId(boxId) {
      if (boxId === "alpha") return "\u03b1";
      if (boxId === "omega") return "\u03a9";
      return boxId;
    }

    function surveyHubChapterKey(data, hubId) {
      const index = data?.hubs?.findIndex((hub) => hub.id === hubId) ?? -1;
      if (index < 0) return "";
      const hub = data.hubs[index];
      return `hub-${String(index + 1).padStart(2, "0")}-${hub.chapterId || hubId}`;
    }

    function firstCheckedSurveyHubTarget(data) {
      for (const hub of data?.hubs || []) {
        const checkedBoxes = state.surveyConstants.hubs?.[hub.id] || {};
        for (const [boxId] of hub.boxes) {
          if (checkedBoxes[boxId]) return { itemId: hub.id, boxId };
        }
      }
      return null;
    }

    function firstCheckedSurveyRrTarget(data) {
      for (const [id] of data?.rr || []) {
        if (state.surveyConstants.rr?.[id]) return { itemId: id };
      }
      return null;
    }

    function validSurveyHubTarget(data, target) {
      if (!target?.itemId || !target?.boxId) return null;
      if (!state.surveyConstants.hubs?.[target.itemId]?.[target.boxId]) return null;
      const hub = findSurveyHub(data, target.itemId);
      if (!findSurveyHubBox(hub, target.boxId)) return null;
      return target;
    }

    function validSurveyRrTarget(data, target) {
      if (!target?.itemId) return null;
      if (!state.surveyConstants.rr?.[target.itemId]) return null;
      return data?.rr?.some(([id]) => id === target.itemId) ? target : null;
    }

    function getActiveSurveyHubTarget() {
      const data = getCurrentSurveyConstantData();
      ensureTodaySurveyConstants();
      return validSurveyHubTarget(data, state.surveyConstants.activeHub) || firstCheckedSurveyHubTarget(data);
    }

    function getActiveSurveyRrTarget() {
      const data = getCurrentSurveyConstantData();
      ensureTodaySurveyConstants();
      return validSurveyRrTarget(data, state.surveyConstants.activeRr) || firstCheckedSurveyRrTarget(data);
    }

    async function readServerArgoRecord() {
      const response = await fetch(`${authUrl}?section=record`, { cache: "no-store" });
      if (response.status === 401) return { available: false, record: null, error: "auth required" };
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const payload = await response.json();
      if (!payload.ok) throw new Error(payload.error || "read failed");
      const savedRecord = payload.exists && isPlainObject(payload.state) ? payload.state : null;
      const profileRecord = isPlainObject(savedRecord?.users)
        ? savedRecord.users[archive.activeProfileId] || null
        : savedRecord;
      return {
        available: true,
        record: isPlainObject(profileRecord) ? profileRecord : null,
        revision: Math.max(0, Number(payload.revision || 0)),
      };
    }

    async function writeServerArgoRecord(record, expectedRevision) {
      const response = await fetch(`${authUrl}?section=record`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          section: "record",
          userId: archive.activeProfileId,
          state: record,
          expectedRevision,
        }),
      });
      const payload = await response.json().catch(() => null);
      if (response.status === 409 && payload?.code === "SAVE_CONFLICT") return { conflict: true };
      if (!response.ok || !payload?.ok) throw new Error(payload?.error || `HTTP ${response.status}`);
      return { conflict: false, revision: Math.max(0, Number(payload.revision || 0)) };
    }

    function normalizeRecordCrewCounters(record) {
      if (!isPlainObject(record)) return record;
      record.cycleStats = isPlainObject(record.cycleStats) ? record.cycleStats : {};
      const c2 = record.cycleStats.c2 = isPlainObject(record.cycleStats.c2) ? record.cycleStats.c2 : {};
      if (isPlainObject(c2.crewCounters)) return record;
      const legacyBoxes = isPlainObject(record.crewBoxes) ? record.crewBoxes : {};
      let refugees = 0;
      let captives = 0;
      Object.entries(legacyBoxes).forEach(([key, value]) => {
        if (!key.startsWith("c2-crew-")) return;
        const normalized = value === true ? "refugee" : value;
        if (normalized === "refugee") refugees += 1;
        if (normalized === "captive") captives += 1;
      });
      const legacyTotal = Math.max(0, Math.floor(Number(c2.crew ?? record.crew ?? 5) || 0));
      c2.crewCounters = {
        crew: Math.max(0, legacyTotal - refugees - captives),
        refugees,
        captives,
      };
      c2.crew = String(c2.crewCounters.crew);
      return record;
    }

    function mergeArgoRecords(serverRecord, localRecord) {
      if (!isPlainObject(serverRecord)) return normalizeRecordCrewCounters(isPlainObject(localRecord) ? { ...localRecord } : {});
      if (!isPlainObject(localRecord)) return normalizeRecordCrewCounters({ ...serverRecord });

      const merged = { ...localRecord, ...serverRecord };
      [
        "enemies",
        "adventures",
        "diplomacy",
        "resources",
        "map",
        "matrix",
        "maxUnlocked",
        "pygmalion",
        "rooting",
      ].forEach((key) => {
        merged[key] = {
          ...(isPlainObject(localRecord[key]) ? localRecord[key] : {}),
          ...(isPlainObject(serverRecord[key]) ? serverRecord[key] : {}),
        };
      });
      merged.crewBoxes = isPlainObject(serverRecord.crewBoxes)
        ? { ...serverRecord.crewBoxes }
        : (isPlainObject(localRecord.crewBoxes) ? { ...localRecord.crewBoxes } : {});

      ["godforms", "nymphCards", "godformUsedCards", "nymphUsedCards", "titans"].forEach((key) => {
        const serverList = Array.isArray(serverRecord[key]) ? serverRecord[key] : [];
        const localList = Array.isArray(localRecord[key]) ? localRecord[key] : [];
        merged[key] = serverList.length ? serverList : localList;
      });

      return normalizeRecordCrewCounters(merged);
    }

    async function syncAdventureActionToArgoRecord(action) {
      if (!action) return;

      const localRecord = readLocalArgoRecord();
      let serverAvailable = false;
      let serverRecord = null;
      let serverRevision = 0;
      try {
        const server = await readServerArgoRecord();
        serverAvailable = server.available;
        serverRecord = server.record;
        serverRevision = server.revision || serverRevision;
      } catch (error) {
        console.warn(error);
      }

      const applyAction = (baseRecord) => {
        const record = mergeArgoRecords(baseRecord, localRecord);
        record.profileName ||= "阿尔戈号记录";
        record.cycle = action.cycle;
        record.day = action.day;
        const slot = markRecordAdventure(record, action);
        if (slot) appendRecordSyncLog(record, `Day ${action.day} 定数写入：${action.adventure} -> ${adventureSlotLabel(slot)}`);
        return record;
      };
      let record = applyAction(serverRecord);
      updateRecordLinks();

      if (serverAvailable) {
        try {
          for (let attempt = 0; attempt < 3; attempt += 1) {
            const writeResult = await writeServerArgoRecord(record, serverRevision);
            if (!writeResult.conflict) {
              recordSyncChannel?.postMessage({ revision: writeResult.revision });
              break;
            }
            const latest = await readServerArgoRecord();
            serverRevision = latest.revision || serverRevision;
            record = applyAction(latest.record);
          }
        } catch (error) {
          console.warn(error);
        }
      }
    }

    function adventureSlotLabel(slot) {
      const namedSlots = {
        alpha: "α", beta: "β", gamma: "γ", delta: "δ", epsilon: "ε",
        lambda: "λ", omicron: "ο", sigma: "σ", psi: "ψ", omega: "Ω",
      };
      if (namedSlots[slot]) return namedSlots[slot];
      if (slot === "mid1") return "左侧空白格";
      if (slot === "mid2") return "右侧空白格";
      return slot || "";

    function appendRecordSyncLog(record, message) {
      const stamp = new Date().toLocaleString("zh-CN", {
        month: "2-digit",

      });
      const line = `${stamp} ${message}`;

    function recordAdventureIndex(cycleId, adventure) {
      const adventures = surveyConstantData[cycleId]?.hubs || [];
      const normalizedAdventure = normalizeAdventureTitle(adventure);
      const hubIndex = adventures.findIndex((hub) => normalizeAdventureTitle(hub.title) === normalizedAdventure);
      if (hubIndex >= 0) return hubIndex;
      const simple = pharosDreamConstants[cycleId];
      if (simple?.adventure && normalizeAdventureTitle(simple.adventure) === normalizedAdventure) {
        return Math.max(0, Number(simple.recordAdventureIndex ?? adventures.length));
      }
      return -1;
    }

    function markRecordAdventure(record, action) {
      const index = recordAdventureIndex(action.cycle, action.adventure);
      if (index < 0) return "";
      record.adventures ||= {};
      const prefix = `${action.cycle}-${index}`;
      let slot = "";
      const explicitSlots = new Set(["alpha", "beta", "gamma", "delta", "epsilon", "lambda", "omicron", "sigma", "psi", "omega"]);
      if (action.recordSlot && explicitSlots.has(action.recordSlot)) {
        slot = action.recordSlot;
      } else if (action.box === "alpha" || action.box === "omega") {
        slot = action.box;
      } else {
        const middleSlots = recordAdventureMiddleSlots(action.cycle, index);
        slot = middleSlots.find((candidate) => !record.adventures[`${prefix}-${candidate}`]) || "";
      }
      if (!slot) return "";
      delete record.adventures[prefix];
      record.adventures[`${prefix}-${slot}`] = true;
      return slot;
    }

    function recordAdventureMiddleSlots(cycleId, adventureIndex) {
      const usesFiveSlots = (cycleId === "c4" && adventureIndex < 6)
        || (cycleId === "c5" && adventureIndex >= 1 && adventureIndex <= 3);
      return usesFiveSlots ? ["mid1", "mid2", "mid3"] : ["mid1", "mid2"];
    }
