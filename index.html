    function rememberConstantDetailsOpen(details, key) {
      details.open = Boolean(constantToolsOpen[key]);
      details.addEventListener("toggle", () => {
        if (details.open) {
          constantToolsOpen[key] = true;
        } else {
          delete constantToolsOpen[key];
        }
      });
      return details;
    }

    function createSimpleConstantTools(data, options) {
      if (!data) return null;

      const values = options.ensure();
      const wrapper = document.createElement("details");
      wrapper.className = "survey-constants";
      rememberConstantDetailsOpen(wrapper, options.openKey);
      const summary = document.createElement("summary");
      summary.textContent = options.summary;
      const body = document.createElement("div");
      body.className = "survey-constants-body";

      const group = document.createElement("section");
      group.className = "survey-constant-group";
      group.innerHTML = `<div class="survey-constant-heading">${escapeHtml(data.title)}</div>`;
      const grid = document.createElement("div");
      grid.className = "survey-constant-grid";
      const card = document.createElement("article");
      card.className = "survey-constant-card";

      const title = document.createElement("div");
      title.className = "survey-constant-title";
      title.innerHTML = `${escapeHtml(data.title)}${options.subtitle ? ` <span>${escapeHtml(options.subtitle)}</span>` : ""}`;
      const boxes = document.createElement("div");
      boxes.className = "survey-constant-boxes";
      data.boxes.forEach((item) => {
        const [boxId, roll, label] = item;
        const slotIds = simpleConstantSlotIds(item);
        const row = document.createElement(slotIds.length === 1 ? "label" : "div");
        row.className = slotIds.length === 1 ? "" : "survey-constant-row-item multi-slot";
        const slotWrap = document.createElement("span");
        slotWrap.className = "simple-constant-slots";
        slotIds.forEach((slotId, index) => {
          const input = document.createElement("input");
          input.type = "checkbox";
          input.checked = Boolean(values[slotId] || (index === 0 && values[boxId]));
          input.setAttribute("aria-label", `${roll} ${label} ${index + 1}`);
          input.addEventListener("change", () => {
            if (values[boxId]) delete values[boxId];
            options.set(slotId, input.checked);
          });
          slotWrap.appendChild(input);
        });
        if (slotIds.length === 1) {
          const rollText = document.createElement("span");
          rollText.className = "survey-constant-roll";
          rollText.textContent = roll;
          const labelText = document.createElement("span");
          labelText.textContent = label;
          row.append(slotWrap.firstChild, rollText, labelText);
        } else {
          const text = document.createElement("span");
          text.innerHTML = `<span class="survey-constant-roll">${escapeHtml(roll)}</span> ${escapeHtml(label)}`;
          row.append(slotWrap, text);
        }
        boxes.appendChild(row);
      });

      card.append(title, boxes);
      grid.appendChild(card);
      group.appendChild(grid);
      body.appendChild(group);
      wrapper.append(summary, body);
      return wrapper;
    }

    function createMapStepTools(stepId) {
      if (!secondScreenEnabled || !currentCycleConfig().map || (stepId !== "move" && stepId !== "explore")) return null;
      const wrapper = document.createElement("div");
      wrapper.className = "map-step-tools";

      if (stepId === "move") {
        const group = document.createElement("div");
        group.className = "map-step-group";
        group.innerHTML = `
          <span class="map-step-label">移动阿尔戈号</span>
          <div class="argo-direction-pad" aria-label="阿尔戈号方向移动">
            <button type="button" class="secondary" data-map-direction="up" aria-label="向上移动">↑</button>
            <button type="button" class="secondary" data-map-direction="down" aria-label="向下移动">↓</button>
            <button type="button" class="secondary" data-map-direction="left" aria-label="向左移动">←</button>
            <button type="button" class="secondary" data-map-direction="right" aria-label="向右移动">→</button>
          </div>
        `;
        wrapper.appendChild(group);

        if (currentCycleConfig().id === "c5") {
          const flipGroup = document.createElement("div");
          flipGroup.className = "map-step-group";
          flipGroup.innerHTML = `
            <span class="map-step-label">C5 地图</span>
            <div class="map-step-buttons">
              <button type="button" class="secondary" data-map-command="flip-c5-tile">当前板块翻面</button>
            </div>
          `;
          wrapper.appendChild(flipGroup);
        }

        if (currentCycleConfig().id === "c3") {
          const specialGroup = document.createElement("div");
          specialGroup.className = "map-step-group c3-special-group";
          specialGroup.innerHTML = `
            <span class="map-step-label">C3 特殊连接</span>
            <div class="map-step-buttons" data-c3-special-buttons>
              <span class="map-command-status">正在读取连接…</span>
            </div>
          `;
          wrapper.appendChild(specialGroup);
          window.setTimeout(() => renderC3SpecialButtons(specialGroup.querySelector("[data-c3-special-buttons]")), 0);
        }
      } else {
        const group = document.createElement("div");
        group.className = "map-step-group";
        group.innerHTML = `
          <span class="map-step-label">宿敌</span>
          <div class="map-step-buttons">
            <button type="button" data-map-command="spawn-nemesis">生成宿敌</button>
            <button type="button" class="secondary" data-map-command="chase-nemesis">追击 1 格</button>
          </div>
        `;
        wrapper.appendChild(group);
      }

      const status = document.createElement("div");
      status.className = "map-command-status";
      status.textContent = stepId === "move"
        ? "移动到未揭示目标时，会自动标记为已探索。"
        : "生成在距离阿尔戈号 4 格处；追击沿已揭示路线前进 1 格。";
      wrapper.appendChild(status);
      return wrapper;
    }

    async function renderC3SpecialButtons(container) {
      if (!container || mapCommandBusy) return;
      try {
        const commandState = await loadMapCommandState();
        const { cycle, cycleState } = currentMapCommandCycle(commandState);
        const targets = currentC3SpecialTargets(cycle, cycleState);
        container.innerHTML = "";
        if (!targets.length) {
          const note = document.createElement("span");
          note.className = "map-command-status";
          note.textContent = "当前位置没有特殊连接";
          container.appendChild(note);
          return;
        }
        targets.forEach((targetId) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "secondary";
          button.dataset.mapCommand = "move-special";
          button.dataset.mapTarget = targetId;
          button.textContent = `特殊 → ${targetId}`;
          container.appendChild(button);
        });
      } catch (error) {
        setMapCommandStatus(String(error.message || error), true);
      }
    }

    function renderFlow() {
      elements.flowList.innerHTML = "";
      const fragment = document.createDocumentFragment();

      flowSteps.forEach((step, index) => {
        const item = document.createElement("article");
        const checked = Boolean(state.completed[step.id]);
        item.className = `flow-step${checked ? " done" : ""}`;

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.className = "flow-check";
        checkbox.checked = checked;
        checkbox.setAttribute("aria-label", `完成${step.title}`);
        checkbox.addEventListener("change", () => {
          state.completed[step.id] = checkbox.checked;
          if (step.id === "encounter" && checkbox.checked) {
            state.nextBattleTerrain = null;
          }
          saveState();
          renderFlow();
        });

        const text = document.createElement("div");
        const trackReminders = getStepTrackReminders(step.id);
        const titleText = step.id === "story" || step.id === "doom"
          ? `<button type="button" class="flow-title-button" data-card-track-open="${step.id}">${escapeHtml(step.title)}</button>`
          : `<span>${escapeHtml(step.title)}</span>`;
        text.innerHTML = `
          <div class="step-title">
            <span class="step-index">${String(index + 1).padStart(2, "0")}</span>
            ${titleText}
            <span class="step-kind">${escapeHtml(step.kind)}</span>
          </div>
          <p class="step-desc">${renderStepDesc(step.desc)}</p>
          ${renderStepTrackReminders(trackReminders)}
        `;
        const actions = document.createElement("div");
        actions.className = "step-actions";
        getStepLinks(step).forEach((link) => {
          const anchor = document.createElement("a");
          anchor.href = link.href;
          anchor.textContent = link.label;
          if (link.title) anchor.title = link.title;
          actions.appendChild(anchor);
        });
        if (actions.children.length) text.querySelector(".step-title")?.appendChild(actions);
        const mapTools = createMapStepTools(step.id);
        if (mapTools) text.appendChild(mapTools);
        if (step.id === "explore") {
          text.appendChild(createExplorationTools());
        }
        if (step.id === "survey") {
          const surveyTools = createSurveyConstantTools();
          if (surveyTools) text.appendChild(surveyTools);
        }
        if (step.id === "story") {
          const constantRow = document.createElement("div");
          constantRow.className = "simple-constant-row";
          const constantTools = [
            createPharosDreamConstantTools(),
            createMainStoryConstantTools(),
            createSpecialEventConstantTools(),
          ].filter(Boolean);
          if (constantTools.length === 2) {
            constantTools.find((tools) => tools.classList.contains("special-event-constants"))?.classList.add("span-two");
          }
          constantTools.forEach((tools) => constantRow.appendChild(tools));
          if (constantRow.children.length) text.appendChild(constantRow);
        }
        item.append(checkbox, text);
        fragment.appendChild(item);
      });

      elements.flowList.appendChild(fragment);
      renderProgress();
      updateRecordLinks();
    }

    function createExplorationTools() {
      const library = getExplorationLibrary();
      const selectedIds = getSelectedExplorationIds();
      const drawState = ensureExplorationDrawState();
      const specialRule = getExplorationSpecialRule();
      const destructionPileIds = specialRule ? getDestructionPileIds() : [];
      const wrapper = document.createElement("div");
      wrapper.className = "exploration-tools";

      if (!library.length) {
        wrapper.innerHTML = '<div class="exploration-summary">当前 Cycle 暂无探索卡组数据。</div>';
        return wrapper;
      }

      const toolbar = document.createElement("div");
      toolbar.className = "exploration-toolbar";

      const status = document.createElement("div");
      status.className = "exploration-status";
      status.innerHTML = `
        <div class="exploration-count">已选 ${selectedIds.length} / ${library.length} 张</div>
      `;
      status.appendChild(createExplorationFactionStatus());

      const buttons = document.createElement("div");
      buttons.className = "exploration-buttons";
      const hasActiveExplorationDraw = drawState.activePiles.flat().length > 0;
      const drawButton = document.createElement("button");
      drawButton.type = "button";
      drawButton.textContent = hasActiveExplorationDraw ? "结算完毕" : "抽探索卡";
      drawButton.disabled = selectedIds.length === 0 && !hasActiveExplorationDraw;
      drawButton.addEventListener("click", () => {
        if (hasActiveExplorationDraw) endExplorationDraw();
        else drawExplorationCard();
      });

      const returnButton = document.createElement("button");
      returnButton.type = "button";
      returnButton.className = "secondary";
      returnButton.textContent = `放回暂时移出（${drawState.temporaryRemoved.length}）`;
      returnButton.disabled = drawState.temporaryRemoved.length === 0;
      returnButton.addEventListener("click", returnTemporaryExplorationCards);

      buttons.append(drawButton, returnButton);
      toolbar.append(status, buttons);

      const summary = document.createElement("div");
      summary.className = "exploration-summary";
      summary.innerHTML = `
        <div>牌堆 ${drawState.drawPile.length} / 当前牌组 ${selectedIds.length}，待结算 ${drawState.activePiles.flat().length}，暂时移出 ${drawState.temporaryRemoved.length}${specialRule ? `，破坏卡组 ${destructionPileIds.length}` : ""}</div>
      `;

      const createDrawnCard = (entry) => {
        const drawnCard = document.createElement("article");
        drawnCard.className = "exploration-drawn-card";
        const drawnFace = document.createElement("div");
        drawnFace.className = "exploration-drawn-face";
        drawnFace.setAttribute("aria-label", entry.name);
        drawnFace.setAttribute("role", "img");
        drawnFace.style.cssText = getExplorationCardImageStyle(entry.id);
        const meta = document.createElement("div");
        meta.className = "exploration-drawn-meta";
        const cornerNumber = getExplorationCornerNumber(entry.id);
        const removalLabel = entry.removal === "permanent" ? "永久移出" : (entry.removal === "remove" ? "暂时移出" : "洗回牌堆");
        const drawLabel = entry.draw === "chain" ? "连抽" : "不连抽";
        meta.innerHTML = `
          <div>D${entry.day} · ${escapeHtml(entry.name)} #${entry.id}${cornerNumber ? ` · 黑底${cornerNumber}` : ""}</div>
          <span class="exploration-card-tag">${removalLabel} · ${drawLabel}</span>
        `;
        drawnCard.append(drawnFace, meta);
        return drawnCard;
      };

      if (drawState.temporaryRemoved.length) {
        const preview = document.createElement("div");
        preview.className = "exploration-return-preview";
        preview.hidden = true;
        preview.setAttribute("role", "region");
        preview.setAttribute("aria-label", "暂时移出牌堆预览");
        const title = document.createElement("div");
        title.className = "exploration-return-preview-title";
        title.textContent = `暂时移出牌堆（${drawState.temporaryRemoved.length} 张）`;
        const grid = document.createElement("div");
        grid.className = "exploration-drawn-grid";
        drawState.temporaryRemoved.forEach((entry) => grid.appendChild(createDrawnCard(entry)));
        preview.append(title, grid);

        const showPreview = () => {
          const rect = returnButton.getBoundingClientRect();
          preview.style.left = `${Math.max(12, Math.min(rect.left, window.innerWidth - Math.min(520, window.innerWidth - 36) - 12))}px`;
          preview.style.top = `${Math.min(window.innerHeight - 80, rect.bottom + 8)}px`;
          preview.hidden = false;
          returnButton.setAttribute("aria-expanded", "true");
        };
        const hidePreview = () => {
          preview.hidden = true;
          returnButton.setAttribute("aria-expanded", "false");
        };
        returnButton.setAttribute("aria-haspopup", "true");
        returnButton.setAttribute("aria-expanded", "false");
        returnButton.addEventListener("pointerenter", (event) => {
          if (event.pointerType === "mouse") showPreview();
        });
        returnButton.addEventListener("pointerleave", (event) => {
          if (event.pointerType === "mouse") window.setTimeout(() => {
            if (!preview.matches(":hover")) hidePreview();
          }, 80);
        });
        preview.addEventListener("pointerleave", hidePreview);
        returnButton.addEventListener("focus", showPreview);
        returnButton.addEventListener("blur", () => window.setTimeout(() => {
          if (!preview.contains(document.activeElement)) hidePreview();
        }, 0));
        returnButton.addEventListener("pointerdown", (event) => {
          if (event.pointerType !== "touch") return;
          if (preview.hidden) {
            event.preventDefault();
            showPreview();
          }
        });
        wrapper.appendChild(preview);
      }

      const drawnCards = document.createElement("section");
      drawnCards.className = "exploration-drawn";
      const activeCards = drawState.activePiles.flat();
      if (activeCards.length) {
        const drawnTitle = document.createElement("div");
        drawnTitle.className = "exploration-drawn-title";
        drawnTitle.textContent = `本次探索结果（${activeCards.length} 张）`;
        const drawnGrid = document.createElement("div");
        drawnGrid.className = "exploration-drawn-grid exploration-active-grid";
        activeCards.forEach((entry) => drawnGrid.appendChild(createDrawnCard(entry)));
        drawnCards.append(drawnTitle, drawnGrid);
      }

      const removedPiles = document.createElement("section");
      removedPiles.className = "exploration-removed-piles";
      if (drawState.temporaryRemoved.length) {
        const temporarySection = document.createElement("details");
        temporarySection.className = "exploration-removed-pile";
        const temporaryHead = document.createElement("summary");
        temporaryHead.className = "exploration-pile-head";
        temporaryHead.textContent = `暂时移出牌堆（${drawState.temporaryRemoved.length} 张）`;
        const temporaryGrid = document.createElement("div");
        temporaryGrid.className = "exploration-drawn-grid";
        drawState.temporaryRemoved.forEach((entry) => temporaryGrid.appendChild(createDrawnCard(entry)));
        temporarySection.append(temporaryHead, temporaryGrid);
        removedPiles.appendChild(temporarySection);
      }

      const builder = document.createElement("details");
      builder.className = "exploration-builder";
      const builderSummary = document.createElement("summary");
      builderSummary.textContent = "选择探索卡库";
      builder.appendChild(builderSummary);

      const builderBody = document.createElement("div");
      builderBody.className = "exploration-builder-body";
      const builderActions = document.createElement("div");
      builderActions.className = "exploration-builder-actions";

      const applyButton = document.createElement("button");
      applyButton.type = "button";
      applyButton.textContent = "应用选择";

      const selectAllButton = document.createElement("button");
      selectAllButton.type = "button";
      selectAllButton.className = "secondary";
      selectAllButton.textContent = "全选";

      const clearButton = document.createElement("button");
      clearButton.type = "button";
      clearButton.className = "secondary";
      clearButton.textContent = "清空";

      const restoreDefaultButton = document.createElement("button");
      restoreDefaultButton.type = "button";
      restoreDefaultButton.className = "secondary";
      restoreDefaultButton.textContent = "恢复初始";
      restoreDefaultButton.hidden = !defaultExplorationSelections[currentCycleConfig().id]?.length;
      restoreDefaultButton.addEventListener("click", restoreDefaultExplorationSelection);

      const libraryList = document.createElement("div");
      libraryList.className = "exploration-library";
      const selectedSet = new Set(selectedIds);
      const destructionSet = new Set(specialRule ? getDestructionCardIds() : []);
      library.forEach((card) => {
        const item = document.createElement("label");
        const preview = document.createElement("div");
        preview.className = "exploration-library-preview";
        preview.setAttribute("role", "img");
        preview.setAttribute("aria-label", card.name);
        preview.style.cssText = getExplorationCardImageStyle(card.id);
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.value = card.id;
        checkbox.checked = selectedSet.has(card.id);
        checkbox.disabled = destructionSet.has(card.id);
        const text = document.createElement("span");
        const cornerNumber = getExplorationCornerNumber(card.id);
        const tag = getExplorationCardTag(card.id);
        const removalLabel = tag.removal === "permanent" ? "永久移出" : (tag.removal === "remove" ? "暂时移出" : "非移出");
        const drawLabel = tag.draw === "chain" ? "连抽" : "不连抽";
        text.textContent = `${card.name} #${card.id}${cornerNumber ? ` · 黑底${cornerNumber}` : ""} · ${removalLabel} · ${drawLabel}${destructionSet.has(card.id) ? " · 破坏卡" : ""}`;
        item.append(preview, checkbox, text);
        if (specialRule && !destructionSet.has(card.id)) {
          const destructionButton = document.createElement("button");
          destructionButton.type = "button";
          destructionButton.className = "secondary";
          destructionButton.textContent = "加入破坏";
          destructionButton.addEventListener("click", (event) => {
            event.preventDefault();
            event.stopPropagation();
            addCardToDestructionPile(card.id);
          });
          item.appendChild(destructionButton);
        }
        libraryList.appendChild(item);
      });

      const getCheckedIds = () => [...libraryList.querySelectorAll('input[type="checkbox"]:checked')].map((input) => input.value);
      applyButton.addEventListener("click", () => applyExplorationSelection(getCheckedIds()));
      selectAllButton.addEventListener("click", () => {
        libraryList.querySelectorAll('input[type="checkbox"]:not(:disabled)').forEach((input) => {
          input.checked = true;
        });
      });
      clearButton.addEventListener("click", () => {
        libraryList.querySelectorAll('input[type="checkbox"]:not(:disabled)').forEach((input) => {
          input.checked = false;
        });
      });

      builderActions.append(applyButton, selectAllButton, clearButton, restoreDefaultButton);
      builderBody.append(builderActions, libraryList);
      builder.appendChild(builderBody);

      wrapper.append(toolbar, summary);
      if (drawState.activePiles.flat().length) wrapper.appendChild(drawnCards);
      if (drawState.temporaryRemoved.length) wrapper.appendChild(removedPiles);
      const destructionTools = createExplorationDestructionTools(selectedIds, destructionPileIds);
      if (destructionTools) wrapper.appendChild(destructionTools);
      wrapper.appendChild(builder);
      return wrapper;
    }

    function getStoryHref(options = {}) {
      const config = currentCycleConfig();
      if (!config.storyBook) return "./story/index.html";

      const params = new URLSearchParams();
      params.set("book", config.storyBook);
      if (options.chapter) params.set("chapter", options.chapter);
      if (options.module) params.set("module", options.module);
      if (options.battle) params.set("battle", options.battle);
      if (options.encounter) params.set("encounter", options.encounter);
      if (options.entry) params.set("entry", options.entry);
      return `./story/index.html?${params.toString()}`;
    }

    function keepCurrentDateVisible() {
      const list = elements.dateTrackList;
      if (currentCycleConfig().id === "c1" && state.day === "T0") {
        list.scrollTop = 0;
        return;
      }
      const current = elements.dateTrackList.querySelector(".date-track-item.current");
      if (!current) return;

      const alignCurrent = () => {
        const listRect = list.getBoundingClientRect();
        const currentRect = current.getBoundingClientRect();
        const centeredOffset = currentRect.top - listRect.top - (list.clientHeight - currentRect.height) / 2;
        const maxScrollTop = Math.max(0, list.scrollHeight - list.clientHeight);
        list.scrollTop = Math.min(maxScrollTop, Math.max(0, list.scrollTop + centeredOffset));

        const updatedRect = current.getBoundingClientRect();
        const viewportTop = 12;
        const viewportBottom = window.innerHeight - 12;
        if (updatedRect.top < viewportTop || updatedRect.bottom > viewportBottom) {
          current.scrollIntoView({ block: "nearest", inline: "nearest" });
        }
      };

      window.requestAnimationFrame(() => {
        alignCurrent();
        window.requestAnimationFrame(alignCurrent);
      });
    }

    let _negotiationCardsCache = null;
    async function loadNegotiationCards() {
      if (_negotiationCardsCache) return _negotiationCardsCache;
      try {
        const resp = await fetch("./technology/tech_card_dictionary.min.json", { cache: "no-cache" });
        if (!resp.ok) return [];
        const dict = await resp.json();
        const cards = Array.isArray(dict.cards) ? dict.cards : Object.values(dict.cards || {});
        const result = [];
        cards.forEach((card) => {
          if (card?.type?.negotiation !== true) return;
          const key = String(card.key || "").toLowerCase().trim();
          if (!key) return;
          const pages = (card.nodes || []).map((n) => n?.page || "").filter(Boolean);
          if (!pages.length) return; // Skip cards not attached to any tree node.
          result.push({
            key,
            nameZh: card.names?.zh || "",
            nameEn: card.names?.en || key,
            pages,
            backImage: card.image?.back || "",
          });
        });
        _negotiationCardsCache = result;
        return result;
      } catch { return []; }
    }

    function unlockedNegotiationTechs() {
      if (!state.unlockedTech || !_negotiationCardsCache) return [];
      const records = Array.isArray(state.unlockedTech.unlocked) ? state.unlockedTech.unlocked : [];
      const activeCycleId = currentCycleConfig().id;
      const activeCycleNum = Number(activeCycleId.replace(/\D/g, "") || 0);
      // Build set of unlocked keys (strip @@pageKey suffix).
      const unlockedKeys = new Set(records.filter((r) => !r.unimportant).map((r) => String(r.key || "").toLowerCase().trim().replace(/@@.*$/, "")));
      return _negotiationCardsCache.filter((card) => {
        if (!unlockedKeys.has(card.key)) return false;
        // Exclude cycle-only cards from previous cycles.
        if (card.pages.length > 0) {
          const cardCycleNums = card.pages.map((p) => Number(String(p).replace(/\D/g, "") || 0));
          const maxCycle = Math.max(...cardCycleNums);
          if (maxCycle < activeCycleNum) return false;
        }
        return true;
      });
    }

      if (!heroState || !Array.isArray(heroState.heroes) || !heroState.heroes.length) return [];

      const reminders = [];
      const heroDisplayName = (hero) => {
        const argonauts = [["odys","奥德修斯·零"],["circe","喀耳刻卫"],["phenelope","珀涅罗珀"],["telebac","忒勒巴科斯"],["herakleides","赫拉克莱德斯"],["olympia","奥林匹亚"],["leocules","莱奥库勒斯"],["raz","拉兹"],["fisher","费舍尔"],["hypatia","希帕提亚"],["anakreon","阿纳克里翁"],["anathea","安纳忒亚"],["orphan","DMT的孤儿"],["aster","阿斯特"],["dastan","达斯坦"],["aktisaeos","阿克提赛俄斯"],["oleander","欧利安德"],["omorfos","欧莫弗斯"]];
        if (hero.customName) return hero.customName;
        const found = argonauts.find(a => a[0] === hero.argonaut);
        return found ? found[1] : (hero.playerName || "英雄");

      heroState.heroes.forEach(hero => {
        hero.mnemosProgress = hero.mnemosProgress || {};

        HERO_CYCLES.forEach(cycleId => {
          (hero.mnemos?.[cycleId] || []).forEach(mId => {
            const cardDef = MNEMOS_CARD_NODES[mId];
            if (!cardDef) return;
            const progress = hero.mnemosProgress[mId] || 0;
            const nodeProgress = hero.mnemosNodeProgress[mId] || {};
            cardDef.thresholds.forEach((threshold, idx) => {
              if (progress >= threshold) {
                const node = cardDef.nodes[idx];
                if (node && !nodeProgress[node]) {
                  const cardName = MNEMOS_CARD_NAMES[mId] || mId;
                  const name = heroDisplayName(hero);
                  const storyBookParam = buildMnemosBreakthroughHref(node, cycleId);
                  reminders.push({
                    title: `${name}「${cardName}」→ ${node}`,
                    tag: { label: "回忆突破", className: "battle-tech" },
                    desc: `${name} 的回忆卡「${cardName}」进度已达 ${threshold}，节点 ${node} 待结算。`,
                    html: storyBookParam ? `<a class="mnemos-node-link" href="${escapeHtml(storyBookParam)}" target="_blank">跳转故事书 ${node}</a>` : "",
                    className: "important",
                  });
                }
              }
            });
          });
        });
      });
      return reminders;
    }

    function renderDateTrack({ focusCurrentDay = false } = {}) {

        elements.dateTrackList.innerHTML = '<div class="empty">暂无日期轨。</div>';
        renderCurrentDateNote();
        return;
      }

      elements.dateTrackMeta.textContent = `${track.label} · 当前 Day ${state.day}`;
      const fragment = document.createDocumentFragment();
      track.entries.forEach((entry) => {
        const eventText = entry.day == null ? "" : track.events[entry.day];
        const noteText = entry.day == null ? "" : state.dateNotes?.[dateNoteKey(entry.day)] || "";
        const icons = dateTrackIcons(entry, track);
        const isCurrentDay = entry.day != null && String(entry.day) === String(state.day);
        const item = document.createElement("div");
        item.className = `date-track-item${isCurrentDay ? " current" : ""}${eventText ? " event" : ""}${noteText ? " noted" : ""}${entry.day == null ? " disabled" : ""}`;
        item.title = noteText ? `Day ${formatTrackDay(entry)}：${noteText}` : `给 Day ${formatTrackDay(entry)} 写备注`;
        if (entry.day != null) {
          item.setAttribute("role", "button");
          item.tabIndex = 0;
          if (isCurrentDay) item.setAttribute("aria-current", "date");
        }
        item.innerHTML = `
          <span class="date-track-day">${escapeHtml(formatTrackDay(entry))}</span>
          ${icons.length ? `<span class="date-track-icons">${icons.map((icon) => `<span class="date-track-icon ${icon.className}">${escapeHtml(icon.label)}</span>`).join("")}</span>` : ""}
          ${eventText ? `<span class="date-track-event">${escapeHtml(eventText)}</span>` : ""}
          ${noteText ? `<span class="date-track-note">${escapeHtml(noteText)}</span>` : ""}
        `;
        if (entry.day != null) {
          item.addEventListener("click", (event) => {
            if (event.target.closest("button, a, input, select, textarea")) return;
            editDateNote(entry.day);
          });
          item.addEventListener("keydown", (event) => {
            if (event.key !== "Enter" && event.key !== " ") return;
            event.preventDefault();
            editDateNote(entry.day);
          });
          const acclimation = getAcclimationRule(entry.day, config.id);
          if (acclimation && isCurrentDay) {
            const actions = document.createElement("span");
            actions.className = "date-track-actions";
            const action = document.createElement("button");
            action.type = "button";
            action.className = `date-track-action${isAcclimationApplied(acclimation, config.id) ? " applied secondary" : ""}`;
            action.textContent = isAcclimationApplied(acclimation, config.id) ? "已扎根" : "扎根";
            action.title = `${acclimation.label}: ${acclimation.from.join(", ")} -> ${acclimation.to.join(", ")}`;
            action.addEventListener("click", (event) => {
              event.stopPropagation();
              applyAcclimationReplacement(acclimation);
            });
            actions.appendChild(action);
            item.appendChild(actions);
          }
        }
        fragment.appendChild(item);
      });
      elements.dateTrackList.appendChild(fragment);
      renderCurrentDateNote();
      if (focusCurrentDay) keepCurrentDateVisible();
    }

    function resetToday() {
      state.completed = {};
      state.events = state.events.map((item) => ({ ...item, done: false }));
      saveState();
      renderFlow();
      renderDateTrack();
    }

    function nextDay() {
      const track = dateTrackData[currentCycleConfig().id];
      const currentIndex = track?.entries.findIndex((entry) => String(entry.day) === String(state.day)) ?? -1;
      state.day = currentIndex >= 0 && currentIndex < track.entries.length - 1
        ? track.entries[currentIndex + 1].day
        : Math.max(0, Number(state.day || 0) + 1);
      state.completed = {};
      state.events = state.events.filter((item) => !item.done);
      state.latestSurveyAdventureAction = null;
      state.latestSimpleAdventureAction = null;
      syncInputs();
      saveState();
      renderFlow();
      renderDateTrack({ focusCurrentDay: true });
    }

    async function loadFullCampaign() {
      try {
        const response = await fetch(authUrl, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const payload = await response.json();
        if (!payload.ok) throw new Error(payload.error || "读取失败");
        return payload.campaign || null;
      } catch (error) {
        console.warn(error);
        return null;
      }
    }

    async function saveImportedCampaignSection(section, sectionState) {
      if (sectionState == null) return;
      try {
        const response = await fetch(`${authUrl}?section=${encodeURIComponent(section)}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ section, state: sectionState }),
        });
        const payload = await response.json().catch(() => null);
        if (!response.ok || !payload?.ok) throw new Error(payload?.error || `HTTP ${response.status}`);
        return payload;
      } catch (error) {
        console.warn(error);
        return null;
      }
    }

    function downloadJsonPayload(payload) {
      const text = JSON.stringify(payload, null, 2);
      const blob = new Blob([text], { type: "application/json;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement("a");
      const stamp = new Date().toISOString().replace(/[:.]/g, "-");
      anchor.href = url;
      anchor.download = `ato-full-save-${stamp}.json`;
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      URL.revokeObjectURL(url);
    }

    async function exportState() {
      saveState();
      const previousText = elements.exportButton.textContent;
      elements.exportButton.textContent = "正在导出...";
      elements.exportButton.disabled = true;
      try {
        const serverCampaign = await loadFullCampaign();
        const serverSections = serverCampaign?.sections || {};
        const sections = {
          dashboard: serverSections.dashboard || archive || null,
          map: serverSections.map || null,
          record: serverSections.record || null,
          technology: serverSections.technology || null,
          heroes: serverSections.heroes || null,
        };
        const payload = {
          app: "ATO Campaign Save Package",
          version: 2,
          exportedAt: new Date().toISOString(),
          activeProfileId: archive.activeProfileId,
          profiles: archive.profiles,
          sections,
          source: {
            serverIncluded: Boolean(serverCampaign),
            serverUpdatedAt: serverCampaign?.updatedAt || null,
          },
          legacyDashboard: {
            activeProfileId: archive.activeProfileId,
            profiles: archive.profiles,
          },
        };
        downloadJsonPayload(payload);
        elements.exportButton.textContent = "已下载";
        window.setTimeout(() => {
          elements.exportButton.textContent = previousText;
        }, 1200);
      } finally {
        elements.exportButton.disabled = false;
      }
    }

    function importStateFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async () => {
        try {
          const imported = JSON.parse(String(reader.result || "{}"));
          const sections = imported.sections || imported.campaign?.sections || null;
          const dashboardImport = sections?.dashboard || imported.legacyDashboard || imported;
          const nextArchive = dashboardImport.profiles
            ? normalizeArchive(dashboardImport)
            : normalizeArchive({
                activeProfileId: "imported",
                profiles: {
                  imported: {
                    id: "imported",
                    name: dashboardImport.name || "导入用户",
                    state: dashboardImport.state || dashboardImport,
                  },
                },
              });

          archive = nextArchive;
          state = currentCycle().state;
          const [dashboardSave] = await Promise.all([
            saveImportedCampaignSection("dashboard", archive),
            sections?.map ? saveImportedCampaignSection("map", sections.map) : Promise.resolve(),
            sections?.record ? saveImportedCampaignSection("record", sections.record) : Promise.resolve(),
            sections?.technology ? saveImportedCampaignSection("technology", sections.technology) : Promise.resolve(),
            sections?.heroes ? saveImportedCampaignSection("heroes", sections.heroes) : Promise.resolve(),
          ]);
          campaignSectionRevision = Math.max(0, Number(dashboardSave?.revision || campaignSectionRevision));
          campaignSectionExists = Boolean(dashboardSave?.ok || campaignSectionExists);
          campaignSectionBaseline = cloneJson(archive);
          campaignSyncChannel?.postMessage({ revision: campaignSectionRevision });
          syncInputs();
          renderProfiles();
          renderCycles();
          renderFlow();
          renderDateTrack();
          window.alert("导入完成。");
        } catch (error) {
          window.alert(`导入失败：${String(error.message || error)}`);
        } finally {
          elements.importInput.value = "";
        }
      };
      reader.readAsText(file);
    }

    function clearState() {
      if (!window.confirm(`确定清空当前账号在 ${currentCycleConfig().label} 的 Day、流程、事件和笔记吗？`)) return;
      state = { ...defaultState, day: defaultDayForCycle(currentCycleConfig().id), completed: {}, dateNotes: {}, cardTracks: normalizeCardTracks({}, {}, false, currentCycleConfig().id), cardTracksVersion: 2, unlockedTech: null, events: [] };
      currentCycle().state = state;
      queueCampaignSave();
      syncInputs();
      renderFlow();
      renderDateTrack();
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    elements.dayInput.addEventListener("input", () => {
      state.day = normalizeCampaignDay(elements.dayInput.value, currentCycleConfig().id);
      state.latestSurveyAdventureAction = null;
      state.latestSimpleAdventureAction = null;
      saveState();
      renderFlow();
      renderDateTrack();
    });
    elements.flowList.addEventListener("click", (event) => {
      const directionButton = event.target.closest("[data-map-direction]");
      if (directionButton) {
        runMapCommand("move-argo", directionButton.dataset.mapDirection);
        return;
      }
      const mapButton = event.target.closest("[data-map-command]");
      if (mapButton) {
        runMapCommand(mapButton.dataset.mapCommand, mapButton.dataset.mapTarget || "");
        return;
      }
      const button = event.target.closest("[data-card-track-open]");
      if (!button) return;
      openCardTrackDialog(button.dataset.cardTrackOpen);
    });
    elements.notesInput.addEventListener("input", () => {
      state.notes = elements.notesInput.value;
      saveState();
    });
    elements.resetTodayButton.addEventListener("click", resetToday);
    elements.nextDayButton.addEventListener("click", nextDay);
    elements.loginModeButton.addEventListener("click", () => setAuthMode("login"));
    elements.registerModeButton.addEventListener("click", () => setAuthMode("register"));
    elements.authForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      elements.authMessage.textContent = "";
      elements.authSubmitButton.disabled = true;
      try {
        const user = await requestAuth(authMode, elements.authUsername.value, elements.authPassword.value);
        elements.authPassword.value = "";
        startAuthenticatedApp(user);
      } catch (error) {
        elements.authMessage.textContent = String(error.message || error);
      } finally {
        elements.authSubmitButton.disabled = false;
      }
    });
    elements.logoutButton.addEventListener("click", async () => {
      await fetch(`${authUrl}?action=logout`, { method: "POST" }).catch(() => null);
      dashboardWriterChannel?.postMessage({ type: "session-logout", pageId: dashboardPageId });
      showAuth();
      clearLocalStorageAfterLogout();
    });
    elements.cycleSelect.addEventListener("change", () => switchCycle(elements.cycleSelect.value));
    elements.exportButton.addEventListener("click", exportState);
    elements.importButton.addEventListener("click", () => elements.importInput.click());
    elements.importInput.addEventListener("change", () => importStateFile(elements.importInput.files[0]));
    elements.cardTrackClose.addEventListener("click", () => elements.cardTrackDialog.close());
    elements.cardTrackDialog.addEventListener("click", (event) => {
      if (event.target === elements.cardTrackDialog) elements.cardTrackDialog.close();
    });
    elements.cardTrackBody.addEventListener("click", (event) => {
      const retreatButton = event.target.closest("[data-card-retreat]");
      if (retreatButton) {
        retreatCardTrack(retreatButton.dataset.cardRetreat);
        return;
      }
      const advanceButton = event.target.closest("[data-card-advance]");
      if (advanceButton) {
        advanceCardTrack(advanceButton.dataset.cardAdvance);
        return;
      }
      const progressButton = event.target.closest("[data-card-progress]");
      if (progressButton) {
        stepCardTrackProgress(progressButton.dataset.cardProgress, Number(progressButton.dataset.delta || 0));
        return;
      }
      const counterButton = event.target.closest("[data-card-counter]");
      if (!counterButton) return;
      stepCardTrackCounter(
        counterButton.dataset.cardCounter,
        counterButton.dataset.cardCounterField,
        Number(counterButton.dataset.delta || 0)
      );
    });
    elements.secondScreenToggle.addEventListener("change", () => setSecondScreenEnabled(elements.secondScreenToggle.checked));
    elements.secondScreenBattleBoardToggle.addEventListener("change", () => {
      setSecondScreenBattleBoardVisible(elements.secondScreenBattleBoardToggle.checked);
    });
    elements.secondScreenScale.addEventListener("input", () => {
      elements.secondScreenScaleValue.textContent = `${elements.secondScreenScale.value}%`;
    });
    elements.secondScreenScale.addEventListener("change", () => setSecondScreenModuleScale("map", elements.secondScreenScale.value));
    elements.secondScreenBattleScale.addEventListener("input", () => {
      elements.secondScreenBattleScaleValue.textContent = `${elements.secondScreenBattleScale.value}%`;
    });
    elements.secondScreenBattleScale.addEventListener("change", () => setSecondScreenModuleScale("battleBoard", elements.secondScreenBattleScale.value));
    elements.secondScreenRotateButton.addEventListener("click", rotateSecondScreenBattle);
    elements.secondScreenSwapButton.addEventListener("click", swapSecondScreenBattle);
    elements.copySecondScreenButton.addEventListener("click", async () => {
      if (!elements.secondScreenUrl.value) return;
      try {
        await navigator.clipboard.writeText(elements.secondScreenUrl.value);
        elements.copySecondScreenButton.textContent = "已复制";
        window.setTimeout(() => { elements.copySecondScreenButton.textContent = "复制网址"; }, 1200);
      } catch {
        elements.secondScreenUrl.select();
        document.execCommand("copy");
      }
    });
    elements.cardTrackBody.addEventListener("change", (event) => {
      const input = event.target.closest("[data-card-progress-input]");
      if (input) {
        setCardTrackProgress(input.dataset.cardProgressInput, input.value);
        return;
      }
      const counterInput = event.target.closest("[data-card-counter-input]");
      if (!counterInput) return;
      setCardTrackCounter(counterInput.dataset.cardCounterInput, counterInput.dataset.cardCounterField, counterInput.value);
    });
    elements.dashboardTakeoverButton.addEventListener("click", () => void takeoverDashboardWriting());
    ["click", "beforeinput", "input", "change", "submit"].forEach((eventName) => {
      document.addEventListener(eventName, blockReadOnlyDashboardEvent, true);
    });
    document.addEventListener("keydown", blockReadOnlyDashboardEvent, true);
    const dashboardControlObserver = new MutationObserver((mutations) => {
      const addedInteractiveContent = mutations.some((mutation) =>
        Array.from(mutation.addedNodes).some((node) =>
          node.nodeType === Node.ELEMENT_NODE || node.nodeType === Node.DOCUMENT_FRAGMENT_NODE
        )
      );
      if (addedInteractiveContent) updateDashboardWriteAccessUi();
    });
    dashboardControlObserver.observe(elements.appShell, { childList: true, subtree: true });
    dashboardControlObserver.observe(elements.cardTrackDialog, { childList: true, subtree: true });
    campaignSyncChannel?.addEventListener("message", () => void syncDashboardFromExternalUpdate());
    dashboardWriterChannel?.addEventListener("message", (event) => {
      const message = event.data || {};
      if (message.pageId === dashboardPageId) return;
      if (message.type === "session-logout") {
        showAuth("已在另一个主控制台登出。");
        clearLocalStorageAfterLogout();
        return;
      }
      maintainDashboardWriteLease();
    });
    recordSyncChannel?.addEventListener("message", () => void refreshCachedArgoRecord());
    window.addEventListener("storage", (event) => {
      if (event.key === dashboardWriterLeaseKey) maintainDashboardWriteLease();
    });
    window.setInterval(() => void syncDashboardFromExternalUpdate(), 4000);
    window.addEventListener("focus", () => void syncDashboardFromExternalUpdate());
    window.addEventListener("focus", reconnectCampaignNow);
    window.addEventListener("online", reconnectCampaignNow);
    window.addEventListener("pagehide", releaseDashboardWriteLease);
    window.addEventListener("pageshow", () => {
      if (sessionUser) beginDashboardWriteLease();
    });
    window.addEventListener("focus", () => void refreshCachedArgoRecord());
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) void syncDashboardFromExternalUpdate();
      if (!document.hidden) void refreshCachedArgoRecord();
    });

    setAuthMode("login");
    initAuth();
  </script>
</body>
</html>
