<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ATO 战役主控台</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef2f0;
      --panel: #fffefa;
      --ink: #1e2623;
      --muted: #68736d;
      --line: #d6ddd8;
      --accent: #16675b;
      --accent-strong: #0d4d44;
      --gold: #a66d1d;
      --danger: #9d332c;
      --done: #1f7a4f;
      --shadow: 0 18px 44px rgba(28, 38, 34, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
      letter-spacing: 0;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      min-height: 38px;
      border: 0;
      border-radius: 6px;
      padding: 0 14px;
      background: var(--accent);
      color: #fff;
      font-weight: 800;
      cursor: pointer;
    }

    button:hover {
      background: var(--accent-strong);
    }

    button.secondary {
      border: 1px solid var(--line);
      background: #f8faf7;
      color: var(--ink);
    }

    button.secondary:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      padding: 10px 12px;
    }

    textarea {
      min-height: 106px;
      resize: vertical;
      line-height: 1.55;
    }

    .app {
      width: min(1440px, 100%);
      margin: 0 auto;
      padding: 24px clamp(14px, 3vw, 34px) 34px;
    }

    .auth-gate {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .auth-panel {
      width: min(420px, 100%);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      padding: 22px;
      display: grid;
      gap: 16px;
    }

    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .auth-tabs button[aria-pressed="true"] {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .auth-form {
      display: grid;
      gap: 12px;
    }

    .auth-form label,
    .session-card label {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .auth-message {
      min-height: 20px;
      color: var(--danger);
      font-size: 13px;
      font-weight: 700;
    }

    .session-card {
      display: grid;
      gap: 10px;
    }

    .session-account {
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      font-weight: 800;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: start;
      margin-bottom: 18px;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    h1 {
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1.08;
    }

    .title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
    }

    .title-cycle-control {
      min-width: min(280px, 100%);
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .title-cycle-control select {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      padding: 0 10px;
      font-weight: 900;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: 15px;
    }

    .campaign-save-status {
      display: inline-flex;
      margin-left: 0;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .campaign-save-status[data-state="saving"] { color: var(--accent); }
    .campaign-save-status[data-state="offline"] { color: var(--danger); }
    .campaign-save-status[data-state="saved"] { color: #16794a; }
    .campaign-save-status[data-state="readonly"] { color: #8a5a00; }

    .app-credit {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 12px;
      text-align: right;
    }

    .dashboard-writer-notice {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 16px;
      border: 1px solid #d6a645;
      border-radius: 6px;
      background: #fff5d6;
      color: #5f4300;
      font-size: 14px;
      font-weight: 800;
    }

    .dashboard-writer-notice[hidden] { display: none; }

    .dashboard-writer-notice button {
      flex: 0 0 auto;
      background: #815a00;
      border-color: #815a00;
    }

    body.dashboard-readonly #appShell :is(button, input:not([readonly]), select, textarea, [role="button"]):not([data-dashboard-readonly-allowed]),
    body.dashboard-readonly #cardTrackDialog :is(button, input, select, textarea):not([data-dashboard-readonly-allowed]) {
      pointer-events: none;
      opacity: 0.55;
      cursor: not-allowed;
    }

    .record-card-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(166, 109, 29, 0.38);
      border-radius: 6px;
      padding: 8px 12px;
      background: #fff8ea;
      color: var(--gold);
      text-decoration: none;
      font-size: 13px;
      font-weight: 900;
      white-space: nowrap;
    }

    .record-card-link:hover {
      border-color: var(--gold);
      background: #fff3d7;
      color: #7f5015;
    }

    .record-links {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      align-self: stretch;
      align-content: stretch;
    }

    .record-links .record-card-link {
      min-width: 0;
      padding-inline: 8px;
    }

    .record-links .hero-card-link {
      grid-column: 1;
      grid-row: 2;
    }

    .record-links .aibp-card-link {
      grid-column: 2;
      grid-row: 1;
    }

    .record-links .technology-card-link {
      grid-column: 2;
      grid-row: 2;
    }

    .day-card {
      width: min(520px, 100%);
      min-width: min(420px, 100%);
      justify-self: end;
      display: grid;
      grid-template-columns: 116px minmax(0, 1fr) auto;
      gap: 12px;
      align-items: stretch;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .day-card label {
      grid-column: 1;
      display: grid;
      gap: 6px;
      align-content: start;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .day-card input {
      width: 116px;
      font-size: 28px;
      font-weight: 900;
      text-align: center;
    }

    .day-actions {
      grid-column: 3;
      align-self: stretch;
      display: grid;
      gap: 8px;
      align-content: stretch;
    }

    .profile-tools {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: end;
      width: 100%;
    }

    .profile-tools label {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .profile-tools select {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      padding: 0 10px;
    }

    .profile-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(320px, 0.8fr);
      gap: 18px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      min-height: 56px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: #f8faf7;
    }

    .panel-head h2 {
      font-size: 18px;
      line-height: 1.2;
    }

    .flow-head-tools {
      display: grid;
      grid-template-columns: auto;
      gap: 10px 14px;
      align-items: center;
      justify-content: end;
      min-width: min(260px, 100%);
    }

    .flow-head-tools .field-note {
      grid-column: 1 / -1;
      justify-self: stretch;
    }

    .date-track-meta {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .date-track-list {
      max-height: 560px;
      overflow: auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 6px;
      align-items: start;
    }

    .date-track-item {
      min-height: 38px;
      display: grid;
      grid-template-columns: 46px minmax(88px, auto) minmax(0, 1fr);
      gap: 8px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 8px;
      background: #fff;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
    }

    .date-track-item:hover {
      border-color: var(--accent);
      background: #f5fbf8;
    }

    .date-track-item.current {
      border-color: var(--accent);
      border-left: 8px solid var(--accent);
      padding-left: 12px;
      background: #dff1ec;
      box-shadow: inset 0 0 0 2px rgba(22, 103, 91, 0.28), 0 6px 16px rgba(22, 103, 91, 0.16);
    }

    .date-track-item.event {
      border-color: rgba(166, 109, 29, 0.55);
      background: #fff8ea;
    }

    .date-track-item.noted {
      border-color: rgba(31, 122, 79, 0.24);
      background: linear-gradient(90deg, rgba(31, 122, 79, 0.1), #fff 28px);
    }

    .date-track-item.current.noted {
      border-color: var(--accent);
      border-left-color: var(--accent);
      background: #dff1ec;
    }

    .date-track-item:disabled,
    .date-track-item.disabled {
      cursor: default;
      opacity: 0.72;
    }

    .date-track-day {
      font-size: 14px;
      font-weight: 900;
    }

    .date-track-event {
      grid-column: 3;
      color: var(--gold);
      font-size: 11px;
      font-weight: 800;
      line-height: 1.2;
    }

    .date-track-actions {
      grid-column: 1 / -1;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 2px;
    }

    .date-track-action {
      min-height: 28px;
      border-radius: 5px;
      padding: 0 8px;
      font-size: 11px;
    }

    .date-track-action.applied {
      background: #ecf6f2;
      color: var(--accent);
      border: 1px solid rgba(31, 122, 79, 0.28);
    }

    .date-track-icons {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
    }

    .date-track-icon {
      display: inline-flex;
      align-items: center;
      min-height: 16px;
      border-radius: 4px;
      padding: 0 4px;
      background: #eef1ef;
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      line-height: 1.1;
    }

    .date-track-icon.battle {
      background: #f4ece8;
      color: var(--danger);
    }

    .date-track-icon.structure-tech {
      background: #e8f4ef;
      color: var(--accent);
    }

    .date-track-icon.battle-tech {
      background: #eef1f7;
      color: #44536f;
    }

    .date-track-note {
      grid-column: 3;
      color: var(--done);
      font-size: 11px;
      font-weight: 800;
      line-height: 1.2;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .field-note {
      min-height: 30px;
      border: 1px solid rgba(31, 122, 79, 0.28);
      border-radius: 6px;
      padding: 7px 9px;
      background: #eef8f1;
      color: var(--done);
      font-size: 12px;
      font-weight: 800;
      line-height: 1.35;
    }

    .field-note[hidden] {
      display: none;
    }

    .panel-body {
      padding: 16px;
    }

    .field {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .flow-list {
      display: grid;
      gap: 10px;
    }

    .flow-step {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .flow-step.done {
      border-color: rgba(31, 122, 79, 0.35);
      background: #f1faf5;
    }

    .flow-check {
      width: 24px;
      height: 24px;
      margin-top: 2px;
      accent-color: var(--done);
      cursor: pointer;
    }

    .step-title {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 4px;
      font-weight: 900;
    }

    .step-index {
      color: var(--gold);
      font-family: Consolas, monospace;
      font-size: 15px;
    }

    .step-kind {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .step-desc {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .step-track-reminders {
      display: grid;
      gap: 7px;
      margin-top: 10px;
    }

    .step-track-reminder {
      padding: 8px 9px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
    }

    .step-track-reminder.important {
      border-color: rgba(157, 51, 44, 0.42);
      background: #fff7f4;
    }

    .step-track-reminder.tech {
      border-color: rgba(22, 103, 91, 0.35);
      background: #f2faf6;
    }

    .step-track-title {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
      margin-bottom: 3px;
      font-size: 13px;
      font-weight: 900;
    }
    .step-track-action {
      margin-left: auto;
    }

    .step-track-tag {
      min-height: 20px;
      display: inline-flex;
      align-items: center;
      border-radius: 4px;
      padding: 0 6px;
      background: #eef1ef;
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
    }

    .step-track-tag.battle {
      background: #f4ece8;
      color: var(--danger);
    }

    .step-track-tag.structure-tech {
      background: #e8f4ef;
      color: var(--accent);
    }

    .step-track-tag.battle-tech {
      background: #eef1f7;
      color: #44536f;
    }

    .step-track-desc {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .mnemos-node-link {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 4px;
      background: var(--accent);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      text-decoration: none;
    }
    .mnemos-node-link:hover { filter: brightness(0.9); }

    .negotiation-card-back {
      display: inline-block;
      height: 180px;
      width: auto;
      margin: 6px 6px 0 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      box-shadow: 0 4px 10px rgba(28, 38, 34, 0.12);
      object-fit: contain;
      vertical-align: top;
    }

    .exploration-tools {
      display: grid;
      gap: 9px;
      margin-top: 11px;
      padding: 10px;
      border: 1px solid rgba(22, 103, 91, 0.28);
      border-radius: 8px;
      background: #f3faf7;
    }

    .exploration-toolbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 9px;
      align-items: end;
    }

    .exploration-status {
      display: grid;
      gap: 5px;
    }

    .exploration-faction-status {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      color: #31504a;
      font-size: 12px;
      font-weight: 800;
    }

    .exploration-faction-chip {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 4px 8px;
      border: 1px solid rgba(22, 103, 91, 0.24);
      border-radius: 6px;
      background: #ffffff;
      color: var(--ink);
      line-height: 1.2;
    }

    .exploration-faction-chip.muted {
      color: #66756f;
      font-weight: 700;
    }

    .exploration-count {
      color: var(--ink);
      font-size: 14px;
      font-weight: 900;
    }

    .exploration-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      justify-content: end;
    }

    .exploration-buttons button {
      min-height: 36px;
    }

    .exploration-return-preview {
      position: absolute;
      z-index: 4;
      width: min(520px, calc(100vw - 36px));
      max-height: min(520px, 60vh);
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: #fff;
      box-shadow: var(--shadow);
    }

    .exploration-return-preview[hidden] {
      display: none;
    }

    .exploration-return-preview-title {
      margin-bottom: 8px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 900;
    }

    .exploration-summary {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .exploration-drawn {
      display: grid;
      gap: 8px;
    }

    .exploration-removed-pile {
      display: grid;
      gap: 8px;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 9px;
      background: #fff;
    }

    .exploration-removed-piles {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 9px;
    }

    .exploration-pile-head {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      color: var(--ink);
      font-size: 13px;
      font-weight: 900;
    }

    .exploration-removed-pile summary {
      display: list-item;
      cursor: pointer;
      list-style-position: inside;
    }

    .exploration-drawn-title {
      color: var(--ink);
      font-size: 13px;
      font-weight: 900;
    }

    .exploration-drawn-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
      gap: 8px;
      align-items: start;
    }

    .exploration-active-grid {
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 12px;
    }

    .exploration-active-grid .exploration-drawn-meta {
      font-size: 12px;
    }

    .exploration-drawn-card {
      display: grid;
      gap: 5px;
      min-width: 0;
    }

    .exploration-drawn-face {
      width: 100%;
      aspect-ratio: 470 / 740;
      overflow: hidden;
      border: 1px solid rgba(30, 38, 35, 0.2);
      border-radius: 6px;
      background-color: #e9eeeb;
      background-repeat: no-repeat;
      box-shadow: 0 6px 14px rgba(28, 38, 34, 0.12);
    }

    .exploration-drawn-meta {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .exploration-card-tag {
      display: inline-flex;
      margin-top: 3px;
      border-radius: 999px;
      padding: 2px 6px;
      background: #edf3f1;
      color: #50645e;
      font-size: 10px;
      font-weight: 900;
    }

    .exploration-destruction {
      border: 1px solid rgba(157, 51, 44, 0.2);
      border-radius: 7px;
      background: #fff8f5;
    }

    .exploration-destruction summary {
      cursor: pointer;
      padding: 9px 10px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 900;
    }

    .exploration-destruction-body {
      display: grid;
      gap: 8px;
      padding: 0 9px 9px;
    }

    .exploration-destruction-head {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }

    .exploration-destruction-title {
      color: var(--ink);
      font-size: 13px;
      font-weight: 900;
    }

    .exploration-destruction-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .exploration-destruction-card {
      display: inline-flex;
      min-height: 28px;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 3px 6px;
      background: #fff;
      color: var(--ink);
      font-size: 12px;
      font-weight: 800;
    }

    .exploration-destruction-card button {
      min-height: 22px;
      padding: 0 7px;
      font-size: 11px;
    }

    .exploration-builder {
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
    }

    .exploration-builder summary {
      cursor: pointer;
      padding: 9px 10px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 900;
    }

    .exploration-builder-body {
      display: grid;
      gap: 9px;
      padding: 0 10px 10px;
    }

    .exploration-builder-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .exploration-library {
      max-height: 620px;
      overflow: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
      align-items: start;
    }

    .exploration-library label {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 7px;
      align-items: start;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px;
      background: #fbfcfa;
      color: var(--ink);
      font-size: 12px;
      font-weight: 800;
      line-height: 1.25;
    }

    .exploration-library-preview {
      grid-column: 1 / -1;
      width: 100%;
      aspect-ratio: 470 / 740;
      border: 1px solid rgba(30, 38, 35, 0.18);
      border-radius: 6px;
      background-color: #e9eeeb;
      background-repeat: no-repeat;
      box-shadow: 0 5px 12px rgba(28, 38, 34, 0.1);
    }

    .exploration-library input {
      width: 16px;
      height: 16px;
      padding: 0;
      accent-color: var(--accent);
    }

    .exploration-library button {
      grid-column: 1 / -1;
      min-height: 26px;
      padding: 0 8px;
      font-size: 11px;
      white-space: nowrap;
    }

    .survey-constants {
      margin-top: 10px;
      border: 1px solid rgba(166, 109, 29, 0.26);
      border-radius: 7px;
      background: #fffaf1;
    }

    .survey-constants summary {
      cursor: pointer;
      padding: 9px 10px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 900;
    }

    .simple-constant-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      align-items: start;
      margin-top: 10px;
    }

    .simple-constant-row .survey-constants {
      margin-top: 0;
      min-width: 0;
    }

    .simple-constant-row .special-event-constants.span-two {
      grid-column: span 2;
    }

    .survey-constants-body {
      display: grid;
      gap: 10px;
      padding: 0 10px 10px;
    }

    .survey-constant-group {
      display: grid;
      gap: 7px;
    }

    .survey-constant-heading {
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .survey-hub-summary {
      overflow: auto;
      border: 1px solid rgba(30, 38, 35, 0.12);
      border-radius: 7px;
      background: #fff;
    }

    .survey-hub-summary-row {
      display: grid;
      grid-template-columns: repeat(var(--survey-story-columns, 4), minmax(52px, 0.5fr)) minmax(160px, 1.25fr) minmax(150px, 1fr);
      gap: 8px;
      align-items: center;
      min-width: 660px;
      border-top: 1px solid rgba(30, 38, 35, 0.08);
      padding: 7px 8px;
      color: var(--ink);
      font-size: 12px;
      font-weight: 800;
      line-height: 1.25;
    }

    .survey-hub-summary-row:first-child {
      border-top: 0;
    }

    .survey-hub-summary-row.header {
      background: #f7efe2;
      color: var(--muted);
      font-size: 11px;
      font-weight: 950;
      text-transform: uppercase;
    }

    .survey-hub-summary-row.active {
      background: #f1f8f5;
      box-shadow: inset 3px 0 0 var(--accent);
    }

    .survey-hub-story {
      color: var(--gold);
      font-weight: 950;
      white-space: nowrap;
    }

    .survey-hub-title {
      font-weight: 950;
    }

    .survey-constant-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 8px;
    }

    .survey-constant-card {
      display: grid;
      gap: 6px;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 8px;
      background: #fff;
    }

    .survey-constant-title {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      align-items: baseline;
      color: var(--ink);
      font-size: 12px;
      font-weight: 900;
      line-height: 1.25;
    }

    .survey-constant-title span {
      color: var(--muted);
      font-weight: 800;
    }

    .survey-constant-boxes {
      display: grid;
      gap: 5px;
    }

    .survey-constant-boxes label,
    .survey-constant-row-item {
      display: grid;
      grid-template-columns: auto minmax(34px, auto) minmax(0, 1fr);
      gap: 6px;
      align-items: center;
      color: var(--ink);
      font-size: 12px;
      font-weight: 800;
      line-height: 1.25;
    }

    .survey-constant-row-item.multi-slot {
      grid-template-columns: auto minmax(0, 1fr);
    }

    .simple-constant-slots {
      display: inline-flex;
      gap: 4px;
      align-items: center;
      min-width: max-content;
    }

    .survey-constant-boxes input {
      width: 15px;
      height: 15px;
      padding: 0;
      accent-color: var(--gold);
    }

    .survey-constant-roll {
      color: var(--gold);
      font-weight: 900;
      white-space: nowrap;
    }

    .survey-constant-tag {
      display: inline-block;
      padding: 1px 5px;
      border-radius: 3px;
      background: rgba(138, 91, 23, 0.12);
      color: var(--gold);
      font-size: 10px;
      font-weight: 800;
      vertical-align: middle;
    }

    .flow-title-button {
      min-height: 0;
      border: 0;
      border-bottom: 2px solid rgba(22, 103, 91, 0.35);
      border-radius: 0;
      padding: 0 1px 1px;
      background: transparent;
      color: var(--accent);
      font: inherit;
      font-weight: 900;
      cursor: pointer;
    }

    .flow-title-button:hover {
      background: transparent;
      border-color: var(--accent);
      color: var(--accent-strong);
    }

    .card-track-dialog {
      width: min(1240px, calc(100vw - 28px));
      max-height: min(920px, calc(100vh - 28px));
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0;
      background: var(--panel);
      color: var(--ink);
      box-shadow: var(--shadow);
    }

    .card-track-dialog::backdrop {
      background: rgba(30, 38, 35, 0.42);
    }

    .card-track-shell {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      max-height: min(920px, calc(100vh - 28px));
    }

    .card-track-head {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      padding: 14px 16px;
    }

    .card-track-head h2 {
      font-size: 20px;
    }

    .card-track-close {
      width: 34px;
      min-height: 34px;
      padding: 0;
      border: 1px solid var(--line);
      background: #f8faf7;
      color: var(--ink);
      font-size: 20px;
      line-height: 1;
    }

    .card-track-body {
      overflow: auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(520px, 1fr));
      gap: 14px;
      padding: 14px;
    }

    .card-track-dialog[data-group="story"] .card-track-body {
      grid-template-columns: minmax(620px, 1fr) minmax(260px, 340px);
    }

    .card-track-dialog[data-group="doom"] .card-track-body {
      grid-template-columns: minmax(0, 1fr);
      justify-items: center;
    }

    .card-track-dialog[data-group="doom"] .card-track-item {
      width: min(100%, 720px);
    }

    .card-track-dialog[data-group="doom"] .card-track-face,
    .card-track-dialog[data-group="doom"] .card-track-empty {
      width: min(100%, 620px);
    }

    .card-track-item {
      display: grid;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: #fff;
    }

    .card-track-title {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 900;
    }

    .card-track-status {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .card-track-face {
      width: min(100%, 920px);
      justify-self: center;
      aspect-ratio: 1.4;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(30, 38, 35, 0.22);
      border-radius: 7px;
      background: #edf1ee;
      box-shadow: 0 8px 18px rgba(28, 38, 34, 0.12);
    }

    .card-track-face img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    .card-track-progress-badge {
      position: absolute;
      right: 8px;
      bottom: 8px;
      min-height: 26px;
      display: inline-flex;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 999px;
      padding: 0 9px;
      background: rgba(30, 38, 35, 0.78);
      color: #fff;
      font-size: 12px;
      font-weight: 900;
    }

    .card-track-side-badge {
      position: absolute;
      left: 8px;
      top: 8px;
      min-height: 30px;
      display: inline-flex;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 6px;
      padding: 0 10px;
      background: rgba(255, 254, 250, 0.86);
      color: var(--ink);
      font-size: 13px;
      font-weight: 950;
    }

    .card-track-preview-badge {
      position: absolute;
      left: 8px;
      bottom: 8px;
      min-height: 26px;
      display: inline-flex;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 999px;
      padding: 0 9px;
      background: rgba(190, 102, 36, 0.84);
      color: #fff;
      font-size: 12px;
      font-weight: 900;
    }

    .card-track-empty {
      width: min(100%, 920px);
      justify-self: center;
      aspect-ratio: 1.4;
      display: grid;
      place-items: center;
      border: 1px dashed rgba(22, 103, 91, 0.34);
      border-radius: 7px;
      background: #fff;
      color: var(--muted);
      font-size: 13px;
      font-weight: 850;
      text-align: center;
      padding: 8px;
    }

    .card-track-knowledge {
      min-height: 180px;
      display: grid;
      place-items: center;
      gap: 8px;
      border: 1px solid rgba(22, 103, 91, 0.28);
      border-radius: 8px;
      background: #f3faf7;
      text-align: center;
      padding: 18px;
    }

    .card-track-knowledge-value {
      color: var(--accent-strong);
      font-size: 52px;
      font-weight: 950;
      line-height: 1;
    }

    .card-track-knowledge-label {
      color: var(--muted);
      font-size: 14px;
      font-weight: 900;
    }

    .card-track-controls {
      display: grid;
      gap: 8px;
    }

    .card-track-counter-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      align-items: center;
    }

    .card-track-progress {
      display: grid;
      grid-template-columns: auto 34px minmax(44px, 1fr) 34px;
      gap: 6px;
      align-items: center;
    }

    .card-track-counter {
      display: grid;
      grid-template-columns: auto 34px minmax(60px, 1fr) 34px;
      gap: 6px;
      align-items: center;
    }

    .card-track-counter-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }

    .card-track-progress button,
    .card-track-counter button,
    .card-track-advance,
    .card-track-retreat {
      min-height: 34px;
      border: 1px solid var(--line);
      background: #f8faf7;
      color: var(--ink);
    }

    .card-track-progress input {
      height: 34px;
      padding: 6px 8px;
      text-align: center;
      font-weight: 900;
    }

    .card-track-step-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .card-track-advance,
    .card-track-retreat {
      width: 100%;
    }

    .card-track-meta {
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      line-height: 1.4;
    }

    .step-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin: 0 0 0 auto;
    }

    .step-actions a {
      min-height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fbfcfa;
      color: var(--ink);
      text-decoration: none;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.18;
      text-align: center;
    }

    .step-actions a:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .step-action-context {
      grid-column: 1 / -1;
      display: grid;
      gap: 6px;
      margin-top: 2px;
      border-top: 1px solid var(--line);
      padding-top: 8px;
      color: var(--ink);
      font-size: 12px;
      line-height: 1.3;
    }

    .step-action-context-title {
      color: var(--muted);
      font-size: 11px;
      font-weight: 950;
      text-transform: uppercase;
    }

    .step-action-context-row {
      display: grid;
      gap: 2px;
      min-width: 0;
    }

    .step-action-context-label {
      color: var(--gold);
      font-weight: 950;
    }

    .step-action-context-value {
      overflow-wrap: anywhere;
      font-weight: 850;
    }

    .step-action-context-empty {
      color: var(--muted);
      font-weight: 750;
    }

    .step-action-context-count {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }

    .progress {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 210px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .progress-track {
      width: 120px;
      height: 9px;
      overflow: hidden;
      border-radius: 99px;
      background: #e2e8e4;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: var(--done);
      transition: width 160ms ease;
    }

    .stack {
      display: grid;
      gap: 18px;
    }

    .event-tools {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      margin-bottom: 12px;
    }

    .event-list {
      display: grid;
      gap: 8px;
    }

    .event-item {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 9px;
      align-items: center;
      padding: 9px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .event-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--done);
    }

    .event-item.done span {
      color: var(--muted);
      text-decoration: line-through;
    }

    .event-remove {
      min-height: 30px;
      padding: 0 9px;
      background: #675d51;
    }

    .empty {
      padding: 12px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      color: var(--muted);
      text-align: center;
      font-size: 14px;
    }

    .danger-zone {
      display: grid;
      gap: 12px;
    }

    .archive-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .second-screen-card {
      display: grid;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f8faf7;
    }

    .second-screen-toggle {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--ink);
      font-weight: 900;
      cursor: pointer;
    }

    .second-screen-toggle input {
      width: 19px;
      height: 19px;
      padding: 0;
      accent-color: var(--done);
    }

    .second-screen-subtoggle {
      padding-top: 9px;
      border-top: 1px solid var(--line);
      font-size: 13px;
      font-weight: 850;
    }

    .second-screen-address {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 7px;
    }

    .second-screen-address input {
      min-width: 0;
      font-size: 12px;
    }

    .second-screen-scale {
      display: grid;
      grid-template-columns: auto minmax(120px, 1fr) 54px;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
    }

    .second-screen-scale input {
      min-height: 24px;
      padding: 0;
      accent-color: var(--accent);
    }

    .second-screen-scale output {
      color: var(--accent-strong);
      font-weight: 950;
      text-align: right;
    }

    .second-screen-scale.with-rotation {
      grid-template-columns: auto minmax(120px, 1fr) 54px 38px 38px;
    }

    .second-screen-scale .second-screen-icon-button {
      width: 38px;
      min-height: 34px;
      padding: 0;
      font-size: 20px;
      line-height: 1;
    }

    .second-screen-hint {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .map-step-tools {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 4px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
    }

    .map-step-group {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
    }

    .map-step-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 950;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .map-step-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .map-step-buttons button {
      min-height: 32px;
      padding: 0 11px;
      font-size: 12px;
    }

    .argo-direction-pad {
      display: flex;
      align-items: center;
      flex-wrap: nowrap;
      gap: 4px;
      width: max-content;
    }

    .map-command-status {
      min-height: 18px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
    }

    .map-command-status.error { color: var(--danger); }

    .danger {
      background: var(--danger);
    }

    .danger:hover {
      background: #76241f;
    }

    @media (max-width: 1040px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .day-card {
        min-width: min(420px, 100%);
      }

      .date-track-list {
        max-height: 280px;
      }

      .flow-step {
        grid-template-columns: auto minmax(0, 1fr);
      }

      .flow-head-tools {
        width: 100%;
        min-width: 0;
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 780px) {
      .topbar {
        grid-template-columns: 1fr;
      }

      .day-card {
        width: 100%;
        min-width: 0;
        justify-self: stretch;
      }

      .simple-constant-row {
        grid-template-columns: 1fr;
      }

      .simple-constant-row .special-event-constants.span-two {
        grid-column: auto;
      }
    }

    .card-track-counter input {
      height: 34px;
      padding: 6px 8px;
      text-align: center;
      font-weight: 900;
    }

    @media (max-width: 620px) {
      .app-credit {
        text-align: center;
      }

      .dashboard-writer-notice {
        align-items: stretch;
        flex-direction: column;
      }

      .dashboard-writer-notice button {
        width: 100%;
      }

      .title-row {
        flex-direction: column;
        align-items: stretch;
      }

      .panel-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .progress {
        width: 100%;
      }

      .progress-track {
        width: 100%;
      }

      .day-card {
        grid-template-columns: 1fr;
      }

      .day-card label,
      .record-links,
      .day-actions {
        grid-column: 1;
      }

      .record-card-link {
        min-height: 38px;
      }

      .day-actions {
        grid-template-columns: 1fr 1fr;
      }

      .second-screen-address {
        grid-template-columns: 1fr;
      }

      .date-track-list {
        grid-template-columns: minmax(0, 1fr);
      }

      .date-track-item {
        grid-template-columns: 42px minmax(74px, auto) minmax(0, 1fr);
      }

      .card-track-body {
        grid-template-columns: minmax(0, 1fr);
      }

      .card-track-dialog[data-group="story"] .card-track-body,
      .card-track-dialog[data-group="doom"] .card-track-body {
        grid-template-columns: minmax(0, 1fr);
      }

      .card-track-dialog {
        width: calc(100vw - 14px);
        max-height: calc(100vh - 14px);
      }

      .card-track-shell {
        max-height: calc(100vh - 14px);
      }

      .card-track-face,
      .card-track-empty {
        width: min(100%, 520px);
      }
    }
  </style>
</head>
<body>
  <section id="authGate" class="auth-gate" hidden>
    <div class="auth-panel">
      <div>

    function isPlainObject(value) {
      return value && typeof value === "object" && !Array.isArray(value);

    function cloneJson(value) {
      return value === undefined ? undefined : JSON.parse(JSON.stringify(value));

    function jsonEqual(left, right) {
      if (left === right) return true;
      if (Array.isArray(left) || Array.isArray(right)) {
        return Array.isArray(left)
          && Array.isArray(right)
          && left.length === right.length
          && left.every((value, index) => jsonEqual(value, right[index]));
      }
      if (isPlainObject(left) || isPlainObject(right)) {
        if (!isPlainObject(left) || !isPlainObject(right)) return false;
        const leftKeys = Object.keys(left);
        const rightKeys = Object.keys(right);
        return leftKeys.length === rightKeys.length
          && leftKeys.every((key) => Object.prototype.hasOwnProperty.call(right, key) && jsonEqual(left[key], right[key]));
      }
      return false;
    }

        if (lease.userId !== dashboardLeaseUserId()) return null;
        return lease;
      } catch {
        return null;

    function acquireDashboardWriteLease(force = false) {
      if (!sessionUser) return false;
      const current = readDashboardWriterLease();
      if (!force && current && current.pageId !== dashboardPageId) {
        setDashboardWriteLeaseState(false);
        return false;
      }

      const lease = {
        pageId: dashboardPageId,
        userId: dashboardLeaseUserId(),
        expiresAt: Date.now() + dashboardWriterLeaseTtl,
      };
      try {
        localStorage.setItem(dashboardWriterLeaseKey, JSON.stringify(lease));
      } catch {
        setDashboardWriteLeaseState(false);
        if (elements.dashboardWriterMessage) {
          elements.dashboardWriterMessage.textContent = "无法建立主控制台写入锁。本页只读，请检查浏览器存储权限。";

        return false;

      const acquired = readDashboardWriterLease()?.pageId === dashboardPageId;
      setDashboardWriteLeaseState(acquired);
      if (acquired) dashboardWriterChannel?.postMessage({ type: "lease-updated", pageId: dashboardPageId });
      return acquired;

    function mergeDashboardChanges(base, local, remote, path = "") {
      if (jsonEqual(local, remote)) return { value: cloneJson(local), conflicts: [] };
      if (jsonEqual(local, base)) return { value: cloneJson(remote), conflicts: [] };
      if (jsonEqual(remote, base)) return { value: cloneJson(local), conflicts: [] };

      if (isPlainObject(base) || isPlainObject(local) || isPlainObject(remote)) {
        const baseObject = isPlainObject(base) ? base : {};
        const localObject = isPlainObject(local) ? local : {};
        const remoteObject = isPlainObject(remote) ? remote : {};
        const value = {};
        const conflicts = [];
        const keys = new Set([
          ...Object.keys(baseObject),
          ...Object.keys(localObject),
          ...Object.keys(remoteObject),
        ]);

        keys.forEach((key) => {
          const childPath = path ? `${path}.${key}` : key;
          const result = mergeDashboardChanges(baseObject[key], localObject[key], remoteObject[key], childPath);
          if (result.value !== undefined) value[key] = result.value;
          conflicts.push(...result.conflicts);
        });
        return { value, conflicts };
      }

      return {
        value: cloneJson(local),
        conflicts: [path || "dashboard"],
      };
    }

    async function readLatestDashboardSection() {
      const response = await fetch(campaignStorageUrl, { cache: "no-store" });
      if (!response.ok) {
        const error = new Error(`HTTP ${response.status}`);
        error.status = response.status;
        throw error;
      }
      const payload = await response.json();
      if (!payload.ok) throw new Error(payload.error || "读取失败");
      return {
        archive: normalizeArchive(payload.state || defaultArchive),
        revision: Math.max(0, Number(payload.revision || 0)),
        exists: Boolean(payload.exists),
      };
    }

    function scheduleCampaignReconnect(sessionEpoch = campaignSessionEpoch) {
      if (campaignReconnectTimer || campaignReconnectInFlight || campaignStorageAvailable || !sessionUser) return;
      const wait = campaignReconnectDelay;
      campaignReconnectDelay = Math.min(30000, campaignReconnectDelay * 2);
      campaignReconnectTimer = setTimeout(() => {
        campaignReconnectTimer = null;
        void probeCampaignReconnect(sessionEpoch);
      }, wait);
    }

    async function probeCampaignReconnect(sessionEpoch = campaignSessionEpoch) {
      if (campaignStorageAvailable || campaignReconnectInFlight || sessionEpoch !== campaignSessionEpoch) return;
      campaignReconnectInFlight = true;
      try {
        const latest = await readLatestDashboardSection();
        if (sessionEpoch !== campaignSessionEpoch) return;
        const hadQueuedSave = campaignSaveQueuedBeforeReady;
        const localArchive = cloneJson(archive);
        const localBaseline = cloneJson(campaignSectionBaseline || defaultArchive);
        campaignStorageAvailable = true;
        campaignSectionRevision = latest.revision;
        campaignSectionExists = latest.exists;
        campaignSectionBaseline = cloneJson(latest.archive);
        campaignSaveQueuedBeforeReady = false;
        campaignReconnectDelay = 2000;

        if (hadQueuedSave) {
          const merged = mergeDashboardChanges(localBaseline, localArchive, latest.archive);
          renderDashboardArchive(merged.value);
          setCampaignSaveStatus("已重连，正在同步", "saving");
          queueCampaignSave();
        } else {
          renderDashboardArchive(latest.archive);
          campaignSectionBaseline = cloneJson(archive);
          if (latest.exists) setCampaignSaveStatus("已重新连接", "saved");
          else queueCampaignSave();
        }
      } catch (error) {
        if (sessionEpoch !== campaignSessionEpoch) return;
        if (error?.status === 401) {
          showAuth("登录已过期，请重新登录。");
          return;
        }
        console.warn(error);
        setCampaignSaveStatus("存档离线，等待重连", "offline");
      } finally {
        campaignReconnectInFlight = false;
        if (sessionEpoch === campaignSessionEpoch && !campaignStorageAvailable) {
          scheduleCampaignReconnect(sessionEpoch);
        }
      }
    }

    function reconnectCampaignNow() {
      if (campaignStorageAvailable || campaignReconnectInFlight || !sessionUser) return;

      campaignReconnectDelay = 2000;

    }

    async function syncDashboardFromExternalUpdate() {
      if (!campaignStorageAvailable || campaignExternalSyncInFlight || campaignConflictReloading || campaignSaveInFlight) return;
      campaignExternalSyncInFlight = true;
      try {
        const latest = await readLatestDashboardSection();
        if (!ownsDashboardWriteLease()) {
          campaignSectionRevision = latest.revision;
          campaignSectionExists = latest.exists;
          campaignSectionBaseline = cloneJson(latest.archive);
          if (!jsonEqual(cloneJson(archive), campaignSectionBaseline)) renderDashboardArchive(latest.archive);
          setCampaignSaveStatus("只读：已同步编辑页的最新存档", "readonly");
          return;
        }
        if (latest.revision <= campaignSectionRevision) return;
        const localChanged = !jsonEqual(cloneJson(archive), campaignSectionBaseline || cloneJson(archive));
        if (!localChanged) {
          campaignSectionRevision = latest.revision;
          campaignSectionExists = latest.exists;
          campaignSectionBaseline = cloneJson(latest.archive);
          renderDashboardArchive(latest.archive);
          return;
        }

        const merged = mergeDashboardChanges(campaignSectionBaseline || defaultArchive, archive, latest.archive);
        campaignSectionRevision = latest.revision;
        campaignSectionExists = latest.exists;
        campaignSectionBaseline = cloneJson(latest.archive);
        if (merged.conflicts.length) {
          const shown = merged.conflicts.slice(0, 8).join("\n");
          const more = merged.conflicts.length > 8 ? `\n另有 ${merged.conflicts.length - 8} 项` : "";
          if (!window.confirm(`其他页面修改了相同字段：\n${shown}${more}\n\n确定：保留当前页面的值并合并\n取消：加载其他页面的最新修改`)) {
            renderDashboardArchive(latest.archive);
            return;
          }
        }
        renderDashboardArchive(merged.value);
        queueCampaignSave();
      } catch (error) {
        if (error?.status === 401) {
          showAuth("登录已过期，请重新登录。");
        } else {
          if (ownsDashboardWriteLease() && !jsonEqual(cloneJson(archive), campaignSectionBaseline || cloneJson(archive))) {
            campaignSaveQueuedBeforeReady = true;
          }
          campaignStorageAvailable = false;
          setCampaignSaveStatus("存档离线，等待重连", "offline");
          console.warn(error);
          scheduleCampaignReconnect();
        }
      } finally {
        campaignExternalSyncInFlight = false;
      }
    }

    function createDefaultCycles(activeCycleId = "c1", seedState = null) {
      return Object.fromEntries(cycleConfigs.map((cycle) => [
        cycle.id,
        {
          id: cycle.id,
          state: normalizeState(cycle.id === activeCycleId && seedState ? seedState : defaultState, cycle.id),
        },
      ]));
    }

    function loadArchive() {
      return normalizeArchive(defaultArchive);
    }

    function normalizeArchive(value) {
      const profiles = {};
      Object.values(isPlainObject(value?.profiles) ? value.profiles : {}).forEach((profile) => {
        if (!profile || !profile.id) return;
        profiles[profile.id] = normalizeProfile(profile);
      });

      if (!Object.keys(profiles).length) {
        profiles.default = {
          id: "default",
          name: "默认用户",
          activeCycleId: "c1",
          cycles: createDefaultCycles("c1"),
        };
      }

      const activeProfileId = profiles[value?.activeProfileId] ? value.activeProfileId : Object.keys(profiles)[0];
      return { activeProfileId, profiles };
    }

    function normalizeProfile(profile) {
      const activeCycleId = cycleConfigs.some((cycle) => cycle.id === profile.activeCycleId)
        ? profile.activeCycleId
        : "c1";
      const sourceCycles = isPlainObject(profile.cycles) ? profile.cycles : null;
      const cycles = {};

      cycleConfigs.forEach((cycle) => {
        cycles[cycle.id] = {
          id: cycle.id,
          state: normalizeState(sourceCycles?.[cycle.id]?.state || (cycle.id === activeCycleId ? profile.state : null) || defaultState, cycle.id),
        };
      });

      return {
        id: profile.id,
        name: profile.name || "未命名用户",
        activeCycleId,
        cycles,
      };
    }

      const urls = Array.isArray(payload.urls) ? payload.urls : [];
      const currentShortUrl = new URL("./ss/", window.location.href).href;
      const currentHostIsLoopback = /^(?:127(?:\.\d+){3}|localhost|\[?::1\]?)$/i.test(window.location.hostname);
      const preferred = currentHostIsLoopback
        ? (urls.find((url) => !/\/\/(?:127(?:\.\d+){3}|localhost|\[?::1\]?)(?::|\/)/i.test(url)) || currentShortUrl)
        : currentShortUrl;
      elements.secondScreenToggle.checked = enabled;
      if (secondScreenEnabled !== enabled) {
        secondScreenEnabled = enabled;
        renderFlow();
      }
      elements.secondScreenAddress.hidden = !enabled;
      const displayScale = Math.max(60, Math.min(200, Number(payload.displayScales?.map || payload.displayScale || 100)));
      elements.secondScreenScaleRow.hidden = !enabled;
      elements.secondScreenScale.value = String(displayScale);
      elements.secondScreenScaleValue.textContent = `${displayScale}%`;
      const battleBoardVisible = payload.battleBoardVisible !== false;
      elements.secondScreenBattleBoardToggleRow.hidden = !enabled;
      elements.secondScreenBattleBoardToggle.checked = battleBoardVisible;
      const battleScale = Math.max(60, Math.min(200, Number(payload.displayScales?.battleBoard || 100)));
      elements.secondScreenBattleScaleRow.hidden = !enabled || !battleBoardVisible;
      elements.secondScreenBattleScale.value = String(battleScale);
      elements.secondScreenBattleScaleValue.textContent = `${battleScale}%`;
      const battleRotation = [0, 90, 180, 270].includes(Number(payload.battleRotation)) ? Number(payload.battleRotation) : 0;
      elements.secondScreenRotateButton.dataset.rotation = String(battleRotation);
      elements.secondScreenRotateButton.title = `当前 ${battleRotation}°，点击逆时针旋转 90°`;
      elements.secondScreenRotateButton.setAttribute("aria-label", `逆时针旋转第二屏幕左侧区域，当前 ${battleRotation} 度`);
      const battleSwapped = Boolean(payload.battleSwapped);
      elements.secondScreenSwapButton.dataset.swapped = String(battleSwapped);
      elements.secondScreenSwapButton.title = battleSwapped ? "当前已交换，点击恢复左右位置" : "交换 Boss/AIBP 与决战版图的位置";
      elements.secondScreenSwapButton.setAttribute("aria-label", battleSwapped ? "恢复第二屏幕左右区域位置" : "交换第二屏幕左右区域位置");
      elements.secondScreenUrl.value = preferred;
      elements.openSecondScreenLink.href = preferred || "./ss/";
      elements.secondScreenHint.textContent = enabled
        ? battleBoardVisible
          ? "第二屏幕已开启。AIBP 开启新战役时显示决战版图，战利品写入记录表后恢复地图。"
          : "第二屏幕已开启。战斗期间显示 AIBP 镜像和当前地形卡，决战版图状态仍会保留。"
        : "打开后，同一局域网设备可通过专用网址查看地图或决战版图。";
    }
