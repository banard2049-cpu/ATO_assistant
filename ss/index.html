<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ATO 第二屏幕</title>
  <link rel="stylesheet" href="./styles.css?v=20260818-los10">
</head>
<body>
  <main class="screen-shell">
    <section id="unavailableView" class="pair-view" hidden>
      <div class="pair-card">
        <span class="eyebrow">ATO SECOND SCREEN</span>
        <h1>第二屏幕未开启</h1>
        <p>请先在主控制台开启第二屏幕，本页会自动连接。</p>
        <div id="unavailableMessage" class="pair-message" aria-live="polite"></div>
      </div>
    </section>
    <section class="map-stage" aria-label="辅助地图">
      <iframe id="mapFrame" class="map-frame" title="ATO 辅助地图"></iframe>
    </section>
    <section id="battleView" class="battle-view" aria-label="决战版图" hidden>
      <aside class="battle-sidebar">
        <div class="battle-sidebar-content">
          <div class="boss-summary">
            <figure class="boss-panel card-slot tall"><img id="bossPanel" alt="Boss 大卡"><div id="bossTokens" class="boss-token-layer"></div></figure>
          </div>
          <div class="support-cards" aria-label="Boss 惯常、标志与当前 Trait">
            <figure class="card-slot boss-small-card"><img id="bossRoutine" alt="Boss 惯常"></figure>
            <figure class="card-slot boss-small-card"><img id="bossSignature" alt="Boss 标志"></figure>
            <div id="traitCards" class="trait-cards"></div>
          </div>
          <div class="resolution-panel">
            <section class="aibp-slot" aria-label="AIBP 状态">
              <div class="battle-facts">
                <div><b>AI 卡背</b><span id="aiBacks">—</span></div>
                <div><b>BP 卡背</b><span id="bpBacks">—</span></div>
                <div><b>弃牌</b><span id="discardCounts">—</span></div>
                <div><b>当前损伤</b><span id="damageSummary">0</span></div>
              </div>
              <div id="damageCards" class="damage-cards" aria-label="当前损伤牌" hidden></div>
            </section>
            <div class="pending-cards single-pending" aria-label="正在结算">
              <article class="pending-card"><span id="currentPendingLabel">正在结算</span><div id="currentPending" class="current-card empty-card">未抽取</div></article>
            </div>
          </div>
          <section id="battleTerrainCards" class="battle-terrain-cards" aria-label="当前地形卡" hidden>
            <header class="battle-terrain-cards-head">
              <h2>当前地形卡</h2>
              <span id="battleTerrainCardCount"></span>
            </header>
            <div id="battleTerrainCardList" class="battle-terrain-card-list"></div>
          </section>
        </div>
      </aside>
      <div class="battle-board-stage">
        <div id="battleBoardFrame" class="battle-board-frame">
          <img class="battle-board-image" src="./battle-board.jpg" alt="决战版图">
          <div id="battleGrid" class="battle-board-grid" aria-hidden="true"></div>
          <div id="battleTerrainLayer" class="battle-terrain-layer" aria-hidden="true"></div>
          <div id="battleLosLayer" class="battle-map-los-layer" aria-hidden="true" hidden></div>
          <div id="battleStartLayer" class="battle-start-layer" aria-hidden="true"></div>
          <div id="battleCoordinateLayer" class="battle-coordinate-layer" aria-hidden="true"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="./terrain-data.js?v=20260819-burden-hardest-cache2"></script>
  <script src="../aibp/battle_los.js?v=20260819-hekaton4-labyrinthauros-start1"></script>
  <script src="./app.js?v=20260819-hekaton4-labyrinthauros-start1"></script>
</body>
</html>
