<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATO 科技树</title>
<style>
:root {
  color-scheme: light;
  --ink: #1d2328;
  --muted: #66727d;
  --line: #d6dde3;
  --surface: #f7f8f5;
  --panel: #ffffff;
  --accent: #b44b34;
  --accent-2: #1d6f78;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--surface);
  color: var(--ink);
}
.app {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  min-height: 100vh;
}
.main {
  min-width: 0;
  display: flex;
  flex-direction: column;
}
.topbar {
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 0 16px;
  border-bottom: 1px solid var(--line);
  background: #fff;
  position: sticky;
  top: 0;
  z-index: 5;
}
.tabs { display: flex; gap: 8px; align-items: center; }
.tab {
  border: 1px solid var(--line);
  background: #fff;
  color: var(--ink);
  border-radius: 6px;
  padding: 8px 12px;
  font-weight: 650;
  cursor: pointer;
}
.tab.active {
  border-color: var(--accent-2);
  color: #fff;
  background: var(--accent-2);
}
.tools { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; }
.campaign-save-status {
  min-width: 72px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 800;
  text-align: right;
  white-space: nowrap;
}
.campaign-save-status[data-state="saving"] { color: var(--accent-2); }
.campaign-save-status[data-state="offline"] { color: var(--accent); }
.campaign-save-status[data-state="saved"] { color: #16794a; }
.tool-btn {
  border: 1px solid var(--line);
  background: #fff;
  color: var(--ink);
  border-radius: 6px;
  padding: 8px 10px;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
}
.tool-btn:hover { border-color: var(--accent-2); color: var(--accent-2); }
.tool-btn.active {
  border-color: var(--accent-2);
  background: var(--accent-2);
  color: #fff;
}
.tool-btn.return-main {
  border-color: var(--accent-2);
  background: var(--accent-2);
  color: #fff;
}
.tool-btn.return-main:hover {
  background: #15575f;
  color: #fff;
}
.tool-check {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 7px 10px;
  background: #fff;
  color: var(--ink);
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
  cursor: pointer;
}
.tool-check:hover { border-color: var(--accent-2); color: var(--accent-2); }
.tool-check input {
  margin: 0;
  cursor: pointer;
  accent-color: var(--accent-2);
}
.search {
  width: 220px;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px 10px;
  font: inherit;
  background: #fff;
}
.cycle-select,
.account-select {
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px 10px;
  font: inherit;
  background: #fff;
  color: var(--ink);
}
.account-select { max-width: 150px; }
.viewport {
  min-height: 0;
  overflow: auto;
  padding: 18px;
}
.tree-wrap {
  position: relative;
  width: min(1400px, 100%);
  margin: 0 auto;
  background: #fff;
  border: 1px solid var(--line);
  box-shadow: 0 10px 30px rgba(27, 36, 44, .08);
  container-type: inline-size;
}
/* 「不显示底图」：藏掉印刷图，节点名与条件文字改由页面文字绘制。 */
.tree-wrap.no-image .tree-img { display: none; }
.tree-wrap.no-image .node { background: #fff; }
.tree-wrap.no-image .cond-box {
  background-color: #fff;
  box-shadow: inset 0 0 0 1px #6b7480;
}
.tree-wrap.no-image .cond-box:hover {
  background-color: rgba(216, 163, 25, .22);
  box-shadow: inset 0 0 0 1px var(--accent-2);
}
.cond-text {
  position: absolute;
  display: none;
  align-items: center;
  padding-left: 2px;
  color: var(--ink);
  font-size: 10px;                 /* 老浏览器回退值 */
  font-size: 0.72cqw;
  font-weight: 700;
  line-height: 1.04;
  overflow: hidden;
  pointer-events: none;
  white-space: normal;
  word-break: break-word;
}
.tree-wrap.no-image .cond-text { display: flex; }
.tree-wrap.zh-conditions .cond-text { display: flex; }
.tree-wrap.zh-conditions .cond-mask { display: block; }
.tree-wrap.no-image .cond-text.prereq-locked { visibility: hidden; }
.tree-wrap.zh-conditions .cond-text.prereq-locked { visibility: hidden; }
.tree-wrap.zh-conditions .cond-box {
  z-index: 2;
  border: 1px solid #1d2328;
  background-color: #fff;
  box-sizing: border-box;
}
.tree-wrap.zh-conditions .cond-text { z-index: 1; }
.tree-wrap.zh-conditions .cond-box:hover { background-color: rgba(216, 163, 25, .22); }
.tree-wrap.no-image .cond-text.is-placeholder { color: var(--muted); font-weight: 600; font-style: italic; }
.tree-img {
  display: block;
  width: 100%;
  height: auto;
  user-select: none;
}
.node {
  position: absolute;
  border: 2px solid transparent;
  background: transparent;
  border-radius: 0;
  cursor: pointer;
  min-width: 14px;
  min-height: 14px;
  transition: border-color .12s ease, background .12s ease, box-shadow .12s ease, opacity .12s ease;
}
.node-label {
  display: none;
  pointer-events: none;
}
.tree-wrap.zh-labels .node {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2px 5px;
  background: #fff;
  color: var(--ink);
  overflow: hidden;
  text-align: center;
  box-shadow: inset 0 0 0 1px #111;
}
.tree-wrap.zh-labels .node-label {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  width: 100%;
  overflow: hidden;
  font-family: "Noto Serif SC", "Songti SC", "Microsoft YaHei", serif;
  font-size: 12px;
  font-weight: 850;
  line-height: 1.08;
  letter-spacing: .02em;
  text-shadow: 0 1px 0 rgba(255, 255, 255, .62);
}
.tree-wrap.zh-labels .node.unlocked {
  background: #fff;
  box-shadow: inset 0 0 0 1px #111, 0 0 0 1px rgba(30, 138, 85, .18);
}
.tree-wrap.zh-labels .node.unlockable {
  background: #fff;
  box-shadow: inset 0 0 0 1px #111, 0 0 0 1px rgba(216, 163, 25, .2);
}
.node::after {
  display: none;
}
.node:hover {
  background: rgba(29, 35, 40, .04);
}
.node.unlocked {
  border-color: #1e8a55;
  background: rgba(30, 138, 85, .08);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .72), 0 0 0 1px rgba(30, 138, 85, .18);
}
.node.unlockable {
  border-color: #d8a319;
  background: rgba(216, 163, 25, .08);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .72), 0 0 0 1px rgba(216, 163, 25, .2);
}
.node.unlocked:hover,
.node.unlocked.active {
  background: rgba(30, 138, 85, .14);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .8), 0 0 0 3px rgba(30, 138, 85, .2);
}
.node.unlockable:hover,
.node.unlockable.active {
  background: rgba(216, 163, 25, .16);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .8), 0 0 0 3px rgba(216, 163, 25, .24);
}
.node.active:not(.unlocked):not(.unlockable) {
  background: rgba(29, 35, 40, .05);
}
.tree-wrap.zh-labels .node:hover,
.tree-wrap.zh-labels .node.active:not(.unlocked):not(.unlockable) {
  background: #fff;
}
.tree-wrap.zh-labels .node.unlocked:hover,
.tree-wrap.zh-labels .node.unlocked.active {
  background: #fff;
  box-shadow: inset 0 0 0 1px #111, 0 0 0 3px rgba(30, 138, 85, .2);
}
.tree-wrap.zh-labels .node.unlockable:hover,
.tree-wrap.zh-labels .node.unlockable.active {
  background: #fff;
  box-shadow: inset 0 0 0 1px #111, 0 0 0 3px rgba(216, 163, 25, .24);
}
/* 「不显示未知科技」：未知（名字会被遮的）节点用白底盖住底图上的名字，连框线都不画——位置只留空白。 */
.tree-wrap.hide-unknown .node.unknown,
.tree-wrap.hide-unknown .node.unknown:hover,
.tree-wrap.hide-unknown .node.unknown.active {
  background: #fff;
  border-color: transparent;
  box-shadow: none;
}
.tree-wrap.hide-unknown .node.unknown .node-label { display: none; }
/* 被遮挡的节点没有名字可看，搜索时不必再淡出（保留 filtered 的不可点击）。 */
.tree-wrap.hide-unknown .node.unknown.filtered { opacity: 1; }
/* 前置科技没解锁时，用白块盖住节点框下方那条条件文字（复选框本身留在上面可点）。 */
.cond-mask {
  position: absolute;
  display: none;
  background: #fff;
  pointer-events: none;
}
.cond-mask.prereq-locked { display: block; }
/* 完全遮挡的节点：下方条件方格也隐藏（名字那一格由上面的 .unknown 规则留白）。 */
.cond-box.prereq-locked { display: none; }
/* 印在节点框下方的解锁条件复选框：点击切换，勾选后在格子里画对勾。 */
.cond-box {
  position: absolute;
  appearance: none;
  -webkit-appearance: none;
  margin: 0;
  padding: 0;
  border: 0;
  background: transparent center / contain no-repeat;
  cursor: pointer;
}
.cond-box:hover {
  background-color: rgba(216, 163, 25, .22);
  box-shadow: inset 0 0 0 1px var(--accent-2);
}
.cond-box:checked {
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M16 52 L40 76 L86 24' fill='none' stroke='%231d2328' stroke-width='15' stroke-linecap='round' stroke-linejoin='round'/></svg>");
}
.cond-box:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 1px; }
.node.filtered { opacity: .16; pointer-events: none; }
.badge {
  display: inline-flex;
  align-items: center;
  min-height: 22px;
  padding: 2px 7px;
  border-radius: 999px;
  background: #eef3f4;
  color: #31575d;
  font-size: 12px;
  font-weight: 700;
}
.unlocked-page {
  width: min(1440px, 100%);
  margin: 0 auto;
  --unlocked-card-short-edge: 156px;
}
.unlocked-columns {
  display: grid;
  gap: 14px;
  align-items: start;
}
.unlocked-column {
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  padding: 10px;
}
.unlocked-column > summary {
  cursor: pointer;
  user-select: none;
  font-size: 13px;
  font-weight: 850;
  color: var(--ink);
  padding: 2px 2px 8px;
}
.unlocked-column[open] > summary { margin-bottom: 2px; }
.unlocked-list.big {
  grid-template-columns: repeat(auto-fill, minmax(260px, max-content));
  gap: 14px;
}
.unlocked-list.mixed {
  grid-template-columns: repeat(auto-fill, 174px);
}
.unlocked-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, 174px);
  gap: 14px 10px;
  align-items: start;
  justify-content: start;
}
.unlocked-list.big .unlocked-item {
  width: 100%;
}
.unlocked-item {
  border: 0;
  background: transparent;
  color: var(--ink);
  border-radius: 6px;
  padding: 0;
  font: inherit;
  font-size: 12px;
  font-weight: 750;
  text-align: center;
  cursor: pointer;
  min-width: 0;
}
.unlocked-item:hover {
  color: #1e6647;
}
.unlocked-item.important .unlocked-thumb,
.unlocked-item.important .unlocked-thumb-rotated,
.unlocked-item.important .unlocked-thumb-img {
  outline: 3px solid #268058;
  outline-offset: 3px;
}
.unlocked-empty {
  grid-column: 1 / -1;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.45;
  padding: 12px 0;
}
.unlocked-thumb {
  margin: 0 auto;
  background-repeat: no-repeat;
  background-color: #e9ecef;
  border-radius: 4px;
  box-shadow: 0 2px 7px rgba(0,0,0,.16);
}
.unlocked-thumb-rotated {
  margin: 0 auto;
  overflow: hidden;
  border-radius: 4px;
  box-shadow: 0 2px 7px rgba(0,0,0,.16);
}
.unlocked-thumb-rotated .unlocked-thumb {
  margin: 0;
  box-shadow: none;
}
.unlocked-thumb-img {
  display: block;
  width: var(--unlocked-card-short-edge);
  max-width: 100%;
  height: auto;
  border-radius: 4px;
  box-shadow: 0 2px 7px rgba(0,0,0,.16);
  margin: 0 auto;
}
.unlocked-thumb-img.big {
  width: auto;
  height: var(--unlocked-card-short-edge);
  max-width: 100%;
}
.unlocked-thumb-img.small.landscape {
  width: auto;
  height: var(--unlocked-card-short-edge);
}
.unlocked-thumb-img.small.portrait {
  width: var(--unlocked-card-short-edge);
}
.unlocked-thumb-missing {
  width: var(--unlocked-card-short-edge);
  aspect-ratio: 3 / 4;
  display: grid;
  place-items: center;
  margin: 0 auto;
  padding: 8px;
  border: 1px dashed #9aa3a7;
  border-radius: 4px;
  background: #f4f5f5;
  color: var(--muted);
  font-size: 11px;
  font-weight: 800;
  text-align: center;
}
.unlocked-name {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.unlocked-cycle {
  display: block;
  color: var(--muted);
  font-size: 11px;
  margin-top: 2px;
}
.category-pill {
  display: inline-flex;
  align-items: center;
  border-radius: 999px;
  padding: 4px 8px;
  background: #eef3f4;
  color: #31575d;
  font-size: 12px;
  font-weight: 800;
}
.category-pill.battle {
  background: #f6e8e3;
  color: #8f3e2b;
}
.empty {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.55;
  padding: 16px 2px;
}
.card-block + .card-block { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); }
.card-name { font-size: 20px; line-height: 1.15; font-weight: 850; margin: 0 0 10px; }
.card-previews {
  display: grid;
  gap: 12px;
  align-items: start;
}
.card-previews.side-by-side {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
.card-previews.stacked {
  grid-template-columns: 1fr;
}
.meta { display: grid; grid-template-columns: 96px 1fr; gap: 5px 8px; font-size: 13px; color: var(--muted); margin-bottom: 12px; }
.meta b { color: var(--ink); font-weight: 700; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
.tag { border-radius: 999px; background: #f2eee5; color: #74531c; padding: 3px 7px; font-size: 12px; font-weight: 700; }
.preview-frame {
  width: 100%;
  background: #f1f3f4;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px;
  overflow: hidden;
  margin-top: 10px;
}
.preview-frame.landscape {
  padding: 12px;
}
.preview-label {
  color: var(--muted);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .04em;
  margin: 0 0 8px;
}
.card-preview {
  margin: 0 auto;
  background-repeat: no-repeat;
  box-shadow: 0 5px 15px rgba(0,0,0,.18);
  border-radius: 4px;
}
.card-preview-rotated {
  margin: 0 auto;
  overflow: hidden;
  border-radius: 4px;
  box-shadow: 0 5px 15px rgba(0,0,0,.18);
}
.card-preview-rotated .card-preview {
  margin: 0;
  box-shadow: none;
}
.card-preview-img {
  display: block;
  width: min(100%, 300px);
  height: auto;
  margin: 0 auto;
  box-shadow: 0 5px 15px rgba(0,0,0,.18);
  border-radius: 4px;
}
.card-image-missing {
  min-height: 220px;
  display: grid;
  place-items: center;
  padding: 24px;
  border: 1px dashed #9aa3a7;
  border-radius: 6px;
  background: #f4f5f5;
  color: var(--muted);
  font-size: 13px;
  font-weight: 750;
  line-height: 1.5;
  text-align: center;
}
.small-note { color: var(--muted); font-size: 12px; line-height: 1.45; margin-top: 10px; }
.modal-backdrop {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 40;
  background: rgba(16, 24, 28, .72);
  padding: 20px;
}
.modal-backdrop.open { display: flex; }
.unlocked-modal {
  width: min(980px, 96vw);
  max-height: 94vh;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 260px;
  gap: 14px;
  background: #fff;
  border-radius: 10px;
  padding: 14px;
  box-shadow: 0 18px 50px rgba(0,0,0,.35);
}
.unlocked-modal-image {
  min-height: 420px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: auto;
  border-radius: 8px;
  background: #f1f3f4;
  padding: 12px;
}
.unlocked-modal-panel {
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.unlocked-modal-title {
  font-size: 20px;
  font-weight: 900;
  line-height: 1.16;
  margin-bottom: 6px;
}
.unlocked-modal-meta {
  color: var(--muted);
  font-size: 12px;
  margin-bottom: 14px;
}
.modal-tech-links {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin-bottom: 14px;
}
.modal-tech-column {
  border: 1px solid var(--line);
  background: #fbfaf7;
  padding: 10px;
  min-width: 0;
}
.modal-tech-column h3 {
  margin: 0 0 8px;
  font-size: 13px;
  font-weight: 900;
  color: var(--ink);
}
.modal-tech-list {
  display: grid;
  gap: 6px;
}
.modal-tech-or-group {
  display: grid;
  gap: 6px;
  margin-top: 8px;
}
.modal-tech-or-label {
  color: var(--muted);
  font-size: 11px;
  font-weight: 800;
}
.modal-tech-item {
  display: block;
  border: 1px solid rgba(32, 38, 41, .12);
  background: #fff;
  color: var(--ink);
  font-size: 12px;
  line-height: 1.25;
  padding: 6px 7px;
  text-align: left;
  width: 100%;
}
button.modal-tech-item {
  cursor: pointer;
  font: inherit;
}
button.modal-tech-item:hover {
  border-color: var(--accent-2);
  box-shadow: 0 2px 8px rgba(49, 87, 93, .14);
}
.modal-tech-item.met {
  border-color: rgba(30, 138, 85, .45);
  background: #eef8f2;
}
.modal-tech-item.missing {
  border-color: rgba(216, 163, 25, .45);
  background: #fff8e5;
}
.modal-tech-empty {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.45;
}
.modal-tech-conditions {
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 11px;
  line-height: 1.4;
  margin-top: 8px;
  padding-top: 8px;
}
.modal-condition-toggle {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 8px;
  font-size: 12px;
  font-weight: 750;
  color: var(--ink);
  cursor: pointer;
}
.modal-condition-toggle input { margin: 0; cursor: pointer; accent-color: var(--accent-2); }
.modal-condition-hint { margin-top: 2px; font-size: 11px; line-height: 1.4; color: var(--muted); }
.modal-actions {
  display: grid;
  gap: 8px;
  margin-top: auto;
}
.modal-btn {
  border: 1px solid var(--line);
  background: #fff;
  color: var(--ink);
  border-radius: 7px;
  padding: 10px 12px;
  font: inherit;
  font-weight: 800;
  cursor: pointer;
}
.modal-btn.primary {
  border-color: #268058;
  background: #268058;
  color: #fff;
}
.modal-btn.warn {
  border-color: #b7791f;
  color: #8a5a14;
}
.modal-btn.hidden {
  display: none;
}
.modal-card-list {
  width: 100%;
  display: grid;
  gap: 14px;
}
.modal-card-img {
  display: block;
  max-width: min(100%, 760px);
  max-height: 76vh;
  height: auto;
  border-radius: 4px;
  box-shadow: 0 8px 24px rgba(0,0,0,.22);
}
.modal-card-crop {
  background-repeat: no-repeat;
  border-radius: 4px;
  box-shadow: 0 8px 24px rgba(0,0,0,.22);
}
.modal-card-rotated {
  overflow: hidden;
  border-radius: 4px;
  box-shadow: 0 8px 24px rgba(0,0,0,.22);
}

let gearProductionData = null;
let gearCardImages = {};
let gearPartLabels = {};

async function loadGearProductionData() {
  try {
    const productionResponse = await fetch(GEAR_PRODUCTION_URL, { cache: 'no-cache' });
    if (!productionResponse.ok) throw new Error('HTTP ' + productionResponse.status);
    gearProductionData = await productionResponse.json();
  } catch (e) {
    console.warn('Failed to load gear production data:', e);
    gearProductionData = null;
  }
  try {
    const imagesResponse = await fetch(GEAR_CARD_IMAGES_URL, { cache: 'no-cache' });
    if (imagesResponse.ok) {
      const payload = await imagesResponse.json();
      gearCardImages = payload?.images || {};
    }
  } catch (e) {
    console.warn('Failed to load gear card images:', e);
    gearCardImages = {};
  }
  try {
    const labelsResponse = await fetch(GEAR_PART_LABELS_URL, { cache: 'no-cache' });
    if (labelsResponse.ok) {
      const payload = await labelsResponse.json();
      gearPartLabels = payload?.labels || {};
    }
  } catch (e) {
    console.warn('Failed to load gear part labels:', e);
    gearPartLabels = {};
  }
}


function gearImageSrc(gearId) {
  if (!gearId) return '';
  if (gearId.startsWith('T:tt_')) {
    const titanKey = gearId.slice(2);
    return `images/titans/${titanKey}.png`;
  }
  return gearCardImages[gearId] || gearCardImages[String(gearId).toUpperCase()] || '';
}

function normalizeGearId(gearId) {
  return String(gearId || '').replace(/^1x/, '');
}

function getGearTechNodeKey(techId) {
  if (!gearProductionData?.techCardNames?.[techId]) return null;
  const fullName = gearProductionData.techCardNames[techId].trim();
  // Extract English name (everything before the first CJK character)
  const enName = fullName.replace(/[一-鿿㐀-䶿豈-﫿].*/g, '').trim();
  return enName.toLowerCase();
}

function getGearName(gearId) {
  gearId = normalizeGearId(gearId);
  if (gearId.startsWith('T:')) {
    const titanKey = gearId.slice(2);
    if (treeLanguage === 'zh') {
      return TITAN_NAMES_ZH[titanKey] || titanKey.replace(/^tt_/, '');
    }
    const en = titanKey.replace(/^tt_/, '').replace(/^p/, '');
    return en.charAt(0).toUpperCase() + en.slice(1);
  }
  if (!gearProductionData?.gearCards?.[gearId]) return gearId;
  const fullName = gearProductionData.gearCards[gearId].trim();
  if (treeLanguage === 'zh') {
    const zh = fullName.replace(/^[^一-鿿㐀-䶿豈-﫿]*/, '').trim();
    return zh || fullName;
  }
  return fullName.replace(/[一-鿿㐀-䶿豈-﫿].*/g, '').trim() || fullName;
}

function getTechDisplayName(techId) {
  if (!gearProductionData?.techCardNames?.[techId]) return techId;
  const fullName = gearProductionData.techCardNames[techId].trim();
  if (treeLanguage === 'zh') {
    const zh = fullName.replace(/^[^一-鿿㐀-䶿豈-﫿]*/, '').trim();
    return zh || fullName;
  }
  return fullName.replace(/[一-鿿㐀-䶿豈-﫿].*/g, '').trim() || fullName;
}

function formatCostPart(costStr) {
  const match = String(costStr).match(/^(\d+)x(.+)$/);
  if (!match) return { amount: '', resource: costStr };
  const amount = match[1];
  const key = match[2];
  let name;
  if (key.startsWith('CORE_')) {

    'discus', 'chakram', 'bident', 'lance', 'flail', 'thrower', 'ramaxe', 'pillarmace',
    'harpoon', 'kusarigama',
  ])) return { key: 'arm', label: '手臂' };

function findGearTechCard(techId) {
  const key = getGearTechNodeKey(techId);
  if (!key) return null;
  const normalized = key.replace(/\s+/g, ' ').toLowerCase();
  return (data.cards || []).find(card => String(card.key || '').trim().toLowerCase() === normalized) || null;
}
function showGearTechCard(techId) {
  const card = findGearTechCard(techId);
  if (!card) {
    alert(`找不到对应的科技卡：${getTechDisplayName(techId)}`);

  modalTechLinks.innerHTML = '';

  modalToggleUnimportant.classList.add('hidden');

}
function gearFilterBarHtml(visibleCount, totalCount) {
  return `<div class="gear-filter-bar">
    <label class="gear-filter-option"><input type="checkbox" data-gear-filter="cycle" ${gearOnlyCurrentCycle ? 'checked' : ''}>只显示本循环装备</label>
    <label class="gear-filter-option"><input type="checkbox" data-gear-filter="craftable" ${gearOnlyCraftable ? 'checked' : ''}>只显示可制造装备</label>
    <label class="gear-filter-option"><input type="checkbox" data-gear-filter="part" ${gearGroupByPart ? 'checked' : ''}>分部位显示</label>
    <span class="gear-search-hint" style="margin:0 0 0 auto">显示 ${visibleCount}/${totalCount} 件</span>
  </div>`;
}
function gearItemHtml(entry, gear) {
  const gearName = getGearName(gear.gearId);
  const isTitan = String(gear.gearId).startsWith('T:tt_');
  const imgSrc = gearImageSrc(gear.gearId);
  let html = `<div class="gear-item" data-gear-id="${esc(gear.gearId)}" data-search-text="${esc(gearName.toLowerCase())}">`;
  if (imgSrc) {
    const fallback = isTitan
      ? `<div class=\\'gear-card-thumb empty\\'><span class=\\'empty-tag\\'>泰坦</span><span>${esc(gearName)}</span></div>`
      : `<div class=\\'gear-card-thumb empty\\'>${esc(gear.gearId)}</div>`;
    html += `<button type="button" class="gear-card-thumb" data-gear-img="${esc(imgSrc)}" data-gear-name="${esc(gearName)}" title="${esc(gearName)}"><img src="${esc(imgSrc)}" alt="${esc(gearName)}" loading="lazy" onerror="this.parentElement.outerHTML='${fallback}'"></button>`;
  } else if (isTitan) {
    html += `<div class="gear-card-thumb empty"><span class="empty-tag">泰坦</span><span>${esc(gearName)}</span></div>`;
  } else {
    html += `<div class="gear-card-thumb empty">${esc(gear.gearId)}</div>`;
  }
  html += `<div class="gear-item-main"><div class="gear-item-name">${esc(gearName)}</div><div class="gear-item-cost">`;
  for (const c of gear.cost) {
    const formatted = formatCost(c);
    if (formatted._or) {
      html += `<span class="gear-cost-chip cost-or">${formatted.alternatives.map(parts => `<span class="cost-or-alt">${parts.map(p => `<span class="cost-or-part"><span class="cost-amount">${esc(p.amount)}×</span><span class="cost-resource">${esc(p.resource)}</span></span>`).join('')}</span>`).join('<span class="cost-or-sep">或</span>')}</span>`;
    } else {
      html += `<span class="gear-cost-chip"><span class="cost-amount">${esc(formatted.amount)}×</span><span class="cost-resource">${esc(formatted.resource)}</span></span>`;
    }
  }
  html += `</div>${renderCraftPanel(entry, gear)}</div></div>`;
  return html;
}

function renderGearProductionPage() {
  currentTab = 'gear-production';
  cycleBadge.textContent = '装备制造';
  gearCraftPlans = new Map();
  requestGearRecordState();

  const productions = getUnlockedProductions();
  const allItems = productions.flatMap(entry => entry.produces.map(gear => ({ entry, gear })));
  const productionCycle = currentProductionCycle();
  const visibleItems = allItems.filter(({ entry, gear }) => {
    if (gearOnlyCurrentCycle && !shouldShowProductionForCycle(entry, productionCycle)) return false;
    if (gearOnlyCraftable && !gearRecordLoadInFlight && !craftPlanForGear(entry, gear).filterCraftable) return false;
    return true;
  });
  if (!productions.length) {
    mainView.innerHTML = `<div class="gear-page"><div class="gear-layout"><div class="gear-content"><div class="gear-empty">还没有解锁任何生产科技。解锁 production 类型的科技卡后，这里将显示可制造的装备。</div></div>${gearResourceSidebarHtml()}</div></div>`;
    applyGearSearch();
    return;
  }

  let html = '<div class="gear-page">';
  html += gearFilterBarHtml(visibleItems.length, allItems.length);
  html += `<div class="gear-search-hint">共 ${productions.length} 项生产科技已解锁。使用搜索框继续过滤。</div>`;
  html += '<div class="gear-layout"><div class="gear-content">';
  const groups = new Map();
  visibleItems.forEach(item => {
    const group = gearGroupByPart
      ? gearPart(item.gear.gearId)
      : { key: item.entry.techId, label: getTechDisplayName(item.entry.techId), techId: item.entry.techId };
    if (!groups.has(group.key)) groups.set(group.key, { ...group, items: [] });
    groups.get(group.key).items.push(item);
  });
  if (!groups.size) html += `<div class="gear-empty">没有符合当前筛选条件的装备。</div>`;
  for (const group of groups.values()) {
    html += `<div class="gear-group" data-search-text="${esc(`${group.label} ${group.items.map(item => getGearName(item.gear.gearId)).join(' ')}`.toLowerCase())}">`;
    const groupName = group.techId
      ? `<button type="button" class="gear-group-name" data-tech-id="${esc(group.techId)}" title="点击查看科技卡">${esc(group.label)}</button>`
      : `<span class="gear-group-name">${esc(group.label)}</span>`;
    html += `<div class="gear-group-header">${groupName}<span class="gear-group-count">${group.items.length} 件装备</span><span class="gear-group-chevron">▼</span></div>`;
    html += `<div class="gear-items">${group.items.map(({ entry, gear }) => gearItemHtml(entry, gear)).join('')}</div>`;
    html += `</div>`;
  }
  html += `</div>${gearResourceSidebarHtml()}</div></div>`;
  mainView.innerHTML = html;

  mainView.querySelectorAll('[data-gear-filter]').forEach(input => {
    input.addEventListener('change', () => {
      if (input.dataset.gearFilter === 'cycle') gearOnlyCurrentCycle = input.checked;
      if (input.dataset.gearFilter === 'craftable') gearOnlyCraftable = input.checked;
      if (input.dataset.gearFilter === 'part') gearGroupByPart = input.checked;
      renderGearProductionPage();
    });
  });

  // Toggle collapse
  mainView.querySelectorAll('.gear-group-header').forEach(header => {
    header.addEventListener('click', event => {
      if (event.target.closest('.gear-group-name[data-tech-id]')) return;
      header.parentElement.classList.toggle('collapsed');
    });
  });

  mainView.querySelectorAll('.gear-group-name[data-tech-id]').forEach(btn => {
    btn.addEventListener('click', event => {
      event.stopPropagation();
      showGearTechCard(btn.dataset.techId);
    });
  });

  // Click thumbnail to enlarge
  mainView.querySelectorAll('.gear-card-thumb[data-gear-img]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      showGearImageModal(btn.dataset.gearImg, btn.dataset.gearName);
    });
  });

  mainView.querySelectorAll('.gear-craft-btn[data-craft-key]').forEach(btn => {
    btn.addEventListener('click', event => {
      event.stopPropagation();
      void craftGear(btn.dataset.craftKey, btn.dataset.craftOption);
    });
  });

  mainView.querySelectorAll('.gear-resource-btn[data-resource-key]').forEach(btn => {
    btn.addEventListener('click', event => {
      event.stopPropagation();
      void adjustGearResource(btn.dataset.resourceKey, Number(btn.dataset.resourceDelta || 0));
    });
  });

  applyGearSearch();
}

function showGearImageModal(src, name) {
  let modal = document.getElementById('gearImageModal');
  if (!modal) {
    modal = document.createElement('div');
    modal.id = 'gearImageModal';
    modal.className = 'modal-backdrop';
    modal.innerHTML = '<div class="gear-image-modal-content"><img id="gearImageModalImg"><div id="gearImageModalCaption"></div></div>';
    document.body.appendChild(modal);
    modal.addEventListener('click', () => {
      modal.classList.remove('open');
      modal.setAttribute('aria-hidden', 'true');
    });
  }
  document.getElementById('gearImageModalImg').src = src;
  document.getElementById('gearImageModalCaption').textContent = name || '';
  modal.classList.add('open');
  modal.setAttribute('aria-hidden', 'false');
}

function applyGearSearch() {
  if (currentTab !== 'gear-production') return;
  const query = search.value.trim().toLowerCase();
  const groups = mainView.querySelectorAll('.gear-group');
  let totalVisible = 0;
  groups.forEach(group => {
    if (!query) {
      group.classList.remove('filtered');
      group.querySelectorAll('.gear-item').forEach(item => item.classList.remove('filtered'));
      totalVisible++;
      return;
    }
    const groupText = group.dataset.searchText || '';
    const items = group.querySelectorAll('.gear-item');
    let hasVisibleItem = false;
    items.forEach(item => {
      const itemText = item.dataset.searchText || '';
      const match = itemText.includes(query) || groupText.includes(query);
      item.classList.toggle('filtered', !match);
      if (match) hasVisibleItem = true;
    });
    group.classList.toggle('filtered', !hasVisibleItem);
    if (hasVisibleItem) totalVisible++;
  });
  const productions = getUnlockedProductions();
  count.textContent = query
    ? `${totalVisible}/${productions.length} 科技匹配`
    : `已解锁 ${productions.length} 项生产科技`;
}

let PAGE_INDEX = new Map();

let DISAMBIGUATED_TECH_NAMES = new Set();

function computeDisambiguatedTechNames(pages) {
    const byName = new Map();
    for (const page of pages) {
      for (const node of page.nodes) {
        const key = String(node.name || '').trim().toLowerCase();
        if (!byName.has(key)) byName.set(key, new Set());
        byName.get(key).add((node.card_indexes || []).join(','));
      }
    }
    return new Set([...byName].filter(([, cardSets]) => cardSets.size > 1).map(([key]) => key));
  }

function dictionaryToAppData(dictionary) {
    const pages = PAGE_METADATA.map(page => ({ ...page, nodes: [] }));
    const pagesByKey = new Map(pages.map(page => [page.key, page]));
    const pageLabelsByKey = new Map(PAGE_METADATA.map(page => [page.key, page.label]));
    const records = (Array.isArray(dictionary.cards) ? dictionary.cards : Object.values(dictionary.cards || {}))
      .filter(Boolean)
      .sort((a, b) => Number(a.index ?? 0) - Number(b.index ?? 0));
    const cards = [];
    const tagDictionary = {};
    const mergedNodes = new Map();
    const namesFor = record => record.names || { en: record.en, zh: record.zh };
    const sheetFor = image => Array.isArray(image.sheet)
      ? { width: image.sheet[0], height: image.sheet[1], col: image.sheet[2], row: image.sheet[3] }
      : (image.sheet || {});
    const cropFor = image => Array.isArray(image.crop)
      ? { x: image.crop[0], y: image.crop[1], w: image.crop[2], h: image.crop[3] }
      : (image.crop || {});
    const boxFor = value => Array.isArray(value)
      ? { x: value[0], y: value[1], w: value[2], h: value[3] }
      : value;
    const positionFor = value => Array.isArray(value)
      ? { x: value[0], y: value[1], w: value[2], h: value[3] }
      : (value || {});
    const refKeys = refs => (refs || []).map(item => typeof item === 'string' ? item : item?.key).filter(Boolean);
    const refKeyGroups = groups => {
      if (!groups) return [];
      const rawGroups = Array.isArray(groups?.[0]) ? groups : [groups];
      return rawGroups.map(refKeys).filter(group => group.length);
    };
    const conditionsFor = conditions => (conditions || []).map(item => typeof item === 'string' ? { caption: item } : {
      order: item.order,
      caption: item.caption || item.text,
    }).filter(item => item.caption || item.order != null);

    for (const record of records) {
      const image = record.image || {};
      const sheet = sheetFor(image);
      const crop = cropFor(image);
      const tabletop = record.tabletop || {};
      const type = record.type || {};
      const names = namesFor(record);
      const cardIndex = Number(record.index);
      cards[cardIndex] = {
        key: record.key || '',
        guid: tabletop.guid,
        name: names.en || '',
        name_zh: names.zh || '',
        tech_category: record.category || type.category || '',
        type: { ...type },
        card_id: tabletop.card_id,
        deck_key: tabletop.deck_key,
        deck_instance_id: tabletop.deck_instance_id,
        tags: record.core ? ['CoreTechnology'] : (type.tags || []),
        raw_tags: type.raw_tags || [],
        cycle_tags: type.cycle_tags || [],
        face_image_file: image.face,
        back_image_file: image.back,
        image_missing: Boolean(image.missing || !image.face || !image.back),
        image_missing_reason: image.missing_reason || '',
        single_card_images: Boolean(image.single_card_images ?? image.single),
        sheet_width: sheet.width,
        sheet_height: sheet.height,
        crop_x_px: crop.x,
        crop_y_px: crop.y,
        crop_width_px: crop.w,
        crop_height_px: crop.h,
        sheet_col_1_based: sheet.col,
        sheet_row_1_based: sheet.row,
      };

      const nodePages = new Set();
      for (const treeNode of record.tree_nodes || record.nodes || []) {
        const page = pagesByKey.get(treeNode.page);
        if (!page) continue;
        nodePages.add(treeNode.page);
        const position = positionFor(treeNode.position || treeNode.pos);
        const nodeId = treeNode.node_id || treeNode.id;
        const nodeKeyValue = treeNode.node_key || treeNode.key || record.key;
        const nodeName = treeNode.name || names.en || '';
        const xlsmType = treeNode.xlsm_type ?? treeNode.xlsm?.type ?? (treeNode.core ? 'Core' : null);
        const requirements = refKeys(treeNode.requirements || treeNode.req);
        const requirementAnyGroups = [
          ...refKeyGroups(treeNode.requirements_any || treeNode.req_any),
          ...refKeyGroups(treeNode.requirement_any_groups || treeNode.req_any_groups),
        ];
        const unlocks = refKeys(treeNode.unlocks);
        const requirementConditions = conditionsFor(treeNode.requirement_conditions || treeNode.req_conditions);
        const unlockConditions = conditionsFor(treeNode.unlock_conditions);
        const mergeKey = treeNode.page + '::' + nodeId;
        let node = mergedNodes.get(mergeKey);
        if (!node) {
          node = {
            id: nodeId,
            name: nodeName,
            name_zh: treeNode.name_zh || treeNode.zh || names.zh || '',
            tech_category: treeNode.category || record.category || type.category || '',
            card_indexes: [],
            x: position.x,
            y: position.y,
            w: position.w,
            h: position.h,
            tree_box: boxFor(treeNode.tree_box || treeNode.box),
            requires: requirements,
            requires_any_groups: requirementAnyGroups,
            xlsm_requirements: requirements,
            xlsm_requirement_any_groups: requirementAnyGroups,
            xlsm_leads_to: unlocks,
          };
          if (xlsmType) {
            node.xlsm = { type: xlsmType };
            node.xlsm_type = xlsmType;
          }
          if (requirementConditions.length) {
            node.xlsm_special_requirements = { tech: node.xlsm_requirements, conditions: requirementConditions };
          }
          if (unlockConditions.length) {
            node.xlsm_special_leads_to = { tech: node.xlsm_leads_to, conditions: unlockConditions };
          }
          mergedNodes.set(mergeKey, node);
          page.nodes.push(node);
        }
        if (!node.card_indexes.includes(cardIndex)) node.card_indexes.push(cardIndex);

        const pageLabel = pageLabelsByKey.get(treeNode.page);
        const tagRecord = tagDictionary[nodeKeyValue] || {
          category: record.category || type.category || '',
          cycles: [],
          tag: {},
        };
        if (type.battle_card_type != null) tagRecord.tag.battle_card_type = type.battle_card_type;
        if (type.loop_limited != null) tagRecord.tag.loop_limited = type.loop_limited;
        if (type.negotiation != null) tagRecord.tag.negotiation = Boolean(type.negotiation);
        if (pageLabel && !tagRecord.cycles.includes(pageLabel)) tagRecord.cycles.push(pageLabel);
        tagDictionary[nodeKeyValue] = tagRecord;
      }

      if (record.key && !tagDictionary[record.key]) {
        tagDictionary[record.key] = {
          category: record.category || type.category || '',
          cycles: [...nodePages].map(pageKey => pageLabelsByKey.get(pageKey)).filter(Boolean),
          tag: {},
        };
        if (type.battle_card_type != null) tagDictionary[record.key].tag.battle_card_type = type.battle_card_type;
        if (type.loop_limited != null) tagDictionary[record.key].tag.loop_limited = type.loop_limited;
        if (type.negotiation != null) tagDictionary[record.key].tag.negotiation = Boolean(type.negotiation);
      }
    }

    for (const page of pages) {
      page.nodes.sort((a, b) => String(a.id).localeCompare(String(b.id)) || String(a.name).localeCompare(String(b.name)));
    }

    return { pages, cards, tag_dictionary: tagDictionary };
  }

async function loadDictionaryData() {
    const response = await fetch(TECH_DICTIONARY_URL, { cache: 'no-cache' });
    if (!response.ok) throw new Error('HTTP ' + response.status + ' while loading ' + TECH_DICTIONARY_URL);
    return dictionaryToAppData(await response.json());
  }

function showLoadError(error) {
    console.error(error);
    mainView.innerHTML = '<div class="empty">无法加载 ' + esc(TECH_DICTIONARY_URL) + '。请从本地 HTTP 服务打开此页面，不要直接用 file:// 打开。<br>' + esc(error.message || error) + '</div>';
  }

const TECH_STATE_FIELD_LABELS = {

    if (isPlainObject(value)) {
      const out = {};
      Object.keys(value).sort().forEach((key) => { out[key] = normalize(value[key]); });

function mergeTechnologyAccountState(base, local, remote) {

  Object.keys(TECH_STATE_FIELD_LABELS).forEach((field) => {
    const localValue = local?.[field];
    const remoteValue = remote[field];
    const baseValue = base?.[field];
    if (technologyStateValuesEqual(localValue, remoteValue)) return;
    if (technologyStateValuesEqual(localValue, baseValue)) {
      // 只有远端变了：整段缺这个字段时不能因为 remoteValue === undefined 就把本页

      if (remoteValue === undefined && localValue !== undefined) state[field] = localValue;

    if (technologyStateValuesEqual(remoteValue, baseValue)) state[field] = localValue;

    return;

    scheduleCampaignReconnect();

          campaignSavePending = false;
          setCampaignSaveStatus('保存冲突：无法读取该档案的最新科技存档，本次修改未提交，页面内容保持不变。', 'offline');
          return false;

          return false;

        campaignTechBaseState = remote.state;

    campaignSaveQueuedBeforeReady = true;
    setCampaignSaveStatus('保存失败，等待重试', 'offline');

async function flushCampaignTechnologySave() {

  if (!campaignStorageAvailable) {
    campaignSaveQueuedBeforeReady = true;
    setCampaignSaveStatus('有修改待同步', 'offline');
    scheduleCampaignReconnect();
    return false;

    });

  }
  const sheetW = Number(card.sheet_width || cropW);
  const sheetH = Number(card.sheet_height || cropH);
  const thumbOuterW = size === 'big' ? 520 : (landscape ? 96 : 78);
  const scale = thumbOuterW / (rotate ? cropH : cropW);
  const thumbW = Math.round(cropW * scale);
  const thumbH = Math.round(cropH * scale);
  const outerW = rotate ? thumbH : thumbW;
  const outerH = rotate ? thumbW : thumbH;
  const bgW = Math.round(sheetW * scale);
  const bgH = Math.round(sheetH * scale);
  const x = -Math.round(Number(card.crop_x_px || 0) * scale);

  if (!rotate) return crop;
  return `<div class="unlocked-thumb-rotated" style="width:${outerW}px;height:${outerH}px">${crop.replace('style="', `style="transform:rotate(-90deg) translateX(-${thumbW}px);transform-origin:top left;`)}</div>`;

    </details>

}
function attachUnlockedItemHandlers(root) {

function navigateToNode(pageKey, nodeId) {

function showUnlockedModal(pageKey, nodeId) {
  const page = pageByKey(pageKey);

  unlockedModalTitle.textContent = displayTechName(node);
  unlockedModalMeta.textContent = `${page.label} · ${categoryLabel(node.tech_category)}`;
  modalTechLinks.innerHTML = renderRequirementUnlockColumns(page.key, node);

function showNodeModal(node) {

  const cards = node.card_indexes.map(i => data.cards[i]).filter(Boolean);
  selectedNodeId = node.id;
  document.querySelectorAll('.node').forEach(el => el.classList.toggle('active', el.dataset.nodeId === node.id));
  activeUnlockedRecord = { page, node, card: cards[0] || null };
  activeModalMode = 'tree';
  unlockedModalTitle.textContent = displayTechName(node);
  unlockedModalMeta.textContent = `${page?.label || ''} · ${categoryLabel(node.tech_category)}`;
  modalTechLinks.innerHTML = renderRequirementUnlockColumns(page.key, node);
  unlockedModalImage.innerHTML = cards.length
    ? `<div class="modal-card-list">${cards.map(card => renderCard(card, node)).join('')}</div>`

  modalViewTree.classList.add('hidden');
  modalToggleUnlock.classList.remove('hidden');
  modalToggleUnimportant.classList.add('hidden');
  updateModalUnlockButton(page.key, node);
  unlockedModal.classList.add('open');
  unlockedModal.setAttribute('aria-hidden', 'false');
}
function updateModalUnlockButton(pageKey, node) {
  if (isAutoUnlockedNode(pageKey, node)) {
    modalToggleUnlock.textContent = (PAGE_INDEX.get(pageKey) ?? 0) < (PAGE_INDEX.get(currentCycle) ?? 0)
      ? '之前循环已自动解锁'
      : '核心科技已自动解锁';
    modalToggleUnlock.disabled = true;
    modalToggleUnlock.classList.remove('primary', 'warn');
    return;
  }
  const unlockedNow = isUnlockedNode(pageKey, node);
  modalToggleUnlock.disabled = false;
  modalToggleUnlock.textContent = unlockedNow ? '取消解锁' : '解锁';
  modalToggleUnlock.classList.toggle('primary', !unlockedNow);
  modalToggleUnlock.classList.toggle('warn', unlockedNow);
}
function closeUnlockedModal() {
  activeUnlockedRecord = null;
  activeModalMode = null;
  unlockedModal.classList.remove('open');
  unlockedModal.setAttribute('aria-hidden', 'true');
}
function toggleUnimportantForActive() {
  if (!activeUnlockedRecord) return;
  const key = nodeKey(activeUnlockedRecord.page.key, activeUnlockedRecord.node);
  if (unimportant.has(key)) {
    unimportant.delete(key);
  } else {
    unimportant.add(key);
  }

  renderUnlockedList();
  showUnlockedModal(activeUnlockedRecord.page.key, activeUnlockedRecord.node.id);

function renderUnlockedPage() {

  const records = unlockedRecords();
  mainView.innerHTML = `<div class="unlocked-page">
    ${unlockedGroupsHtml(records)}
  </div>`;
  attachUnlockedItemHandlers(mainView);
  applySearch();
}
function renderUnlockedList() {
  if (currentTab === 'unlocked') renderUnlockedPage();
}
function toggleUnlocked(pageKey, node) {
  if (isAutoUnlockedNode(pageKey, node)) {
    refreshUnlockState();
    if (activeModalMode === 'tree') updateModalUnlockButton(pageKey, node);
    return;
  }
  const key = nodeKey(pageKey, node);
  if (unlocked.has(key)) {
    unlocked.delete(key);
    unimportant.delete(key);
  } else {
    unlocked.add(key);
  }
  saveAccounts();
  refreshUnlockState();
  const page = pageByKey(viewPage);
  const selectedNode = page?.nodes.find(item => item.id === selectedNodeId);
  if (selectedNode && activeModalMode === 'tree') updateModalUnlockButton(page.key, selectedNode);

function toggleCondition(pageKey, nodeId, cellIndex, checked) {
  const page = pageByKey(pageKey);
  const node = page?.nodes.find(item => item.id === nodeId);
  if (!page || !node || !hasPrintedConditionBox(page.key, node)) return;
  const key = conditionCellKey(page.key, node, Number(cellIndex) || 0);
  if (checked) conditionTicked.add(key);
  else conditionTicked.delete(key);
  saveAccounts();
  refreshUnlockState();
  if (activeModalMode === 'tree' && activeUnlockedRecord?.node?.id === node.id) showNodeModal(node);
}
function refreshUnlockState() {
  document.querySelectorAll('.node').forEach(el => {
    const page = pageByKey(el.dataset.pageKey);
    const node = page?.nodes.find(item => item.id === el.dataset.nodeId);
    if (page && node) applyNodeState(el, page.key, node);
  });
  document.querySelectorAll('.cond-box').forEach(el => {
    const page = pageByKey(el.dataset.pageKey);
    const node = page?.nodes.find(item => item.id === el.dataset.nodeId);
    if (!page || !node) return;
    const index = Number(el.dataset.cellIndex) || 0;
    el.checked = isConditionCellTicked(page.key, node, index);
    el.classList.toggle('prereq-locked', isConditionTextHidden(page.key, node));
    el.title = conditionCellTitle(page.key, node, index);
  });
  document.querySelectorAll('.cond-mask').forEach(el => {
    const page = pageByKey(el.dataset.pageKey);
    const node = page?.nodes.find(item => item.id === el.dataset.nodeId);
    el.classList.toggle('prereq-locked', Boolean(page && node && isConditionTextHidden(page.key, node)));
  });
  document.querySelectorAll('.cond-text').forEach(el => {
    const page = pageByKey(el.dataset.pageKey);
    const node = page?.nodes.find(item => item.id === el.dataset.nodeId);
    if (!page || !node) return;
    const index = Number(el.dataset.cellIndex) || 0;
    el.classList.toggle('prereq-locked', isConditionTextHidden(page.key, node));
    el.classList.toggle('is-placeholder', !conditionCellCaption(page.key, node, index));
    el.textContent = conditionCellDisplayText(page.key, node, index);
    el.style.fontSize = conditionTextFontCqw(el.textContent) + 'cqw';
  });
  applySearch();
  if (currentTab === 'unlocked') renderUnlockedPage();
}
function cardPreview(card, side = 'front') {
  const imageFile = side === 'back' ? card.back_image_file : card.face_image_file;
  const label = side === 'back' ? '背面' : '正面';
  if (!imageFile) {
    return `<div class="preview-frame"><div class="preview-label">${label}</div><div class="card-image-missing">${esc(card.image_missing_reason || '图包未包含该卡牌图像')}</div></div>`;
  }
  if (card.single_card_images) {
    return `<div class="preview-frame"><div class="preview-label">${label}</div><img class="card-preview-img" src="${esc(rel(imageFile))}" alt="${esc(card.name)} ${label}"></div>`;
  }
  const cropW = Number(card.crop_width_px || 1);
  const cropH = Number(card.crop_height_px || 1);
  const sheetW = Number(card.sheet_width || cropW);
  const sheetH = Number(card.sheet_height || cropH);
  const rotate = shouldRotateLargeCard(card);
  const landscape = rotate || cropW > cropH;
  const maxW = landscape ? 430 : 300;
  const scale = maxW / (rotate ? cropH : cropW);
  const w = Math.round(cropW * scale);
  const h = Math.round(cropH * scale);
  const outerW = rotate ? h : w;
  const outerH = rotate ? w : h;
  const bgW = Math.round(sheetW * scale);
  const bgH = Math.round(sheetH * scale);
  const x = -Math.round(Number(card.crop_x_px || 0) * scale);
  const y = -Math.round(Number(card.crop_y_px || 0) * scale);
  const crop = `<div class="card-preview" style="width:${w}px;height:${h}px;background-image:url('${esc(rel(imageFile))}');background-size:${bgW}px ${bgH}px;background-position:${x}px ${y}px"></div>`;
  const preview = rotate
    ? `<div class="card-preview-rotated" style="width:${outerW}px;height:${outerH}px">${crop.replace('style="', `style="transform:rotate(-90deg) translateX(-${w}px);transform-origin:top left;`)}</div>`
    : crop;
  return `<div class="preview-frame ${landscape ? 'landscape' : ''}"><div class="preview-label">${label}</div>${preview}</div>`;
}
function renderCard(card, node) {
  const layout = isLargeTechCard(card) ? 'stacked' : 'side-by-side';
  const hasCardImage = Boolean(card.face_image_file || card.back_image_file);
  return `<section class="card-block">
    <h2 class="card-name">${esc(displayCardName(card, node?.name || ''))}</h2>
    ${hasCardImage
      ? `<div class="card-previews ${layout}">${cardPreview(card, 'front')}${cardPreview(card, 'back')}</div>`
      : `<div class="card-image-missing">${esc(card.image_missing_reason || '图包未包含该卡牌图像')}</div>`}
  </section>`;
}
function renderTabs() {

    { key: 'unlocked', label: '已解锁科技' },
    { key: 'gear-production', label: '装备制造' },
  ];
  tabs.innerHTML = tabItems.map(p => `<button class="tab ${p.key === currentTab ? 'active' : ''}" data-page="${esc(p.key)}">${esc(p.label)}</button>`).join('');
  tabs.querySelectorAll('.tab').forEach(btn => btn.addEventListener('click', () => {
    currentTab = btn.dataset.page;
    if (currentTab === 'unlocked') {
      selectedNodeId = null;
      renderTabs();
      renderUnlockedPage();
      return;
    }
    if (currentTab === 'gear-production') {
      selectedNodeId = null;
      renderTabs();
      renderGearProductionPage();

      return;
    }
    viewPage = currentTab;
    selectedNodeId = null;
    renderTabs();
    renderTree();
  }));
}
function renderCycleSelect() {

  cycleSelect.value = currentCycle;
}
function renderTree() {
  document.querySelector('.app').classList.remove('unlocked-mode');
  const page = pageByKey(viewPage);
  currentTab = viewPage;
  cycleBadge.textContent = page.label;
  mainView.innerHTML = `<div class="tree-wrap" id="treeWrap"></div>`;
  const treeWrap = document.getElementById('treeWrap');
  treeWrap.style.aspectRatio = `${page.width} / ${page.height}`;
  treeWrap.classList.toggle('zh-labels', treeLanguage === 'zh' || hideTreeImage);
  treeWrap.classList.toggle('zh-conditions', treeLanguage === 'zh');
  treeWrap.classList.toggle('no-image', hideTreeImage);
  treeWrap.classList.toggle('hide-unknown', hideUnknownTech);
  treeWrap.innerHTML = `<img class="tree-img" src="${esc(page.image)}" alt="${esc(page.label)} technology tree">`;
  for (const node of page.nodes) {
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'node';
    el.dataset.nodeId = node.id;
    el.dataset.pageKey = page.key;
    el.dataset.name = `${node.name || ''} ${node.name_zh || ''}`.toLowerCase();
    el.dataset.techName = node.name;
    el.dataset.progressKey = nodeKey(page.key, node);
    applyNodeState(el, page.key, node);
    const box = node.tree_box || node;
    el.style.left = (box.x / page.width * 100) + '%';
    el.style.top = (box.y / page.height * 100) + '%';
    el.style.width = (box.w / page.width * 100) + '%';
    el.style.height = (box.h / page.height * 100) + '%';
    el.innerHTML = `<span class="node-label">${esc(displayTechName(node))}</span>`;
    let clickTimer = null;
    el.addEventListener('click', (event) => {

        showNodeModal(node);
      }, 180);
    });

        clickTimer = null;
      }
      event.preventDefault();
      event.stopPropagation();
      toggleUnlocked(page.key, node);
    });
    treeWrap.appendChild(el);
  }
  renderConditionBoxes(treeWrap, page);
  applySearch();
}
// 「不显示底图」时用来顶替印刷文字的条件文字（中文模式下走对照表）。
// 条件文字按长度自适应字号（单位 cqw = 树宽的 1%），长句自动小一号，避免被格子裁掉。
function conditionTextFontCqw(text) {
  const n = (text || '').length;
  if (n <= 16) return 0.72;
  if (n <= 22) return 0.64;
  if (n <= 30) return 0.56;
  if (n <= 38) return 0.48;
  return 0.42;
}
function conditionCellDisplayText(pageKey, node, index) {
  const caption = conditionCellCaption(pageKey, node, index);
  if (!caption) return treeLanguage === 'zh' ? '（条件文字词典未收录）' : '(condition text not in dictionary)';
  if (treeLanguage !== 'zh') return caption;
  return CONDITION_TEXT_ZH[caption] || caption;
}
function conditionCellTitle(pageKey, node, index) {
  const cells = conditionCells(pageKey, node) || [];
  if (isConditionTextHidden(pageKey, node)) {
    const count = cells.length > 1 ? `第 ${index + 1}/${cells.length} 格` : '解锁条件方格';
    return `${count}（前置科技未解锁，条件文字已遮挡）——点击勾选`;
  }
  const label = conditionToggleLabel(pageKey, node, index);
  return `${label}（点击方格切换；${cells.length > 1 ? '每个方格都要勾上，' : ''}未勾选时该节点不算可解锁）`;
}
function renderConditionBoxes(treeWrap, page) {
  // 先铺遮挡块，再放复选框，保证方格永远在遮挡之上、点得到。
  for (const node of page.nodes) {
    const cells = conditionCells(page.key, node);
    if (!cells) continue;
    const box = node.tree_box || node;
    const mask = document.createElement('div');
    mask.className = 'cond-mask';
    mask.dataset.pageKey = page.key;
    mask.dataset.nodeId = node.id;
    if (isConditionTextHidden(page.key, node)) mask.classList.add('prereq-locked');
    // 中文模式只盖住右侧印刷文字，保留左侧复选框；前置未满足时仍整块遮挡。
    const maskOffset = treeLanguage === 'zh' && !isConditionTextHidden(page.key, node)
      ? PRINTED_CONDITION_BOX_WIDTH
      : 0;
    mask.style.left = ((box.x + maskOffset) / page.width * 100) + '%';
    mask.style.top = ((box.y + box.h + cells[0][0]) / page.height * 100) + '%';
    mask.style.width = ((box.w - maskOffset) / page.width * 100) + '%';
    mask.style.height = (((cells[cells.length - 1][0] + cells[cells.length - 1][1]) - cells[0][0]) / page.height * 100) + '%';
    treeWrap.appendChild(mask);
  }
  for (const node of page.nodes) {
    const cells = conditionCells(page.key, node);
    if (!cells) continue;
    const box = node.tree_box || node;
    cells.forEach(([dy, height], index) => {
      const input = document.createElement('input');
      input.type = 'checkbox';
      input.className = 'cond-box';
      input.dataset.pageKey = page.key;
      input.dataset.nodeId = node.id;
      input.dataset.cellIndex = String(index);
      input.checked = isConditionCellTicked(page.key, node, index);
      if (isConditionTextHidden(page.key, node)) input.classList.add('prereq-locked');
      input.title = conditionCellTitle(page.key, node, index);
      input.setAttribute('aria-label', `${displayTechName(node)} ${conditionToggleLabel(page.key, node, index)}`);
      input.style.left = (box.x / page.width * 100) + '%';
      input.style.top = ((box.y + box.h + dy) / page.height * 100) + '%';
      input.style.width = (PRINTED_CONDITION_BOX_WIDTH / page.width * 100) + '%';
      input.style.height = (height / page.height * 100) + '%';
      treeWrap.appendChild(input);
      // 「不显示底图」时用页面文字顶替印刷的条件文字。
      const text = document.createElement('span');
      text.className = 'cond-text';
      text.dataset.pageKey = page.key;
      text.dataset.nodeId = node.id;
      text.dataset.cellIndex = String(index);
      if (isConditionTextHidden(page.key, node)) text.classList.add('prereq-locked');
      if (!conditionCellCaption(page.key, node, index)) text.classList.add('is-placeholder');
      text.textContent = conditionCellDisplayText(page.key, node, index);
      text.style.fontSize = conditionTextFontCqw(text.textContent) + 'cqw';
      text.style.lineHeight = '1.06';
      text.style.left = ((box.x + PRINTED_CONDITION_BOX_WIDTH) / page.width * 100) + '%';
      text.style.top = ((box.y + box.h + dy) / page.height * 100) + '%';
      text.style.width = ((box.w - PRINTED_CONDITION_BOX_WIDTH) / page.width * 100) + '%';
      text.style.height = (height / page.height * 100) + '%';
      treeWrap.appendChild(text);
    });
  }
}
function applySearch() {
