<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATO 科技树</title>
<style>
:root {
  color-scheme: light;
  --ink: #1d2328;
  --muted: #66727d;
  --line: #d6dde3;
  --surface: #f7f8f5;
  --panel: #ffffff;
  --accent: #b44b34;
  --accent-2: #1d6f78;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--surface);
  color: var(--ink);
}
.app {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  min-height: 100vh;
}
.main {
  min-width: 0;
  display: flex;
  flex-direction: column;
}
.topbar {
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 0 16px;
  border-bottom: 1px solid var(--line);
  background: #fff;
  position: sticky;
  top: 0;
  z-index: 5;
}
.tabs { display: flex; gap: 8px; align-items: center; }
.tab {
  border: 1px solid var(--line);
  background: #fff;
  color: var(--ink);
  border-radius: 6px;
  padding: 8px 12px;
  font-weight: 650;
  cursor: pointer;
}
.tab.active {
  border-color: var(--accent-2);
  color: #fff;
  background: var(--accent-2);
}
.tools { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; }
.campaign-save-status {
  min-width: 72px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 800;
  text-align: right;
  white-space: nowrap;
}
.campaign-save-status[data-state="saving"] { color: var(--accent-2); }
.campaign-save-status[data-state="offline"] { color: var(--accent); }
.campaign-save-status[data-state="saved"] { color: #16794a; }
.tool-btn {
  border: 1px solid var(--line);
  background: #fff;
  color: var(--ink);
  border-radius: 6px;
  padding: 8px 10px;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
}
.tool-btn:hover { border-color: var(--accent-2); color: var(--accent-2); }
.tool-btn.active {
  border-color: var(--accent-2);
  background: var(--accent-2);
  color: #fff;
}
.tool-btn.return-main {
  border-color: var(--accent-2);
  background: var(--accent-2);
  color: #fff;
}
.tool-btn.return-main:hover {
  background: #15575f;
  color: #fff;
}
.tool-check {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 7px 10px;
  background: #fff;
  color: var(--ink);
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
  cursor: pointer;
}
.tool-check:hover { border-color: var(--accent-2); color: var(--accent-2); }
.tool-check input {
  margin: 0;
  cursor: pointer;
  accent-color: var(--accent-2);
}
.search {
  width: 220px;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px 10px;
  font: inherit;
  background: #fff;
}
.cycle-select,
.account-select {
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px 10px;
  font: inherit;
  background: #fff;
  color: var(--ink);
}
.account-select { max-width: 150px; }
.viewport {
  min-height: 0;
  overflow: auto;
  padding: 18px;
}
.badge {
  display: inline-flex;
  align-items: center;
  min-height: 22px;
  padding: 2px 7px;
  border-radius: 999px;
  background: #eef3f4;
  color: #31575d;
  font-size: 12px;
  font-weight: 700;
}
.unlocked-page {
  width: min(1440px, 100%);
  margin: 0 auto;
  --unlocked-card-short-edge: 156px;
}
.unlocked-columns {
  display: grid;
  gap: 14px;
  align-items: start;
}
.unlocked-column {
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  padding: 10px;
}
.unlocked-column > summary {
  cursor: pointer;
  user-select: none;
  font-size: 13px;
  font-weight: 850;
  color: var(--ink);
  padding: 2px 2px 8px;
}
.unlocked-column[open] > summary { margin-bottom: 2px; }
.unlocked-list.big {
  grid-template-columns: repeat(auto-fill, minmax(260px, max-content));
  gap: 14px;
}
.unlocked-list.mixed {
  grid-template-columns: repeat(auto-fill, 174px);
}
.unlocked-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, 174px);
  gap: 14px 10px;
  align-items: start;
  justify-content: start;
}
.unlocked-list.big .unlocked-item {
  width: 100%;
}
.unlocked-item {
  border: 0;
  background: transparent;
  color: var(--ink);
  border-radius: 6px;
  padding: 0;
  font: inherit;
  font-size: 12px;
  font-weight: 750;
  text-align: center;
  cursor: pointer;
  min-width: 0;
}
.unlocked-item:hover {
  color: #1e6647;
}
.unlocked-item.important .unlocked-thumb,
.unlocked-item.important .unlocked-thumb-rotated,
.unlocked-item.important .unlocked-thumb-img {
  outline: 3px solid #268058;
  outline-offset: 3px;
}
.unlocked-empty {
  grid-column: 1 / -1;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.45;
  padding: 12px 0;
}
.unlocked-thumb {
  margin: 0 auto;
  background-repeat: no-repeat;
  background-color: #e9ecef;
  border-radius: 4px;
  box-shadow: 0 2px 7px rgba(0,0,0,.16);
}
.unlocked-thumb-rotated {
  margin: 0 auto;
  overflow: hidden;
  border-radius: 4px;
  box-shadow: 0 2px 7px rgba(0,0,0,.16);
}
.unlocked-thumb-rotated .unlocked-thumb {
  margin: 0;
  box-shadow: none;
}
.unlocked-thumb-img {
  display: block;
  width: var(--unlocked-card-short-edge);
  max-width: 100%;
  height: auto;
  border-radius: 4px;
  box-shadow: 0 2px 7px rgba(0,0,0,.16);
  margin: 0 auto;
}
.unlocked-thumb-img.big {
  width: auto;
  height: var(--unlocked-card-short-edge);
  max-width: 100%;
}
.unlocked-thumb-img.small.landscape {
  width: auto;
  height: var(--unlocked-card-short-edge);
}
.unlocked-thumb-img.small.portrait {
  width: var(--unlocked-card-short-edge);
}
.unlocked-thumb-missing {
  width: var(--unlocked-card-short-edge);
  aspect-ratio: 3 / 4;
  display: grid;
  place-items: center;
  margin: 0 auto;
  padding: 8px;
  border: 1px dashed #9aa3a7;
  border-radius: 4px;
  background: #f4f5f5;
  color: var(--muted);
  font-size: 11px;
  font-weight: 800;
  text-align: center;
}
.unlocked-name {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.unlocked-cycle {
  display: block;
  color: var(--muted);
  font-size: 11px;
  margin-top: 2px;
}
.category-pill {
  display: inline-flex;
  align-items: center;
  border-radius: 999px;
  padding: 4px 8px;
  background: #eef3f4;
  color: #31575d;
  font-size: 12px;
  font-weight: 800;
}
.category-pill.battle {
  background: #f6e8e3;
  color: #8f3e2b;
}
.structure-type-badges { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; margin-top: 8px; }
.structure-type-badges .category-pill { padding: 2px 6px; font-size: 11px; }
.structure-filter-bar {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 12px 18px;
  margin-bottom: 24px;
  padding: 16px 18px;
  border: 1px solid var(--line);
  border-radius: 0;
  background: var(--panel);
}
.structure-filter-title { margin: 0; color: var(--muted); font-size: 13px; font-weight: 650; white-space: nowrap; }
.structure-filter-chips { display: flex; flex-wrap: wrap; gap: 8px; min-width: 0; }
.structure-filter-chip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 36px;
  padding: 6px 10px;
  border: 1px solid transparent;
  border-radius: 0;
  background: var(--surface);
  color: var(--ink);
  font: inherit;
  font-size: 13px;
  font-weight: 650;
  line-height: 1.2;
  white-space: nowrap;
  cursor: pointer;
  transition: background .15s, border-color .15s, color .15s;
}
.structure-filter-chip:hover { background: var(--accent-soft, #eef3f4); border-color: var(--line); color: var(--accent-strong, var(--accent-2)); }
.structure-filter-count {
  display: inline-grid;
  place-items: center;
  min-width: 20px;
  height: 20px;
  padding: 0 5px;
  border-radius: 0;
  background: var(--panel);
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.structure-filter-chip[aria-pressed="true"] { background: var(--accent-strong, var(--accent-2)); border-color: var(--accent-strong, var(--accent-2)); color: #fff; }
.structure-filter-chip[aria-pressed="true"] .structure-filter-count { background: rgb(255 255 255 / 18%); color: inherit; }
.structure-filter-bar :is(button, a):focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
@media (max-width: 1100px) {
  .structure-filter-bar { grid-template-columns: minmax(0, 1fr) auto; }
  .structure-filter-chips { grid-column: 1 / -1; grid-row: 2; }
}
@media (max-width: 600px) {
  .structure-filter-bar { padding: 12px; gap: 10px; }
  .structure-filter-chips { gap: 6px; }
  .structure-filter-chip { padding: 6px 8px; font-size: 12px; }
}
.empty {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.55;
  padding: 16px 2px;
}
.card-block + .card-block { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); }
.card-name { font-size: 20px; line-height: 1.15; font-weight: 850; margin: 0 0 10px; }
.card-previews {
  display: grid;
  gap: 12px;
  align-items: start;
}
.card-previews.side-by-side {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
.card-previews.stacked {
  grid-template-columns: 1fr;
}
.meta { display: grid; grid-template-columns: 96px 1fr; gap: 5px 8px; font-size: 13px; color: var(--muted); margin-bottom: 12px; }
.meta b { color: var(--ink); font-weight: 700; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
.tag { border-radius: 999px; background: #f2eee5; color: #74531c; padding: 3px 7px; font-size: 12px; font-weight: 700; }
.preview-frame {
  width: 100%;
  background: #f1f3f4;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px;
  overflow: hidden;
  margin-top: 10px;
}
.preview-frame.landscape {
  padding: 12px;
}
.preview-label {
  color: var(--muted);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .04em;
  margin: 0 0 8px;
}
.card-preview {
  margin: 0 auto;
  background-repeat: no-repeat;
  box-shadow: 0 5px 15px rgba(0,0,0,.18);
  border-radius: 4px;
}
.card-preview-rotated {
  margin: 0 auto;
  overflow: hidden;
  border-radius: 4px;
  box-shadow: 0 5px 15px rgba(0,0,0,.18);
}
.card-preview-rotated .card-preview {
  margin: 0;
  box-shadow: none;
}
.card-preview-img {
  display: block;
  width: min(100%, 300px);
  height: auto;
  margin: 0 auto;
  box-shadow: 0 5px 15px rgba(0,0,0,.18);
  border-radius: 4px;
}
.card-image-missing {
  min-height: 220px;
  display: grid;
  place-items: center;
  padding: 24px;
  border: 1px dashed #9aa3a7;
  border-radius: 6px;
  background: #f4f5f5;
  color: var(--muted);
  font-size: 13px;
  font-weight: 750;
  line-height: 1.5;
  text-align: center;
}
.small-note { color: var(--muted); font-size: 12px; line-height: 1.45; margin-top: 10px; }
.modal-backdrop {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 40;
  background: rgba(16, 24, 28, .72);
  padding: 20px;
}
.modal-backdrop.open { display: flex; }
.unlocked-modal {
  width: min(980px, 96vw);
  max-height: 94vh;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 260px;
  gap: 14px;
  background: #fff;
  border-radius: 10px;
  padding: 14px;
  box-shadow: 0 18px 50px rgba(0,0,0,.35);
}
.unlocked-modal-image {
  min-height: 420px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: auto;
  border-radius: 8px;
  background: #f1f3f4;
  padding: 12px;
}
.unlocked-modal-panel {
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.unlocked-modal-title {
  font-size: 20px;
  font-weight: 900;
  line-height: 1.16;
  margin-bottom: 6px;
}
.unlocked-modal-meta {
  color: var(--muted);
  font-size: 12px;
  margin-bottom: 14px;
}
.modal-tech-links {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin-bottom: 14px;
}
.modal-tech-column {
  border: 1px solid var(--line);
  background: #fbfaf7;
  padding: 10px;
  min-width: 0;
}
.modal-tech-column h3 {
  margin: 0 0 8px;
  font-size: 13px;
  font-weight: 900;
  color: var(--ink);
}
.modal-tech-list {
  display: grid;
  gap: 6px;
}
.modal-tech-or-group {
  display: grid;
  gap: 6px;
  margin-top: 8px;
}
.modal-tech-or-label {
  color: var(--muted);
  font-size: 11px;
  font-weight: 800;
}
.modal-tech-item {
  display: block;
  border: 1px solid rgba(32, 38, 41, .12);
  background: #fff;
  color: var(--ink);
  font-size: 12px;
  line-height: 1.25;
  padding: 6px 7px;
  text-align: left;
  width: 100%;
}
button.modal-tech-item {
  cursor: pointer;
  font: inherit;
}
button.modal-tech-item:hover {
  border-color: var(--accent-2);
  box-shadow: 0 2px 8px rgba(49, 87, 93, .14);
}
.modal-tech-item.met {
  border-color: rgba(30, 138, 85, .45);
  background: #eef8f2;
}
.modal-tech-item.missing {
  border-color: rgba(216, 163, 25, .45);
  background: #fff8e5;
}
.modal-tech-empty {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.45;
}
.modal-tech-conditions {
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 11px;
  line-height: 1.4;
  margin-top: 8px;
  padding-top: 8px;
}
.modal-condition-toggle {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 8px;
  font-size: 12px;
  font-weight: 750;
  color: var(--ink);
  cursor: pointer;
}
.modal-condition-toggle input { margin: 0; cursor: pointer; accent-color: var(--accent-2); }
.modal-condition-hint { margin-top: 2px; font-size: 11px; line-height: 1.4; color: var(--muted); }
.modal-actions {
  display: grid;
  gap: 8px;
  margin-top: auto;
}
.modal-btn {
  border: 1px solid var(--line);
  background: #fff;
  color: var(--ink);
  border-radius: 7px;
  padding: 10px 12px;
  font: inherit;
  font-weight: 800;
  cursor: pointer;
}
.modal-btn.primary {
  border-color: #268058;
  background: #268058;
  color: #fff;
}
.modal-btn.warn {
  border-color: #b7791f;
  color: #8a5a14;
}
.modal-btn.hidden {
  display: none;
}
.modal-card-list {
  width: 100%;
  display: grid;
  gap: 14px;
}
.modal-card-img {
  display: block;
  max-width: min(100%, 760px);
  max-height: 76vh;
  height: auto;
  border-radius: 4px;
  box-shadow: 0 8px 24px rgba(0,0,0,.22);
}
.modal-card-crop {
  background-repeat: no-repeat;
  border-radius: 4px;
  box-shadow: 0 8px 24px rgba(0,0,0,.22);
}
.modal-card-rotated {
  overflow: hidden;
  border-radius: 4px;
  box-shadow: 0 8px 24px rgba(0,0,0,.22);
}
.modal-card-rotated .modal-card-crop {
  box-shadow: none;
}
/* Gear Production Tab */
.gear-page {
  width: min(1200px, 100%);
  height: calc(100dvh - 92px);
  min-height: 420px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
}
.gear-search-hint { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
.gear-filter-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 16px;
  padding: 9px 12px;
  margin-bottom: 12px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #fff;
}
.gear-filter-option {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--ink);
  font-size: 12px;
  font-weight: 750;
  cursor: pointer;
  user-select: none;
}
.gear-filter-option input { margin: 0; accent-color: var(--accent); }
.gear-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(220px, 280px);
  gap: 14px;
  align-items: stretch;
  flex: 1;
  min-height: 0;
}
.gear-content {
  min-height: 0;
  overflow: auto;
  padding-right: 2px;
}
.gear-resource-sidebar {
  position: sticky;
  top: 0;
  align-self: start;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  padding: 12px;
  max-height: 100%;
  overflow: auto;
}
.gear-resource-title {
  font-size: 13px;
  font-weight: 850;
  margin-bottom: 8px;
}
.gear-resource-meta {
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  margin-bottom: 10px;
}
.gear-resource-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.gear-resource-row {
  display: grid;
  grid-template-columns: 22px minmax(0, 1fr) auto auto auto;
  gap: 6px;
  align-items: center;
  padding: 6px 8px;
  border-radius: 6px;
  background: #f7f9fa;
  font-size: 12px;
}
.gear-resource-btn {
  width: 22px;
  height: 22px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 0;
  background: #fff;
  color: var(--ink);
  font-size: 14px;
  font-weight: 900;
  line-height: 1;
  cursor: pointer;
}
.gear-resource-btn:hover {
  border-color: var(--accent-2);
  color: var(--accent-2);
}
.gear-resource-icon {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  object-fit: contain;
  background: #fff;
  border: 1px solid #e3e8eb;
}
.gear-resource-name {
  min-width: 0;
  overflow-wrap: anywhere;
  color: var(--ink);
  font-weight: 700;
}
.gear-resource-value {
  color: #0d6274;
  font-weight: 850;
}
.gear-resource-empty {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.4;
}
.gear-group { border: 1px solid var(--line); border-radius: 8px; background: #fff; margin-bottom: 14px; }
.gear-group-header {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px; cursor: pointer; user-select: none;
}
.gear-group-header:hover { background: #f9fafb; }
.gear-group-name { font-size: 14px; font-weight: 850; flex: 1; }
button.gear-group-name {
  padding: 0;
  border: 0;
  background: transparent;
  color: inherit;
  text-align: left;
  cursor: pointer;
  font: inherit;
}
button.gear-group-name:hover {
  color: #0d6274;
  text-decoration: underline;
  text-underline-offset: 2px;
}
.gear-group-count { font-size: 12px; color: var(--muted); font-weight: 700; }
.gear-group-chevron { color: var(--muted); transition: transform .15s; font-size: 12px; }
.gear-group.collapsed .gear-group-chevron { transform: rotate(-90deg); }
.gear-group.collapsed .gear-items { display: none; }
.gear-items {
  padding: 4px 14px 16px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 14px;
}
.gear-item {
  display: flex; flex-direction: column;
  padding: 10px;
  border: 1px solid #eef1f3; border-radius: 8px;
  background: #fafbfc;
  min-width: 0;
  position: relative;
}
.gear-item:hover { border-color: var(--accent-2); background: #f4fafb; }
.gear-card-thumb {
  width: 100%;

let gearProductionData = null;
let gearCardImages = {};
let gearPartLabels = {};

async function loadGearProductionData() {
  try {
    const productionResponse = await fetch(GEAR_PRODUCTION_URL, { cache: 'no-cache' });
    if (!productionResponse.ok) throw new Error('HTTP ' + productionResponse.status);
    gearProductionData = await productionResponse.json();
  } catch (e) {
    console.warn('Failed to load gear production data:', e);
    gearProductionData = null;
  }
  try {
    const imagesResponse = await fetch(GEAR_CARD_IMAGES_URL, { cache: 'no-cache' });
    if (imagesResponse.ok) {
      const payload = await imagesResponse.json();
      gearCardImages = payload?.images || {};
    }
  } catch (e) {
    console.warn('Failed to load gear card images:', e);
    gearCardImages = {};
  }
  try {
    const labelsResponse = await fetch(GEAR_PART_LABELS_URL, { cache: 'no-cache' });
    if (labelsResponse.ok) {
      const payload = await labelsResponse.json();
      gearPartLabels = payload?.labels || {};
    }
  } catch (e) {
    console.warn('Failed to load gear part labels:', e);
    gearPartLabels = {};
  }
}


function gearImageSrc(gearId) {
  if (!gearId) return '';
  if (gearId.startsWith('T:tt_')) {
    const titanKey = gearId.slice(2);
    return `images/titans/${titanKey}.png`;
  }
  return gearCardImages[gearId] || gearCardImages[String(gearId).toUpperCase()] || '';
}

function normalizeGearId(gearId) {
  return String(gearId || '').replace(/^1x/, '');
}

function getGearTechNodeKey(techId) {
  if (!gearProductionData?.techCardNames?.[techId]) return null;
  const fullName = gearProductionData.techCardNames[techId].trim();
  // Extract English name (everything before the first CJK character)
  const enName = fullName.replace(/[一-鿿㐀-䶿豈-﫿].*/g, '').trim();
  return enName.toLowerCase();
}

function getGearName(gearId) {
  gearId = normalizeGearId(gearId);
  if (gearId.startsWith('T:')) {
    const titanKey = gearId.slice(2);
    if (treeLanguage === 'zh') {
      return TITAN_NAMES_ZH[titanKey] || titanKey.replace(/^tt_/, '');
    }
    const en = titanKey.replace(/^tt_/, '').replace(/^p/, '');
    return en.charAt(0).toUpperCase() + en.slice(1);
  }
  if (!gearProductionData?.gearCards?.[gearId]) return gearId;
  const fullName = gearProductionData.gearCards[gearId].trim();
  if (treeLanguage === 'zh') {
    const zh = fullName.replace(/^[^一-鿿㐀-䶿豈-﫿]*/, '').trim();
    return zh || fullName;
  }
  return fullName.replace(/[一-鿿㐀-䶿豈-﫿].*/g, '').trim() || fullName;
}

function getTechDisplayName(techId) {
  if (!gearProductionData?.techCardNames?.[techId]) return techId;
  const fullName = gearProductionData.techCardNames[techId].trim();
  if (treeLanguage === 'zh') {
    const zh = fullName.replace(/^[^一-鿿㐀-䶿豈-﫿]*/, '').trim();
    return zh || fullName;
  }
  return fullName.replace(/[一-鿿㐀-䶿豈-﫿].*/g, '').trim() || fullName;
}

function formatCostPart(costStr) {
  const match = String(costStr).match(/^(\d+)x(.+)$/);
  if (!match) return { amount: '', resource: costStr };
  const amount = match[1];
  const key = match[2];
  let name;
  if (key.startsWith('CORE_')) {
    const enemyKey = key.slice(5);
    name = treeLanguage === 'zh'
      ? `${RESOURCE_NAMES_ZH[enemyKey] || enemyKey} 核心`
      : `${enemyKey.replace(/_/g, ' ').toLowerCase()} core`;
  } else if (RESOURCE_NAMES_ZH[key]) {
    name = treeLanguage === 'zh' ? RESOURCE_NAMES_ZH[key] : key.replace(/_/g, ' ').toLowerCase();
  } else if (/^[A-Z]J\d+$/i.test(key)) {
    // Gear-as-material reference (e.g. 1xAJ0280)
    name = getGearName(key);
  } else {
    name = treeLanguage === 'zh' ? key : key.replace(/_/g, ' ').toLowerCase();
  }
  return { amount, resource: name };
}

function formatCost(costStr) {
  // Support OR-cost: "2xA&&1xB||1xC" means (A and B) or C.
  const orParts = String(costStr).split('||');
  if (orParts.length === 1) return formatCostPart(orParts[0]);
  return {
    _or: true,
    alternatives: orParts.map(part => part.split('&&').map(formatCostPart))
  };
}
function productionRecordCycle(cycle) {
  return PRODUCTION_CYCLE_TO_RECORD_CYCLE[String(cycle || '').toUpperCase()] || normalizeMainCycleId(cycle);
}
function recordResourceKey(rawKey, recordCycle) {
  const normalized = String(rawKey || '').trim().toUpperCase();
  if (normalized.startsWith('CORE_')) {
    const coreKey = RECORD_CORE_KEYS[normalized.slice(5)];
    return coreKey ? `${recordCycle}-core-${coreKey}` : null;
  }
  const baseKey = RECORD_RESOURCE_KEYS[normalized];
  if (!baseKey) return null;
  return SHARED_RECORD_RESOURCE_KEYS.has(baseKey) ? baseKey : `${recordCycle}-${baseKey}`;
}
function parseRawCostPart(costStr, recordCycle) {
  const match = String(costStr).trim().match(/^(\d+)x(.+)$/);
  if (!match) return { amount: 0, key: String(costStr), label: String(costStr), unsupported: true, reason: '无法识别' };
  const amount = Math.max(0, Number(match[1] || 0));
  const key = match[2].trim();
  const formatted = formatCostPart(`${amount}x${key}`);
  const label = `${amount}×${formatted.resource}`;
  if (/^[A-Z]J\d+$/i.test(key)) {
    return { amount, key, label, unsupported: true, reason: '装备材料需手动处理，可在军械库扣除' };
  }
  if (key === 'TITAN' || key.startsWith('T:')) {
    return { amount, key, label, unsupported: true, reason: '泰坦消耗需手动处理' };
  }
  const storageKey = recordResourceKey(key, recordCycle);
  if (!storageKey) {
    return { amount, key, label, unsupported: true, reason: '记录表未建档' };
  }
  if (storageKey === 'rare') {
    return { amount, key, label, storageKey, unsupported: true, reason: '记录在稀有资源栏，需手动处理' };
  }
  return { amount, key, label, storageKey, unsupported: false };
}
function combineCostAlternatives(groups) {
  return groups.reduce((options, group) => {
    const next = [];
    options.forEach(option => {
      group.forEach(parts => next.push([...option, ...parts]));
    });
    return next;
  }, [[]]);
}
function mergeCostParts(parts) {
  const merged = new Map();
  const result = [];
  parts.forEach(part => {
    const mergeKey = part.storageKey || `${part.key}:${part.reason || ''}`;
    if (merged.has(mergeKey)) {
      const existing = merged.get(mergeKey);
      existing.amount += part.amount;
      existing.label = existing.key === part.key
        ? `${existing.amount}×${formatCostPart(`${existing.amount}x${existing.key}`).resource}`
        : `${existing.amount}×${recordResourceLabel(existing.storageKey)}`;
      existing.expandedFrom = [...new Set([...(existing.expandedFrom || []), ...(part.expandedFrom || [])])];
    } else {
      const copy = { ...part };
      merged.set(mergeKey, copy);
      result.push(copy);
    }
  });
  return result;

    const next = mutator(JSON.parse(JSON.stringify(latest.state)));

    <label class="gear-filter-option"><input type="checkbox" data-gear-filter="cycle" ${gearOnlyCurrentCycle ? 'checked' : ''}>只显示本循环及以后装备</label>
    <label class="gear-filter-option"><input type="checkbox" data-gear-filter="craftable" ${gearOnlyCraftable ? 'checked' : ''}>只显示可制造装备</label>
    <label class="gear-filter-option"><input type="checkbox" data-gear-filter="part" ${gearGroupByPart ? 'checked' : ''}>分部位显示</label>
    <span class="gear-search-hint" style="margin:0 0 0 auto">显示 ${visibleCount}/${totalCount} 件</span>
  </div>`;
}
function gearItemHtml(entry, gear) {
  const gearName = getGearName(gear.gearId);
  const isTitan = String(gear.gearId).startsWith('T:tt_');
  const imgSrc = gearImageSrc(gear.gearId);
  // 提前解锁的后续循环科技会出现在本循环的列表里：把它的所属循环标出来，
  // 否则玩家看不懂这件装备为什么在这里、要扣的是哪一套资源。
  const entryRecordCycle = productionRecordCycle(entry?.cycle);
  const cycleBadge = entryRecordCycle && entryRecordCycle !== currentRecordCycleForGear()
    ? `<span class="gear-cycle-badge">循环 ${esc(String(entryRecordCycle).replace(/[^0-9]/g, '') || entryRecordCycle)}</span>`
    : '';
  let html = `<div class="gear-item" data-gear-id="${esc(gear.gearId)}" data-search-text="${esc(gearName.toLowerCase())}">`;
  if (imgSrc) {
    const fallback = isTitan
      ? `<div class=\\'gear-card-thumb empty\\'><span class=\\'empty-tag\\'>泰坦</span><span>${esc(gearName)}</span></div>`
      : `<div class=\\'gear-card-thumb empty\\'>${esc(gear.gearId)}</div>`;
    html += `<button type="button" class="gear-card-thumb" data-gear-img="${esc(imgSrc)}" data-gear-name="${esc(gearName)}" title="${esc(gearName)}"><img src="${esc(imgSrc)}" alt="${esc(gearName)}" loading="lazy" onerror="this.parentElement.outerHTML='${fallback}'"></button>`;
  } else if (isTitan) {
    html += `<div class="gear-card-thumb empty"><span class="empty-tag">泰坦</span><span>${esc(gearName)}</span></div>`;
  } else {
    html += `<div class="gear-card-thumb empty">${esc(gear.gearId)}</div>`;
  }
  html += `<div class="gear-item-main"><div class="gear-item-name">${esc(gearName)}${cycleBadge}</div><div class="gear-item-cost">`;
  for (const c of gear.cost) {
    const formatted = formatCost(c);
    if (formatted._or) {
      html += `<span class="gear-cost-chip cost-or">${formatted.alternatives.map(parts => `<span class="cost-or-alt">${parts.map(p => `<span class="cost-or-part"><span class="cost-amount">${esc(p.amount)}×</span><span class="cost-resource">${esc(p.resource)}</span></span>`).join('')}</span>`).join('<span class="cost-or-sep">或</span>')}</span>`;
    } else {
      html += `<span class="gear-cost-chip"><span class="cost-amount">${esc(formatted.amount)}×</span><span class="cost-resource">${esc(formatted.resource)}</span></span>`;
    }
  }
  const stock = window.ATO_GEAR_INVENTORY.normalize(gearRecordState?.arsenal)[window.ATO_GEAR_INVENTORY.gearKey(gear.gearId)];
  html += `</div><div class="gear-stock">军械库现有 ${stock?.quantity || 0} 件</div>${renderCraftPanel(entry, gear)}</div></div>`;
  return html;
}

function renderGearProductionPage() {
  currentTab = 'gear-production';
  mainView.classList.remove('tech-tree-view');
  renderCycleButton();
  gearCraftPlans = new Map();
  requestGearRecordState();

  const productions = getUnlockedProductions();
  const allItems = productions.flatMap(entry => entry.produces.map(gear => ({ entry, gear })));
  const productionCycle = currentProductionCycle();
  const visibleItems = allItems.filter(({ entry, gear }) => {
    if (gearOnlyCurrentCycle && !shouldShowProductionForCycle(entry, productionCycle)) return false;
    if (gearOnlyCraftable && !gearRecordLoadInFlight && !craftPlanForGear(entry, gear).filterCraftable) return false;
    return true;
  });
  if (!productions.length) {
    mainView.innerHTML = `<div class="gear-page"><div class="gear-layout"><div class="gear-content"><div class="gear-empty">还没有解锁任何生产科技。解锁 production 类型的科技卡后，这里将显示可制造的装备。</div></div>${gearResourceSidebarHtml()}</div></div>`;
    applyGearSearch();
    return;
  }

  let html = '<div class="gear-page">';
  html += gearFilterBarHtml(visibleItems.length, allItems.length);
  html += `<div class="gear-search-hint">共 ${productions.length} 项生产科技已解锁。使用搜索框继续过滤。</div>`;
  html += '<div class="gear-layout"><div class="gear-content">';
  const groups = new Map();
  visibleItems.forEach(item => {
    const group = gearGroupByPart
      ? gearPart(item.gear.gearId)
      : { key: item.entry.techId, label: getTechDisplayName(item.entry.techId), techId: item.entry.techId };
    if (!groups.has(group.key)) groups.set(group.key, { ...group, items: [] });
    groups.get(group.key).items.push(item);
  });
  if (!groups.size) html += `<div class="gear-empty">没有符合当前筛选条件的装备。</div>`;
  const orderedGroups = [...groups.values()];
  if (gearGroupByPart) {
    const order = ['arm_1h', 'arm_2h', 'arm_3h', 'arm_1_2h', 'arm_all_h', 'arm', 'armor', 'attachment', 'aid', 'titan'];
    orderedGroups.sort((a, b) => order.indexOf(a.key) - order.indexOf(b.key));
  }
  for (const group of orderedGroups) {
    html += `<div class="gear-group" data-search-text="${esc(`${group.label} ${group.items.map(item => getGearName(item.gear.gearId)).join(' ')}`.toLowerCase())}">`;
    const groupName = group.techId
      ? `<button type="button" class="gear-group-name" data-tech-id="${esc(group.techId)}" title="点击查看科技卡">${esc(group.label)}</button>`
      : `<span class="gear-group-name">${esc(group.label)}</span>`;
    html += `<div class="gear-group-header"><span class="gear-group-label">${group.techId ? '科技卡' : '装备部位'}</span>${groupName}<span class="gear-group-count">${group.items.length} 件装备</span><span class="gear-group-chevron">▼</span></div>`;
    html += `<div class="gear-items">${group.items.map(({ entry, gear }) => gearItemHtml(entry, gear)).join('')}</div>`;
    html += `</div>`;
  }
  html += `</div>${gearResourceSidebarHtml()}</div></div>`;
  mainView.innerHTML = html;

  mainView.querySelectorAll('[data-gear-filter]').forEach(input => {
    input.addEventListener('change', () => {
      if (input.dataset.gearFilter === 'cycle') gearOnlyCurrentCycle = input.checked;
      if (input.dataset.gearFilter === 'craftable') gearOnlyCraftable = input.checked;
      if (input.dataset.gearFilter === 'part') gearGroupByPart = input.checked;
      renderGearProductionPage();
    });
  });

  // Toggle collapse
  mainView.querySelectorAll('.gear-group-header').forEach(header => {
    header.addEventListener('click', event => {
      if (event.target.closest('.gear-group-name[data-tech-id]')) return;
      header.parentElement.classList.toggle('collapsed');
    });
  });

  mainView.querySelectorAll('.gear-group-name[data-tech-id]').forEach(btn => {
    btn.addEventListener('click', event => {
      event.stopPropagation();
      showGearTechCard(btn.dataset.techId);
    });
  });

  // Click thumbnail to enlarge
  mainView.querySelectorAll('.gear-card-thumb[data-gear-img]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      showGearImageModal(btn.dataset.gearImg, btn.dataset.gearName);
    });
  });

  mainView.querySelectorAll('.gear-craft-btn[data-craft-key]').forEach(btn => {
    btn.addEventListener('click', event => {
      event.stopPropagation();
      void craftGear(btn.dataset.craftKey, btn.dataset.craftOption);
    });
  });

  mainView.querySelectorAll('.gear-resource-btn[data-resource-key]').forEach(btn => {
    btn.addEventListener('click', event => {
      event.stopPropagation();
      void adjustGearResource(btn.dataset.resourceKey, Number(btn.dataset.resourceDelta || 0));
    });
  });

  applyGearSearch();
}

function showGearImageModal(src, name) {
  let modal = document.getElementById('gearImageModal');
  if (!modal) {
    modal = document.createElement('div');
    modal.id = 'gearImageModal';
    modal.className = 'modal-backdrop';
    modal.innerHTML = '<div class="gear-image-modal-content"><img id="gearImageModalImg"><div id="gearImageModalCaption"></div></div>';
    document.body.appendChild(modal);
    modal.addEventListener('click', () => {
      modal.classList.remove('open');
      modal.setAttribute('aria-hidden', 'true');
    });
  }
  document.getElementById('gearImageModalImg').src = src;
  document.getElementById('gearImageModalCaption').textContent = name || '';
  modal.classList.add('open');
  modal.setAttribute('aria-hidden', 'false');
}

function applyGearSearch() {
  if (currentTab !== 'gear-production') return;
  const query = search.value.trim().toLowerCase();
  const groups = mainView.querySelectorAll('.gear-group');
  let totalVisible = 0;
  groups.forEach(group => {
    if (!query) {
      group.classList.remove('filtered');
      group.querySelectorAll('.gear-item').forEach(item => item.classList.remove('filtered'));
      totalVisible++;
      return;
    }
    const groupText = group.dataset.searchText || '';
    const items = group.querySelectorAll('.gear-item');
    let hasVisibleItem = false;
    items.forEach(item => {
      const itemText = item.dataset.searchText || '';
      const match = itemText.includes(query) || groupText.includes(query);
      item.classList.toggle('filtered', !match);
      if (match) hasVisibleItem = true;
    });
    group.classList.toggle('filtered', !hasVisibleItem);
    if (hasVisibleItem) totalVisible++;
  });
  const productions = getUnlockedProductions();
  count.textContent = query
    ? `${totalVisible}/${productions.length} 科技匹配`
    : `已解锁 ${productions.length} 项生产科技`;
}

function renderGearInventoryView() {
  if (currentTab === 'gear-production') renderGearProductionPage();
  else if (currentTab === 'arsenal') renderArsenalPage();
}

function arsenalCatalog() {
  const inventory = window.ATO_GEAR_INVENTORY.normalize(gearRecordState?.arsenal);
  const catalog = new Map();
  // The complete card dictionary also includes loot and starting equipment.
  // Their card IDs identify the cycle even when there is no production recipe.
  for (const rawId of Object.keys(gearProductionData?.gearCards || {})) {
    const gearId = window.ATO_GEAR_INVENTORY.gearKey(rawId);
    if (!gearId) continue;
    const cycle = { A: 'c1', B: 'c2', C: 'c3', D: 'c4', E: 'c5' }[gearId[0]];
    catalog.set(gearId, { gearId, cycles: cycle ? [cycle] : [], techIds: [] });
  }
  for (const entry of gearProductionData?.techProduction || []) {
    for (const gear of entry.produces || []) {
      const gearId = window.ATO_GEAR_INVENTORY.gearKey(gear.gearId);
      if (!gearId) continue;
      if (!catalog.has(gearId)) catalog.set(gearId, { gearId, cycles: [], techIds: [] });
      const item = catalog.get(gearId);
      const cycle = productionRecordCycle(entry.cycle);
      if (!item.cycles.includes(cycle)) item.cycles.push(cycle);
      if (!item.techIds.includes(entry.techId)) item.techIds.push(entry.techId);
    }
  }
  for (const gearId of Object.keys(inventory)) {
    if (!catalog.has(gearId)) catalog.set(gearId, { gearId, cycles: [], techIds: [] });
  }
  return [...catalog.values()].map(item => {
    const name = getGearName(item.gearId);
    const part = gearPart(item.gearId);
    return {
      ...item, name, part,
      ...(inventory[item.gearId] || { quantity: 0, manufactured: 0 }),
      recorded: Object.prototype.hasOwnProperty.call(inventory, item.gearId),
      searchText: `${item.gearId} ${name} ${gearProductionData?.gearCards?.[item.gearId] || ''} ${part.label} ${item.techIds.map(getTechDisplayName).join(' ')}`.toLowerCase(),
    };
  }).sort((a, b) => a.gearId.localeCompare(b.gearId));
}

function arsenalItemMatchesFilters(item, query) {
  return gearPartMatchesFilter(item.part.key, arsenalPartFilter)
    && (!arsenalCycleFilter || item.cycles.includes(arsenalCycleFilter))
    && (!query || item.searchText.includes(query));
}

  mainView.classList.remove('tech-tree-view');

  requestGearRecordState();
  const catalog = arsenalCatalog();
  const query = search.value.trim().toLowerCase();
  const choices = catalog.filter(item => arsenalItemMatchesFilters(item, query));
  const recorded = catalog.filter(item => item.recorded);
  const visible = choices.filter(item => item.recorded && (!arsenalOnlyStock || item.quantity > 0));

  count.textContent = `军械库 ${recorded.length} 种 / ${totalQuantity} 件`;
  const parts = [

  ];

  let html = `<div class="gear-page arsenal-page"><div class="gear-filter-bar arsenal-toolbar">
    <label>装备分类 <select data-arsenal-filter="part" aria-label="装备分类">${optionHtml('', '全部分类', arsenalPartFilter)}${filterParts.map(([key, label]) => optionHtml(key, label, arsenalPartFilter)).join('')}</select></label>

    <button type="submit" class="tool-btn" ${unavailable || !choices.length ? 'disabled' : ''}>加入军械库</button>
    <button type="button" class="tool-btn" data-arsenal-refresh ${gearRecordLoadInFlight || gearMutationInFlight ? 'disabled' : ''}>刷新</button>
    </form>
  </div><div class="arsenal-meta"><span>制造自动入库；所有装备均可补录，手动增减仅调整库存。</span><span class="arsenal-summary">显示 ${visible.length}/${recorded.length} 种 · ${visibleQuantity} 件</span></div>`;
  html += gearMutationInFlight ? '<div class="arsenal-message" role="status">正在保存军械库...</div>' : arsenalMessageHtml();
  if (gearRecordError) html += `<div class="gear-empty">军械库读取失败：${esc(gearRecordError)}。请点击刷新重试。</div>`;
  else if (!gearRecordState) html += '<div class="gear-empty">正在读取军械库...</div>';
  else if (!recorded.length) html += '<div class="gear-empty">军械库还没有装备。在“装备制造”中制造，或在上方补录已有装备。</div>';
  else if (!visible.length) html += '<div class="gear-empty">没有符合当前筛选条件的装备。</div>';
  else {

    for (const [key, label] of parts) {

      html += `<section class="gear-group"><div class="gear-group-header"><span class="gear-group-name">${label}</span><span class="gear-group-count">${items.length} 种 · ${items.reduce((sum, item) => sum + item.quantity, 0)} 件</span></div><div class="gear-items arsenal-items">${items.map(arsenalItemHtml).join('')}</div></section>`;

  mainView.querySelectorAll('[data-arsenal-filter]').forEach(input => input.addEventListener('change', () => {

    if (input.dataset.arsenalFilter === 'cycle') arsenalCycleFilter = input.value;

  });
  mainView.querySelector('.arsenal-add').addEventListener('submit', event => {
    event.preventDefault();
    const gearId = mainView.querySelector('#arsenalAddGear').value;

  mainView.querySelectorAll('[data-arsenal-delta]').forEach(button => button.addEventListener('click', () => {

  mainView.querySelectorAll('.gear-card-thumb[data-gear-img]').forEach(button => {
    button.addEventListener('click', () => showGearImageModal(button.dataset.gearImg, button.dataset.gearName));
    button.querySelector('img').addEventListener('error', () => {
      button.classList.add('empty');
      button.textContent = button.dataset.gearName;
    }, { once: true });
  });
}

async function adjustArsenal(gearId, delta) {
  if (gearMutationInFlight) return;
  if (!gearRecordState || gearRecordError) { alert('军械库尚未连接，请刷新后重试。'); return; }
  if (!Number.isSafeInteger(delta) || delta === 0 || !arsenalCatalog().some(item => item.gearId === gearId)) {
    alert('请选择装备并输入有效的整数数量。');
    return;
  }
  gearMutationInFlight = true;
  arsenalMessage = '';
  renderGearInventoryView();
  try {
    await mutateCampaignRecordState(recordState => {
      recordState.arsenal = window.ATO_GEAR_INVENTORY.adjust(recordState.arsenal, gearId, delta);
      return recordState;
    });
    arsenalMessage = `${getGearName(gearId)} 的数量已保存。`;
    arsenalMessageError = false;
  } catch (error) {
    arsenalMessage = `军械库保存失败：${String(error.message || error)}`;
    arsenalMessageError = true;
    await loadGearRecordState();
  } finally {
    gearMutationInFlight = false;
    renderGearInventoryView();
  }
}

let PAGE_INDEX = new Map();

let DISAMBIGUATED_TECH_NAMES = new Set();

function computeDisambiguatedTechNames(pages) {
    const byName = new Map();
    for (const page of pages) {
      for (const node of page.nodes) {
        const key = String(node.name || '').trim().toLowerCase();
        if (!byName.has(key)) byName.set(key, new Set());
        byName.get(key).add((node.card_indexes || []).join(','));
      }
    }
    return new Set([...byName].filter(([, cardSets]) => cardSets.size > 1).map(([key]) => key));
  }

function dictionaryToAppData(dictionary) {
    const layout = window.ATO_TECH_PAGE_LAYOUT || [];
    const pages = layout.map(page => ({ ...page, nodes: [] }));
    const pagesByKey = new Map(pages.map(page => [page.key, page]));
    const pageLabelsByKey = new Map(layout.map(page => [page.key, page.label]));
    const records = (Array.isArray(dictionary.cards) ? dictionary.cards : Object.values(dictionary.cards || {}))
      .filter(Boolean)
      .sort((a, b) => Number(a.index ?? 0) - Number(b.index ?? 0));
    const cards = [];
    const tagDictionary = {};
    const mergedNodes = new Map();
    const namesFor = record => record.names || { en: record.en, zh: record.zh };
    const sheetFor = image => Array.isArray(image.sheet)
      ? { width: image.sheet[0], height: image.sheet[1], col: image.sheet[2], row: image.sheet[3] }
      : (image.sheet || {});
    const cropFor = image => Array.isArray(image.crop)
      ? { x: image.crop[0], y: image.crop[1], w: image.crop[2], h: image.crop[3] }
      : (image.crop || {});
    const boxFor = value => Array.isArray(value)
      ? { x: value[0], y: value[1], w: value[2], h: value[3] }
      : value;
    const positionFor = value => Array.isArray(value)
      ? { x: value[0], y: value[1], w: value[2], h: value[3] }
      : (value || {});
    const refKeys = refs => (refs || []).map(item => typeof item === 'string' ? item : item?.key).filter(Boolean);
    const refKeyGroups = groups => {
      if (!groups) return [];
      const rawGroups = Array.isArray(groups?.[0]) ? groups : [groups];
      return rawGroups.map(refKeys).filter(group => group.length);
    };
    const conditionsFor = conditions => (conditions || []).map(item => typeof item === 'string' ? { caption: item } : {
      order: item.order,
      caption: item.caption || item.text,
    }).filter(item => item.caption || item.order != null);

    for (const record of records) {
      const image = record.image || {};
      const sheet = sheetFor(image);
      const crop = cropFor(image);
      const tabletop = record.tabletop || {};
      const type = record.type || {};
      const names = namesFor(record);
      const cardIndex = Number(record.index);
      cards[cardIndex] = {
        key: record.key || '',
        guid: tabletop.guid,
        name: names.en || '',
        name_zh: names.zh || '',
        tech_category: record.category || type.category || '',
        type: { ...type },
        card_id: tabletop.card_id,
        deck_key: tabletop.deck_key,
        deck_instance_id: tabletop.deck_instance_id,
        tags: record.core ? ['CoreTechnology'] : (type.tags || []),
        raw_tags: type.raw_tags || [],
        cycle_tags: type.cycle_tags || [],
        face_image_file: image.face,
        back_image_file: image.back,
        image_missing: Boolean(image.missing || !image.face || !image.back),
        image_missing_reason: image.missing_reason || '',
        single_card_images: Boolean(image.single_card_images ?? image.single),
        sheet_width: sheet.width,
        sheet_height: sheet.height,
        crop_x_px: crop.x,
        crop_y_px: crop.y,
        crop_width_px: crop.w,
        crop_height_px: crop.h,
        sheet_col_1_based: sheet.col,
        sheet_row_1_based: sheet.row,
      };

      const nodePages = new Set();
      for (const treeNode of record.tree_nodes || record.nodes || []) {
        const page = pagesByKey.get(treeNode.page);
        if (!page) continue;
        nodePages.add(treeNode.page);
        const position = positionFor(treeNode.position || treeNode.pos);
        const nodeId = treeNode.node_id || treeNode.id;
        const nodeKeyValue = treeNode.node_key || treeNode.key || record.key;
        const nodeName = treeNode.name || names.en || '';
        const xlsmType = treeNode.xlsm_type ?? treeNode.xlsm?.type ?? (treeNode.core ? 'Core' : null);
        const requirements = refKeys(treeNode.requirements || treeNode.req);
        const requirementAnyGroups = [
          ...refKeyGroups(treeNode.requirements_any || treeNode.req_any),
          ...refKeyGroups(treeNode.requirement_any_groups || treeNode.req_any_groups),
        ];
        const unlocks = refKeys(treeNode.unlocks);
        const requirementConditions = conditionsFor(treeNode.requirement_conditions || treeNode.req_conditions);
        const unlockConditions = conditionsFor(treeNode.unlock_conditions);
        const mergeKey = treeNode.page + '::' + nodeId;
        let node = mergedNodes.get(mergeKey);
        if (!node) {
          node = {
            id: nodeId,
            name: nodeName,
            name_zh: treeNode.name_zh || treeNode.zh || names.zh || '',
            tech_category: treeNode.category || record.category || type.category || '',
            card_indexes: [],
            x: position.x,
            y: position.y,
            w: position.w,
            h: position.h,
            tree_box: boxFor(treeNode.tree_box || treeNode.box),
            requires: requirements,
            requires_any_groups: requirementAnyGroups,
            xlsm_requirements: requirements,
            xlsm_requirement_any_groups: requirementAnyGroups,
            xlsm_leads_to: unlocks,
          };
          if (xlsmType) {
            node.xlsm = { type: xlsmType };
            node.xlsm_type = xlsmType;
          }
          if (requirementConditions.length) {
            node.xlsm_special_requirements = { tech: node.xlsm_requirements, conditions: requirementConditions };
          }
          if (unlockConditions.length) {
            node.xlsm_special_leads_to = { tech: node.xlsm_leads_to, conditions: unlockConditions };
          }
          mergedNodes.set(mergeKey, node);
          page.nodes.push(node);
        }
        if (!node.card_indexes.includes(cardIndex)) node.card_indexes.push(cardIndex);

        const pageLabel = pageLabelsByKey.get(treeNode.page);
        const tagRecord = tagDictionary[nodeKeyValue] || {
          category: record.category || type.category || '',
          cycles: [],
          tag: {},
        };
        if (type.battle_card_type != null) tagRecord.tag.battle_card_type = type.battle_card_type;
        if (type.loop_limited != null) tagRecord.tag.loop_limited = type.loop_limited;
        if (type.negotiation != null) tagRecord.tag.negotiation = Boolean(type.negotiation);
        if (Array.isArray(type.structure_card_types)) tagRecord.tag.structure_card_types = [...new Set([...(tagRecord.tag.structure_card_types || []), ...type.structure_card_types])];
        if (pageLabel && !tagRecord.cycles.includes(pageLabel)) tagRecord.cycles.push(pageLabel);
        tagDictionary[nodeKeyValue] = tagRecord;
      }

      if (record.key && !tagDictionary[record.key]) {
        tagDictionary[record.key] = {
          category: record.category || type.category || '',
          cycles: [...nodePages].map(pageKey => pageLabelsByKey.get(pageKey)).filter(Boolean),
          tag: {},
        };
        if (type.battle_card_type != null) tagDictionary[record.key].tag.battle_card_type = type.battle_card_type;
        if (type.loop_limited != null) tagDictionary[record.key].tag.loop_limited = type.loop_limited;
        if (type.negotiation != null) tagDictionary[record.key].tag.negotiation = Boolean(type.negotiation);
        if (Array.isArray(type.structure_card_types)) tagDictionary[record.key].tag.structure_card_types = type.structure_card_types.slice();
      }
    }

    for (const page of pages) {
      page.nodes.sort((a, b) => String(a.id).localeCompare(String(b.id)) || String(a.name).localeCompare(String(b.name)));
    }

    return { pages, cards, tag_dictionary: tagDictionary };
  }

async function loadDictionaryData() {
    const response = await fetch(TECH_DICTIONARY_URL, { cache: 'no-cache' });
    if (!response.ok) throw new Error('HTTP ' + response.status + ' while loading ' + TECH_DICTIONARY_URL);
    return dictionaryToAppData(await response.json());
  }

function setCampaignSaveStatus(message, status = 'saved') {
  if (campaignSession.changed) { message = '登录账号已切换，已停止保存，请刷新页面'; status = 'conflict'; }
  else if (campaignTechConflict) { message = '科技存档冲突，已暂停保存，请刷新页面确认'; status = 'conflict'; }
  campaignSaveStatus.textContent = message;
  campaignSaveStatus.dataset.state = status;

function scheduleCampaignReconnect() {
  if (campaignSession.changed || campaignTechConflict) return;
  if (campaignReconnectTimer || campaignReconnectInFlight || campaignStorageAvailable) return;
  const wait = campaignReconnectDelay;
  campaignReconnectDelay = Math.min(30000, campaignReconnectDelay * 2);
  campaignReconnectTimer = window.setTimeout(() => {
    campaignReconnectTimer = null;
    void probeCampaignReconnect();
  }, wait);
}
async function probeCampaignReconnect() {
  if (campaignSession.changed || campaignTechConflict) return;
  if (campaignStorageAvailable || campaignReconnectInFlight) return;
  campaignReconnectInFlight = true;
  try {
    const response = await fetch(CAMPAIGN_STORAGE_URL, { cache: 'no-store' });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const payload = campaignSession.accept(await response.json());
    if (!payload.ok) throw new Error(payload.error || '读取失败');
    const hadQueuedSave = campaignSaveQueuedBeforeReady;
    campaignStorageAvailable = true;
    campaignSaveQueuedBeforeReady = false;
    campaignReconnectDelay = 2000;
    if (!adoptTechnologyCampaign(payload.campaign || {}, hadQueuedSave)) return;
    if (hadQueuedSave) queueCampaignTechnologySave();
    else setCampaignSaveStatus('已重新连接', 'saved');
  } catch (error) {
    console.warn(error);
    setCampaignSaveStatus('等待重连', 'offline');
  } finally {
    campaignReconnectInFlight = false;
    if (!campaignStorageAvailable) scheduleCampaignReconnect();
  }
}
function reconnectCampaignNow() {
  if (campaignStorageAvailable || campaignReconnectInFlight) return;
  window.clearTimeout(campaignReconnectTimer);
  campaignReconnectTimer = null;
  campaignReconnectDelay = 2000;
  void probeCampaignReconnect();
}

// 印刷在节点框下方的条件方格（见 PRINTED_CONDITION_BOXES）：每一格都要勾上，

function conditionCells(pageKey, node) {

function conditionCaptionText(node) {
  const groups = [node?.xlsm_special_requirements, node?.xlsm_special_leads_to];
  const captions = groups
    .flatMap(group => group?.conditions || [])
    .map(item => item.caption || item.text || '')
    .filter(Boolean);
  return [...new Set(captions)].join(' / ');
}
// 多格节点：数据里的条件条数常常少于印刷行数（底图上的文字没有全部进词典），

function conditionCellCaption(pageKey, node, index) {
  const cells = conditionCells(pageKey, node) || [];
  // 以图为准：先从底图上读出来的印刷文字里取（含与词典不一致的更正），没有再退回词典。
  const printed = PRINTED_CONDITION_TEXT[node?.id];
  if (printed) {
    if (cells.length === 1) return printed;
    // 多格节点：印刷文字里用 ' / ' 分隔各格（没分隔就每格都用同一条）
    const parts = printed.split(' / ');
    return parts.length === cells.length ? parts[index] : printed;
  }
  const conditions = [...new Set([...(node?.xlsm_special_requirements?.conditions || []), ...(node?.xlsm_special_leads_to?.conditions || [])]

  if (currentTab === 'gear-production' || currentTab === 'arsenal') void loadGearRecordState();
});
search.addEventListener('input', () => {
  applySearch();
  if (!search.value.trim() || currentTab === 'unlocked' || currentTab === 'gear-production' || currentTab === 'arsenal') return;
  const match = mainView.querySelector('.tech-module:not(.filtered) .node');
  if (match) focusTreeNode(match.dataset.nodeId);
});
hideUnknownToggle.addEventListener('change', () => {
  hideUnknownTech = hideUnknownToggle.checked;
  queueCampaignTechnologySave();
  syncHideUnknownToggle();
  refreshUnlockState();
});
mainView.addEventListener('change', (event) => {
  const target = event.target;
  if (target?.classList?.contains('tech-condition-input')) {
    toggleCondition(target.dataset.pageKey, target.dataset.nodeId, target.dataset.cellIndex, target.checked);
  }
});
languageToggle.addEventListener('click', () => {
  treeLanguage = treeLanguage === 'zh' ? 'en' : 'zh';
  queueCampaignTechnologySave();
  updateLanguageToggle();
  if (currentTab === 'unlocked') {
    renderUnlockedPage();
  } else if (currentTab === 'gear-production') {
    renderGearProductionPage();
  } else if (currentTab === 'arsenal') {
    renderArsenalPage();
  } else {
    renderTree();
  }
  if (activeUnlockedRecord) {
    const { page, node } = activeUnlockedRecord;
    if (activeModalMode === 'tree') showNodeModal(node);
    if (activeModalMode === 'unlocked') showUnlockedModal(page.key, node.id);
  }
});
function selectTechnologyCycle(cycleKey) {
  if (!data?.pages?.some(page => page.key === cycleKey) || cycleKey === currentCycle) return;
  currentCycle = cycleKey;
  unlockAutomaticCyclesThrough(currentCycle);
  selectedNodeId = null;
  saveAccounts();
  viewPage = currentCycle;
  currentTab = viewPage;
  renderCycleButton();
  renderTabs(true);
  renderTree();
  refreshUnlockState();
}
const cycleMenu = document.getElementById('cycleMenu');
cycleMenu.addEventListener('beforetoggle', event => {
  if (event.newState !== 'open') return;
  const rect = cycleBadge.getBoundingClientRect();
  cycleMenu.style.left = `${Math.max(8, Math.min(rect.left, window.innerWidth - 148))}px`;
  cycleMenu.style.top = `${rect.bottom + 4}px`;
});
cycleMenu.addEventListener('click', event => {
  const option = event.target.closest('button[data-cycle]');
  if (!option) return;
  cycleMenu.hidePopover();
  selectTechnologyCycle(option.dataset.cycle);
  cycleBadge.focus();
});
window.addEventListener('resize', () => cycleMenu.hidePopover());
clearUnlocked.addEventListener('click', () => {
  if (!confirm('重置当前账号的解锁进度？')) return;
  unlocked.clear();
  unimportant.clear();
  conditionTicked.clear();
  currentCycle = data.pages[0].key;
  viewPage = currentCycle;
  currentTab = viewPage;
  selectedNodeId = null;
  unlockAutomaticCyclesThrough(currentCycle);
  saveAccounts();
  renderCycleButton();
  renderTabs(true);
  renderTree();
  refreshUnlockState();
});
returnMain.addEventListener('click', saveAndReturnMain);
window.addEventListener('online', reconnectCampaignNow);
window.addEventListener('focus', reconnectCampaignNow);
function boot(appData) {
  data = appData;
  PAGE_INDEX = new Map(data.pages.map((page, index) => [page.key, index]));
  DISAMBIGUATED_TECH_NAMES = computeDisambiguatedTechNames(data.pages);
  accounts = loadAccounts();
  activeAccountId = 'default';
  if (!accounts[activeAccountId]) activeAccountId = Object.keys(accounts)[0];
  const params = new URLSearchParams(window.location.search);
  const requestedTechCycle = validPageKey(TECH_CYCLE_BY_MAIN_CYCLE[String(params.get('cycle') || '').toLowerCase()] || params.get('cycle'));
  currentCycle = requestedTechCycle || validPageKey(accounts[activeAccountId]?.currentCycle) || data.pages[0].key;
  viewPage = viewPageFor(currentCycle);
  restoreTechnologyTab();
  selectedNodeId = null;
  unlocked = new Set(accounts[activeAccountId]?.unlocked || []);
  unimportant = new Set(accounts[activeAccountId]?.unimportant || []);
  conditionTicked = new Set(accounts[activeAccountId]?.conditions || []);
  unlockAutomaticCyclesThrough(currentCycle);
  campaignTechBaseState = technologySectionState();
  updateLanguageToggle();
  syncHideUnknownToggle();
  renderAccountSelect();
  renderCycleButton();
  renderTabs();
  refreshUnlockState();
  loadCampaignTechnologySection();
}

loadDictionaryData().then(async (appData) => {
  await loadGearProductionData();
  boot(appData);
}).catch(showLoadError);
</script>
