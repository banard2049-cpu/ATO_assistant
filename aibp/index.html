<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIBP Apostle Viewer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #10100f;
      --panel: #181816;
      --panel-2: #22211e;
      --line: #3a3832;
      --text: #f0ede4;
      --muted: #aaa396;
      --accent: #b4342c;
      --gold: #c7ad72;
      --gap: 16px;
      --header-height: 42px;
      --pad: 10px;
      --side-card-image-height: 255px;
      --panel-image-height: calc(var(--side-card-image-height) * 2.2);
      --card-min: 126px;
      --card-max-width: calc(var(--side-card-image-height) * 63 / 89);
      --aibp-column-width: 424px;
      --draw-card-height: var(--side-card-image-height);
      --draw-card-width: calc(var(--draw-card-height) * 63 / 89);
      --radius: 14px;
      --shadow: 0 16px 42px rgba(0, 0, 0, 0.32);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 18% 0%, rgba(180, 52, 44, 0.18), transparent 34%),
        radial-gradient(circle at 82% 12%, rgba(199, 173, 114, 0.12), transparent 28%),
        linear-gradient(180deg, #12110f 0%, var(--bg) 52%, #080808 100%);
      color: var(--text);
      font-family: "Microsoft YaHei UI", "Segoe UI", Arial, sans-serif;
      letter-spacing: 0;
    }

    .app {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      min-height: 100vh;
    }

    aside {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
      border-right: 1px solid rgba(199, 173, 114, 0.18);
      background:
        linear-gradient(180deg, rgba(34, 33, 30, 0.94), rgba(13, 13, 12, 0.98));
      padding: 18px 14px;
      box-shadow: inset -1px 0 0 rgba(255, 255, 255, 0.03);
    }

    .sidebar-toggle {
      position: fixed;
      z-index: 30;
      top: 14px;
      left: 14px;
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      border: 1px solid rgba(199, 173, 114, 0.42);
      background: rgba(24, 24, 22, 0.94);
      color: var(--gold);
      font-size: 22px;
      line-height: 1;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.34);
    }

    .sidebar-toggle:hover {
      border-color: var(--gold);
      background: #261a18;
    }

    body:not(.sidebar-collapsed) .sidebar-toggle {
      left: 274px;
    }

    body.sidebar-collapsed .app {
      grid-template-columns: minmax(0, 1fr);
    }

    body.sidebar-collapsed aside {
      display: none;
    }

    body.sidebar-collapsed main {
      padding-left: 62px;
    }

    body.sidebar-collapsed .viewer {
      width: calc(100% + 40px);
      margin-left: -40px;
    }

    h1 {
      margin: 0 0 14px;
      color: var(--gold);
      font-size: 20px;
      line-height: 1.2;
    }

    .nav {
      display: grid;
      gap: 8px;
    }

    button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      font: inherit;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .nav button {
      width: 100%;
      min-height: 42px;
      padding: 10px 12px;
      border-radius: 10px;
      text-align: left;
    }

    .nav button:hover,
    .nav button.active,
    .segmented button.active {
      border-color: rgba(199, 173, 114, 0.55);
      background: linear-gradient(180deg, #2a1c19, #201716);
      box-shadow: inset 3px 0 0 var(--accent);
    }

    main {
      min-width: 0;
      padding: 22px;
      overflow: auto;
    }

    .title-row {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 14px;
    }

    .title-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
    }

    .apostle-title {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .map-faction-status {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      font-size: 12px;
      font-weight: 800;
    }

    .map-faction-chip {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 4px 8px;
      border: 1px solid rgba(199, 173, 114, 0.34);
      border-radius: 6px;
      background: rgba(24, 24, 22, 0.78);
      color: var(--gold);
      line-height: 1.2;
    }

    .map-faction-chip.muted {
      color: var(--muted);
      font-weight: 700;
    }

    .apostle-level-select {
      min-height: 36px;
      padding: 6px 10px;
      border: 1px solid rgba(199, 173, 114, 0.42);
      border-radius: 7px;
      background: #151411;
      color: var(--gold);
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .title-actions button,
    .title-actions .return-main-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 7px 12px;
      border-radius: 6px;
    }

    .title-actions .return-main-link {
      border: 1px solid rgba(199, 173, 114, 0.42);
      background: var(--panel);
      color: var(--gold);
      font-weight: 800;
      text-decoration: none;
      white-space: nowrap;
    }

    .title-actions .return-main-link:hover {
      border-color: var(--gold);
      background: #261a18;
    }

    h2 {
      margin: 0;
      font-size: 26px;
      line-height: 1.1;
    }

    .path {
      min-width: 0;
      color: var(--muted);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .viewer {
      display: flex;
      justify-content: safe center;
      align-items: flex-start;
      gap: var(--gap);
      margin-bottom: 18px;
      overflow: auto;
    }

    .section {
      flex: 0 0 auto;
      overflow: hidden;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }

    .section.extra-section {
      flex: 0 1 min(34vw, calc(var(--side-card-image-height) * 2.4));
      min-width: min(320px, 34vw);
      max-width: min(34vw, calc(var(--side-card-image-height) * 2.4));
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      height: var(--header-height);
      padding: 8px 11px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(42, 40, 36, 0.98), rgba(28, 27, 24, 0.98));
      color: var(--gold);
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    .section-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-header button {
      min-height: 28px;
      padding: 4px 8px;
      border-radius: 6px;
      border-color: rgba(199, 173, 114, 0.35);
      color: var(--gold);
      font-size: 12px;
      font-weight: 700;
    }

    .section-header button:hover {
      border-color: rgba(199, 173, 114, 0.7);
      background: #261a18;
    }

    .image-wrap {
      display: grid;
      place-items: center;
      padding: 0;
      background: transparent;
    }

    img {
      display: block;
      width: auto;
      max-width: none;
      border-radius: 4px;
    }

    .panel-image {
      height: var(--panel-image-height);
    }

    .panel-frame {
      position: relative;
      display: inline-block;
      line-height: 0;
    }

    .panel-state-marker {
      position: absolute;
      left: var(--marker-left, 50%);
      top: var(--marker-top, 50%);
      transform: translate(-50%, -50%);
      width: 64px;
      height: 64px;
      display: none;
      place-items: center;
      padding: 0;
      border: 3px solid rgba(255, 88, 82, 0.88);
      border-radius: 999px;
      background: rgba(255, 88, 82, 0.04);
      color: transparent;
      font-size: 0;
      font-weight: 0;
      line-height: 1;
      letter-spacing: 0;
      text-shadow: none;
      box-shadow:
        0 0 0 1px rgba(20, 8, 6, 0.62),
        0 0 10px rgba(255, 72, 66, 0.22),
        inset 0 0 8px rgba(255, 72, 66, 0.12);
      cursor: pointer;
      user-select: none;
      z-index: 3;
    }

    .panel-state-marker.show {
      display: grid;
    }

    .panel-state-marker.chimera-state-marker {
      width: var(--marker-width, 14%);
      height: var(--marker-height, 5%);
      border-width: 3px;
      border-radius: 8px !important;
      box-shadow:
        0 0 0 1px rgba(20, 8, 6, 0.62),
        0 0 12px rgba(255, 72, 66, 0.2),
        inset 0 0 8px rgba(255, 72, 66, 0.1);
    }

    .nietzsche-break-lock {
      position: absolute;
      left: var(--lock-left, 50%);
      top: var(--lock-top, 50%);
      transform: translate(-50%, -50%);
      width: 54px;
      height: 54px;
      border: 3px solid rgba(255, 88, 82, 0.94);
      border-radius: 999px;
      background: rgba(20, 8, 6, 0.2);
      box-shadow:
        0 0 0 1px rgba(20, 8, 6, 0.72),
        0 0 14px rgba(255, 72, 66, 0.34);
      pointer-events: none;
      z-index: 4;
    }

    .nietzsche-break-lock::before,
    .nietzsche-break-lock::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 38px;
      height: 5px;
      border-radius: 999px;
      background: rgba(255, 88, 82, 0.96);
      box-shadow: 0 0 8px rgba(255, 72, 66, 0.32);
    }

    .nietzsche-break-lock::before {
      transform: translate(-50%, -50%) rotate(45deg);
    }

    .nietzsche-break-lock::after {
      transform: translate(-50%, -50%) rotate(-45deg);
    }

    .state-button.hidden {
      display: none;
    }

    .state-button {
      border-color: rgba(199, 173, 114, 0.46);
      color: var(--gold);
      font-weight: 800;
    }

    .side-card-image {
      height: var(--side-card-image-height);
    }

    .side-stack {
      display: grid;
      grid-template-rows: repeat(2, max-content);
      gap: 10px;
      background: transparent;
      border: 0;
      box-shadow: none;
    }

    .extra-grid {
      display: grid;
      grid-auto-flow: column;
      grid-template-rows: repeat(2, max-content);
      grid-auto-columns: max-content;
      grid-auto-rows: max-content;
      gap: 10px;
      align-content: start;
      justify-content: start;
      width: 100%;
      max-width: 100%;
      max-height: calc(var(--side-card-image-height) * 2 + 10px);
      overflow: auto;
    }

    .extra-grid img {
      width: auto;
      height: var(--side-card-image-height);
      max-width: none;
      border: 1px solid var(--line);
      background: transparent;
    }

    .extra-grid img.panel-image {
      grid-row: span 2;
      height: calc(var(--side-card-image-height) * 2 + 10px);
    }

    .trait-dialog {
      width: min(980px, calc(100vw - 28px));
      max-height: min(760px, calc(100vh - 28px));
      padding: 0;
      border: 1px solid rgba(199, 173, 114, 0.28);
      border-radius: var(--radius);
      background: #141311;
      color: var(--text);
      box-shadow: 0 22px 70px rgba(0, 0, 0, 0.55);
    }

    .trait-dialog::backdrop {
      background: rgba(0, 0, 0, 0.7);
    }

    .trait-dialog form {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      max-height: inherit;
    }

    .trait-dialog-head,
    .trait-dialog-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(42, 40, 36, 0.98), rgba(28, 27, 24, 0.98));
    }

    .trait-dialog-actions {
      justify-content: flex-end;
      border-top: 1px solid var(--line);
      border-bottom: 0;
    }

    .trait-dialog-title {
      color: var(--gold);
      font-size: 15px;
      font-weight: 800;
    }

    .trait-dialog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(138px, 1fr));
      gap: 12px;
      padding: 14px;
      overflow: auto;
      background: #0b0b0a;
    }

    .trait-option {
      position: relative;
      display: grid;
      gap: 7px;
      min-width: 0;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      cursor: pointer;
    }

    .trait-option:hover,
    .trait-option:has(input:checked) {
      border-color: rgba(199, 173, 114, 0.72);
      background: #211916;
    }

    .trait-option input {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }

    .trait-option img {
      width: 100%;
      height: auto;
      max-height: 214px;
      object-fit: contain;
      border: 1px solid rgba(199, 173, 114, 0.18);
      background: #0b0b0a;
    }

    .trait-option span {
      min-width: 0;
      color: var(--muted);
      font-size: 11px;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .trait-dialog-actions button {
      min-height: 34px;
      padding: 6px 12px;
      border-radius: 7px;
    }

    .cards-panel {
      width: 85%;
      max-width: 85%;
      margin: 0 auto;
      border: 1px solid rgba(199, 173, 114, 0.18);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(31, 30, 27, 0.96), rgba(18, 18, 16, 0.98));
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .cards-toolbar {
      display: flex;
      align-items: center;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
      background: var(--panel-2);
    }

    .cards-toolbar h3 {
      margin: 0;
      color: var(--gold);
      font-size: 14px;
      line-height: 1.1;
    }

    .deck-info {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      color: var(--muted);
      font-family: Consolas, "Microsoft YaHei UI", monospace;
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
    }

    .deck-info span {
      color: var(--text);
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.4px;
    }

    .card-title-with-back {
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-width: max-content;
    }

    .draw-panel {
      display: contents;
    }

    .draw-box {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      align-items: start;
      justify-content: stretch;
      margin-bottom: 8px;
      padding: 6px;
      width: 100%;
      max-width: 100%;
      border: 1px solid rgba(199, 173, 114, 0.18);
      border-radius: 12px;
      background:
        radial-gradient(circle at 100% 0%, rgba(199, 173, 114, 0.08), transparent 34%),
        #141412;
    }

    .draw-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-content: start;
      align-items: center;
      width: 100%;
    }

    .draw-actions button,
    .draw-panel button {
      flex: 0 0 auto;
      min-width: 58px;
      min-height: 24px;
      padding: 3px 6px;
      border-radius: 7px;
      font-size: 11px;
      line-height: 1.05;
      white-space: nowrap;
      transition: transform 140ms ease, border-color 140ms ease, background 140ms ease;
    }



    .draw-actions .damage-target {
      flex: 1 1 100%;
      min-height: 24px;
      padding: 3px 5px;
      border-radius: 7px;
      font-size: 12px;
    }

    .draw-actions .damage-target select {
      min-height: 24px;
      padding: 1px 5px;
      font-size: 12px;
    }

    .draw-actions button:not(:disabled):hover,
    .draw-panel button:not(:disabled):hover,
    .title-actions button:hover {
      transform: translateY(-1px);
      border-color: rgba(199, 173, 114, 0.58);
      background: #241916;
    }

    #drawAiButton,
    #drawBpButton {
      min-width: 104px;
      min-height: 54px;
      padding: 12px 16px;
      border-color: rgba(199, 173, 114, 0.58);
      border-radius: 8px;
      background: linear-gradient(180deg, #2a1c19, #1a1513);
      color: var(--gold);
      font-size: 15px;
      font-weight: 800;
      line-height: 1.1;
      box-shadow: inset 3px 0 0 var(--accent), 0 8px 18px rgba(0, 0, 0, 0.24);
    }

    .draw-preview {
      width: calc(var(--draw-card-width) + 8px);
      height: calc(var(--draw-card-height) + 8px);
      max-width: 100%;
      display: grid;
      place-items: center;
      justify-self: center;
      align-self: start;
      padding: 4px;
      border: 1px solid rgba(199, 173, 114, 0.18);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.03), transparent 36%),
        #0b0b0a;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      aspect-ratio: 63 / 89;
      cursor: pointer;
      transition: border-color 140ms ease, background 140ms ease;
    }

    .draw-preview.has-card {
      cursor: zoom-in;
    }

    .draw-preview:not(.has-card):hover {
      border-color: rgba(199, 173, 114, 0.58);
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.04), transparent 36%),
        #181511;
    }

    .draw-preview img {
      width: auto;
      max-width: var(--draw-card-width);
      height: auto;
      max-height: var(--draw-card-height);
      object-fit: contain;
      border-radius: 7px;
    }

    .segmented {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px;
    }

    .segmented button {
      min-width: 48px;
      min-height: 26px;
      padding: 3px 6px;
      border-radius: 6px;
    }

    .aibp-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 0;
      padding: 0;
      width: 100%;
    }

    .aibp-layout.ai-only {
      grid-template-columns: minmax(0, 1fr);
    }

    .card-column {
      min-width: 0;
      padding: 10px;
      width: 100%;
    }

    .card-column + .card-column {
      border-left: 1px solid rgba(199, 173, 114, 0.14);
    }

    .card-column-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }

    .card-column-title {
      margin: 0;
      color: var(--gold);
      font-size: 15px;
      font-weight: 700;
      text-align: left;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(var(--card-min), var(--card-max-width)));
      justify-content: start;
      gap: 14px;
    }

    .card-grid img {
      width: 100%;
      height: auto;
      max-width: var(--card-max-width);
      max-height: var(--side-card-image-height);
      justify-self: center;
      object-fit: contain;
      background: #0b0b0a;
      border: 1px solid rgba(199, 173, 114, 0.18);
      border-radius: 10px;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.28);
    }

    .damage-target {
      display: none;
      gap: 5px;
      align-items: start;
      color: var(--muted);
      font-size: 12px;
    }

    .damage-target.show {
      display: grid;
    }

    .chimera-only-action {
      display: none;
    }

    .chimera-only-action.show {
      display: inline-grid;
      align-items: center;
    }

    .labyrinthauros-only-action {
      display: none;
    }

    .labyrinthauros-only-action.show {
      display: inline-grid;
      align-items: center;
    }

    .hermesian-only-action {
      display: none;
    }

    .hermesian-only-action.show {
      display: inline-grid;
      align-items: center;
    }

    .oracle-only-action {
      display: none;
    }

    .oracle-only-action.show {
      display: inline-grid;
      align-items: center;
    }

    .titan-x-only-action {
      display: none;
    }

    .titan-x-only-action.show {
      display: inline-grid;
      align-items: center;
    }

    .damage-target select {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #151411;
      color: var(--text);
      padding: 5px 8px;
      font: inherit;
    }

    .card-tile {
      position: relative;
      min-width: 0;
    }

    .damage-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      min-width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(180, 52, 44, 0.92);
      color: #fff;
      font-weight: 800;
      font-size: 15px;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.38);
    }

    .bp-damage-summary {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: fit-content;
      padding: 4px 10px;
      border: 1px solid rgba(180, 52, 44, 0.45);
      border-radius: 999px;
      background: rgba(180, 52, 44, 0.16);
      color: #ffd6d2;
      font-size: 13px;

    function canUndo(name, type = "") {
      const stack = undoStacks[name] || [];
      const entry = stack[stack.length - 1];
      if (!entry) return false;
      if (!type) return true;
      return entry.scope === type || entry.scope === "AIBP";
    }

    function undoLastAibp(type = "") {

      const entry = stack[stack.length - 1];

      stack.pop();
      piles[currentApostle] = clonePileState(entry.state);

    function ensurePiles(name) {

        piles[name].AI.deck ||= [];
        piles[name].AI.discard ||= [];

        piles[name].AI.removed ||= [];

          const oracleAiCollections = [

            piles[name].AI.discard,
            piles[name].AI.removed,

          const migrateOracleAiIII = (cards) => (cards || [])
            .filter((card) => !(card?.type === "AI" && card.level === "III" && card.index === 1))
            .map((card) => card?.type === "AI" && card.level === "III" && card.index >= 2 && card.index <= 7
              ? { ...card, index: card.index - 1 }

          if (hasLegacyOracleAiIII) {
            piles[name].AI.deck = migrateOracleAiIII(piles[name].AI.deck);
            piles[name].AI.discard = migrateOracleAiIII(piles[name].AI.discard);

            piles[name].AI.supply.III = migrateOracleAiIII(piles[name].AI.supply.III);

              piles[name].AI.pending = piles[name].AI.pending.index === 1

        piles[name].BP.supply ||= { I: [], II: supplyPile("BP", "II"), III: supplyPile("BP", "III") };
        piles[name].BP.supply.I ||= [];
        piles[name].BP.supply.II ||= [];
        piles[name].BP.supply.III ||= [];
        piles[name].BP.removed ||= [];
        if (!hasBpDeck(name)) {
          piles[name].BP = {
            deck: [],
            discard: [],

          if (name === "HYPERTIME_ORACLE" && card?.type === "TR" && !card.scope && card.level === "O" && card.index === 1) {
            return { ...card, level: "IV" };

            return { ...card, level: "COMMON", scope: "common" };

          return card;
        });
        if (name === nietzscheName) {
          const migratedTraits = [];
          const migratedKeys = new Set();
          piles[name].traits.forEach((card) => {
            const migrated = card?.type === "TR" && (card.level === "I" || card.level === "X") && (card.index === 1 || card.index === 2)

            const key = `${migrated?.type || "TR"}-${migrated?.level}-${migrated?.index}-${migrated?.ext || "jpg"}`;

        }
      }
    }

    function parseApostleLevel(value) {
      const text = String(value || "").toUpperCase();
      const arabic = text.match(/(?:^|[^0-9])([1-9])(?:[^0-9]|$)/);
      if (arabic) return Number(arabic[1]);
      const roman = text.match(/(?:^|[^IVX])(VIII|VII|III|IX|VI|IV|II|V|I)(?:[^IVX]|$)/);
      return roman
        ? ({ I: 1, II: 2, III: 3, IV: 4, V: 5, VI: 6, VII: 7, VIII: 8, IX: 9 }[roman[1]] || 0)
        : 0;
    }

    function recordLevelForTrack(recordState, track) {
      if (Array.isArray(track)) {
        return track.reduce((max, item) => Math.max(max, recordLevelForTrack(recordState, item)), 0);
      }
      if (!recordState?.enemies || !track) return 0;
      let level = parseApostleLevel(recordState.enemies[track.key]);
      Object.entries(recordState.enemies).forEach(([key, active]) => {
        if (!active || !key.startsWith(`${track.cycle}:`)) return;
        const parts = key.split(":");
        const isDirect = parts[1] === track.key;
        const isShared = parts[1] === "shared" && (parts[2] || "").split("+").includes(track.key);
        if (!isDirect && !isShared) return;
        level = Math.max(level, parseApostleLevel(parts.at(-1)));
      });
      return level;
    }

        { value: 7, label: "友善", bonus: 1 },
        { value: 12, label: "结盟", bonus: 2 },
      ],
      c3: [
        { value: -10, label: "开战", bonus: -3 },
        { value: -5, label: "恶劣", bonus: -2 },
        { value: -2, label: "交恶", bonus: -1 },
        { value: 0, label: "中立", bonus: 0 },
        { value: 4, label: "友善", bonus: 1 },
        { value: 8, label: "结盟", bonus: 2 },
      ],
    };

    function formatSignedNumber(value) {
      return value > 0 ? `+${value}` : String(value);
    }

    function allCycleFactionIds(cycleId) {
      return Object.keys(mapFactionLabelsByCycle[cycleId] || {}).filter((id) => id !== "none");
    }

    function factionLabel(cycleId, factionId) {
      return mapFactionLabelsByCycle[cycleId]?.[factionId] || factionId;
    }

    function diplomacyValue(recordState, cycleId, factionId) {
      const diplomacy = recordState?.diplomacy && typeof recordState.diplomacy === "object" ? recordState.diplomacy : {};
      const raw = diplomacy[`${cycleId}-${factionId}`] ?? diplomacy[factionId];
      if (raw === "" || raw === null || raw === undefined) return null;
      const value = Number(raw);
      return Number.isFinite(value) ? value : null;
    }

    function diplomacyStatus(cycleId, value) {
      const markers = diplomacyMarkersByCycle[cycleId] || [];
      let status = markers[0] || { label: "未分级", bonus: 0 };
      markers.forEach((marker) => {
        if (value >= marker.value) status = marker;
      });
      return status;
    }

    function factionStatusText(recordState, cycleId, factionId) {
      const value = diplomacyValue(recordState, cycleId, factionId);
      if (value === null) return `${factionLabel(cycleId, factionId)}：未记录`;
      const status = diplomacyStatus(cycleId, value);
      return `${factionLabel(cycleId, factionId)}：${status.label} ${formatSignedNumber(status.bonus)}`;
    }

    function dashboardMapFactions(dashboardCycle) {
      const cycleId = dashboardCycle?.cycleId || "";
      const state = dashboardCycle?.state || {};
      let factions = Array.isArray(state.mapCurrentTileFactions)
        ? state.mapCurrentTileFactions
        : (Array.isArray(state.mapSnapshot?.currentTileFactions) ? state.mapSnapshot.currentTileFactions : []);
      const tileId = state.mapSnapshot?.currentTileId || "";
      if (!factions.length && cycleId && tileId) {
        const entry = window.ATO_MAP_TILE_TAGS?.tiles?.[`${cycleId}:${tileId}`];
        factions = Array.isArray(entry?.factions) ? entry.factions : [];
      }
      return {
        cycleId,
        tileId,
        factions: [...new Set(factions.map((id) => String(id || "").trim()).filter(Boolean))]
      };
    }

    function renderMapFactionStatus() {
      if (!mapFactionStatus) return;
      mapFactionStatus.innerHTML = "";
      const { cycleId, factions, record } = campaignMapFactionState;
      const chip = document.createElement("span");
      chip.className = "map-faction-chip";

      if (!cycleId || !factions.length) {
        chip.classList.add("muted");
        chip.textContent = "AG：未同步地图阵营";
        mapFactionStatus.appendChild(chip);
        return;
      }
      if (factions.includes("none")) {
        chip.classList.add("muted");
        chip.textContent = "AG：无阵营";
        mapFactionStatus.appendChild(chip);
        return;
      }

      const hereText = factions.map((id) => factionStatusText(record, cycleId, id)).join(" / ");
      const otherFactionIds = allCycleFactionIds(cycleId).filter((id) => !factions.includes(id));
      const otherText = otherFactionIds.map((id) => factionStatusText(record, cycleId, id)).join("；");
      chip.textContent = otherText ? `${hereText}（其他：${otherText}）` : hereText;
      mapFactionStatus.appendChild(chip);
    }

    function applyCampaignMapFactionState(campaign) {
      const dashboardCycle = activeDashboardCycleFromCampaign(campaign);
      const mapState = dashboardMapFactions(dashboardCycle);
      campaignMapFactionState = {
        ...mapState,
        record: recordStateFromCampaign(campaign)
      };
      renderMapFactionStatus();
    }

    async function refreshCampaignMapFactionState() {
      if (campaignMapFactionRefreshInFlight) return;
      campaignMapFactionRefreshInFlight = true;
      try {
        const response = await fetch(recordStorageUrl, { cache: "no-store" });
        if (!response.ok) return;
        const payload = await response.json();
        applyCampaignMapFactionState(payload?.campaign);
      } catch {
        renderMapFactionStatus();
      } finally {
        campaignMapFactionRefreshInFlight = false;
      }
    }

    async function refreshRecordApostleLevels() {
      try {
        const response = await fetch(recordStorageUrl, { cache: "no-store" });
        if (!response.ok) return;
        const payload = await response.json();
        applyCampaignMapFactionState(payload?.campaign);
        const recordState = recordStateFromCampaign(payload?.campaign);
        if (!recordState) return;
        recordApostleLevels = Object.fromEntries(
          Object.entries(apostleRecordTracks).map(([apostle, track]) => [
            apostle,
            recordLevelForTrack(recordState, track)
          ])
        );
        renderApostleTitle();
        applyCurrentApostleLevelBonuses();
        renderCriticalMassSlot();
        renderExtraCards();
        renderAibpCards();
        renderPanelTokens();
      } catch {
        // 离线或 file:// 打开时继续使用手动等级。
      }
    }

    function apostleLevelFor(name) {
      if (fixedLevelOneApostles.has(name)) return 1;
      const override = Number(apostleLevelOverrides[name]);
      if (override >= 1 && override <= maxApostleLevel) return override;
      const recordLevel = Number(recordApostleLevels[name]);
      if (recordLevel >= 1 && recordLevel <= maxApostleLevel) return recordLevel;
      return 1;
    }

    function currentApostleLevel() {
      return apostleLevelFor(currentApostle);
    }

    function renderApostleTitle() {
      const level = currentApostleLevel();
      title.textContent = `${currentApostle.replaceAll("_", " ")} · ${levelRoman[level] || level}`;
      renderMapFactionStatus();
      const fixedAtOne = fixedLevelOneApostles.has(currentApostle);
      apostleLevelSelect.disabled = fixedAtOne;
      apostleLevelSelect.value = !fixedAtOne && apostleLevelOverrides[currentApostle]
        ? String(apostleLevelOverrides[currentApostle])
        : "";
      const recordLevel = Number(recordApostleLevels[currentApostle]) || 0;
      apostleLevelSelect.options[0].textContent = fixedAtOne
        ? "固定等级 I"
        : recordLevel
          ? `跟随记录表（${levelRoman[recordLevel] || recordLevel}）`
          : "跟随记录表（未读取）";
      document.querySelectorAll("#nav button[data-name]").forEach((button) => {
        const name = button.dataset.name;
        const navLevel = apostleLevelFor(name);
        button.textContent = `${name.replaceAll("_", " ")} · ${levelRoman[navLevel] || navLevel}`;
      });
    }

    function bpViewsForCurrentApostle() {
      return isChimera() ? chimeraBpViews : normalBpViews;
    }

    function currentBpDamageKey() {
      if (!isChimera()) return "damage";
      return bpDamageTargetSelect.value === "damage2" ? "damage2" : "damage1";
    }

    function currentBpDamageView() {
      if (!isChimera()) return "损伤";
      return currentBpDamageKey() === "damage2" ? "第二损伤堆" : "常规损伤堆";
    }

    function bpDamageValue(card) {
      if (!card) return 0;
      if (card.special === "DW" || card.level === "III") return 2;
      return Math.max(1, Math.floor(Number(card.damageValue) || 1));
    }

    function notifyBpWound(card) {
      window.C45Specials?.recordBpCardDamage?.(card);
      window.C45Specials?.recordBpWound?.(bpDamageValue(card));
    }

    function bpDamageTotalForKey(key) {
      ensurePiles(currentApostle);
      const cards = piles[currentApostle].BP[key] || [];
      return cards.reduce((sum, card) => sum + bpDamageValue(card), 0);
    }

    function currentBpDamageSummary() {
      if (!isChimera()) {
        return { total: bpDamageTotalForKey("damage") };
      }
      const damage1 = bpDamageTotalForKey("damage1");
      const damage2 = bpDamageTotalForKey("damage2");
      return { total: damage1 + damage2, damage1, damage2 };
    }

    function pushBpDamage(card) {
      ensurePiles(currentApostle);
      const damageKey = currentBpDamageKey();
      if (isChimera() && damageKey === "damage2") {
        addChimeraSecondDamage(card);
        return;
      }
      piles[currentApostle].BP[damageKey].push(card);
      if (isCyclonus() || currentApostle === "HEKATON" || currentApostle === "HYPERTIME_ORACLE") {
        addCriticalMass(bpDamageValue(card));
      }
      notifyBpWound(card);
    }

    function hasCriticalMassFeature() {
      return criticalMassApostles.has(currentApostle);
    }

    function criticalMassToken() {
      if (!hasCriticalMassFeature()) return null;
      return piles[currentApostle].tokens.find((item) =>
        item.criticalMass === true || item.chimeraCriticalMass === true
      ) || null;
    }

    function c45PanelCounterKind(name = currentApostle) {
      if (name === "MIDASCORE") return "midascorePain";
      if (name === "DEMIDJINN") return "demidjinn";
      if (name === "DRAGON_OF_PHOBOS") return "dragon";
      if (name === "MEDUKETOS") return "meduketos";
      return "";
    }

    function c45PanelCounterToken() {
      const kind = c45PanelCounterKind();
      if (!kind) return null;
      return piles[currentApostle].tokens.find((item) =>
        kind === "midascorePain"
          ? item.midascorePain === true
          : item.c45PanelCounter === kind
      ) || null;
    }

    function c45PanelCounterThreshold() {
      if (currentApostle === "MIDASCORE") return 5;
      if (currentApostle === "DRAGON_OF_PHOBOS") {
        return currentApostleLevel() >= 4 ? 3 : 4;
      }
      return 3;
    }

    function currentC45PanelCounterPosition() {
      if (currentApostle === "DEMIDJINN") return demidjinnPanelCounterPosition;
      return currentApostle === "DRAGON_OF_PHOBOS"
        ? dragonPanelCounterPosition
        : c45PanelCounterPosition;
    }

    function hasPanelCounterSlot(name = currentApostle) {
      return criticalMassApostles.has(name) || Boolean(c45PanelCounterKind(name));
    }

    function currentCriticalMassPosition() {
      if (currentApostle === "HEKATON") return hekatonCriticalMassPosition;
      if (currentApostle === "HYPERTIME_ORACLE") return oracleCriticalMassPosition;
      return criticalMassPosition;
    }

    function criticalMassThreshold() {
      return isCyclonus() || currentApostle === "HYPERTIME_ORACLE" ? 4 : 3;
    }

    function addCriticalMass(amount = 1) {
      if (!hasCriticalMassFeature() || currentApostleLevel() < 2) return false;
      const increment = Math.max(0, Math.floor(Number(amount) || 0));
      if (increment <= 0) return false;

      const existing = criticalMassToken();
      if (existing) {
        existing.criticalMass = true;
        delete existing.chimeraCriticalMass;
        existing.count = clampTokenCount((Number(existing.count) || 0) + increment);
      } else {
        const position = currentCriticalMassPosition();
        piles[currentApostle].tokens.push({
          id: createTokenStackId(),
          file: criticalMassTokenFile,
          count: clampTokenCount(increment),
          x: position.x,
          y: position.y,
          criticalMass: true
        });
      }
      renderPanelTokens();
      return true;
    }

    function addChimeraSecondDamage(card) {
      ensurePiles(currentApostle);
      piles[currentApostle].BP.damage2.push(card);
      addCriticalMass(1);
    }

    function addCriticalMassFromSlot() {
      if (c45PanelCounterKind()) {
        window.C45Specials?.handlePanelCounterTokenClick?.();
        return;
      }
      if (!hasCriticalMassFeature() || currentApostleLevel() < 2 || criticalMassToken()) return;
      rememberUndo(currentApostle, "BP");
      addCriticalMass(1);
      savePiles();
      renderAibpCards();
    }

    function resolveCriticalMass() {
      if (!hasCriticalMassFeature()) return;
      const token = criticalMassToken();
      if (!token || (Number(token.count) || 0) < criticalMassThreshold()) return;

      if (currentApostle === "HEKATON") {
        rememberUndo(currentApostle, "AIBP");
        piles[currentApostle].tokens = piles[currentApostle].tokens.filter((item) => item.id !== token.id);
        savePiles();
        renderPanelTokens();
        const signatureImg = document.getElementById("signatureCardImage");
        if (signatureImg) {
          openImageZoom(
            signatureImg.dataset.frontSrc || signatureImg.currentSrc || signatureImg.src,
            "HEKATON 标志行为",
            null,
            { cardTokens: currentPanelCardTokens("AI") }
          );
        }
        return;
      }

      const ai = piles[currentApostle]?.AI;
      if (!ai || ai.pending || (ai.deck.length === 0 && ai.discard.length === 0)) return;

      rememberUndo(currentApostle, "AIBP");
      piles[currentApostle].tokens = piles[currentApostle].tokens.filter((item) => item.id !== token.id);
      savePiles();
      renderPanelTokens();
      drawAi(false);
    }

    function handleCriticalMassTokenClick() {
      if (!hasCriticalMassFeature()) return;
      const token = criticalMassToken();
      if (!token) return;
      if ((Number(token.count) || 0) >= criticalMassThreshold()) {
        resolveCriticalMass();
        return;
      }

      rememberUndo(currentApostle, "BP");
      addCriticalMass(1);
      savePiles();
      renderAibpCards();
      renderPanelTokens();
    }

    function chimeraPhaseForCard(card) {
      const fileName = cardFileName(card, chimeraName);
      const map = window.CHIMERA_BP_STATUS_MAP || {};
      const phase = String(map[fileName] || "").toUpperCase();
      return chimeraPhaseStates[phase] ? phase : "";
    }

    function setChimeraPhaseFromCard(card) {
      if (!isChimera()) return;
      const phase = chimeraPhaseForCard(card);
      if (!phase) return;
      piles[currentApostle].chimeraPhase = phase;
      const marker = panelWrap.querySelector(".panel-state-marker");
      updateNietzscheStateUi(marker);
    }

    function cardSrc(card) {
      if (card.special) {
        return `ps/other/${card.special}.jpg`;
      }
      return `ps/${currentApostle}/${cardFileName(card)}`;
    }

    function cardAlt(card) {
      if (card.special) {
        return `${card.special} 特殊损伤`;
      }
      if (card.damageValue && card.damageValue > 1) {
        return `${card.type} ${card.level} ${card.index}，视作 ${card.damageValue} 个损伤`;
      }
      return `${card.type} ${card.level} ${card.index}`;
    }

    function renderCardsIntoGrid(grid, cards, emptyText, type = "", view = "") {
      grid.replaceChildren();

      if (cards.length === 0) {
        const empty = document.createElement("div");
        empty.className = "missing";
        empty.textContent = emptyText;
        grid.appendChild(empty);
        return;
      }

      cards.forEach((card, index) => {
        const tile = document.createElement("div");
        tile.className = "card-tile";
        if (type && view) {
          tile.dataset.cardType = type;
          tile.dataset.cardView = view;
          tile.dataset.cardIndex = String(index);
        }
        const src = cardSrc(card);
        const img = imageOrMessage(src, cardAlt(card));
        img.addEventListener("load", () => enableOptionalCardBack(img, src), { once: true });
        tile.appendChild(img);
        if (card.damageValue && card.damageValue > 1) {
          const badge = document.createElement("div");
          badge.className = "damage-badge";
          badge.textContent = `×${card.damageValue}`;
          tile.appendChild(badge);
        }
        grid.appendChild(tile);
      });
    }

    function cardsForView(type, view) {
      ensurePiles(currentApostle);
      if (type === "AI" && view === "闪粉牌组") {
        return piles[currentApostle].flare.deck;
      }
      if (type === "AI" && view === "闪粉弃牌") {
        return piles[currentApostle].flare.discard;
      }
      if (type === "AI" && view === "变招牌组") {
        return piles[currentApostle].feint.deck;
      }
      if (type === "AI" && view === "生效变招") {
        return piles[currentApostle].feint.active;
      }
      if (type === "AI" && view === "移除变招") {
        return piles[currentApostle].feint.removed;
      }
      if (view === "当前") {
        return piles[currentApostle][type].deck;
      }
      if (view === "弃牌") {
        return piles[currentApostle][type].discard;
      }
      if (type === "AI" && view === "移除") {
        return piles[currentApostle].AI.removed;
      }
      if (type === "BP" && view === "损伤") {
        return piles[currentApostle].BP.damage;
      }
      if (type === "BP" && (view === "损伤1" || view === "常规损伤堆")) {
        return piles[currentApostle].BP.damage1;
      }
      if (type === "BP" && (view === "损伤2" || view === "第二损伤堆")) {
        return piles[currentApostle].BP.damage2;
      }
      if (type === "BP" && view === "移除") {
        return piles[currentApostle].BP.removed;
      }
      if (["I", "II", "III"].includes(view)) {
        return piles[currentApostle][type].supply[view] || [];
      }
      return [];
    }

    function pileLocationForView(type, view) {
      if (type === "AI" && view === "闪粉牌组") {
        return { type, owner: "flare", key: "deck", view, label: "闪粉牌组" };
      }
      if (type === "AI" && view === "闪粉弃牌") {
        return { type, owner: "flare", key: "discard", view, label: "闪粉弃牌" };
      }
      if (type === "AI" && view === "变招牌组") {
        return { type, owner: "feint", key: "deck", view, label: "变招牌组" };
      }
      if (type === "AI" && view === "生效变招") {
        return { type, owner: "feint", key: "active", view, label: "生效变招" };
      }
      if (type === "AI" && view === "移除变招") {
        return { type, owner: "feint", key: "removed", view, label: "移除变招" };
      }
      if (view === "当前") {
        return { type, owner: type, key: "deck", view, label: "抽牌堆" };
      }
      if (view === "弃牌") {
        return { type, owner: type, key: "discard", view, label: "弃牌堆" };
      }
      if (type === "AI" && view === "移除") {
        return { type, owner: "AI", key: "removed", view, label: "移出游戏" };
      }
      if (type === "BP" && view === "损伤") {
        return { type, owner: "BP", key: "damage", view, label: "损伤堆" };
      }
      if (type === "BP" && (view === "损伤1" || view === "常规损伤堆")) {
        return { type, owner: "BP", key: "damage1", view, label: "常规损伤堆" };
      }
      if (type === "BP" && (view === "损伤2" || view === "第二损伤堆")) {
        return { type, owner: "BP", key: "damage2", view, label: "第二损伤堆" };
      }
      if (type === "BP" && view === "移除") {
        return { type, owner: "BP", key: "removed", view, label: "移出游戏" };
      }
      if (["I", "II", "III"].includes(view)) {
        return { type, owner: type, key: "supply", level: view, view, label: `${view} 备用牌堆` };
      }
      return null;
    }

    function pileArrayForLocation(location, create = false) {
      if (!location) return null;
      ensurePiles(currentApostle);
      if (location.owner === "flare") {
        piles[currentApostle].flare[location.key] ||= [];
        return piles[currentApostle].flare[location.key];
      }

      const pile = piles[currentApostle][location.owner];
      if (!pile) return null;
      if (location.key === "supply") {
        if (create) pile.supply[location.level] ||= [];
        return pile.supply[location.level] || null;
      }
      if (create) pile[location.key] ||= [];
      return pile[location.key] || null;
    }

    function samePileLocation(left, right) {
      return Boolean(left && right)
        && left.owner === right.owner
        && left.key === right.key
        && (left.level || "") === (right.level || "");
    }

    function sameMoveCard(left, right) {
      if (!left || !right) return false;
      if (left.special || right.special) {
        return left.special === right.special && (left.damageValue || 1) === (right.damageValue || 1);
      }
      return sameCard(left, right)
        && (left.damageValue || 1) === (right.damageValue || 1)
        && Boolean(left.specialBp) === Boolean(right.specialBp);
    }

    function addMoveTarget(targets, context, location, label, placement = "end") {
      if (!location) return;
      if (samePileLocation(context.source, location)) {
        if (placement !== "top" || location.key !== "deck" || context.index <= 0) return;
      }
      targets.push({ location, label, placement });
    }

    function moveTargetsForContext(context) {
      const targets = [];
      if (!context) return targets;

      if (context.source.owner === "flare") {
        addMoveTarget(targets, context, pileLocationForView("AI", "闪粉牌组"), "到闪粉牌组");
        addMoveTarget(targets, context, pileLocationForView("AI", "闪粉弃牌"), "到闪粉弃牌");
        return targets;
      }
      if (context.source.owner === "feint") {
        addMoveTarget(targets, context, pileLocationForView("AI", "变招牌组"), "洗回变招牌组", "random");
        addMoveTarget(targets, context, pileLocationForView("AI", "生效变招"), "留在场上");
        addMoveTarget(targets, context, pileLocationForView("AI", "移除变招"), "从变招牌组移除");
        return targets;
      }

      addMoveTarget(targets, context, pileLocationForView(context.type, "当前"), "到抽牌堆", "random");
      addMoveTarget(targets, context, pileLocationForView(context.type, "当前"), "到抽牌堆顶", "top");
      addMoveTarget(targets, context, pileLocationForView(context.type, "弃牌"), "到弃牌堆");

      if (context.type === "BP") {
        if (isChimera()) {
          addMoveTarget(targets, context, pileLocationForView("BP", "常规损伤堆"), "到常规损伤堆");
          addMoveTarget(targets, context, pileLocationForView("BP", "第二损伤堆"), "到第二损伤堆");
        } else {
          addMoveTarget(targets, context, pileLocationForView("BP", "损伤"), "到损伤堆");
        }
      }

      addMoveTarget(targets, context, pileLocationForView(context.type, "移除"), "移出游戏");
      addMoveTarget(targets, context, pileLocationForView(context.type, "II"), "到 II 备用");
      addMoveTarget(targets, context, pileLocationForView(context.type, "III"), "到 III 备用");
      return targets;
    }

    function moveContextFromImage(img) {
      const tile = img?.closest(".card-tile");
      if (!tile || (!tile.closest("#aiGrid") && !tile.closest("#bpGrid"))) return null;
      const type = tile.dataset.cardType;
      const view = tile.dataset.cardView;
      const index = Number(tile.dataset.cardIndex);
      if (!["AI", "BP"].includes(type) || !Number.isInteger(index)) return null;

      const source = pileLocationForView(type, view);
      const sourceCards = pileArrayForLocation(source);
      const card = sourceCards?.[index];
      if (!card) return null;

      return {
        type,
        view,
        index,
        source,
        card: clonePileState(card)
      };
    }

    function flipContextFromImage(img) {
      if (!img?.dataset?.frontSrc || !img?.dataset?.backSrc) return null;
      return {
        frontSrc: img.dataset.frontSrc,
        backSrc: img.dataset.backSrc,
        sourceId: img.id || "",
        face: img.dataset.face || "front"
      };
    }

    function tokenContextFromImage(img) {
      const tokenItem = img?.closest(".panel-token-item");
      if (!tokenItem?.dataset?.tokenId) return null;
      return {
        apostle: currentApostle,
        tokenId: tokenItem.dataset.tokenId,
        file: tokenItem.dataset.file
      };
    }

    function placeCardInTarget(target, card) {
      const targetCards = pileArrayForLocation(target.location, true);
      if (!targetCards) return false;
      if (target.placement === "top") {
        targetCards.unshift(card);
      } else if (target.placement === "random") {
        insertRandom(targetCards, card);
      } else {
        targetCards.push(card);
      }
      return true;
    }

    function moveVisibleCard(context, target) {
      const sourceCards = pileArrayForLocation(context?.source);
      if (!sourceCards || !target?.location) return;

      let sourceIndex = context.index;
      if (!sameMoveCard(sourceCards[sourceIndex], context.card)) {
        sourceIndex = sourceCards.findIndex((card) => sameMoveCard(card, context.card));
      }
      if (sourceIndex < 0) return;

      rememberUndo(currentApostle, context.type);
      const [card] = sourceCards.splice(sourceIndex, 1);
      placeCardInTarget(target, card);
      if (isChimera() && target.location.owner === "BP" && target.location.key === "damage2") {
        addCriticalMass(1);
      } else if ((isCyclonus() || currentApostle === "HEKATON" || currentApostle === "HYPERTIME_ORACLE")
        && target.location.owner === "BP"
        && target.location.key === "damage") {
        addCriticalMass(bpDamageValue(card));
      }
      if (target.location.owner === "BP" && target.location.key === "damage") {
        notifyBpWound(card);
      }
      savePiles();
      renderAibpCards();
    }

    function deckBackText(cards) {
      if (cards.length === 0) return "空";
      return cards.map((card) => levelBack[card.level] || card.level).join("-");
    }

    function shuffleCards(cards) {
      const shuffled = cards.slice();
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    function insertRandom(deck, card) {
      if (!card) return;
      const position = Math.floor(Math.random() * (deck.length + 1));
      deck.splice(position, 0, card);
    }

    function drawFromSupply(type, level) {
      const pile = piles[currentApostle][type].supply[level];
      if (!pile || pile.length === 0) return null;
      return pile.pop();
    }

    function insertPromotedCard(type, level) {
      const pile = piles[currentApostle][type];
      const card = drawFromSupply(type, level);
      if (!card) return false;

      insertRandom(pile.deck, card);
      if (pile.deck.length === 1 && pile.discard.length > 0) {
        pile.deck = shuffleCards(pile.deck.concat(pile.discard));
        pile.discard = [];
      }
      return true;
    }

    function hasSupply(type, level) {
      const pile = piles[currentApostle][type].supply[level];
      return Array.isArray(pile) && pile.length > 0;
    }

    function reshuffleDiscardIfDeckEmpty(type) {
      const pile = piles[currentApostle][type];
      if (pile.deck.length === 0 && pile.discard.length > 0) {
        pile.deck = shuffleCards(pile.discard);
        pile.discard = [];
      }
    }

    function removeFirstMatching(type, predicate) {
      const pile = piles[currentApostle][type];
      reshuffleDiscardIfDeckEmpty(type);
      let index = pile.deck.findIndex(predicate);
      if (index >= 0) {
        const card = pile.deck.splice(index, 1)[0];
        pile.removed.push(card);
        reshuffleDiscardIfDeckEmpty(type);
        return { card, from: "deck" };
      }

      index = pile.discard.findIndex(predicate);
      if (index >= 0) {
        const card = pile.discard.splice(index, 1)[0];
        pile.removed.push(card);
        pile.deck = shuffleCards(pile.deck.concat(pile.discard));
        pile.discard = [];
        return { card, from: "discard" };
      }

      return null;
    }

    function putIntoRemovedPile(type, card) {
      if (!card || card.special) return;
      piles[currentApostle][type].removed.push(card);
    }

    function removeFirstMatchingToRemoved(type, predicate) {
      const pile = piles[currentApostle][type];
      reshuffleDiscardIfDeckEmpty(type);
      let index = pile.deck.findIndex(predicate);
      if (index >= 0) {
        const card = pile.deck.splice(index, 1)[0];
        putIntoRemovedPile(type, card);
        reshuffleDiscardIfDeckEmpty(type);
        return { card, from: "deck" };
      }

      index = pile.discard.findIndex(predicate);
      if (index >= 0) {
        const card = pile.discard.splice(index, 1)[0];
        putIntoRemovedPile(type, card);
        pile.deck = shuffleCards(pile.deck.concat(pile.discard));
        pile.discard = [];
        return { card, from: "discard" };
      }

      return null;
    }

    function lowestLevelCard(type) {
      const order = ["I", "II", "III"];
      const pile = piles[currentApostle][type];
      for (const level of order) {
        const deckCard = pile.deck.find((card) => card.level === level);
        if (deckCard) return deckCard;
        const discardCard = pile.discard.find((card) => card.level === level);
        if (discardCard) return discardCard;
      }
      return null;
    }

    function removeLowestCard(type) {
      const lowest = lowestLevelCard(type);
      if (!lowest) return null;
      return removeFirstMatching(type, (card) => card.level === lowest.level && card.index === lowest.index);
    }

    function removeLowestCardToRemoved(type) {
      const lowest = lowestLevelCard(type);
      if (!lowest) return null;
      return removeFirstMatchingToRemoved(type, (card) => card.level === lowest.level && card.index === lowest.index);
    }

    function removeLowestCardFromDeckOnly(type) {
      const order = ["I", "II", "III"];
      const pile = piles[currentApostle][type];
      for (const level of order) {
        const index = pile.deck.findIndex((card) => card.level === level);
        if (index >= 0) {
          const card = pile.deck.splice(index, 1)[0];
          pile.removed.push(card);
          return card;
        }
      }
      return null;
    }

    function isPlainObject(value) {
      return value && typeof value === "object" && !Array.isArray(value);
    }

    function isCriticalMassStack(item) {
      return item?.criticalMass === true || item?.chimeraCriticalMass === true;
    }

    function isPerHitTokenStack(item) {
      return item?.autoLevelBonus === "danger" || item?.perHit === true;
    }

    function tokenMergeKey(file, options = {}) {
      const normalizedFile = String(file || "");
      if (!normalizedFile || nonStackingTokenFiles.has(normalizedFile)) return "";
      return `${normalizedFile}|${options.perHit ? "per-hit" : "normal"}`;
    }

    function tokenMergeKeyForItem(item) {
      if (!item || isCriticalMassStack(item)) return "";
      return tokenMergeKey(item.file, { perHit: isPerHitTokenStack(item) });
    }

    function findMergeableToken(tokens, file, options = {}) {
      const key = tokenMergeKey(file, options);
      if (!key) return null;
      return tokens.find((item) => tokenMergeKeyForItem(item) === key) || null;
    }

    function normalizeTokenStacks(tokens) {
      const result = [];
      const byKey = new Map();
      (Array.isArray(tokens) ? tokens : []).forEach((item) => {
        const normalized = {
          ...item,
          id: item.id || createTokenStackId(),
          count: Math.max(1, clampTokenCount(item.count) || 1)
        };
        const key = tokenMergeKeyForItem(normalized);
        if (!key) {
          result.push(normalized);
          return;
        }
        const existing = byKey.get(key);
        if (existing) {
          existing.count = clampTokenCount((Number(existing.count) || 0) + (Number(normalized.count) || 0));
          if (isPlainObject(normalized.autoLevelBonusContributions)) {
            existing.autoLevelBonusContributions ||= {};
            Object.entries(normalized.autoLevelBonusContributions).forEach(([kind, value]) => {
              existing.autoLevelBonusContributions[kind] = (Number(existing.autoLevelBonusContributions[kind]) || 0) + (Number(value) || 0);
            });
          }
        } else {
          byKey.set(key, normalized);
          result.push(normalized);
        }
      });
      return result;
    }

    function addPanelToken(file, amount = 1, options = {}) {
      ensurePiles(currentApostle);
      const count = Math.max(0, Math.floor(Number(amount) || 0));
      if (!file || count <= 0) return;

      const tokens = piles[currentApostle].tokens;
      if (options.stackExisting !== false) {
        const existing = findMergeableToken(tokens, file, { perHit: options.perHit === true });
        if (existing) {
          existing.count = clampTokenCount((Number(existing.count) || 0) + count);
          return existing;
        }
      }
      const item = {
        id: createTokenStackId(),
        file,
        count: clampTokenCount(count),
        x: 8 + (tokens.length % 5) * 8,
        y: 8 + Math.floor(tokens.length / 5) * 8
      };
      tokens.push(item);
      return item;
    }

    function addAiExhaustedBonusTokens(damageCount = 1) {
      ensurePiles(currentApostle);
      const count = Math.max(0, Math.floor(Number(damageCount) || 0));
      if (count <= 0) return;

      let index = piles[currentApostle].aiExhaustedBonusIndex % aiExhaustedBonusTokens.length;
      if (index < 0) index = 0;

      for (let i = 0; i < count; i++) {
        addPanelToken(aiExhaustedBonusTokens[index], 1);
        index = (index + 1) % aiExhaustedBonusTokens.length;
      }

      piles[currentApostle].aiExhaustedBonusIndex = index;
      renderPanelTokens();
    }

    function promoteAiFromLevel(fromLevel, toLevel, damageCount = 1) {
      reshuffleDiscardIfDeckEmpty("AI");
      if (toLevel === "III" && !hasSupply("AI", "III")) {
        addAiExhaustedBonusTokens(damageCount);
        return;
      }
      removeFirstMatchingToRemoved("AI", (card) => card.level === fromLevel);
      insertPromotedCard("AI", toLevel);
    }

    function promoteAiForBpIII(damageCount = 2) {
      reshuffleDiscardIfDeckEmpty("AI");
      if (!hasSupply("AI", "III")) {
        addAiExhaustedBonusTokens(damageCount);
        return;
      }
      removeLowestCardToRemoved("AI");
      insertPromotedCard("AI", "III");
    }

    function resolveBpDefeat(card) {
      const bp = piles[currentApostle].BP;

      if (card.level === "I") {
        pushBpDamage(card);
        insertPromotedCard("BP", "II");
        promoteAiFromLevel("I", "II");
        return;
      }

      if (card.level === "II") {
        pushBpDamage(card);
        insertPromotedCard("BP", "III");
        promoteAiFromLevel("II", "III");
        return;
      }

      // BP III：按规则不把这张 BP3 当作普通损伤显示；它被放在一旁，损伤堆加入通用双重损伤 DW。
      bp.removed.push(card);
      pushBpDamage({ special: "DW" });

      if (hasSupply("BP", "III")) {
        removeLowestCard("BP");
        insertPromotedCard("BP", "III");
        bp.deck.push(card);
      } else {
        bp.deck = shuffleCards(bp.deck.concat(bp.discard));
        bp.discard = [];
        bp.deck.push(card);
      }

      promoteAiForBpIII();
    }

    function resolveBpCritical(card) {
      const bp = piles[currentApostle].BP;

      if (card.level !== "III") {
        // 规则图中“关键一击”只列在 BP III；非 BP III 时按普通击败处理。
        resolveBpDefeat(card);
        return;
      }

      // BP III 关键一击：击伤的 BP3 本体进入损伤堆，视作 2 个损伤。
      pushBpDamage({ ...card, damageValue: 2 });

      if (hasSupply("BP", "III")) {
        removeLowestCard("BP");
        insertPromotedCard("BP", "III");
        insertPromotedCard("BP", "III");
      } else {
        bp.deck = shuffleCards(bp.deck.concat(bp.discard));
        bp.discard = [];
      }
    }

    function addBpSpecialDamage(special) {
      ensurePiles(currentApostle);
      rememberUndo(currentApostle, "BP");
      pushBpDamage({ special });
      currentBpView = currentBpDamageView();
      savePiles();
      renderAibpCards();
    }

    function isLabyrinthauros() {
      return currentApostle === labyrinthaurosName;
    }

    function isHermesian() {
      return currentApostle === hermesianName;
    }

    function isTitanX() {
      return currentApostle === titanXName;
    }

    function renderFlareButton() {
      if (!drawFlareButton) return;
      drawFlareButton.classList.toggle("show", isHermesian());
      if (!isHermesian()) return;
      const flare = piles[currentApostle].flare;
      drawFlareButton.textContent = `抽取闪粉（${flare.deck.length}/${flare.discard.length}）`;
    }

    function drawFlare() {
      if (!isHermesian()) return;
      ensurePiles(currentApostle);
      const flare = piles[currentApostle].flare;
      if (flare.deck.length === 0 && flare.discard.length > 0) {
        flare.deck = shuffleCards(flare.discard);
        flare.discard = [];
      }
      if (flare.deck.length === 0) return;

      rememberUndo(currentApostle, "AI");
      const card = flare.deck.shift();
      flare.discard.push(card);
      savePiles();
      renderAibpCards();
      openImageZoom(cardSrc(card), "抽取的闪粉卡");
    }

    function renderFeintButton() {
      if (!drawFeintButton) return;
      drawFeintButton.classList.toggle("show", isTitanX());
      if (!isTitanX()) return;
      const feint = piles[currentApostle].feint;
      drawFeintButton.disabled = feint.deck.length === 0;
      drawFeintButton.textContent = `抽取变招（${feint.deck.length}/${feint.active.length}/${feint.removed.length}）`;
    }

    function drawFeint() {
      if (!isTitanX()) return;
      ensurePiles(currentApostle);
      const feint = piles[currentApostle].feint;
      if (feint.deck.length === 0) return;

      rememberUndo(currentApostle, "AI");
      const card = feint.deck.shift();
      feint.active.push(card);
      currentAiView = "生效变招";
      savePiles();
      updateAiViewTabs();
      renderAibpCards();
      const frontSrc = cardSrc(card);
      const source = pileLocationForView("AI", "生效变招");
      openImageZoom(frontSrc, "抽取的变招卡", null, {
        flipContext: {
          frontSrc,
          backSrc: frontSrc.replace(/(\.[^.]+)$/, "_BACK$1"),
          face: "front"
        },
        moveContext: {
          type: "AI",
          view: "生效变招",
          index: feint.active.length - 1,
          source,
          card: clonePileState(card)
        }
      });
    }

    function addLabyrinthaurosSpecialBp() {
      if (!isLabyrinthauros()) return;
      ensurePiles(currentApostle);
      const bp = piles[currentApostle].BP;
      const locations = ["deck", "discard", "damage", "damage1", "damage2"];
      const alreadyInPlay = locations.some((key) =>
        (bp[key] || []).some((card) => sameCard(card, labyrinthaurosSpecialBp))
      ) || sameCard(bp.pending, labyrinthaurosSpecialBp);
      if (alreadyInPlay) return;

      rememberUndo(currentApostle, "BP");
      bp.removed = (bp.removed || []).filter((card) => !sameCard(card, labyrinthaurosSpecialBp));
      insertRandom(bp.deck, { ...labyrinthaurosSpecialBp });
      savePiles();
      renderAibpCards();
    }

    function removeLabyrinthaurosSpecialBp() {
      if (!isLabyrinthauros()) return;
      ensurePiles(currentApostle);
      const bp = piles[currentApostle].BP;
      const locations = ["deck", "discard", "damage", "damage1", "damage2"];
      const exists = locations.some((key) =>
        (bp[key] || []).some((card) => sameCard(card, labyrinthaurosSpecialBp))
      ) || sameCard(bp.pending, labyrinthaurosSpecialBp);
      if (!exists) return;

      rememberUndo(currentApostle, "BP");
      locations.forEach((key) => {
        bp[key] = (bp[key] || []).filter((card) => !sameCard(card, labyrinthaurosSpecialBp));
      });
      if (sameCard(bp.pending, labyrinthaurosSpecialBp)) bp.pending = null;
      if (!(bp.removed || []).some((card) => sameCard(card, labyrinthaurosSpecialBp))) {
        bp.removed.push({ ...labyrinthaurosSpecialBp });
      }
      currentBpView = "移除";
      savePiles();
      renderAibpCards();
    }

    function addChimeraDamage2Sw() {
      ensurePiles(currentApostle);
      if (!isChimera()) return;
      rememberUndo(currentApostle, "BP");
      addChimeraSecondDamage({ special: "SW" });
      currentBpView = "第二损伤堆";
      savePiles();
      renderAibpCards();
    }

    function removeChimeraDamage2Sw() {
      ensurePiles(currentApostle);
      if (!isChimera()) return;
      const damage2 = piles[currentApostle].BP.damage2;
      const index = damage2.findLastIndex
        ? damage2.findLastIndex((card) => card && card.special === "SW")
        : (() => {
            for (let i = damage2.length - 1; i >= 0; i--) {
              if (damage2[i] && damage2[i].special === "SW") return i;
            }
            return -1;
          })();
      if (index < 0) return;
      rememberUndo(currentApostle, "BP");
      damage2.splice(index, 1);
      currentBpView = "第二损伤堆";
      savePiles();
      renderAibpCards();
    }

    function promoteBpDeckForDefeatedLevel(level) {
      const bp = piles[currentApostle].BP;
      reshuffleDiscardIfDeckEmpty("BP");

      if (level === "I") {
        insertPromotedCard("BP", "II");
        return;
      }

      if (level === "II") {
        insertPromotedCard("BP", "III");
        return;
      }

      if (level === "III") {
        if (hasSupply("BP", "III")) {
          removeLowestCardToRemoved("BP");
          insertPromotedCard("BP", "III");
        } else {
          bp.deck = shuffleCards(bp.deck.concat(bp.discard));
          bp.discard = [];
        }
      }
    }


    function lowestDeckCardWithIndex(type) {
      const order = ["I", "II", "III"];
      const deck = piles[currentApostle][type].deck;
      for (const level of order) {
        const index = deck.findIndex((card) => card.level === level);
        if (index >= 0) {
          return { card: deck[index], index };
        }
      }
      return null;
    }

    function higherLevel(level) {
      if (level === "I") return "II";
      if (level === "II") return "III";
      return null;
    }

    function promoteSinglePile(type) {
      ensurePiles(currentApostle);
      const target = lowestLevelCard(type);
      if (!target) return;

      const toLevel = higherLevel(target.level);
      if (!toLevel) {
        window.alert(`${type} 当前牌堆中最低等级已经是 III，没有更高等级可晋升。`);
        return;
      }

      rememberUndo(currentApostle, type);
      removeFirstMatchingToRemoved(type, (card) => card.level === target.level && card.index === target.index);
      insertPromotedCard(type, toLevel);

      // 不再自动跳转到“当前”；保留用户当前正在查看的牌堆。
      savePiles();
      renderAibpCards();
    }

    function promoteBpByRemovingLowest() {
      ensurePiles(currentApostle);
      if (!lowestLevelCard("BP")) return;
      rememberUndo(currentApostle, "AIBP");
      const removed = removeLowestCardToRemoved("BP");
      const removedCard = removed?.card;
      if (!removedCard) return;

      // 这张 BP 不进入损伤牌堆，而是进入 BP 的移除牌堆；
      // 但仍按“这张 BP 被击败/造成损伤”完整结算 BP 卡组补新卡和 AI 卡组升级。
      promoteBpDeckForDefeatedLevel(removedCard.level);

      if (removedCard.level === "I") {
        promoteAiFromLevel("I", "II");
      } else if (removedCard.level === "II") {
        promoteAiFromLevel("II", "III");
      } else if (removedCard.level === "III") {
        promoteAiForBpIII();
      }

      currentBpView = "移除";
      savePiles();
      renderAibpCards();
    }

    function performLinkedPromotion() {
      ensurePiles(currentApostle);
      const removed = removeLowestCardToRemoved("BP");
      const removedCard = removed?.card;
      if (!removedCard) return false;

      promoteBpDeckForDefeatedLevel(removedCard.level);
      if (removedCard.level === "I") {
        promoteAiFromLevel("I", "II");
      } else if (removedCard.level === "II") {
        promoteAiFromLevel("II", "III");
      } else if (removedCard.level === "III") {
        promoteAiForBpIII();
      }
      return true;
    }

    function isUnstartedAibpState(state) {
      return !state?.AI?.pending
        && !state?.BP?.pending
        && state.AI.discard.length === 0
        && state.BP.discard.length === 0
        && state.AI.removed.length === 0
        && state.BP.removed.length === 0
        && state.BP.damage.length === 0
        && state.BP.damage1.length === 0
        && state.BP.damage2.length === 0;
    }

    function applyBurdenInitialLinkedPromotion() {
      ensurePiles(currentApostle);
      if (currentApostle !== burdenName) return false;
      const state = piles[currentApostle];
      state.initialSetupApplied ||= {};
      if (state.initialSetupApplied.burdenLinkedPromotion) return false;
      if (!isUnstartedAibpState(state)) return false;

      const changed = performLinkedPromotion();
      if (!changed) return false;
      state.initialSetupApplied.burdenLinkedPromotion = true;
      savePiles();
      return true;
    }

    function levelBonusFor(apostle, level) {
      const config = apostleLevelBonusConfig[apostle];
      if (!config) return { promotions: 0, danger: 0, at: 0 };
      let result = { promotions: 0, danger: 0, at: 0 };
      Object.entries(config).forEach(([minimumLevel, bonus]) => {
        if (level >= Number(minimumLevel)) result = { ...result, ...bonus };
      });
      return result;
    }

    function automaticTokenContribution(item, kind) {
      if (isPlainObject(item?.autoLevelBonusContributions)) {
        return Math.max(0, Math.floor(Number(item.autoLevelBonusContributions[kind]) || 0));
      }
      return item?.autoLevelBonus === kind ? Math.max(0, Math.floor(Number(item.count) || 0)) : 0;
    }

    function automaticTokenSnapshot() {
      return JSON.stringify(
        piles[currentApostle].tokens.filter((item) =>
          item.autoLevelBonus || isPlainObject(item.autoLevelBonusContributions)
        )
      );
    }

    function syncAutomaticLevelBonusToken(kind, file, count) {
      const tokens = piles[currentApostle].tokens;
      const position = kind === "danger"
        ? { x: 8, y: 8 }
        : { x: 16, y: 8 };
      const normalizedCount = Math.max(0, Math.floor(Number(count) || 0));
      const perHit = kind === "danger" && currentApostleLevel() >= 5;
      const existingAuto = tokens.find((item) => automaticTokenContribution(item, kind) > 0);
      const previousContribution = automaticTokenContribution(existingAuto, kind);

      if (existingAuto && previousContribution > 0) {
        existingAuto.count = clampTokenCount((Number(existingAuto.count) || 0) - previousContribution);
        if (isPlainObject(existingAuto.autoLevelBonusContributions)) {
          delete existingAuto.autoLevelBonusContributions[kind];
          if (!Object.keys(existingAuto.autoLevelBonusContributions).length) {
            delete existingAuto.autoLevelBonusContributions;
          }
        }
        if (existingAuto.autoLevelBonus === kind) {
          delete existingAuto.autoLevelBonus;
          delete existingAuto.perHit;
        }
        if ((Number(existingAuto.count) || 0) <= 0) {
          const index = tokens.indexOf(existingAuto);
          if (index >= 0) tokens.splice(index, 1);
        }
      }

      if (normalizedCount <= 0) return;

      if (perHit) {
        let perHitToken = tokens.find((item) => item.autoLevelBonus === kind && item.perHit === true);
        if (!perHitToken) {
          perHitToken = addPanelToken(file, normalizedCount, { perHit: true });
        } else {
          perHitToken.count = normalizedCount;
        }
        perHitToken.file = file;
        perHitToken.count = normalizedCount;
        perHitToken.x = position.x;
        perHitToken.y = position.y;
        perHitToken.autoLevelBonus = kind;
        perHitToken.perHit = true;
        return;
      }

      const target = addPanelToken(file, normalizedCount);
      if (!target) return;
      target.autoLevelBonusContributions ||= {};
      target.autoLevelBonusContributions[kind] = normalizedCount;
      if (previousContribution <= 0 && target.count === normalizedCount) {
        target.x = position.x;
        target.y = position.y;
      }
    }

    function applyCurrentApostleLevelBonuses() {
      if (c45LevelBonusApostles.has(currentApostle) && window.C45SpecialsReady !== true) {
        return false;
      }
      ensurePiles(currentApostle);
      const target = levelBonusFor(currentApostle, currentApostleLevel());
      const state = piles[currentApostle].levelBonusState;
      let changed = false;

      while (state.promotions < target.promotions) {
        if (!performLinkedPromotion()) break;
        state.promotions += 1;
        changed = true;
      }

      const beforeTokens = automaticTokenSnapshot();
      syncAutomaticLevelBonusToken("danger", levelDangerBonusTokenFile(currentApostle), target.danger);
      syncAutomaticLevelBonusToken("at", "AT+.png", target.at);
      const afterTokens = automaticTokenSnapshot();
      if (beforeTokens !== afterTokens) changed = true;

      if (changed) savePiles();
      return changed;
    }

    function traitFileName(name, level, index, ext = "jpg") {
      const safeExt = String(ext || "jpg").replace(/^\./, "").toLowerCase();
      return `${name}_TR_${level}_${String(index).padStart(3, "0")}.${safeExt}`;
    }

    function traitSrc(name, level, index, ext = "jpg") {
      return `ps/${name}/${traitFileName(name, level, index, ext)}`;
    }

    function commonTraitFileName(index, ext = "jpg") {
      const safeExt = String(ext || "jpg").replace(/^\./, "").toLowerCase();
      return `COMMON_TR_${String(index).padStart(3, "0")}.${safeExt}`;
    }

    function commonTraitSrc(index, ext = "jpg") {
      return `ps/other/trait/${commonTraitFileName(index, ext)}`;
    }

    function cycleTraitDefinition(card) {
      return cycleTraitCards.find((candidate) => candidate.scope === card?.scope && candidate.index === card?.index);
    }

    function availableCycleTraitCards(name = currentApostle) {
      const cycle = apostleRecordTracks[name]?.cycle || "";
      return cycleTraitCards.filter((card) => card.cycle === cycle || card.cycles?.includes(cycle));
    }

    function cycleTraitSrc(card) {
      const definition = cycleTraitDefinition(card);
      return definition ? `ps/other/trait/${definition.fileName}` : "";
    }

    function traitCardLabel(card) {
      const definition = cycleTraitDefinition(card);
      if (definition) {
        const group = card.scope === "c4-cursed"
          ? "C4 Cursed Trait"
          : card.scope === "c5-exclusive"
            ? "C5 Trait"
            : "C4/C5 通用 Trait";
        return `${group} · ${definition.title}`;
      }
      return card.scope === "common" ? `通用特质 ${card.index}` : `TR ${card.level} ${card.index}`;
    }

    function traitCardSrc(name, card) {
      if (card.scope === "common") return commonTraitSrc(card.index, card.ext);
      if (cycleTraitDefinition(card)) return cycleTraitSrc(card);
      return traitSrc(name, card.level, card.index, card.ext);
    }

    function traitKey(level, index, ext = "jpg", scope = "") {
      return `${scope || "apostle"}-${level}-${index}-${String(ext || "jpg").replace(/^\./, "").toLowerCase()}`;
    }

    function isLargeTraitCard(apostle, card) {
      return card.level === "O"
        || (apostle === "HYPERTIME_ORACLE" && card.level === "IV")
        || (apostle === "ICARIAN_HARPY" && card.level === "X" && card.index === 2);
    }

    function automaticTraitLevels() {
      const levels = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX"];
      return [...levels.slice(0, currentApostleLevel()), "X"];
    }

          scope: input.dataset.scope || ""
        }))
        .sort((a, b) => {
          const scopeOrder = String(a.scope || "").localeCompare(String(b.scope || ""));
          if (scopeOrder) return scopeOrder;
          return traitLevels.indexOf(a.level) - traitLevels.indexOf(b.level) || a.index - b.index || String(a.ext).localeCompare(String(b.ext));

    function reorderExtraGridForLargeCards() {
      const children = Array.from(extraGrid.children).filter((el) => el.tagName === "IMG" || el.classList.contains("missing"));
      if (children.length === 0) return;
      const large = [];
      const small = [];
      children.forEach((el) => {
        if (el.classList.contains("panel-image")) {
          large.push(el);
        } else {
          small.push(el);
        }
      });
      if (large.length === 0) return;
      // 大卡占一整列（2行），小卡每2张占一列。
      // 按顺序排列：大卡独占一列位，小卡两两成对填列。
      const result = [];
      let li = 0;
      let si = 0;
      // 保持原始相对顺序：遍历原始列表，遇到大卡就输出，遇到小卡攒够2张或到末尾再输出
      const orig = children.slice();
      const reordered = [];
      let smallBuf = [];
      for (const el of orig) {
        if (el.classList.contains("panel-image")) {
          // 如果缓冲区有奇数张小卡，先把偶数张输出，留1张到大卡后面
          if (smallBuf.length % 2 === 1) {
            const leftover = smallBuf.pop();
            reordered.push(...smallBuf);
            smallBuf = [leftover];
          } else {
            reordered.push(...smallBuf);
            smallBuf = [];
          }
          reordered.push(el);
        } else {
          smallBuf.push(el);
        }
      }
      reordered.push(...smallBuf);
      extraGrid.replaceChildren(...reordered);
    }

        img.dataset.backSrc = backSrc;
        img.dataset.face = "front";

      probe.onerror = () => {};
      probe.src = backSrc;
    }
