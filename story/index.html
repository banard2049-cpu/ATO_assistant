<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ATO 故事书跳转器</title>
    <link rel="stylesheet" href="./assets/styles.css?v=20261009-copy-paragraph1" />
    <link rel="stylesheet" href="../api/cycle-theme.css" />
    <script src="../assets/theme.js?v=20261001" defer></script>
    <link rel="stylesheet" href="./assets/editorial.css?v=20261001-sidebar-deeper1" />
    <link rel="stylesheet" href="./assets/centimanes.css?v=20261004-manual1" />
    <link rel="stylesheet" href="./assets/mixed-media/styles.css?v=20261005-apk-icons1" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">
        <div id="storyMark" class="mark">ATO</div>
        <div>
          <h1>故事书跳转器</h1>
        </div>
      </div>
      <nav class="story-navigation" aria-label="战役工具">
        <a class="home-link" href="../index.html">返回主控台</a>
        <a class="home-link record-link" href="../record/index.html" data-cycle-link>阿尔戈号记录表</a>
        <a class="home-link record-link" href="../hero/index.html" data-cycle-link>英雄记录表</a>
      </nav>

      <label class="field">
        <span>故事书</span>
        <select id="bookSelect"></select>
      </label>

      <label class="field">
        <span>模块 / 大章</span>
        <select id="chapterSelect"></select>
      </label>

      <label class="field">
        <span>入口层 / 小章节</span>
        <select id="encounterSelect"></select>
      </label>

      <label class="field">
        <span>段落号或关键词</span>
        <input id="searchInput" autocomplete="off" placeholder="搜索当前故事书全文，例如 0001、M009、尼采超人" />
      </label>

      <div class="quick-row">
        <button id="goButton" type="button">读取</button>
        <button id="backButton" type="button" title="返回上一段">返回</button>
      </div>

      <div class="memory-tools">
        <button id="rememberButton" type="button">记下段落</button>
        <button id="copyParagraphButton" type="button" disabled>复制全文</button>
        <span id="copyParagraphStatus" class="copy-paragraph-status" role="status" aria-live="polite"></span>
      </div>

      <div id="chapterSummary" class="chapter-summary"></div>

      <section class="memory-panel" aria-label="已记下段落">
        <div class="memory-title">已记下段落</div>
        <div id="memoryList" class="memory-list"></div>
      </section>

      <nav id="resultList" class="result-list" aria-label="搜索结果"></nav>
      <details class="cryptic-module" id="crypticLanguages">
        <summary>密语记录</summary>
        <div class="cryptic-body">
          <nav class="cryptic-tabs" role="tablist" aria-label="密语语言">
            <button id="crypticCentTab" type="button" role="tab" aria-selected="true" aria-controls="centimanesPanel" data-cryptic-language="centimanes">百臂巨人语</button>
            <button id="crypticBabelTab" type="button" role="tab" aria-selected="false" aria-controls="babelianPanel" data-cryptic-language="babelian">巴别语</button>
            <button id="crypticSirenTab" type="button" role="tab" aria-selected="false" aria-controls="sirenPanel" data-cryptic-language="siren">塞壬语</button>
          </nav>
          <p id="centimanesSync" class="cent-sync" role="status">正在读取密语记录…</p>
          <div class="cent-sync-actions">
            <button id="centimanesRetry" type="button" hidden>重试同步</button>
            <button id="centimanesKeep" type="button" hidden>保留本页冲突值</button>
            <button id="centimanesRemote" type="button" hidden>采用存档版本</button>
          </div>
          <fieldset class="cent-fields" id="centimanesFields" disabled aria-label="密语记录工具">
            <div id="centimanesPanel" role="tabpanel" aria-labelledby="crypticCentTab"></div>
            <div id="babelianPanel" role="tabpanel" aria-labelledby="crypticBabelTab" hidden></div>
            <div id="sirenPanel" role="tabpanel" aria-labelledby="crypticSirenTab" hidden></div>
          </fieldset>
          <a class="cryptic-source" href="https://github.com/HUAHUOOo/Babelian-Siren-Translator" target="_blank" rel="noopener noreferrer">字形与离线分词来源 ↗</a>
        </div>
      </details>
    </aside>

    <main class="reader">
      <header class="reader-head">
        <div>
          <div id="sectionLabel" class="section-label">选择一个模块</div>
          <h2 id="entryTitle">选择模块或输入段落号后开始阅读</h2>
          <button id="pharosTitleDecodeButton" type="button" class="pharos-title-decode" hidden>标题解密</button>
        </div>
        <div class="reader-actions">
          <label id="secondScreenStoryModeLabel" class="second-screen-mode-toggle" title="勾选后第二屏显示当前故事文本，取消勾选后显示地图">
            <input type="checkbox" id="secondScreenStoryModeToggle" />
            第二屏显示文本
          </label>
          <label id="secondScreenStoryContentLabel" class="second-screen-mode-toggle" hidden title="官方版有扫描图时，勾选后第二屏显示原书扫描图，取消勾选后显示官方正文">
            <input type="checkbox" id="secondScreenStoryContentToggle" checked />
            第二屏显示图片
          </label>
          <button id="entityBioToggle" type="button" class="entity-bio-toggle" aria-pressed="false" title="显示或隐藏人物小传">人物小传：关</button>
          <button id="ttsButton" type="button" class="tts-btn" title="朗读">朗读</button>
          <button id="ttsPauseButton" type="button" class="tts-btn" title="暂停朗读" aria-pressed="false" hidden>暂停</button>
          <select id="ttsSpeed" class="tts-select">
            <option value="1" selected>1x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
            <option value="1.75">1.75x</option>
            <option value="2">2x</option>
          </select>
          <div id="entryBadge" class="entry-badge">----</div>
        </div>
      </header>

      <article id="storyText" class="story-text">
        <p>左侧先选择故事书、模块和入口层，再输入段落号。正文里的段落号会按当前上下文优先跳转。</p>
      </article>

      <footer class="reader-foot">
        <div id="linkPanel" class="link-panel"></div>
      </footer>
    </main>

    <script src="../assets/campaign-session.js?v=20260917"></script>
    <script src="../assets/page-focus-router.js?v=20261007-page-navigation1"></script>
    <!-- 公共仓库使用占位数据；本地完整数据存在时由后一项覆盖。 -->
    <script src="./storybook-placeholder.js?v=20260813"></script>
    <script src="./data/storybook-data.js?v=c4c5-20261006-r2"></script>
    <script src="./data/storybook-official-data.js?v=20261006-official-c45-1"></script>
    <script src="./data/entity-index.js?v=c4c5-20261006-r2"></script>
    <script src="./audio-packs/audio/manifest.js?v=20260614structure1"></script>
    <script src="../assets/cycle-symbols.js?v=20260918"></script>
    <script src="./assets/pharos-codes.js?v=20260924-title-codes1"></script>
    <script src="./assets/story-tables.js?v=20261005-pipetables1"></script>
    <script src="./assets/mixed-media/renderer.js?v=c4c5-20261006-r3-compat1"></script>
    <script async data-ato-mm-map src="./assets/mixed-media/mapping.js?v=c4c5-20261006-official-c45-1"></script>
    <script src="./assets/app.js?v=20261009-copy-paragraph1"></script>
    <script src="./assets/centimanes.js?v=20261004-sidebar1"></script>
    <script src="./assets/cryptic/glyph-catalog.js?v=20261004-manual1"></script>
    <script src="./assets/cryptic/vendor/text-format.js?v=20261004-manual1"></script>
    <script src="./assets/cryptic-manual.js?v=20261004-manual1"></script>
    <script src="./assets/cryptic-manual-ui.js?v=20261004-manual1"></script>
    <script src="./assets/centimanes-store.js?v=20261004-manual1"></script>
    <script src="../assets/ato-terms.js?v=20260912f"></script>
  <script src="../assets/term-language.js?v=20261009-label2"></script>
</body>
</html>
