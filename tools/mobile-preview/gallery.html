<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ATO · 手机预览截图</title><link rel="stylesheet" href="../../api/cycle-theme.css"><style>
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.7 "Microsoft YaHei",system-ui,sans-serif}main{max-width:1240px;margin:auto;padding:32px 24px 60px}a{color:var(--accent)}header{display:flex;justify-content:space-between;align-items:center;gap:20px;padding-bottom:24px;border-bottom:1px solid var(--line);margin-bottom:28px}h1{font:normal 30px "Songti SC",SimSun,serif;margin:8px 0}p{margin:0;color:var(--muted);font-size:12px}.eyebrow{color:var(--gold);font-size:10px;letter-spacing:2px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:35px 28px}.page-head{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}h2{font:normal 23px "Songti SC",SimSun,serif;margin:0}.page-head span{font:13px Georgia,serif;color:var(--gold)}.page-head a{margin-left:auto;font-size:11px}.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}figure{margin:0;min-width:0}figure a{display:block}figure img{display:block;width:100%;aspect-ratio:390/844;object-fit:contain;background:var(--panel);border:1px solid var(--line)}figcaption{font-size:11px;color:var(--muted);padding-top:7px}.notice{padding:20px 0 0;font-size:11px}@media(max-width:680px){main{padding:24px 16px}.grid{grid-template-columns:1fr;gap:30px}header{align-items:flex-start}h1{font-size:26px}}
</style></head>
<body><main><header><div><span class="eyebrow">MOBILE PREVIEW / 390 × 844</span><h1>八个页面，一览变化。</h1><p>左侧为默认内容，右侧为工具展开；点击截图查看原图。</p></div><a href="index.html">返回交互预览 ↗</a></header><div id="gallery" class="grid"></div><p class="notice">截图使用独立示例数据与本地素材。可点击原型以交互预览为准。</p></main><script src="identity.js"></script><script>
const pages=[['dashboard','主控台'],['record','阿尔戈号'],['hero','英雄'],['aibp','始徒'],['technology','科技'],['map','地图'],['story','故事书'],['briefing','战役简报']];
document.getElementById('gallery').innerHTML=pages.map(([id],i)=>{const label=window.MobilePreviewIdentity[id].heading;return `<section><div class="page-head"><span>0${i+1}</span><h2>${label}</h2><a href="index.html#${id}">点击体验 ↗</a></div><div class="pair">${[['default','默认 · 内容优先'],['tools','展开 · 完整工具']].map(([state,caption])=>`<figure><a href="screenshots/${id}-${state}.png"><img src="screenshots/${id}-${state}.png" alt="${label}${caption}手机截图" loading="lazy"></a><figcaption>${caption}</figcaption></figure>`).join('')}</div></section>`;}).join('');
</script></body></html>
