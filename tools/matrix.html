<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>抉择矩阵索引</title>
  <style>
    :root {
      --bg: #f4f2ec;
      --panel: #fffdf8;
      --ink: #25231f;
      --muted: #6d675e;
      --line: #d7d1c5;
      --line-strong: #a79d8c;
      --accent: #176c62;
      --accent-soft: #dcece8;
      --warn: #8a5b17;
      --warn-soft: #f4ead9;
      --blank: #ebe6da;
      --shadow: 0 16px 44px rgba(50, 43, 32, 0.12);
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
    }

    button,
    input,
    select {
      font: inherit;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 22px 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 253, 248, 0.92);
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(8px);
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .meta {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }

    .toolbar input,
    .toolbar select {
      height: 36px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      padding: 0 10px;
    }

    .toolbar input {
      width: min(280px, 42vw);
    }

    main {
      display: grid;
      grid-template-columns: minmax(560px, 1fr) minmax(320px, 420px);
      gap: 16px;
      padding: 16px;
      min-height: 0;
    }

    .matrix-area,
    .detail {
      min-width: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .matrix-area {
      overflow: auto;
      padding: 12px;
    }

    .matrix {
      display: grid;
      grid-template-columns: repeat(12, minmax(48px, 1fr));
      gap: 5px;
      min-width: 700px;
    }

    .cell {
      position: relative;
      aspect-ratio: 1.22 / 1;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--blank);
      color: var(--muted);
      cursor: pointer;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: border-color 120ms ease, background 120ms ease, color 120ms ease, transform 120ms ease;
    }

    .cell:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .cell.has-source {
      background: var(--accent-soft);
      border-color: rgba(23, 108, 98, 0.38);
      color: var(--ink);
      font-weight: 700;
    }

    .cell.has-summary:not(.has-source) {
      background: var(--warn-soft);
      border-color: rgba(138, 91, 23, 0.36);
      color: var(--ink);
      font-weight: 700;
    }

    .cell.suspected::after,
    .cell.no-source.has-summary::after {
      content: "";
      position: absolute;
      top: 5px;
      right: 5px;
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--warn);
    }

    .cell.selected {
      outline: 3px solid rgba(23, 108, 98, 0.35);
      outline-offset: 1px;
      border-color: var(--accent);
    }

    .cell.hidden {
      display: none;
    }

    .detail {
      padding: 16px;
      overflow: auto;
      max-height: calc(100vh - 86px);
      position: sticky;
      top: 82px;
    }

    .detail h2 {
      margin: 0 0 10px;
      font-size: 24px;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .badge {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 8px;
      color: var(--muted);
      background: #fff;
      font-size: 12px;
      line-height: 1.2;
    }

    .badge.source {
      color: var(--accent);
      border-color: rgba(23, 108, 98, 0.35);
      background: var(--accent-soft);
    }

    .badge.warn {
      color: var(--warn);
      border-color: rgba(138, 91, 23, 0.35);
      background: var(--warn-soft);
    }

    .section {
      border-top: 1px solid var(--line);
      padding-top: 14px;
      margin-top: 14px;
    }

    .section h3 {
      margin: 0 0 8px;
      font-size: 15px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .summary {
      margin: 0;
      color: var(--ink);
      line-height: 1.72;
      white-space: pre-wrap;
    }

    .empty {
      color: var(--muted);
      line-height: 1.6;
      margin: 0;
    }

    .source-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .source-item {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: #fff;
      line-height: 1.5;
    }

    .source-title {
      display: block;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 4px;
    }

    .source-note {
      display: block;
      color: var(--muted);
      font-size: 13px;
    }

    details {
      border-top: 1px solid var(--line);
      margin-top: 14px;
      padding-top: 12px;
    }

    summary {
      cursor: pointer;
      color: var(--accent);
      font-weight: 700;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
      margin: 10px 0 0;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      line-height: 1.55;
      font-family: inherit;
      font-size: 13px;
    }

    .load-error {
      padding: 18px;
      border: 1px solid rgba(138, 91, 23, 0.35);
      border-radius: 8px;
      background: var(--warn-soft);
      color: var(--ink);
      line-height: 1.6;
    }

    @media (max-width: 980px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .toolbar {
        justify-content: stretch;
        width: 100%;
      }

      .toolbar input,
      .toolbar select {
        flex: 1 1 180px;
        width: auto;
      }

      main {
        grid-template-columns: 1fr;
        padding-bottom: 50vh;
      }

      .detail {
        position: fixed;
        left: 10px;
        right: 10px;
        bottom: 10px;
        top: auto;
        z-index: 30;
        max-height: 45vh;
        overflow: auto;
        padding: 14px;
      }

      .detail h2 {
        font-size: 20px;
      }
    }

    @media (max-width: 640px) {
      header {
        padding: 14px;
      }

      main {
        padding: 10px;
        padding-bottom: 52vh;
      }

      .matrix {
        grid-template-columns: repeat(12, 44px);
        min-width: 583px;
      }

      .cell {
        min-height: 36px;
        font-size: 12px;
      }

      .detail {
        left: 8px;
        right: 8px;
        bottom: 8px;
        max-height: 48vh;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>抉择矩阵索引</h1>
        <div id="matrixMeta" class="meta">正在读取矩阵数据...</div>
      </div>
      <div class="toolbar" aria-label="矩阵筛选">
        <input id="searchInput" type="search" placeholder="搜索格子、简介、故事书位置">
        <select id="filterSelect">
          <option value="all">全部格子</option>
          <option value="with-source">有故事书位置</option>
          <option value="with-summary">有简介</option>
          <option value="suspected">来源待核</option>
          <option value="without-source">没有确定来源</option>
        </select>
      </div>
    </header>

    <main>
      <section class="matrix-area" aria-label="抉择矩阵">
        <div id="matrix" class="matrix"></div>
      </section>

      <aside class="detail" aria-live="polite">
        <h2 id="detailTitle">请选择一个格子</h2>
        <div id="badges" class="badges"></div>

        <section class="section">
          <h3>故事简介</h3>
          <p id="summaryText" class="empty">点击左侧矩阵格子后显示。</p>
        </section>

        <section class="section">
          <h3>故事书位置</h3>
          <ul id="sourceList" class="source-list"></ul>
          <p id="sourceEmpty" class="empty">点击左侧矩阵格子后显示。</p>
        </section>

        <details>
          <summary>原始备注</summary>
          <pre id="rawNotes">点击左侧矩阵格子后显示。</pre>
        </details>
      </aside>
    </main>
  </div>

  <script src="../record/matrix-data.js?v=20261106-c123-fixes2"></script>
  <script>
    const rows = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").concat(["AA", "BB", "CC", "DD", "EE", "FF"]);
    const matrixData = window.ATO_MATRIX_DATA;
    const state = {
      selected: "",
      query: "",
      filter: "all",
    };

    const elements = {
      meta: document.querySelector("#matrixMeta"),
      matrix: document.querySelector("#matrix"),
      search: document.querySelector("#searchInput"),
      filter: document.querySelector("#filterSelect"),
      title: document.querySelector("#detailTitle"),
      badges: document.querySelector("#badges"),
      summary: document.querySelector("#summaryText"),
      sourceList: document.querySelector("#sourceList"),
      sourceEmpty: document.querySelector("#sourceEmpty"),
      rawNotes: document.querySelector("#rawNotes"),
    };

    function cellCodes() {
      const codes = [];
      for (const row of rows) {
        for (let col = 1; col <= 12; col += 1) codes.push(`${row}${col}`);
      }
      return codes;
    }

    function parseSources(notes) {
      const results = [];
      const seen = new Set();
      const regex = /\bC([1-5](?:\.5)?)\s*\|\s*(.+?)\s*>\s*(.+?)\s+line\s+(\d+):\s*(.*)$/;
      for (const note of notes || []) {
        const match = note.match(regex);
        if (!match) continue;
        const suspected = /疑似来源|实体线索卡|实体卡牌|特殊事件卡|后文检查/.test(note);
        const key = `${match[1]}|${match[2]}|${match[3]}|${match[4]}|${suspected}`;
        if (seen.has(key)) continue;
        seen.add(key);
        results.push({
          book: `C${match[1]}`,
          chapter: match[2].trim(),
          entry: match[3].trim(),
          line: match[4].trim(),
          excerpt: match[5].trim(),
          suspected,
        });
      }
      return results;
    }

    function hasSuspectedSource(notes) {
      return (notes || []).some((note) => /疑似来源|实体线索卡|实体卡牌|特殊事件卡/.test(note));
    }

    function cellInfo(code) {
      const notes = matrixData[code]?.sources || [];
      const removals = matrixData[code]?.removals || [];
      const summary = matrixData[code]?.summary || "";
      const sources = parseSources(notes);
      const removalSources = parseSources(removals);
      const solidSources = sources.filter((source) => !source.suspected);
      return {
        code,
        notes,
        removals,
        summary,
        sources,
        removalSources,
        solidSources,
        suspected: matrixData[code]?.sourceStatus === "unverified" || hasSuspectedSource(notes) || sources.some((source) => source.suspected),
      };
    }

    function matchesFilter(info) {
      if (state.filter === "with-source") return info.solidSources.length > 0;
      if (state.filter === "with-summary") return Boolean(info.summary);
      if (state.filter === "suspected") return info.suspected;
      if (state.filter === "without-source") return info.solidSources.length === 0;
      return true;
    }

    function matchesQuery(info) {
      const query = state.query.trim().toLowerCase();
      if (!query) return true;
      const haystack = [
        info.code,
        info.summary,
        ...info.notes,
        ...info.removals,
        ...info.sources.map((source) => `${source.book} ${source.chapter} ${source.entry} line ${source.line}`),
      ].join("\n").toLowerCase();
      return haystack.includes(query);
    }

    function renderMatrix() {
      const codes = cellCodes();
      let visible = 0;
      let withSource = 0;
      let withSummary = 0;
      let suspected = 0;
      elements.matrix.innerHTML = "";

      for (const code of codes) {
        const info = cellInfo(code);
        const show = matchesFilter(info) && matchesQuery(info);
        if (info.solidSources.length) withSource += 1;
        if (info.summary) withSummary += 1;
        if (info.suspected) suspected += 1;
        if (show) visible += 1;

        const button = document.createElement("button");
        button.type = "button";
        button.className = [
          "cell",
          info.solidSources.length ? "has-source" : "no-source",
          info.summary ? "has-summary" : "",
          info.suspected ? "suspected" : "",
          state.selected === code ? "selected" : "",
          show ? "" : "hidden",
        ].filter(Boolean).join(" ");
        button.textContent = code;
        button.title = `${code}\n${info.summary || "暂无简介"}\n${info.solidSources.length ? `${info.solidSources.length} 个故事书位置` : "没有确定故事书来源"}${info.removals.length ? `\n${info.removals.length} 处移除标记提示` : ""}`;
        button.addEventListener("click", () => selectCell(code));
        elements.matrix.appendChild(button);
      }

      elements.meta.textContent = `显示 ${visible}/${codes.length} 格；有故事书位置 ${withSource} 格，有简介 ${withSummary} 格，来源待核 ${suspected} 格。`;
    }

    function makeBadge(text, className = "") {
      const badge = document.createElement("span");
      badge.className = ["badge", className].filter(Boolean).join(" ");
      badge.textContent = text;
      return badge;
    }

    function selectCell(code) {
      state.selected = code;
      const info = cellInfo(code);
      elements.title.textContent = code;
      elements.badges.innerHTML = "";
      elements.badges.appendChild(makeBadge(info.summary ? "有简介" : "暂无简介", info.summary ? "source" : ""));
      elements.badges.appendChild(makeBadge(info.solidSources.length ? `${info.solidSources.length} 个故事书位置` : "没有确定来源", info.solidSources.length ? "source" : "warn"));
      if (info.suspected) elements.badges.appendChild(makeBadge("来源待核", "warn"));
      if (info.removals.length) elements.badges.appendChild(makeBadge(`${info.removals.length} 处移除标记提示`, "warn"));

      elements.summary.className = info.summary ? "summary" : "empty";
      elements.summary.textContent = info.summary || "暂无故事简介。";

      elements.sourceList.innerHTML = "";
      const locations = info.sources.map(source => ({ ...source, removal: false }))
        .concat(info.removalSources.map(source => ({ ...source, removal: true })));
      if (locations.length) {
        elements.sourceEmpty.hidden = true;
        for (const source of locations) {
          const item = document.createElement("li");
          item.className = "source-item";

          const title = document.createElement("span");
          title.className = "source-title";
          title.textContent = `${source.removal ? "移除标记：" : ""}${source.book} | ${source.chapter} > ${source.entry}，line ${source.line}`;
          item.appendChild(title);

          const note = document.createElement("span");
          note.className = "source-note";
          note.textContent = `${source.removal ? "移除已有标记：" : source.suspected ? "备注/疑似来源：" : "摘录："}${source.excerpt || "无摘录"}`;
          item.appendChild(note);

          elements.sourceList.appendChild(item);
        }
      } else {
        elements.sourceEmpty.hidden = false;
        elements.sourceEmpty.textContent = matrixData[code]?.sourceStatus === "unverified"
          ? "本格的标记来源尚待核实。"
          : info.notes.length
          ? "这格有备注，但没有解析到明确的故事书位置。请看下方原始备注。"
          : "这格目前没有来源备注。";
      }

      elements.rawNotes.textContent = info.notes.length ? info.notes.join("\n\n") : "暂无原始备注。";
      if (info.removals.length) elements.rawNotes.textContent += `\n\n移除已有标记：\n${info.removals.join("\n\n")}`;
      window.location.hash = code;
      renderMatrix();
    }

    function selectInitialCell() {
      const hash = decodeURIComponent(window.location.hash.replace(/^#/, "")).toUpperCase();
      const codes = new Set(cellCodes());
      if (codes.has(hash)) {
        selectCell(hash);
        return;
      }
      const firstUseful = cellCodes().find((code) => {
        const info = cellInfo(code);
        return info.summary || info.notes.length;
      });
      selectCell(firstUseful || "A1");
    }

    function showLoadError(error) {
      elements.matrix.innerHTML = "";
      const box = document.createElement("div");
      box.className = "load-error";
      box.textContent = `矩阵数据读取失败：${error.message || error}。请确认项目文件完整，再重新打开矩阵检索页。`;
      elements.matrix.appendChild(box);
      elements.meta.textContent = "矩阵数据读取失败";
    }

    elements.search.addEventListener("input", () => {
      state.query = elements.search.value;
      renderMatrix();
    });

    elements.filter.addEventListener("change", () => {
      state.filter = elements.filter.value;
      renderMatrix();
    });

    try {
      if (!matrixData) throw new Error("缺少矩阵数据文件");
      renderMatrix();
      selectInitialCell();
    } catch (error) {
      showLoadError(error);
    }
  </script>
</body>
</html>
