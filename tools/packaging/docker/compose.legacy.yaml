# Docker Compose v1 (docker-compose >= 1.21.0).
# Save next to the existing data/ and app/ directories, then run:
#   mkdir -p data app/ss/battle-board
#   docker-compose -f compose.legacy.yaml pull
#   docker-compose -f compose.legacy.yaml up -d
# The battle-board folder contains both the original image and its thumbnail.
# v1 cannot use pull_policy or bind.create_host_path; always pull before updating.
version: "2.4"

services:
  ato:
    image: ${ATO_IMAGE:-ghcr.io/banard2049-cpu/ato_assistant:${ATO_VERSION:-latest}}
    ports:
      - "8793:8793"
    volumes:
      - ./data:/app/data
      # The image entrypoint restores program data inside aibp/ps on startup.
      - ./app/aibp/ps:/app/aibp/ps
      - ./app/assets/exploration-cards:/app/assets/exploration-cards
      - ./app/assets/story-doom-cards:/app/assets/story-doom-cards
      # Cycle marker icons are copyright artwork: absent from the image, supply them here.
      - ./app/assets/cycle-symbols:/app/assets/cycle-symbols
      # Interface SVG icons are supplied by the user's resource pack.
      - ./app/assets/icons:/app/assets/icons:ro
      - ./app/assets/bgm/audio:/app/assets/bgm/audio:ro
      - ./app/assets/bgm:/app/assets/bgm/media:ro
      - ./app/hero/assets:/app/hero/assets
      # Recursive: layered HD maps, shared card backs and legacy flat scans.
      - ./app/map/images:/app/map/images
      - ./app/map/tokens:/app/map/tokens
      # 记录表素材整棵挂 assets（含 Boss 头像 record/assets/boss-avatars/），与 compose.yaml 一致。
      - ./app/record/assets:/app/record/assets
      # Only mount artwork so the second-screen program can still update.
      - ./app/ss/battle-board:/app/ss/battle-board:ro
      - ./app/ss/terrain:/app/ss/terrain:ro
      - ./app/ss/terrain-cards:/app/ss/terrain-cards:ro
      - ./app/story/images:/app/story/images
      # c1.5 / c2.5 preface chapter art moved from story/images/OO/ to story/assets/OO/.
      - ./app/story/assets/OO:/app/story/assets/OO:ro
      # Cryptic glyphs (Babelian/Siren) come from the user's resource pack (crypticFiles section).
      - ./app/story/assets/cryptic/glyphs:/app/story/assets/cryptic/glyphs:ro
      # Mixed-media material (book crops + mapping) comes from the resource pack
      # (mixedMediaFiles section). Create mapping.js as a FILE before up.
      - ./app/story/assets/mixed-media/images:/app/story/assets/mixed-media/images:ro
      - ./app/story/assets/mixed-media/mapping.js:/app/story/assets/mixed-media/mapping.js:ro
      - ./app/story/data:/app/story/data:ro
      - ./app/technology/images:/app/technology/images
    restart: unless-stopped
