services:
  ato:
    image: ghcr.io/banard2049-cpu/ato_assistant:${ATO_VERSION:-latest}
    build: .
    # latest 是会移动的标签，而 missing 的语义是「本地已经有同名镜像就别拉」：
    # 两者凑在一起，`docker compose pull` 有可能什么都不拉，更新看起来成功、
    # 实际还在跑旧镜像。这里必须是 always，pull 才是真的 pull。
    # （代价：GHCR 不可达时手动 `docker compose up -d` 会报错；已经在跑的容器不受影响。）
    pull_policy: always
    ports:
      - "8793:8793"
    volumes:
      - ./data:/app/data
      # AIBP 卡图：整棵挂 ./app/aibp/ps —— 这个目录就是使用者投放自备卡图的位置。
      # ps/ 里不只有图片：CHIMERA_METASTASIOS/bp_status_map.{js,json}、
      # other/token/token_manifest.js、other/resouce/bp_resource_map*.js 是程序数据，
      # 由 aibp/index.html 以 <script src="ps/..."> 直接引用，而整目录挂载会把它们一起
      # 遮住 —— 新装时宿主机目录是空的，这些脚本在容器里根本不存在；旧宿主机留下的副本
      # 又会一直遮住镜像的新版本，pull 更新不到。
      # 对策是「整目录挂载 + 启动时还原程序文件」：镜像在 /opt/ato/aibp-ps-program 存一份
      # 原版程序数据（见 Dockerfile），docker-entrypoint.sh 启动时把缺失或与镜像不同的
      # 文件补回 /app/aibp/ps，只动程序文件、不删使用者的图片。
      # 不要再把这里拆成「只挂纯素材子目录」：CHIMERA_METASTASIOS / other/token /
      # other/resouce / other 里图片与程序数据同级，拆开就等于使用者的图全部看不见。
      - ./app/aibp/ps:/app/aibp/ps
      - ./app/assets/exploration-cards:/app/assets/exploration-cards
      - ./app/assets/story-doom-cards:/app/assets/story-doom-cards
      # 循环标记图标（c1-brown.png … c5-black-transparent.png）：版权素材，公开镜像里没有，
      # 必须由宿主机提供，否则五个页面的循环标题前就没有图标。cycle-symbols.js 会自动移除
      # 加载失败的 <img>，所以这里缺图只会表现为「没有图标」，不会出现裂图。
      - ./app/assets/cycle-symbols:/app/assets/cycle-symbols
      # 主控台 BGM：只挂音频子目录。assets/bgm/ 里混着程序（bgm.js / manifest.js）
      # 和自备音频，整目录挂载会把播放器代码一起钉死在宿主机上，pull 就再也更新不到它；
      # 所以音频放 ./app/assets/bgm/audio/，程序交给镜像（见 assets/bgm/README.md）。
      - ./app/assets/bgm/audio:/app/assets/bgm/audio:ro
      - ./app/hero/assets:/app/hero/assets
      - ./app/map/images:/app/map/images
      - ./app/map/tokens:/app/map/tokens
      - ./app/record/assets:/app/record/assets
      # 第二屏：只挂本地素材（版图底图 + 地形图），ss/ 里的程序文件
      # （index.html / app.js / styles.css / terrain-data.js）必须由镜像提供。以前整棵挂
      # ./app/ss 会把它们全部遮住 —— 镜像里修好的第二屏前端永远进不了容器，
      # 表现为「主控台更新了、第二屏还是旧版」。
      # battle-board.jpg 是单文件挂载：文件不存在时 Docker 会建一个同名目录顶上，
      # 版图背景就悄悄废了，所以用 create_host_path: false 让它直接报错。
      # 安装脚本（tools/install-docker.sh）会先放一个 0 字节占位文件。
      - type: bind
        source: ./app/ss/battle-board.jpg
        target: /app/ss/battle-board.jpg
        read_only: true
        bind:
          create_host_path: false
      - ./app/ss/terrain:/app/ss/terrain:ro
      - ./app/ss/terrain-cards:/app/ss/terrain-cards:ro
      - ./app/story/images:/app/story/images
      # Keep Storybook data local; it is intentionally absent from the public image.
      # Put the private storybook-data.js in ./app/story/data on the host.
      - ./app/story/data:/app/story/data:ro
      - ./app/technology/images:/app/technology/images
    restart: unless-stopped
