# ATO_assistant：仓库根目录的 Apache / NAS 部署（docker-compose.yml、
# docker-compose.nas.yml）用的补充配置，在容器里挂到
# /etc/apache2/conf-enabled/zz-ato-lan.conf（见那两份 compose 的 volumes）。
#
# 为什么需要它：这两个部署直接用官方 php:8.3-apache 镜像，没有自己的 Dockerfile。
# 该镜像沿用的是 Debian 默认的 apache2.conf，其中 /var/www/ 上是
# "AllowOverride None"，也就是说 .htaccess 会被整个忽略 —— 私有目录的拒绝规则
# （data/ 里的账号密码哈希/完整存档/session/备份、export/、logs/、tmp/）就全是摆设，
# 在这个端口上仍是普通静态文件。这里只做一件事：让根目录的 .htaccess 生效。
#
# 拒绝规则本身写在仓库根的 .htaccess 里（与 router.php 的清单保持一致），
# 那份文件由服务器安全相关的改动维护，这里不重复任何规则。
<Directory /var/www/html>
    AllowOverride All
    # 目录里没有 index 文件时不要列出文件清单（素材目录本来就可能被直接访问）。
    Options -Indexes +FollowSymLinks
</Directory>
