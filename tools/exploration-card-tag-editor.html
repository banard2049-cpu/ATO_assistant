<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>探索卡打标工具</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #263238;
      --muted: #667780;
      --line: #d7e0e4;
      --paper: #fff;
      --bg: #f3f6f7;
      --accent: #0d6274;
      --remove: #a33b2b;
      --permanent: #6f2530;
      --keep: #18734b;
      --chain: #7753a6;
      --single: #3f6875;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    button, select, input, textarea { font: inherit; }
    button { cursor: pointer; }
    .topbar {
      position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 9px;
      align-items: center; padding: 10px 14px; background: rgba(255,255,255,.97); border-bottom: 1px solid var(--line);
    }
    h1 { margin: 0 8px 0 0; font-size: 17px; }
    .topbar input, .topbar select, .topbar button, .topbar a {
      min-height: 36px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink);
    }
    .topbar input, .topbar select { padding: 7px 9px; }
    .topbar button { padding: 7px 11px; font-weight: 750; }
    .topbar a { display: inline-flex; align-items: center; padding: 7px 11px; color: var(--ink); text-decoration: none; font-weight: 750; }
    .topbar .primary { border-color: #8fc6d0; background: #e6f6f9; color: var(--accent); }
    .search { width: min(260px, 100%); }
    .status { margin-left: auto; color: var(--muted); font-size: 12px; font-weight: 750; }
    .layout { display: grid; grid-template-columns: minmax(220px, 310px) minmax(0, 1fr); gap: 14px; padding: 14px; }
    .panel { border: 1px solid var(--line); border-radius: 9px; background: var(--paper); overflow: hidden; }
    .list-head { padding: 11px 12px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; font-weight: 800; }
    .card-list { max-height: calc(100vh - 130px); overflow: auto; }
    .card-row { width: 100%; padding: 9px 11px; border: 0; border-bottom: 1px solid #edf1f2; background: #fff; text-align: left; }
    .card-row:hover { background: #f4fafb; }
    .card-row.active { background: #e6f6f9; box-shadow: inset 4px 0 var(--accent); }
    .row-title { display: flex; justify-content: space-between; gap: 8px; font-weight: 850; }
    .row-meta { margin-top: 4px; color: var(--muted); font-size: 11px; }
    .dots { display: inline-flex; gap: 4px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #cdd6da; }
    .dot.remove { background: var(--remove); }
    .dot.permanent { background: var(--permanent); }
    .dot.keep { background: var(--keep); }
    .dot.chain { background: var(--chain); }
    .dot.single { background: var(--single); }
    .workbench { padding: 15px; }
    .card-head { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .card-head h2 { margin: 0; font-size: 18px; }
    .card-head p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .nav { display: flex; gap: 7px; }
    .nav button { padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; font-weight: 800; }
    .editor { display: grid; grid-template-columns: minmax(260px, 480px) minmax(260px, 1fr); gap: 18px; align-items: start; }
    .preview { border: 1px solid var(--line); border-radius: 8px; background: #eef2f4; overflow: hidden; }
    .preview img { display: block; width: 100%; max-height: calc(100vh - 205px); object-fit: contain; background: #fff; }
    fieldset { margin: 0 0 14px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; }
    legend { padding: 0 6px; font-size: 13px; font-weight: 850; }
    .choice-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
    .choice-grid.removal-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .choice { position: relative; }
    .choice input { position: absolute; opacity: 0; pointer-events: none; }
    .choice span {
      display: flex; min-height: 64px; align-items: center; justify-content: center; border: 2px solid var(--line);
      border-radius: 8px; background: #fff; font-size: 16px; font-weight: 900; transition: .12s ease;
    }
    .choice input:focus-visible + span { outline: 3px solid rgba(13,98,116,.22); }
    .choice.remove input:checked + span { border-color: var(--remove); background: #fff0ed; color: var(--remove); }
    .choice.permanent input:checked + span { border-color: var(--permanent); background: #f9e9ec; color: var(--permanent); }
    .choice.keep input:checked + span { border-color: var(--keep); background: #eaf8f1; color: var(--keep); }
    .choice.chain input:checked + span { border-color: var(--chain); background: #f4edfb; color: var(--chain); }
    .choice.single input:checked + span { border-color: var(--single); background: #edf5f7; color: var(--single); }
    .reviewed { display: flex; align-items: center; gap: 8px; margin: 10px 0 14px; font-weight: 850; }
    .reviewed input { width: 18px; height: 18px; accent-color: var(--accent); }
    textarea { width: 100%; min-height: 110px; resize: vertical; padding: 9px; border: 1px solid var(--line); border-radius: 7px; }
    .hint { color: var(--muted); font-size: 12px; line-height: 1.55; }
    .empty { padding: 40px; color: var(--muted); text-align: center; }
    @media (max-width: 820px) {
      .status { width: 100%; margin-left: 0; }
      .layout { grid-template-columns: 1fr; }
      .card-list { max-height: 240px; }
      .editor { grid-template-columns: 1fr; }
      .preview img { max-height: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <h1>探索卡打标工具</h1>
    <input id="search" class="search" placeholder="搜索卡号" autocomplete="off">
    <select id="cycle">
      <option value="">全部 Cycle</option>
      <option value="c1">Cycle I</option>
      <option value="c2">Cycle II</option>
      <option value="c3">Cycle III</option>
    </select>
    <select id="reviewFilter">
      <option value="">全部状态</option>
      <option value="unreviewed">只看未打标</option>
      <option value="reviewed">只看已打标</option>
      <option value="remove">只看移出</option>
      <option value="permanent">只看永久移出</option>
      <option value="chain">只看连抽</option>
    </select>
    <button id="save" class="primary" type="button">保存 / 下载标签</button>
    <button id="export" type="button">导出 JSON</button>
    <button id="import" type="button">导入 JSON</button>
    <input id="importFile" type="file" accept=".json,application/json" hidden>
    <a href="../index.html">返回主页</a>
    <span id="status" class="status">正在加载…</span>
  </header>

  <main class="layout">
    <aside class="panel">
      <div id="listHead" class="list-head"></div>
      <div id="cardList" class="card-list"></div>
    </aside>
    <section class="panel workbench">
      <div id="workbench"></div>
    </section>
  </main>

  <script src="../assets/exploration-card-tags.js"></script>
  <script>
    const API_URL = '../api/exploration-card-tags.php';
    const STORAGE_KEY = 'ato-exploration-card-tags-draft-v1';
    const cycleLabels = { c1: 'Cycle I', c2: 'Cycle II', c3: 'Cycle III' };
    const c1Ids = [
      '13400', '6400', '6401', '6402', '6403', '6404', '6405', '6406', '6407', '6408',
      '6409', '6410', '6411', '6412', '6413', '6414', '6415', '6416', '6417', '6418',
      '6419', '6420', '6421', '6422', '6423', '6424', '6425', '6426', '6427', '6428',
      '6429', '6430', '6431', '6433', '6434', '6435', '6436', '6437', '6438', '6439', '6440'
    ];
    const range = (start, count) => Array.from({ length: count }, (_, index) => String(start + index));
    const catalog = [
      ...c1Ids.map(cardId => ({ cycleId: 'c1', cardId })),
      ...range(13600, 42).map(cardId => ({ cycleId: 'c2', cardId })),
      ...range(13500, 42).map(cardId => ({ cycleId: 'c3', cardId })),
    ];

    let data = normalizeData(window.ATO_EXPLORATION_CARD_TAGS || {});
    let selectedKey = '';
    let dirty = false;
    const $ = id => document.getElementById(id);
    const keyFor = card => `${card.cycleId}:${card.cardId}`;
    const imageFor = card => `../assets/exploration-cards/${card.cycleId}/${card.cardId}.png`;

    function normalizeData(value) {
      const cards = {};
      Object.entries(value?.cards || {}).forEach(([key, entry]) => {
        if (!entry || typeof entry !== 'object') return;
        const cycleId = String(entry.cycleId || key.split(':')[0] || '').toLowerCase();
        const cardId = String(entry.cardId || key.split(':')[1] || '');
        if (!cycleLabels[cycleId] || !/^\d+$/.test(cardId)) return;
        const removal = entry.removal === 'permanent'
          ? 'permanent'
          : (entry.removal === 'remove' ? 'remove' : 'keep');
        cards[`${cycleId}:${cardId}`] = {
          cycleId,
          cardId,
          removal,
          draw: removal !== 'keep' || entry.draw === 'chain' ? 'chain' : 'single',
          reviewed: Boolean(entry.reviewed),
          notes: String(entry.notes || ''),
          updatedAt: entry.updatedAt || null,
        };
      });
      return { version: 1, updatedAt: value?.updatedAt || null, cards };
    }

    function entryFor(card, create = false) {
      const key = keyFor(card);
      if (!data.cards[key] && create) {
        data.cards[key] = {
          cycleId: card.cycleId, cardId: card.cardId, removal: 'keep', draw: 'single',
          reviewed: false, notes: '', updatedAt: null,
        };
      }
      return data.cards[key] || null;
    }

    function filteredCards() {
      const q = $('search').value.trim().toLowerCase();
      const cycle = $('cycle').value;
      const filter = $('reviewFilter').value;
      return catalog.filter(card => {
        const entry = entryFor(card);
        if (q && !`${card.cycleId} ${card.cardId}`.includes(q)) return false;
        if (cycle && card.cycleId !== cycle) return false;
        if (filter === 'unreviewed' && entry?.reviewed) return false;
        if (filter === 'reviewed' && !entry?.reviewed) return false;
        if (filter === 'remove' && !(entry?.reviewed && entry.removal === 'remove')) return false;
        if (filter === 'permanent' && !(entry?.reviewed && entry.removal === 'permanent')) return false;
        if (filter === 'chain' && !(entry?.reviewed && entry.draw === 'chain')) return false;
        return true;
      });
    }

    function ensureSelection(items) {
      if (!items.length) {
        selectedKey = '';
        return;
      }
      if (!items.some(card => keyFor(card) === selectedKey)) selectedKey = keyFor(items[0]);
    }

    function render() {
      const items = filteredCards();
      ensureSelection(items);
      const reviewed = catalog.filter(card => entryFor(card)?.reviewed).length;
      const remove = catalog.filter(card => entryFor(card)?.reviewed && entryFor(card).removal === 'remove').length;
      const permanent = catalog.filter(card => entryFor(card)?.reviewed && entryFor(card).removal === 'permanent').length;
      const chain = catalog.filter(card => entryFor(card)?.reviewed && entryFor(card).draw === 'chain').length;
      $('status').textContent = `已打标 ${reviewed}/${catalog.length} · 移出 ${remove} · 永久移出 ${permanent} · 连抽 ${chain}${dirty ? ' · 尚未保存' : ''}`;
      $('listHead').textContent = `当前显示 ${items.length} 张`;
      $('cardList').innerHTML = items.map(card => {
        const key = keyFor(card);
        const entry = entryFor(card);
        return `<button class="card-row ${key === selectedKey ? 'active' : ''}" data-key="${key}" type="button">
          <span class="row-title"><span>${cycleLabels[card.cycleId]} · #${card.cardId}</span>
            <span class="dots">${entry?.reviewed ? `<i class="dot ${entry.removal}"></i><i class="dot ${entry.draw}"></i>` : '<i class="dot"></i><i class="dot"></i>'}</span>
          </span>
          <span class="row-meta">${entry?.reviewed ? `${entry.removal === 'permanent' ? '永久移出' : (entry.removal === 'remove' ? '移出' : '非移出')} · ${entry.draw === 'chain' ? '连抽' : '不连抽'}` : '未打标'}</span>
        </button>`;
      }).join('') || '<div class="empty">没有符合条件的探索卡。</div>';
      $('cardList').querySelectorAll('[data-key]').forEach(button => {
        button.addEventListener('click', () => {
          selectedKey = button.dataset.key;
          render();
        });
      });
      renderWorkbench(items.find(card => keyFor(card) === selectedKey) || null);
    }

    function renderWorkbench(card) {
      if (!card) {
        $('workbench').innerHTML = '<div class="empty">请选择一张探索卡。</div>';
        return;
      }
      const entry = entryFor(card, true);
      $('workbench').innerHTML = `
        <div class="card-head">
          <div><h2>${cycleLabels[card.cycleId]} · 探索卡 #${card.cardId}</h2><p>${keyFor(card)} · 快捷键：1 移出，2 非移出，5 永久移出，3/4 抽卡状态，J/K 切卡</p></div>
          <div class="nav"><button id="prev" type="button">← 上一张</button><button id="next" type="button">下一张 →</button></div>
        </div>
        <div class="editor">
          <div class="preview"><img src="${imageFor(card)}" alt="探索卡 ${card.cardId}"></div>
          <div>
            <fieldset>
              <legend>结算后是否移出</legend>
              <div class="choice-grid removal-grid">
                <label class="choice remove"><input type="radio" name="removal" value="remove" ${entry.removal === 'remove' ? 'checked' : ''}><span>移出</span></label>
                <label class="choice keep"><input type="radio" name="removal" value="keep" ${entry.removal === 'keep' ? 'checked' : ''}><span>非移出</span></label>
                <label class="choice permanent"><input type="radio" name="removal" value="permanent" ${entry.removal === 'permanent' ? 'checked' : ''}><span>永久移出</span></label>
              </div>
            </fieldset>
            <fieldset>
              <legend>结算时是否继续抽卡</legend>
              <div class="choice-grid">
                <label class="choice chain"><input type="radio" name="draw" value="chain" ${entry.draw === 'chain' ? 'checked' : ''}><span>连抽</span></label>
                <label class="choice single"><input type="radio" name="draw" value="single" ${entry.draw === 'single' ? 'checked' : ''} ${entry.removal !== 'keep' ? 'disabled' : ''}><span>不连抽</span></label>
              </div>
            </fieldset>
            <label class="reviewed"><input id="reviewed" type="checkbox" ${entry.reviewed ? 'checked' : ''}>这张卡已确认打标</label>
            <label><strong>备注</strong><textarea id="notes" placeholder="可记录判定依据、特殊条件等">${escapeHtml(entry.notes)}</textarea></label>
            <p class="hint">选择任一标签会自动视为“已确认”。编辑内容会先保存为本机草稿；文件模式下会下载 JSON，可在主页探索工具中直接导入。</p>
          </div>
        </div>`;

      $('workbench').querySelectorAll('input[name="removal"], input[name="draw"]').forEach(input => {
        input.addEventListener('change', () => updateEntry(card, input.name, input.value));
      });
      $('reviewed').addEventListener('change', event => updateEntry(card, 'reviewed', event.target.checked));
      $('notes').addEventListener('input', event => updateEntry(card, 'notes', event.target.value, false));
      $('prev').addEventListener('click', () => moveSelection(-1));
      $('next').addEventListener('click', () => moveSelection(1));
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]));
    }

    function updateEntry(card, field, value, rerender = true) {
      const entry = entryFor(card, true);
      entry[field] = value;
      if (entry.removal !== 'keep') entry.draw = 'chain';
      if (field === 'removal' || field === 'draw') entry.reviewed = true;
      entry.updatedAt = new Date().toISOString();
      dirty = true;
      saveDraft();
      if (rerender) render();
      else $('status').textContent = `${$('status').textContent.replace(/ · 尚未保存$/, '')} · 尚未保存`;
    }

    function moveSelection(delta) {
      const items = filteredCards();
      if (!items.length) return;
      const current = Math.max(0, items.findIndex(card => keyFor(card) === selectedKey));
      selectedKey = keyFor(items[(current + delta + items.length) % items.length]);
      render();
      document.querySelector('.card-row.active')?.scrollIntoView({ block: 'nearest' });
    }

    function saveDraft() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    async function writeTagFile() {
      if (typeof window.showSaveFilePicker !== 'function') {
        throw new Error('当前浏览器不支持直接写文件，请改用本地 HTTP 服务打开此页面。');
      }
      const handle = await window.showSaveFilePicker({
        suggestedName: 'exploration-card-tags.js',
        types: [{
          description: '探索卡标签文件',
          accept: { 'text/javascript': ['.js'] },
        }],
      });
      const writable = await handle.createWritable();
      await writable.write(`window.ATO_EXPLORATION_CARD_TAGS = ${JSON.stringify(data, null, 2)};\n`);
      await writable.close();
      dirty = false;
      localStorage.removeItem(STORAGE_KEY);
      render();
      alert('标签文件已写入。请确认保存位置是项目的 assets/exploration-card-tags.js。');
    }

    async function saveProject() {
      $('save').disabled = true;
      try {
        if (location.protocol === 'file:') {
          if (typeof window.showSaveFilePicker === 'function') {
            await writeTagFile();
          } else {
            exportJson();
            alert('当前浏览器不允许网页直接改项目文件，已下载标签 JSON。请将内容保存到项目的 assets/exploration-card-tags.js。');
          }
          return;
        }
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ data }),
        });
        const payload = await response.json().catch(() => null);
        if (!response.ok || !payload?.ok) throw new Error(payload?.error || `HTTP ${response.status}`);
        data = normalizeData(payload.data);
        dirty = false;
        localStorage.removeItem(STORAGE_KEY);
        render();
        alert('探索卡标签已保存到项目。');
      } catch (error) {
        if (error?.name !== 'AbortError' && typeof window.showSaveFilePicker === 'function') {
          try {
            await writeTagFile();
            return;
          } catch (fileError) {
            if (fileError?.name === 'AbortError') return;
            alert(`保存失败：${fileError.message || fileError}\n\n草稿仍保存在当前浏览器中。`);
            return;
          }
        }
        if (error?.name !== 'AbortError') {
          exportJson();
          alert('保存接口不可用，已改为下载标签 JSON。请将内容保存到项目的 assets/exploration-card-tags.js。');
          return;
        }
      } finally {
        $('save').disabled = false;
      }
    }

    function exportJson() {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'exploration-card-tags.json';
      link.click();
      URL.revokeObjectURL(link.href);
    }

    async function importJson(file) {
      try {
        data = normalizeData(JSON.parse(await file.text()));
        dirty = true;
        saveDraft();
        render();
      } catch (error) {
        alert(`导入失败：${error.message || error}`);
      }
    }

    function loadDraft() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      try {
        data = normalizeData(JSON.parse(raw));
        dirty = true;
      } catch (_) {
        localStorage.removeItem(STORAGE_KEY);
      }
    }

    ['search', 'cycle', 'reviewFilter'].forEach(id => $(id).addEventListener(id === 'search' ? 'input' : 'change', render));
    $('save').addEventListener('click', saveProject);
    $('export').addEventListener('click', exportJson);
    $('import').addEventListener('click', () => $('importFile').click());
    $('importFile').addEventListener('change', event => {
      const file = event.target.files?.[0];
      if (file) importJson(file);
      event.target.value = '';
    });
    document.addEventListener('keydown', event => {
      if (event.target.matches('input, textarea, select')) return;
      const card = catalog.find(item => keyFor(item) === selectedKey);
      if (event.key.toLowerCase() === 'j' || event.key === 'ArrowRight') moveSelection(1);
      else if (event.key.toLowerCase() === 'k' || event.key === 'ArrowLeft') moveSelection(-1);
      else if (card && event.key === '1') updateEntry(card, 'removal', 'remove');
      else if (card && event.key === '2') updateEntry(card, 'removal', 'keep');
      else if (card && event.key === '3') updateEntry(card, 'draw', 'chain');
      else if (card && event.key === '4') updateEntry(card, 'draw', 'single');
      else if (card && event.key === '5') updateEntry(card, 'removal', 'permanent');
    });
    window.addEventListener('beforeunload', event => {
      if (!dirty) return;
      event.preventDefault();
      event.returnValue = '';
    });

    loadDraft();
    render();
  </script>
</body>
</html>
