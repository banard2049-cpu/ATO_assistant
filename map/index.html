<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ATO 地图模块</title>
  <link rel="stylesheet" href="./styles.css?v=20261001-tile-lookup-compact">
  <link rel="stylesheet" href="../api/cycle-theme.css">
  <link rel="stylesheet" href="./map.css?v=20261001-square-selection">
  <script src="../assets/theme.js?v=20261001" defer></script>
</head>
<body>
  <script>if (new URLSearchParams(location.search).get("second") === "1") document.body.classList.add("second-screen-map");</script>
  <main class="app">
    <header class="topbar">
      <div>
        <h1 id="mapTitle" class="cycle-title">ATO 地图模块</h1>
        <p id="campaignSaveStatus" class="campaign-save-status" data-state="connecting" aria-live="polite">正在连接存档...</p>
      </div>
      <div class="topbar-tools">
        <div class="header-return-actions">
          <a class="return-without-save" href="../index.html">不保存，返回控制台</a>
          <button id="headerSaveReturnButton" class="back-link" type="button">保存并返回</button>
        </div>
        <div class="cycle-tabs" id="cycleTabs"></div>
      </div>
    </header>

    <div class="sticky-actions">
    <section class="control-panel">
      <label>
        当前板块
        <select id="currentTileSelect"></select>
      </label>
      <div class="tile-lookup">
        <label for="searchInput">搜索 / 揭示板块</label>
        <div class="tile-lookup-row">
          <input id="searchInput" type="text" inputmode="text" autocomplete="off" placeholder="例如 001、T03">
          <div class="tile-lookup-actions">
            <button id="searchTileButton" type="button" class="secondary">搜索</button>
            <button id="revealTileButton" type="button">揭示</button>
          </div>
        </div>
      </div>
      <label class="zoom-control">
        地图缩放
        <span class="zoom-row">
          <input id="mapZoomInput" type="range" min="60" max="400" step="10" value="100">
          <output id="mapZoomValue" for="mapZoomInput">100%</output>
        </span>
      </label>
      <div class="toggle-row">
        <label class="check-label">
          <input id="showBackToggle" type="checkbox">
          显示背面
        </label>
        <label class="check-label">
          <input id="onlyExploredToggle" type="checkbox">
          只看已探索
        </label>
        <label class="check-label">
          <input id="hideUnknownToggle" type="checkbox">
          不显示未知区域
        </label>
        <label class="check-label">
          <input id="showAdjacencyToggle" type="checkbox">
          显示邻接
        </label>
        <label id="secondScreenMapModeLabel" class="check-label second-screen-mode-toggle" title="请先在主控制台开启第二屏幕">
          <input type="checkbox" id="secondScreenMapModeToggle" disabled>
          第二屏显示地图
        </label>
      </div>
    </section>

    <section class="token-panel">
      <div class="map-status">
        <strong id="cycleTitle">Cycle</strong>
        <span id="cycleMeta"></span>
      </div>
      <div class="tool-cluster token-cluster">
        <span class="toolbar-label">图标</span>
        <div class="token-palette" id="tokenPalette"></div>
        <div id="edgeDirectionControl" class="edge-direction-control" role="group" aria-label="沙尘暴方向" hidden>
          <button type="button" data-edge-direction="up" title="上" aria-label="上" aria-pressed="true">↑</button>
          <button type="button" data-edge-direction="right" title="右" aria-label="右" aria-pressed="false">→</button>
          <button type="button" data-edge-direction="down" title="下" aria-label="下" aria-pressed="false">↓</button>
          <button type="button" data-edge-direction="left" title="左" aria-label="左" aria-pressed="false">←</button>
        </div>
      </div>
      <div class="map-actions" aria-label="地图操作">
        <div class="action-group">
          <span class="toolbar-label">侦察船</span>
          <span id="scoutCount" class="scout-count">0</span>
          <button id="hsProduceButton" type="button" class="secondary">生产</button>
          <button id="hsRecallButton" type="button" class="secondary">收回</button>
          <button id="hsDestroyButton" type="button" class="secondary danger">破坏</button>
        </div>
        <div class="action-group">
          <span class="toolbar-label">仇敌</span>
          <button id="adSpawnButton" type="button">生成</button>
          <button id="adMoveButton" type="button" class="secondary">移动</button>
        </div>
        <div id="titanXTrack" class="action-group titan-x-track" role="group" aria-label="泰坦 X 追踪轨" hidden>
          <span class="toolbar-label">泰坦 X 追踪轨</span>
          <div id="titanXTrackSpaces" class="titan-x-track-spaces"></div>
          <button id="titanXRetreatButton" type="button" class="secondary" title="本次探索阶段没有激活探索指示物时，向 7 移动一格">减缓</button>
          <span id="titanXTrackStatus" class="titan-x-track-status" aria-live="polite"></span>
        </div>
        <div class="action-group">
          <span class="toolbar-label">流程</span>
          <button id="undoButton" type="button" class="secondary" disabled>撤回</button>
          <button id="openTagEditorButton" type="button" class="secondary">标签</button>
          <button id="saveReturnButton" type="button">保存返回</button>
          <button id="clearCycleButton" type="button" class="secondary danger">清空探索</button>
        </div>
      </div>
    </section>
    </div>

    <section class="tile-grid-viewport" aria-label="地图显示区域">
      <section id="tileGrid" class="tile-grid" aria-label="地图板块"></section>
    </section>

    <dialog id="tileNoteDialog" class="note-dialog">
      <form method="dialog" class="note-card">
        <div class="note-card-header">
          <strong id="tileNoteTitle">地图笔记</strong>
          <button id="closeNoteButton" type="button" class="icon-button" aria-label="关闭">×</button>
        </div>
        <textarea id="tileNoteInput" rows="7" placeholder="写下这个地图板块的线索、事件或提醒"></textarea>
        <div class="note-actions">
          <button id="deleteNoteButton" type="button" class="secondary danger">删除笔记</button>
          <button id="saveNoteButton" type="button">保存笔记</button>
        </div>
      </form>
    </dialog>
  </main>

  <script src="../assets/page-focus-router.js?v=20261007-page-navigation1"></script>
  <script src="./map-data.js?v=20260730-cycle-labels"></script>
  <script src="./map-tile-tags.js?v=20260730-c5-silver-ruin-token-crop"></script>
  <script src="../assets/cycle-symbols.js?v=20260918"></script>
  <script src="../assets/campaign-session.js?v=20260917"></script>
  <script src="./nemesis-path.js?v=20260924-shared"></script>
  <script src="./nemesis-battle.js?v=20261003-record"></script>
  <script src="./app.js?v=20261005-c1-027-last-city"></script>
  <script src="../assets/ato-terms.js?v=20260912f"></script>
  <script src="../assets/term-language.js?v=20261009-label2"></script>
</body>
</html>
