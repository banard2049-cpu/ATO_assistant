name: Docker package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Image version, for example 1.1.7"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release sources
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve image version
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            version="${REF_NAME#v}"
          else
            version="${INPUT_VERSION#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid image version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build Docker package stage
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: python tools/export_portable.py --version "$VERSION" --target docker

      - name: Extract Docker image context
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          temp_dir="$(mktemp -d)"
          mkdir -p tools/.docker-image-context
          unzip -q "export/ATO-Assistant-Docker-${VERSION}.zip" -d "$temp_dir"
          package_dir="$temp_dir/ATO-Assistant-Docker-${VERSION}"
          test -f "$package_dir/Dockerfile"
          cp -a "$package_dir"/. tools/.docker-image-context/
          rm -rf "$temp_dir"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        # linux/arm/v7 这一段是在 x86 runner 上跨架构构建的，必须靠 QEMU 模拟。
        # runner 上没有预注册 arm/v7 的 binfmt，缺了这一步构建会在 RUN 处直接失败。
        # 不写 platforms: 就是注册全部支持架构（含 arm64），以后加架构不必再动这里。
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        # 必须显式切到 docker-container driver：默认的 docker driver 只支持单平台，
        # 多平台构建会直接报 "Multi-platform build is not supported for the docker driver"。
        # QEMU 只负责让 x86 runner 能执行 arm 指令，多平台输出还得靠 buildx 容器。
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/banard2049-cpu/ato_assistant
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(steps.release.outputs.version, '-') }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: tools/.docker-image-context
          push: true
          # 多架构清单：同一个 tag 同时指向 amd64 与 arm/v7，docker pull 会按本机架构自动挑。
          # arm/v7 是树莓派 4 上 32 位 Raspberry Pi OS（linux/arm/v7）用的那份；
          # 基础镜像 php:8.4-cli-alpine 有 arm32v7 清单，应用是纯 PHP 内置服务器 + 静态文件，
          # 因此不需要为它改 Dockerfile。arm64、riscv64 之类仍然没有预构建镜像，
          # tools/install-docker.sh 在这类架构上会退回本机构建。
          # 加架构时这里与上面的 setup-qemu-action 一起改。
          platforms: linux/amd64,linux/arm/v7
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
