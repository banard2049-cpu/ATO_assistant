name: Android release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.2.0"
        required: true
        type: string
      prerelease:
        description: "Mark as a prerelease"
        required: false
        default: false
        type: boolean
      draft:
        description: "Create as a draft release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out release sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 必须排在 Set up Python / Java 之前：它设置 steps.signing.outputs.signed，后面的步骤
      # 靠它决定用正式签名还是 Debug 签名。GitHub Actions 里引用一个「还没执行过」的 step
      # 的输出得到的是空串，所以这个检查放在后面会判断错误。
      #
      # 没有签名密钥时**不再跳过**整个 Android 构建：改成构建并上传 Debug 签名的 APK。
      # 这是使用者的明确选择 —— Debug 签名用的是构建机的临时密钥，装了它的用户以后无法
      # 用正式签名的包覆盖升级，只能卸载重装（代价写在 release-notes 里）。
      # 配好 ANDROID_RELEASE_* 四个仓库密钥后，这里会自动恢复成正式签名，不需要改工作流。
      - name: Check Android release signing key
        id: signing
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          $names = @('ANDROID_RELEASE_KEYSTORE_BASE64', 'ANDROID_RELEASE_STORE_PASSWORD', 'ANDROID_RELEASE_KEY_ALIAS', 'ANDROID_RELEASE_KEY_PASSWORD')
          $missing = @($names | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
          if ($missing.Count -gt 0) {
            "signed=false" >> $env:GITHUB_OUTPUT
            # 只报密钥名，不报值（值本身也不会出现在日志里，GitHub 会打码）。
            Write-Host "::warning title=Debug-signed APK::Android release signing is not configured ($($missing -join ', ')); the APK will be Debug-signed. Users must uninstall before they can install a properly signed build. Configure the four ANDROID_RELEASE_* repository secrets to publish a properly signed APK."
            exit 0
          }
          $keystore = Join-Path $env:RUNNER_TEMP 'ato-release.jks'
          [IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          "ATO_ANDROID_KEYSTORE_PATH=$keystore" >> $env:GITHUB_ENV
          "ATO_ANDROID_KEYSTORE_PASSWORD=$env:KEYSTORE_PASSWORD" >> $env:GITHUB_ENV
          "ATO_ANDROID_KEY_ALIAS=$env:KEY_ALIAS" >> $env:GITHUB_ENV
          "ATO_ANDROID_KEY_PASSWORD=$env:KEY_PASSWORD" >> $env:GITHUB_ENV
          "signed=true" >> $env:GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Resolve release version
        id: release
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:EVENT_NAME -eq 'push') {
            $version = $env:REF_NAME -replace '^v', ''
          } else {
            $version = $env:INPUT_VERSION -replace '^v', ''
          }
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:[-.][0-9A-Za-z.-]+)?$') {
            throw "Invalid release version: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build and publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          INPUT_DRAFT: ${{ inputs.draft }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          $arguments = @{
            Version = $env:RELEASE_VERSION
            Publish = $true
          }
          if ($env:SIGNED -ne 'true') {
            # 没有常驻签名时显式放行 Debug 签名的 APK —— release_android.ps1 默认拒绝发布
            # 这种包，只有调用方明确传 -AllowUnsigned 才放行。
            $arguments.AllowUnsigned = $true
          }
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            if ($env:INPUT_PRERELEASE -eq 'true') { $arguments.Prerelease = $true }
            if ($env:INPUT_DRAFT -eq 'true') { $arguments.Draft = $true }
          } elseif ($env:RELEASE_VERSION -match '-') {
            $arguments.Prerelease = $true
          }
          ./tools/release_android.ps1 @arguments

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ATO-Assistant-Android-${{ steps.release.outputs.version }}
          path: |
            export/ATO-Assistant-${{ steps.release.outputs.version }}.apk
          if-no-files-found: error
