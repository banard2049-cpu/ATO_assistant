name: Resource import regressions

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install asset studio dependencies
        run: python -m pip install -r asset-studio/requirements.txt
      - name: Test Docker installation and resource mounts
        run: python tools/test_docker_mounts.py
      - name: Test Docker package licensing
        run: python tools/test_docker_package_license.py
      - name: Build and start the Docker export
        run: python tools/test_docker_runtime.py
      - name: Test cryptic package exports and partial imports
        working-directory: asset-studio
        run: python -m unittest tests.test_core tests.test_cryptic_resources tests.test_fan_pack tests.test_hostile_pack_safety tests.test_install_target_safety tests.test_bgm_resources tests.test_icon_resources tests.test_map_resources tests.test_image_shrink
      - name: Test layered maps, icon scope and card artwork
        run: |
          python -m pip install numpy==2.2.6
          node --test tests/map-tile-artwork.test.cjs tests/map-layered-consumers.test.cjs tests/map-tile-icon-tags.test.cjs tests/map-frozen-time.test.cjs tests/map-unknown-region-adjacency.test.cjs tests/c4-cloud-ship.test.cjs tests/card-art.test.cjs tests/fan-card-trims.test.cjs
          python -m unittest discover -s tests -p test_fan_card_trims.py
      - name: Test battle layout controls and second screen
        run: |
          node tools/test-ss-terrain-data.cjs
          node tools/test-aibp-battle-map-control.cjs
          node tools/test-second-screen-los-mirror.cjs
      - name: Test Android resource catalog and coverage
        run: |
          python tools/test_android_resource_catalog.py
          python tools/test_android_resource_catalog_coverage.py
      - name: Test story page code is committed to git
        # 页面引用的代码必须在仓库里（renderer.js / styles.css / story-tables.js 曾整批漏提交，
        # 导致干净检出构建的 APK、镜像与便携包都缺这些文件）；私有素材则必须不进仓库。
        run: python tools/test_story_code_in_git.py
      - name: Test C5 headings and story rendering without private resources
        run: node --test story/tests/c5-heading-compat.test.cjs story/tests/mixed-media.test.cjs story/tests/story-pipe-tables.test.cjs story/tests/story-pipe-tables-second-screen.test.cjs story/tests/story-battle-reward-tables.test.cjs story/tests/story-dice-tables.test.cjs
      - name: Test hidden exploration and music playback
        run: |
          node --test tests/exploration-selection.test.cjs
          node tests/hidden-exploration.test.cjs
          node tools/test-bgm-player.cjs
          node tools/test-story-bgm.cjs
      - name: Test record attachment storage and backups
        run: |
          node tests/record-attachments.test.cjs
          python -m unittest discover -s tests -p test_record_attachments.py

  android-import:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Test Android campaign import
        env:
          PYTHONUTF8: "1"
        run: python tools/test_android_campaign_import.py
      - name: Test Android resource import transactions and limits
        env:
          PYTHONUTF8: "1"
        run: python tools/test_android_atopack_import.py

  campaign-settlement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test save recovery, editor concurrency and pending card display
        run: >-
          node --test
          tests/dashboard-backup-completeness.test.cjs
          tests/dashboard-hero-progress.test.cjs
          tests/hero-import.test.cjs
          tests/asset-studio-story-editor.test.cjs
          tests/aibp-special-pending.test.cjs
          story/tests/tts-pause.test.cjs
      - name: Test campaign automation and settlement
        run: >-
          node --test
          tests/aibp-card-loot-regression.test.cjs
          tests/aibp-loot-level.test.cjs
          tests/aibp-resource-labels.test.cjs
          tests/bp-resource-labeler-state.test.cjs
          tests/aibp-story-loot.test.cjs
          tests/aibp-settlement-rules.test.cjs
          tests/exploration-resource-settlement.test.cjs
          tests/exploration-record-effects.test.cjs
          tests/exploration-pursuit.test.cjs
          tests/exploration-pursuit-audit.test.cjs
          tests/exploration-tech-rules.test.cjs
          tests/structure-tech-client.test.cjs
          tests/structure-tech-rules.test.cjs
          tests/structure-tech-dashboard.test.cjs
          tests/structure-tech-details.test.cjs
          tests/structure-tech-breakpoints.test.cjs
          tests/negotiation-rules.test.cjs
          tests/investigation-rules.test.cjs
          tests/voyage-action-rules.test.cjs
          tests/map-titan-capture.test.cjs
          tests/map-token-placement.test.cjs
          tests/dashboard-map-tag-sync.test.cjs
          tests/dashboard-battle-terrain.test.cjs
          tests/scout-map-link.test.cjs
          tests/dashboard-hub-points.test.cjs
          tests/dashboard-argo-fate-chip.test.cjs
      - name: Test special battle promotions
        run: node tools/test-aibp-c45-specials.cjs
      - name: Test exploration card faces, tags and regeneration
        run: |
          node --test tests/exploration-*.test.cjs tests/hidden-exploration.test.cjs
          python tests/exploration-scanner-icons.test.py
          python tests/test_exploration_card_tags.py
      - name: Test BP label review metadata persistence
        run: python tests/test_bp_resource_labeler.py
      - name: Test local material exclusion from application packages
        run: python tools/test_packaging_exclusions.py
